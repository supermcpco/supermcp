# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: visma-eaccounting
  name: Visma eAccounting
  description: 'Visma eAccounting — Nordic cloud bookkeeping: customers, suppliers, customer and supplier invoices, articles, and the account chart. REST API v2, OAuth 2.0.'
  region: se
  category: accounting
  icon: visma-eaccounting
  docsUrl: https://developer.vismaonline.com/
credentials:
  VISMA_CLIENT_ID:
    required: true
  VISMA_CLIENT_SECRET:
    required: true
    secret: true
  VISMA_REFRESH_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://eaccountingapi.vismaonline.com/v2
  headers:
    Accept: application/json
auth:
  type: oauth2
  grant: refresh_token
  clientId: '{{env.VISMA_CLIENT_ID}}'
  clientSecret: '{{env.VISMA_CLIENT_SECRET}}'
  tokenUrl: https://identity.vismaonline.com/connect/token
  clientAuth: basic
  refreshToken: '{{env.VISMA_REFRESH_TOKEN}}'
healthcheck:
  tool: visma_eaccounting_get_company_settings
  http:
    method: GET
    path: /companysettings
instructions: |-
  **Getting a token**
  1. Register at **developer.vismaonline.com** and create an application. You receive a client id and client secret.
  2. Run the authorization-code flow once for the customer's company, asking for the scopes you need — `ea:api`, `ea:sales`, `ea:purchase`, `ea:accounting`. Keep the **refresh token**.
  3. Set `VISMA_CLIENT_ID`, `VISMA_CLIENT_SECRET` and `VISMA_REFRESH_TOKEN`.

  **Sandbox and production are different hosts.** This adapter targets production at `eaccountingapi.vismaonline.com`. The sandbox lives at `eaccountingapi-sandbox.vismaonline.com` with its own client registration; a production token there fails in a way that looks like a bad secret. If you want to test first, register a sandbox app and build a custom connector against that host.

  **One connector, one company.** The token is bound to the company it was authorised for. A bookkeeper with several clients needs one connector per client.

  **Filtering is OData-flavoured** on most collections: `$filter`, `$top`, `$skip`, `$orderby`. Dates are ISO 8601. `$top` is capped server-side around 1000.

  **Vocabulary is Nordic.** `CustomerInvoiceDraft` is an unposted invoice; `CustomerInvoice` is posted and immutable. A draft is not revenue, and an agent summing both will over-report.

  **Unverified.** The paths and field names below follow the vendor's published documentation and have not been exercised against a live tenant. Treat a 404 as a docs-versus-reality gap and check the developer portal before concluding that the credential is wrong. A correction from anyone running this against a real system is genuinely welcome.

  **Cloud reachability**: eaccountingapi.vismaonline.com is public with a valid certificate.
tools:
  - name: visma_eaccounting_get_company_settings
    description: 'Read the connected company''s settings: name, corporate identity number, VAT number, address and base currency. The fastest proof the token works.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /companysettings
  - name: visma_eaccounting_list_customers
    description: List customers with their number, name, corporate identity number, address and payment terms.
    input:
      type: object
      properties:
        filter:
          type: string
          description: OData $filter expression, e.g. IsActive eq true.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
        orderby:
          type: string
          description: Sort expression, e.g. `Name asc`.
    operation:
      method: GET
      path: /customers
      query:
        $filter: '{{params.filter}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
        $orderby: '{{params.orderby}}'
  - name: visma_eaccounting_get_customer
    description: Read one customer by id, with their addresses, delivery defaults, VAT settings and credit limit.
    input:
      type: object
      properties:
        customerId:
          type: string
          description: Visma customer GUID.
      required:
        - customerId
    operation:
      method: GET
      path: /customers/{{params.customerId}}
  - name: visma_eaccounting_list_customer_invoices
    description: List *posted* customer invoices with their number, date, due date, customer, total and remaining amount. Drafts are a separate collection.
    input:
      type: object
      properties:
        filter:
          type: string
          description: OData $filter expression, e.g. InvoiceDate ge 2026-01-01.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
        orderby:
          type: string
          description: Sort expression, e.g. `InvoiceDate desc`.
    operation:
      method: GET
      path: /customerinvoices
      query:
        $filter: '{{params.filter}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
        $orderby: '{{params.orderby}}'
  - name: visma_eaccounting_get_customer_invoice
    description: 'Read one posted customer invoice in full: every row with article, quantity, price and VAT, the totals and the remaining amount.'
    input:
      type: object
      properties:
        invoiceId:
          type: string
          description: Visma invoice GUID.
      required:
        - invoiceId
    operation:
      method: GET
      path: /customerinvoices/{{params.invoiceId}}
  - name: visma_eaccounting_list_invoice_drafts
    description: List *unposted* customer invoice drafts. A draft is not revenue — keep it out of any figure that reports what was actually invoiced.
    input:
      type: object
      properties:
        filter:
          type: string
          description: OData $filter expression.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /customerinvoicedrafts
      query:
        $filter: '{{params.filter}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
  - name: visma_eaccounting_list_supplier_invoices
    description: List supplier invoices with their supplier, date, due date, total and remaining amount — the payables side.
    input:
      type: object
      properties:
        filter:
          type: string
          description: OData $filter expression.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
        orderby:
          type: string
          description: Sort expression.
    operation:
      method: GET
      path: /supplierinvoices
      query:
        $filter: '{{params.filter}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
        $orderby: '{{params.orderby}}'
  - name: visma_eaccounting_list_suppliers
    description: List suppliers with their number, name, corporate identity number and payment details, for the purchasing side of the ledger.
    input:
      type: object
      properties:
        filter:
          type: string
          description: OData $filter expression.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /suppliers
      query:
        $filter: '{{params.filter}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
  - name: visma_eaccounting_list_articles
    description: List articles with their number, name, net and gross price, VAT rate and stock quantity.
    input:
      type: object
      properties:
        filter:
          type: string
          description: OData $filter expression, e.g. IsActive eq true.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /articles
      query:
        $filter: '{{params.filter}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
  - name: visma_eaccounting_list_accounts
    description: List the chart of accounts with each account's number, name, type and VAT code, for questions that need the ledger structure.
    input:
      type: object
      properties:
        filter:
          type: string
          description: OData $filter expression.
        top:
          type: number
          description: Maximum rows to return.
    operation:
      method: GET
      path: /accounts
      query:
        $filter: '{{params.filter}}'
        $top: '{{params.top}}'
