# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: sellsy
  name: Sellsy
  description: 'Sellsy — French CRM and invoicing: companies, contacts, opportunities, invoices, estimates, items and payments. REST API v2, OAuth 2.0 client credentials.'
  region: fr
  category: crm
  icon: sellsy
  docsUrl: https://api.sellsy.com/doc/v2/
credentials:
  SELLSY_CLIENT_ID:
    required: true
  SELLSY_CLIENT_SECRET:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.sellsy.com/v2
  headers:
    Content-Type: application/json
auth:
  type: oauth2
  grant: client_credentials
  clientId: '{{env.SELLSY_CLIENT_ID}}'
  clientSecret: '{{env.SELLSY_CLIENT_SECRET}}'
  tokenUrl: https://login.sellsy.com/oauth2/access-tokens
healthcheck:
  tool: sellsy_list_companies
  http:
    method: GET
    path: /companies?limit=1
instructions: |-
  **Getting credentials**
  1. Sign in to Sellsy, open **Paramètres → API** and create an **application** in the developer area.
  2. Choose the *client credentials* flow — it authorises the application against your own account with no browser consent step. You receive a **client id** and **client secret**.
  3. Set `SELLSY_CLIENT_ID` and `SELLSY_CLIENT_SECRET`. supermcp mints and refreshes the access token on its own.

  **This is API v2**, at `https://api.sellsy.com/v2`. Sellsy's v1 was an entirely different, single-endpoint RPC API — if you find an example that POSTs everything to one URL with a `request` parameter, that is v1 and it does not apply here.

  **Searching is a POST.** Sellsy's v2 list endpoints have a sibling `/search` that takes a JSON body of `{"filters": {...}}`. It is far more expressive than the query parameters on the plain list, which is why the search tools below are POSTs that read.

  **`embed` resolves relationships.** A document returns its `related` parties as ids; `embed[]=contact` and similar bring them back inline and save a round of calls.

  **Amounts are strings in the document's currency**, with the tax detail in a separate `amounts` object. `total_amount_without_taxes` and `total_amount` are both present, and confusing them is how a revenue figure ends up 20% wrong.

  **Cloud reachability**: api.sellsy.com is public with a valid certificate.
tools:
  - name: sellsy_list_companies
    description: List client companies with their name, SIRET, VAT number, address and owner. The quickest call for checking the OAuth client works.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Rows per page (default 25, max 100).
        offset:
          type: string
          description: Offset token from the previous page's pagination block.
        order:
          type: string
          description: Sort field, e.g. created or name.
        direction:
          type: string
          description: '`asc` or `desc`.'
        embed:
          type: string
          description: Relationship to resolve inline, e.g. invoicing_address.
    operation:
      method: GET
      path: /companies
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        order: '{{params.order}}'
        direction: '{{params.direction}}'
        embed[]: '{{params.embed}}'
  - name: sellsy_search_companies
    description: Search companies with Sellsy's filter object — far more expressive than the plain list. A POST that only reads.
    input:
      type: object
      properties:
        filters:
          type: object
          description: 'Filter object, e.g. {"name": "Dupont"} or {"created": {"start": "2026-01-01"}}.'
        limit:
          type: number
          description: Rows per page.
        offset:
          type: string
          description: Offset token from the previous page.
      required:
        - filters
    operation:
      method: POST
      path: /companies/search
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
      body:
        value:
          filters: '{{params.filters}}'
  - name: sellsy_get_company
    description: 'Read one client company in full: addresses, contacts, tax identifiers, rating and the notes recorded against it.'
    input:
      type: object
      properties:
        companyId:
          type: number
          description: Numeric Sellsy company id.
        embed:
          type: string
          description: Relationship to resolve inline, e.g. contacts.
      required:
        - companyId
    operation:
      method: GET
      path: /companies/{{params.companyId}}
      query:
        embed[]: '{{params.embed}}'
  - name: sellsy_list_contacts
    description: List individual contacts with their name, e-mail, phone, position and the company they belong to.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Rows per page.
        offset:
          type: string
          description: Offset token from the previous page.
        order:
          type: string
          description: Sort field, e.g. created or last_name.
    operation:
      method: GET
      path: /contacts
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        order: '{{params.order}}'
  - name: sellsy_list_invoices
    description: List invoices with their number, date, due date, client, net and gross totals and payment status — the receivables view.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Rows per page.
        offset:
          type: string
          description: Offset token from the previous page.
        order:
          type: string
          description: Sort field, e.g. created or due_date.
        direction:
          type: string
          description: '`asc` or `desc`.'
        embed:
          type: string
          description: Relationship to resolve inline, e.g. related.
    operation:
      method: GET
      path: /invoices
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        order: '{{params.order}}'
        direction: '{{params.direction}}'
        embed[]: '{{params.embed}}'
  - name: sellsy_search_invoices
    description: Search invoices with Sellsy's filter object — by status, date range, client or amount. A POST that only reads.
    input:
      type: object
      properties:
        filters:
          type: object
          description: 'Filter object, e.g. {"status": ["late"], "created": {"start": "2026-01-01"}}.'
        limit:
          type: number
          description: Rows per page.
        offset:
          type: string
          description: Offset token from the previous page.
      required:
        - filters
    operation:
      method: POST
      path: /invoices/search
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
      body:
        value:
          filters: '{{params.filters}}'
  - name: sellsy_get_invoice
    description: 'Read one invoice in full: every row with its quantity, unit price, discount and VAT, the totals and the payments applied against it.'
    input:
      type: object
      properties:
        invoiceId:
          type: number
          description: Numeric Sellsy invoice id.
        embed:
          type: string
          description: Relationship to resolve inline, e.g. rows or related.
      required:
        - invoiceId
    operation:
      method: GET
      path: /invoices/{{params.invoiceId}}
      query:
        embed[]: '{{params.embed}}'
  - name: sellsy_list_estimates
    description: List estimates (devis) with their number, date, client, total and acceptance status — what is out with prospects and not yet won.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Rows per page.
        offset:
          type: string
          description: Offset token from the previous page.
        order:
          type: string
          description: Sort field, e.g. created.
    operation:
      method: GET
      path: /estimates
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        order: '{{params.order}}'
  - name: sellsy_list_opportunities
    description: List CRM opportunities with their name, client, amount, funnel step and expected close date — the pipeline view.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Rows per page.
        offset:
          type: string
          description: Offset token from the previous page.
        order:
          type: string
          description: Sort field, e.g. created.
    operation:
      method: GET
      path: /opportunities
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        order: '{{params.order}}'
  - name: sellsy_list_items
    description: List catalogue items with their reference, name, unit price, VAT rate and stock tracking flag.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Rows per page.
        offset:
          type: string
          description: Offset token from the previous page.
    operation:
      method: GET
      path: /items
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
