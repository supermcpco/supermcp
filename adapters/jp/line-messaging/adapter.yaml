# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: line-messaging
  name: LINE Messaging API
  description: Send push, reply and broadcast messages from a LINE Official Account — LINE is the dominant chat platform in Japan, Taiwan and Thailand. Free tier of 500 push messages per month, unlimited reply messages, channel access tokens require no KYC.
  region: jp
  category: messaging
  icon: line
  docsUrl: https://developers.line.biz/en/reference/messaging-api/
  lint:
    allow:
      - healthcheck-present
      - tool-name-prefix
credentials:
  LINE_CHANNEL_ACCESS_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.line.me
auth:
  type: bearer
  token: '{{env.LINE_CHANNEL_ACCESS_TOKEN}}'
instructions: |-
  This connector uses the LINE Messaging API v2.

  **Creating a channel**: log in to https://developers.line.biz/console → create a Provider → 'Create a new channel' → 'Messaging API'. Set up the LINE Official Account (auto-created with the channel), then under the channel's 'Messaging API' tab, scroll to 'Channel access token' → 'Issue' a long-lived token. Paste it as `LINE_CHANNEL_ACCESS_TOKEN`.

  **Authentication**: Bearer Token (the channel access token). Note: this token belongs to the channel, not to a user — anyone with the token can post as that Official Account, so keep it secret.

  **Message shape**: LINE messages are objects with a `type` field. Simplest example: `{"type": "text", "text": "Hello"}`. Other types: `sticker`, `image`, `video`, `audio`, `location`, `template`, `flex`. The `messages` parameter on every tool is an **array of up to 5** message objects.

  **`to` userId**: cannot be looked up cold — you only get a userId from webhook events when a user interacts with the Official Account. Store the userId on first webhook contact, then use it for push.

  **`replyToken`**: returned in webhook events. Valid for **~30 seconds** after the original user message. Use `line_reply_message` (free, unlimited) instead of `line_push_message` (counts against the 500/month free quota) whenever possible.

  **Broadcast**: sends to ALL friends of the Official Account. Counts heavily against the push quota — use sparingly.

  **Pricing**: free tier = 500 push messages/month. Paid tiers from JP¥5,000/month for higher quotas.
tools:
  - name: line_push_message
    description: Send a push message to a specific userId, groupId, or roomId. Counts against the monthly push quota (500/month free). Use line_reply_message instead whenever you have a fresh replyToken.
    input:
      type: object
      properties:
        to:
          type: string
          description: Destination — userId (from a webhook event), groupId, or roomId. Cannot be looked up; obtain from webhook.
        messages:
          type: array
          description: 'Array of 1–5 LINE message objects. Simplest text: [{"type": "text", "text": "Hello"}]. See https://developers.line.biz/en/reference/messaging-api/#message-objects for full schema.'
        notificationDisabled:
          type: boolean
          description: If true, the user is not notified (silent push). Default false.
      required:
        - to
        - messages
    operation:
      method: POST
      path: /v2/bot/message/push
      body:
        value:
          to: '{{params.to}}'
          messages: '{{params.messages}}'
          notificationDisabled: '{{params.notificationDisabled}}'
  - name: line_reply_message
    description: Reply to a webhook-received message using its replyToken. FREE and unlimited (does not count against the push quota). The replyToken is valid for ~30 seconds after the user's message — call this synchronously from your webhook handler.
    input:
      type: object
      properties:
        replyToken:
          type: string
          description: The replyToken from a webhook event. Single-use, expires after ~30 seconds.
        messages:
          type: array
          description: Array of 1–5 LINE message objects.
        notificationDisabled:
          type: boolean
          description: If true, the user is not notified (silent reply). Default false.
      required:
        - replyToken
        - messages
    operation:
      method: POST
      path: /v2/bot/message/reply
      body:
        value:
          replyToken: '{{params.replyToken}}'
          messages: '{{params.messages}}'
          notificationDisabled: '{{params.notificationDisabled}}'
  - name: line_get_profile
    description: Get a user's display name, profile picture URL, status message and BCP-47 language tag. Only works for users who have added the Official Account as a friend.
    input:
      type: object
      properties:
        userId:
          type: string
          description: LINE userId (from a webhook event).
      required:
        - userId
    operation:
      method: GET
      path: /v2/bot/profile/{{params.userId}}
  - name: line_broadcast_message
    description: Broadcast a message to ALL friends of the Official Account. Heavy on the monthly push quota (1 message × N friends = N counted pushes). Use sparingly. Returns 202 Accepted; delivery happens asynchronously.
    input:
      type: object
      properties:
        messages:
          type: array
          description: Array of 1–5 LINE message objects to broadcast.
        notificationDisabled:
          type: boolean
          description: If true, recipients are not notified. Default false.
      required:
        - messages
    operation:
      method: POST
      path: /v2/bot/message/broadcast
      body:
        value:
          messages: '{{params.messages}}'
          notificationDisabled: '{{params.notificationDisabled}}'
