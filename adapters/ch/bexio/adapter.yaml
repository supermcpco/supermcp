# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: bexio
  name: bexio
  description: 'bexio — the Swiss SMB business suite used by 100,000+ companies: contacts, invoices, quotes, orders, articles, projects and timesheets. REST API, bearer token, amounts in CHF.'
  region: ch
  category: accounting
  icon: bexio
  docsUrl: https://docs.bexio.com/
credentials:
  BEXIO_API_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.bexio.com
  headers:
    Accept: application/json
auth:
  type: bearer
  token: '{{env.BEXIO_API_TOKEN}}'
healthcheck:
  tool: bexio_get_company_profile
  http:
    method: GET
    path: /2.0/company_profile
instructions: |-
  **Getting a token**
  1. Sign in to bexio and open **Einstellungen → Apps & Tools → API-Zugriff**.
  2. Create an **API token** (for a single company) and copy it into `BEXIO_API_TOKEN`. The token inherits the permissions of the user it was created under, so a read-only agent should get a read-only bexio user.
  3. For a multi-tenant integration bexio also offers OAuth 2.0 with per-scope consent; this adapter uses the simpler API token, which is what a single company needs.

  **Mixed API versions.** bexio has migrated its resources one at a time, so the path segment differs per object: contacts and articles live under `/2.0/`, invoices under `/2.0/kb_invoice`, and newer resources under `/3.0/` or `/4.0/`. The tools below carry the correct version in each path — do not assume one prefix works for everything.

  **Searching**: bexio's list endpoints accept `order_by`, `limit` and `offset`, and each resource has a sibling `/search` endpoint that takes a POST body of `[{field, value, criteria}]`. This adapter exposes the list endpoints; for a precise field match use `bexio_search_contacts`.

  **Currency**: bexio is Swiss and most companies book in CHF. Amounts come back as decimal strings — parse, do not round in the prompt.

  **Writes**: `bexio_create_contact` writes to the live company. Invoices are not creatable here: bexio requires positions to be posted separately and a half-created invoice is worse than none.

  **Cloud reachability**: api.bexio.com is public with a valid certificate; a hosted supermcp instance reaches it directly.
tools:
  - name: bexio_get_company_profile
    description: 'Read the company profile of the connected bexio account: legal name, address, VAT number and country. Fast call with no parameters — use it to verify the token.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /2.0/company_profile
  - name: bexio_list_contacts
    description: List contacts (customers, suppliers, private persons) with paging and sorting. Contact type 1 is a company, 2 a private person.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Maximum rows to return (default 500, max 2000).
        offset:
          type: number
          description: Rows to skip, for paging.
        order_by:
          type: string
          description: Field to sort by, e.g. `id_desc`, `name_1`, `nr`.
    operation:
      method: GET
      path: /2.0/contact
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        order_by: '{{params.order_by}}'
  - name: bexio_search_contacts
    description: Find contacts by an exact or partial field match — the right tool when you know a name, customer number or e-mail and need the bexio contact id.
    input:
      type: object
      properties:
        field:
          type: string
          description: 'Field to match: `name_1`, `name_2`, `mail`, `nr`, `contact_group_ids` or `contact_type_id`.'
        value:
          type: string
          description: Value to match against that field.
        criteria:
          type: string
          description: 'Match mode: `=`, `like`, `not_like`, `is_null` or `not_null`. Defaults to `like`.'
      required:
        - field
        - value
    operation:
      method: POST
      path: /2.0/contact/search
      body:
        value:
          - field: '{{params.field}}'
            value: '{{params.value}}'
            criteria: '{{params.criteria}}'
  - name: bexio_get_contact
    description: Read one contact by its bexio id, including both name lines, address, contact group membership and the assigned user.
    input:
      type: object
      properties:
        id:
          type: number
          description: Numeric bexio contact id.
      required:
        - id
    operation:
      method: GET
      path: /2.0/contact/{{params.id}}
  - name: bexio_list_invoices
    description: List invoices (Rechnungen) with their document number, total, currency and payment state. Sort by `id_desc` for the most recent first.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Maximum rows to return (default 500, max 2000).
        offset:
          type: number
          description: Rows to skip, for paging.
        order_by:
          type: string
          description: Field to sort by, e.g. `id_desc` or `is_valid_from`.
    operation:
      method: GET
      path: /2.0/kb_invoice
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        order_by: '{{params.order_by}}'
  - name: bexio_get_invoice
    description: Read one invoice in full, including every position with its article, quantity, unit price, discount and tax, plus the totals and the due date.
    input:
      type: object
      properties:
        id:
          type: number
          description: Numeric invoice id.
      required:
        - id
    operation:
      method: GET
      path: /2.0/kb_invoice/{{params.id}}
  - name: bexio_list_quotes
    description: List quotes (Offerten) with their number, addressee, total and status, to see what is out with customers and not yet won.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Maximum rows to return (default 500, max 2000).
        offset:
          type: number
          description: Rows to skip, for paging.
        order_by:
          type: string
          description: Field to sort by, e.g. `id_desc`.
    operation:
      method: GET
      path: /2.0/kb_offer
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        order_by: '{{params.order_by}}'
  - name: bexio_list_orders
    description: List orders (Aufträge) with their number, customer, total and whether they have already been invoiced.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Maximum rows to return (default 500, max 2000).
        offset:
          type: number
          description: Rows to skip, for paging.
        order_by:
          type: string
          description: Field to sort by, e.g. `id_desc`.
    operation:
      method: GET
      path: /2.0/kb_order
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        order_by: '{{params.order_by}}'
  - name: bexio_list_articles
    description: List articles from the bexio product catalogue with their internal code, purchase and sale price, stock level and unit.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Maximum rows to return (default 500, max 2000).
        offset:
          type: number
          description: Rows to skip, for paging.
        order_by:
          type: string
          description: Field to sort by, e.g. `intern_code`.
    operation:
      method: GET
      path: /2.0/article
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        order_by: '{{params.order_by}}'
  - name: bexio_list_projects
    description: List projects with their client, responsible user, start and end date and current status — the anchor for any timesheet question.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Maximum rows to return (default 500, max 2000).
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /2.0/pr_project
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: bexio_list_timesheets
    description: List tracked time entries with their user, date, duration, project and billability — the raw data behind 'how much did we spend on this client'.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Maximum rows to return (default 500, max 2000).
        offset:
          type: number
          description: Rows to skip, for paging.
        order_by:
          type: string
          description: Field to sort by, e.g. `date_desc`.
    operation:
      method: GET
      path: /2.0/timesheet
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        order_by: '{{params.order_by}}'
  - name: bexio_create_contact
    description: Create a contact in the live bexio company. Search with bexio_search_contacts first — bexio does not deduplicate, and a second 'Muster AG' is painful to unwind.
    input:
      type: object
      properties:
        contact_type_id:
          type: number
          description: 1 for a company, 2 for a private person.
        name_1:
          type: string
          description: Company name, or family name for a private person.
        name_2:
          type: string
          description: 'Second name line: given name, or a department.'
        address:
          type: string
          description: Street and house number.
        postcode:
          type: string
          description: Postal code.
        city:
          type: string
          description: City.
        country_id:
          type: number
          description: bexio country id; 1 is Switzerland.
        mail:
          type: string
          description: Primary e-mail address.
        phone_fixed:
          type: string
          description: Landline phone number.
        user_id:
          type: number
          description: bexio user id the contact is assigned to.
      required:
        - contact_type_id
        - name_1
        - user_id
    operation:
      method: POST
      path: /2.0/contact
      body:
        value:
          contact_type_id: '{{params.contact_type_id}}'
          name_1: '{{params.name_1}}'
          name_2: '{{params.name_2}}'
          address: '{{params.address}}'
          postcode: '{{params.postcode}}'
          city: '{{params.city}}'
          country_id: '{{params.country_id}}'
          mail: '{{params.mail}}'
          phone_fixed: '{{params.phone_fixed}}'
          user_id: '{{params.user_id}}'
          owner_id: '{{params.user_id}}'
