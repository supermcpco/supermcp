# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: holded
  name: Holded
  description: 'Holded — the Spanish SMB business suite: contacts, sales and purchase documents, products, warehouses, treasury accounts and CRM funnels. REST API v1, API-key auth.'
  region: es
  category: accounting
  icon: holded
  docsUrl: https://developers.holded.com/reference
credentials:
  HOLDED_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.holded.com/api
  headers:
    Accept: application/json
auth:
  type: apiKey
  in: header
  name: key
  value: '{{env.HOLDED_API_KEY}}'
healthcheck:
  tool: holded_list_contacts
  http:
    method: GET
    path: /invoicing/v1/contacts
instructions: |-
  **Getting a key**
  1. Sign in to Holded and open **Configuración → Desarrolladores → API key** (Settings → Developers).
  2. Generate a key and put it in `HOLDED_API_KEY`. The key belongs to the account, not to a user, and carries full access to every module you have subscribed to — treat it as a password.

  **The key travels in a `key` header.** Not `Authorization`, not a query parameter. Holded's own documentation calls it simply `key`.

  **One API, several modules, one path prefix each.** Invoicing lives under `/invoicing/v1`, CRM under `/crm/v1`, projects under `/projects/v1`, team under `/team/v1`. The tools below carry the right prefix per resource; a 404 on a path that looks right usually means the module is not on your plan.

  **Documents are one endpoint with a type.** `/invoicing/v1/documents/{docType}` covers invoices, sales receipts, credit notes, estimates, purchase orders and supplier invoices — the `docType` path segment picks one: `invoice`, `salesreceipt`, `creditnote`, `salesorder`, `estimate`, `purchase`, `purchaseorder`, `waybill`.

  **Dates are Unix timestamps in seconds**, not ISO strings, on the `starttmp`/`endtmp` filters. This catches everyone once.

  **Cloud reachability**: api.holded.com is public with a valid certificate.
tools:
  - name: holded_list_contacts
    description: List contacts — customers, suppliers, leads — with their name, NIF/CIF, e-mail, address and the type flags that say which role they hold.
    input:
      type: object
      properties:
        page:
          type: string
          description: Page number, starting at 1.
        type:
          type: string
          description: Restrict by contact type, e.g. client or supplier.
    operation:
      method: GET
      path: /invoicing/v1/contacts
      query:
        page: '{{params.page}}'
        type: '{{params.type}}'
  - name: holded_get_contact
    description: 'Read one contact in full: tax data, billing address, payment terms, default VAT rate and the notes recorded against them.'
    input:
      type: object
      properties:
        contactId:
          type: string
          description: Holded contact id.
      required:
        - contactId
    operation:
      method: GET
      path: /invoicing/v1/contacts/{{params.contactId}}
  - name: holded_list_documents
    description: List documents of one type — invoices, estimates, credit notes, purchase orders — with their number, date, contact, total and payment status.
    input:
      type: object
      properties:
        docType:
          type: string
          description: 'Document type: invoice, salesreceipt, creditnote, salesorder, estimate, purchase, purchaseorder, waybill.'
        starttmp:
          type: number
          description: Earliest document date as a Unix timestamp in seconds.
        endtmp:
          type: number
          description: Latest document date as a Unix timestamp in seconds.
        contactid:
          type: string
          description: Restrict to one contact's documents.
        page:
          type: string
          description: Page number, starting at 1.
      required:
        - docType
    operation:
      method: GET
      path: /invoicing/v1/documents/{{params.docType}}
      query:
        starttmp: '{{params.starttmp}}'
        endtmp: '{{params.endtmp}}'
        contactid: '{{params.contactid}}'
        page: '{{params.page}}'
  - name: holded_get_document
    description: 'Read one document in full: every line with its quantity, price, discount and VAT, the totals, and the payments applied against it.'
    input:
      type: object
      properties:
        docType:
          type: string
          description: Document type, e.g. invoice.
        documentId:
          type: string
          description: Holded document id.
      required:
        - docType
        - documentId
    operation:
      method: GET
      path: /invoicing/v1/documents/{{params.docType}}/{{params.documentId}}
  - name: holded_list_products
    description: List products and services with their SKU, name, price, cost, VAT rate and stock level.
    input:
      type: object
      properties:
        page:
          type: string
          description: Page number, starting at 1.
    operation:
      method: GET
      path: /invoicing/v1/products
      query:
        page: '{{params.page}}'
  - name: holded_list_warehouses
    description: List warehouses with their name and location, so a stock question can name the right one.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /invoicing/v1/warehouses
  - name: holded_list_treasury_accounts
    description: List the treasury accounts (bank and cash) with their name, IBAN and current balance — the cash-position answer.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /invoicing/v1/treasury
  - name: holded_list_funnels
    description: List the CRM funnels with their stages, so a pipeline question knows which stages exist before asking about leads in them.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /crm/v1/funnels
  - name: holded_list_leads
    description: List CRM leads with their name, contact, value, funnel stage and expected close date — the sales-pipeline view.
    input:
      type: object
      properties:
        page:
          type: string
          description: Page number, starting at 1.
    operation:
      method: GET
      path: /crm/v1/leads
      query:
        page: '{{params.page}}'
