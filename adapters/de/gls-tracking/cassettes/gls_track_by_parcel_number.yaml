        <!-- 400817 (gls_group_module_01_hero_slider): end --><a id="gls_group_module_43_free_text" name="gls_group_module_43_free_text"></a>
        <!-- 400818 (gls_group_module_43_free_text): start -->
        <div class="ce_text_container">
        <!-- (gls_group_molecule_free_text): start -->
        <div class="container ce_text">
        <div class="row">
        <div class="col-sm-12">
        <h2 class="text-center">Welcome!<br></h2><p><br></p><p>This page provides guidance on how to register for the GLS Track and Trace API.</p><p>The <b>Track &#38; Trace V1 API</b> provides real-time parcel tracking across regions. By submitting parcel numbers or other valid reference types, you can retrieve current status information and detailed event history for one or multiple shipments in a single request.</p>
        </div>
        </div>
        </div>
        <!-- (gls_group_molecule_free_text): end -->
        </div>
        <!-- 400818 (gls_group_module_43_free_text): end --><a id="gls_group_module_43_free_text_1" name="gls_group_module_43_free_text_1"></a>
        <!-- 1281490 (gls_group_module_43_free_text): start -->
        <div class="ce_text_container">
        <!-- (gls_group_molecule_free_text): start -->
        <div class="bg-soft-blue-sky pt-60">
        <div class="container ce_text pb-60">
        <div class="row">
        <div class="col-sm-12">
        <p><b>How to Register and Start Using the API</b></p><p>Access to the API is managed via the
        <a href="https://dev-portal.gls-group.net/" target="_blank" rel="noopener noreferrer" class="external-url" data-analytics="click" data-analytics-action="Click" data-analytics-category="Inline Link External" data-analytics-label="GLS developer portal" > GLS Developer Portal. </a></p><p><b>Step 1: Create an Account</b></p><p>Visit the GLS Developer Portal and create your user account.</p><p><b>Step 2: Create an App and Enable the Track &#38; Trace V1 API</b></p><p>After logging in, click on &#8220;+ New App&#8221;.</p><p>Enter a mandatory App Name, then select Track &#38; Trace V1 API from the list of available APIs and click &#8220;Enable&#8221;.</p><p>Once saved, your app is automatically registered, and the API is activated for immediate use.</p><p><b>Step 3: Start Using the API</b></p><p>By default, each account includes <b>500 API calls per day</b>, which is suitable for testing and smaller integrations.</p>
        </div>
        </div>
        </div>
        </div>
        <!-- (gls_group_molecule_free_text): end -->
        </div>
        <!-- 1281490 (gls_group_module_43_free_text): end --><a id="gls_group_module_43_free_text_2" name="gls_group_module_43_free_text_2"></a>
        <!-- 1281491 (gls_group_module_43_free_text): start -->
        <div class="ce_text_container">
        <!-- (gls_group_molecule_free_text): start -->
        <div class="container ce_text">
        <div class="row">
        <div class="col-sm-12">
        <p><b>Where to Find Your Credentials and Documentation</b></p><p><b>API Credentials: </b><br>After enabling, you can find your API credentials in the Developer Portal under:<br><b>Apps → My Apps.</b></p><p><b>API Documentation: </b><br>The full technical documentation, including endpoints, parameters, and examples, is available directly in the Developer Portal under:<br><b>APIs → Track &#38; Trace V1.</b></p>
        </div>
        </div>
        </div>
        <!-- (gls_group_molecule_free_text): end -->
        </div>
        <!-- 1281491 (gls_group_module_43_free_text): end --><a id="gls_group_module_02_teasers_1_column" name="gls_group_module_02_teasers_1_column"></a>
        <!-- 1281492 (gls_group_module_02_teasers_1_column): start -->
        <div class="one-column-teasers container " >
        <div class="row pb-40px">
        <div class="col-sm-12">
        <!-- (gls_group_molecule_teaser_card_wide): start -->
        <div class="card card-shadow card-hover text-center card_no_btn" >
        <div class="card-body">
        <h4 >Need Higher Request Volumes?</h4>
        <div class="">
        <p>If you require a higher daily request limit for production use, please contact your responsible
        <a href="https://gls-group.eu/GROUP/en/contact-form/" target="_blank" rel="noopener noreferrer" class="external-url" data-analytics="click" data-analytics-action="Click" data-analytics-category="Inline Link External" > GLS IT, Sales, or Partner Management contact </a>. <br>They will coordinate the next steps and arrange the appropriate access level based on your expected shipment volume.</p>
        </div>
        </div>
        </div>
        <!-- (gls_group_molecule_teaser_card_wide): end -->
        </div>
        </div>
        </div>
