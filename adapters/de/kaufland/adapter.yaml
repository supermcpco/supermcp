# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: kaufland
  name: Kaufland Marketplace
  description: 'Kaufland Marketplace (formerly real.de) seller API: orders and their units, shipments, storefront listings, units, tickets and warehouses. HMAC-signed requests — the signature covers the method, URL, body and a timestamp.'
  region: de
  category: e-commerce
  icon: kaufland
  docsUrl: https://sellerapi.kaufland.com/
credentials:
  KAUFLAND_CLIENT_KEY:
    required: true
    secret: true
  KAUFLAND_SECRET_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://sellerapi.kaufland.com/v2
  headers:
    Accept: application/json
auth:
  type: hmac
  algorithm: sha256
  encoding: hex
  secret: '{{env.KAUFLAND_SECRET_KEY}}'
  stringToSign: |
    {{req.method}}
    {{req.url}}
    {{req.body}}
    {{req.timestamp}}
  signatureHeader: Shop-Signature
  timestampHeader: Shop-Timestamp
  extraHeaders:
    Shop-Client-Key: '{{env.KAUFLAND_CLIENT_KEY}}'
healthcheck:
  tool: kaufland_list_warehouses
  http:
    method: GET
    path: /warehouses
instructions: |-
  **Getting credentials**
  1. You must already be a Kaufland Marketplace seller. In the **Seller Portal** open **Settings → API keys** and create a key pair.
  2. You receive a **Client Key** (public, identifies you) and a **Secret Key** (never sent — it signs the request). Set `KAUFLAND_CLIENT_KEY` and `KAUFLAND_SECRET_KEY`.

  **The secret never travels.** Kaufland does not accept a bearer token: every request carries `Shop-Client-Key`, `Shop-Timestamp` and `Shop-Signature`, where the signature is an HMAC-SHA256 over the canonical string

  ```
  <METHOD>\n<FULL URL INCLUDING QUERY>\n<BODY>\n<UNIX TIMESTAMP>\n
  ```

  keyed with the secret. supermcp computes it per request and sends the timestamp it used, so the server can recompute the same string.

  **A signature is only valid for a few minutes.** Kaufland rejects a request whose timestamp has drifted, which means a 401 here can be a clock problem rather than a key problem. If every call fails and the keys are definitely right, check the host's time.

  **Storefronts are per country.** Kaufland runs `de`, `cz`, `sk`, `pl` and `at` storefronts and most endpoints take a `storefront` parameter. Omitting it gives you the seller's default, which is rarely what a report about one market wants.

  **Orders page with offset and limit**, and `ts_created_from` / `ts_created_to` bound the window — both ISO 8601. Ask for the window you mean; the default is short.

  **Order units are where the money is.** An order carries `order_units`, each with its own status, price and fulfilment state. A part-cancelled order is normal, so a revenue figure should sum the units that were actually fulfilled rather than the order total.

  **Cloud reachability**: sellerapi.kaufland.com is public with a valid certificate.
tools:
  - name: kaufland_list_warehouses
    description: List the seller's warehouses with their id, name and address. No parameters — the lightest call, and the quickest proof that the key pair and the host clock both line up.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /warehouses
  - name: kaufland_list_orders
    description: 'List orders in a time window with their buyer, storefront, totals and status. Bound the window explicitly: the default is short and a report that silently used it will understate the period.'
    input:
      type: object
      properties:
        storefront:
          type: string
          description: 'Storefront to query: de, cz, sk, pl or at.'
        ts_created_from:
          type: string
          description: Earliest order creation time, ISO 8601.
        ts_created_to:
          type: string
          description: Latest order creation time, ISO 8601.
        limit:
          type: number
          description: Rows per page (default 30, max 100).
        offset:
          type: number
          description: Rows to skip, for paging.
        sort:
          type: string
          description: Sort expression, e.g. ts_created:desc.
        embedded:
          type: string
          description: Related objects to expand inline, e.g. order_units,order_invoices.
    operation:
      method: GET
      path: /orders
      query:
        storefront: '{{params.storefront}}'
        ts_created_from: '{{params.ts_created_from}}'
        ts_created_to: '{{params.ts_created_to}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        sort: '{{params.sort}}'
        embedded: '{{params.embedded}}'
  - name: kaufland_get_order
    description: 'Read one order in full: the buyer, the delivery address, the payment and every order unit with its own price, status and fulfilment state.'
    input:
      type: object
      properties:
        id_order:
          type: string
          description: Kaufland order id.
        embedded:
          type: string
          description: Related objects to expand, e.g. order_units.
      required:
        - id_order
    operation:
      method: GET
      path: /orders/{{params.id_order}}
      query:
        embedded: '{{params.embedded}}'
  - name: kaufland_list_order_units
    description: List individual order units — the level Kaufland actually fulfils, cancels and pays out at. A part-cancelled order is normal, so revenue should be summed here rather than from the order total.
    input:
      type: object
      properties:
        storefront:
          type: string
          description: 'Storefront to query: de, cz, sk, pl or at.'
        status:
          type: string
          description: Unit status, e.g. open, sent, cancelled, returned.
        ts_created_from:
          type: string
          description: Earliest creation time, ISO 8601.
        limit:
          type: number
          description: Rows per page (max 100).
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /order-units
      query:
        storefront: '{{params.storefront}}'
        status: '{{params.status}}'
        ts_created_from: '{{params.ts_created_from}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: kaufland_list_units
    description: List the seller's units (offers) with their EAN, condition, price, stock and the storefront each is listed on.
    input:
      type: object
      properties:
        storefront:
          type: string
          description: 'Storefront to query: de, cz, sk, pl or at.'
        ean:
          type: string
          description: Restrict to one EAN.
        limit:
          type: number
          description: Rows per page (max 100).
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /units
      query:
        storefront: '{{params.storefront}}'
        ean: '{{params.ean}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: kaufland_list_shipments
    description: List reported shipments with their carrier, tracking number and the order units they cover — the answer to whether something has actually gone out.
    input:
      type: object
      properties:
        storefront:
          type: string
          description: Storefront to query.
        limit:
          type: number
          description: Rows per page (max 100).
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /shipments
      query:
        storefront: '{{params.storefront}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: kaufland_list_tickets
    description: List customer service tickets with their subject, status and the order they relate to — where a buyer complaint shows up before it becomes a rating.
    input:
      type: object
      properties:
        storefront:
          type: string
          description: Storefront to query.
        status:
          type: string
          description: Ticket status filter.
        limit:
          type: number
          description: Rows per page (max 100).
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /tickets
      query:
        storefront: '{{params.storefront}}'
        status: '{{params.status}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: kaufland_list_storefronts
    description: List the storefronts this seller is active on, with the currency and locale of each. Use it to find the storefront code the other tools need.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /storefronts
