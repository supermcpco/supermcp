# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: jtl-wawi
  name: JTL-Wawi
  description: JTL-Wawi — the e-commerce ERP behind a large share of German online retail. Read customers, items, stock, sales orders and shipments from your on-premises JTL-Wawi via the JTL API Server. REST v1, bearer token.
  region: de
  category: erp
  icon: jtl-wawi
  docsUrl: https://developer.jtl-software.com/products/wawi/api
credentials:
  JTL_WAWI_URL:
    required: true
  JTL_WAWI_API_KEY:
    required: true
    secret: true
  JTL_WAWI_APP_ID:
    required: true
transport:
  type: http
  baseUrl: '{{env.JTL_WAWI_URL}}/api/eazybusiness/v1'
  headers:
    X-AppId: '{{env.JTL_WAWI_APP_ID}}'
    Accept: application/json
auth:
  type: bearer
  token: '{{env.JTL_WAWI_API_KEY}}'
healthcheck:
  tool: jtl_wawi_list_warehouses
  http:
    method: GET
    path: /warehouses
instructions: |
  **JTL-Wawi is on-premises Windows software and does not speak HTTP on its own.** The REST API is served by the separate **JTL API Server** (sometimes called the Wawi API / `JTL-Wawi API`), which you install alongside the Wawi database.
  1. Install the JTL API Server on the machine that reaches your JTL-Wawi MSSQL database, and start its service.
  2. In the API Server's admin UI create an **App** and copy the generated key. JTL issues it base64-encoded; use it exactly as given.
  3. Set `JTL_WAWI_URL` to the API server's root (e.g. `https://wawi.example.com:5883`, no trailing slash) and `JTL_WAWI_API_KEY` to the key. The adapter sends `Authorization: Bearer <key>` and `X-AppId`.

  **Set `JTL_WAWI_APP_ID`** to the App id shown next to the key. JTL routes and rate-limits per app.

  **Pagination is header-driven.** JTL's list endpoints take `$top` and `$skip` and return the total in an `X-Total-Count` response header. Ask for a page, look at the total, ask for the next — do not loop blindly.

  **Item vs stock.** `jtl_wawi_list_items` returns the article master (name, SKU, prices); `jtl_wawi_get_item_stock` returns the per-warehouse quantities. Availability questions need the second one — the article master's stock field is a cached roll-up and can lag.

  **Unverified.** The paths and field names below follow the vendor's published documentation and have not been exercised against a live tenant. Treat a 404 as a docs-versus-reality gap and check the developer portal before concluding that the credential is wrong. A correction from anyone running this against a real system is genuinely welcome.

  **Self-hosted, which is the thing to plan for.**
  - On a **hosted supermcp instance** the instance must be reachable from the public internet on a real hostname with a valid TLS certificate. A self-signed certificate will fail: the connector offers no trust-anything switch.
  - On an internal host (`wawi.intern`, `10.0.0.x`), self-host supermcp on the same network and add that host to `SSRF_ALLOWED_HOSTS`, or the outbound guard refuses the call before it is made.
tools:
  - name: jtl_wawi_list_warehouses
    description: List the warehouses (Lager) configured in JTL-Wawi with their id, name and type. No parameters — the quickest check that the API server and the app key line up.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /warehouses
  - name: jtl_wawi_list_items
    description: List articles from the item master with their SKU, name, prices, EAN and manufacturer. Use a search fragment to find one article before asking about its stock.
    input:
      type: object
      properties:
        searchKeyWord:
          type: string
          description: Search fragment matched against SKU, name and EAN.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /items
      query:
        searchKeyWord: '{{params.searchKeyWord}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
  - name: jtl_wawi_get_item
    description: 'Read one article in full: its SKU, descriptions, dimensions, prices, categories and supplier links.'
    input:
      type: object
      properties:
        itemId:
          type: number
          description: Numeric JTL item id (kArtikel).
      required:
        - itemId
    operation:
      method: GET
      path: /items/{{params.itemId}}
  - name: jtl_wawi_get_item_stock
    description: 'Read the per-warehouse stock of one article: quantity on hand, reserved, and available. This — not the item master''s cached field — is what an availability question needs.'
    input:
      type: object
      properties:
        itemId:
          type: number
          description: Numeric JTL item id (kArtikel).
      required:
        - itemId
    operation:
      method: GET
      path: /items/{{params.itemId}}/stocks
  - name: jtl_wawi_list_customers
    description: List customers with their customer number, company, contact name, address and customer group.
    input:
      type: object
      properties:
        searchKeyWord:
          type: string
          description: Search fragment matched against name, company and customer number.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /customers
      query:
        searchKeyWord: '{{params.searchKeyWord}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
  - name: jtl_wawi_get_customer
    description: 'Read one customer in full: billing and delivery addresses, payment and shipping defaults, and the customer group they belong to.'
    input:
      type: object
      properties:
        customerId:
          type: number
          description: Numeric JTL customer id (kKunde).
      required:
        - customerId
    operation:
      method: GET
      path: /customers/{{params.customerId}}
  - name: jtl_wawi_list_sales_orders
    description: List sales orders with their order number, customer, date, payment and shipping status and total. The core question of 'what is in the pipeline'.
    input:
      type: object
      properties:
        searchKeyWord:
          type: string
          description: Search fragment matched against order number and customer.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /salesOrders
      query:
        searchKeyWord: '{{params.searchKeyWord}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
  - name: jtl_wawi_get_sales_order
    description: 'Read one sales order in full: its line items with SKU, quantity and price, the addresses, and the payment and shipping state.'
    input:
      type: object
      properties:
        salesOrderId:
          type: number
          description: Numeric JTL sales order id (kBestellung).
      required:
        - salesOrderId
    operation:
      method: GET
      path: /salesOrders/{{params.salesOrderId}}
  - name: jtl_wawi_list_shipments
    description: List shipments with their tracking number, carrier, date and the sales order they belong to — the answer to 'has it gone out yet'.
    input:
      type: object
      properties:
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /shipments
      query:
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
