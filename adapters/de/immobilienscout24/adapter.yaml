# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: immobilienscout24
  name: ImmobilienScout24 API
  description: Search real estate listings on ImmobilienScout24, Germany's largest property portal, from any AI assistant. Find apartments and houses for sale or rent, resolve location GeoCodes, and read full listing detail. 3 tools, requires ImmobilienScout24 API credentials (OAuth 1.0a).
  region: de
  category: real-estate
  icon: immobilienscout24
  docsUrl: https://api.immobilienscout24.de/api-docs/get-started/get-your-client-credentials/
  lint:
    allow:
      - healthcheck-present
      - tool-name-prefix
credentials:
  IS24_CLIENT_ID:
    required: true
  IS24_CLIENT_SECRET:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://rest.immobilienscout24.de/restapi/api
auth:
  type: oauth1
  consumerKey: '{{env.IS24_CLIENT_ID}}'
  consumerSecret: '{{env.IS24_CLIENT_SECRET}}'
instructions: |-
  This connector wraps the official ImmobilienScout24 REST API (`rest.immobilienscout24.de`).

  **Authentication — OAuth 1.0a (handled for you)**: unlike most APIs, ImmobilienScout24 never moved to OAuth 2.0. It requires every request to be **signed** with HMAC-SHA1 per the OAuth 1.0a protocol. supermcp performs this signing automatically (two-legged / app-only) using your consumer key + secret — you do not exchange or refresh any token. Just provide the two credentials below.

  **Where to get the credentials** (`IS24_CLIENT_ID` = consumer key, `IS24_CLIENT_SECRET` = consumer secret):
  1. Go to the self-service portal: https://selfservice.immobilienscout24.de
  2. Log in with — or create — an ImmobilienScout24 account. ⚠️ A **business account is mandatory**; non-business accounts cannot be granted API access.
  3. Generate an API key set. You can issue keys for **sandbox** (free, for testing) and/or **production**.
  4. Production keys require accepting the API Terms of Use and are subject to ImmobilienScout24's published price list (paid). Some use cases require partner approval/vetting before production access is granted — this is not instant.
  5. Copy the generated **API key** into `IS24_CLIENT_ID` and the **secret** into `IS24_CLIENT_SECRET`.

  Docs: https://api.immobilienscout24.de/api-docs/get-started/get-your-client-credentials/

  **Scope**: this connector uses two-legged (app-only) signing, which covers public listing search and lookup. Acting on *your own* objects/leads (three-legged, user context) is not exposed here.

  **Workflow**:
  1. Resolve a location to a GeoCode with `is24_search_locations` (e.g. 'München Schwabing').
  2. Pass that geocode + a `realestatetype` to `is24_search_properties`.
  3. Read a single listing with `is24_get_property` using its expose ID.

  **Suggested starter prompts**:
  - "Find apartments to rent in Berlin Mitte under €1500/month on ImmobilienScout24."
  - "Look up the GeoCode for Hamburg Altona."
  - "Show me ImmobilienScout24 expose 123456789 in detail."
tools:
  - name: is24_search_properties
    description: Search for real estate listings on ImmobilienScout24 by location and filters. Returns property titles, prices, sizes, and listing IDs.
    input:
      type: object
      properties:
        geocode:
          type: string
          description: GeoCode ID for the search location (e.g. '1276003001' for Berlin Mitte). Use is24_search_locations to find the code.
        realestatetype:
          type: string
          description: 'Property type: ''apartmentrent'', ''apartmentbuy'', ''houserent'', ''housebuy'', ''office'', ''store'', ''gastronomy'''
        price_min:
          type: number
          description: Minimum price (rent per month or purchase price)
        price_max:
          type: number
          description: Maximum price
        livingspace_min:
          type: number
          description: Minimum living space in sqm
        numberofrooms_min:
          type: number
          description: Minimum number of rooms
        pagenumber:
          type: number
          description: 'Page number for pagination (default: 1)'
      required:
        - geocode
        - realestatetype
    proxy: true
    operation:
      method: GET
      path: /search/v1.0/search/region
      query:
        geocodes: '{{params.geocode}}'
        realestatetype: '{{params.realestatetype}}'
        price.min: '{{params.price_min}}'
        price.max: '{{params.price_max}}'
        livingspace.min: '{{params.livingspace_min}}'
        numberofrooms.min: '{{params.numberofrooms_min}}'
        pagenumber: '{{params.pagenumber}}'
        pagesize: "20"
      headers:
        Accept: application/json
  - name: is24_search_locations
    description: Search for ImmobilienScout24 GeoCode IDs by location name. Use this to find the geocode parameter needed for property searches.
    input:
      type: object
      properties:
        query:
          type: string
          description: Location name to search (e.g. 'Berlin', 'München Schwabing', 'Hamburg Altona')
      required:
        - query
    proxy: true
    operation:
      method: GET
      path: /gis/v1.0/geo/autocomplete
      query:
        i: '{{params.query}}'
      headers:
        Accept: application/json
  - name: is24_get_property
    description: Get detailed information about a specific real estate listing by its expose ID. Returns full property details including description, equipment, energy certificate, and contact info.
    input:
      type: object
      properties:
        exposeId:
          type: string
          description: The ImmobilienScout24 expose ID (listing ID)
      required:
        - exposeId
    proxy: true
    operation:
      method: GET
      path: /search/v1.0/expose/{{params.exposeId}}
      headers:
        Accept: application/json
