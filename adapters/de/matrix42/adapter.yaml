# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: matrix42
  name: Matrix42
  description: 'Matrix42 Enterprise Service Management: query any configuration item, incident, service request, asset or user with Matrix42''s fragment query API. Bearer token minted from an API token against your own instance.'
  region: de
  category: itsm
  icon: matrix42
  docsUrl: https://help.matrix42.com/030_DWP/030_ESM/Web_Services
credentials:
  MATRIX42_URL:
    required: true
  MATRIX42_API_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: '{{env.MATRIX42_URL}}'
  headers:
    Accept: application/json
auth:
  type: login
  request:
    method: POST
    url: '{{env.MATRIX42_URL}}/api/ApiToken/Token'
    headers:
      Content-Type: application/json
    body:
      ApiToken: '{{auth.password}}'
  credentials:
    username: '{{env.MATRIX42_API_TOKEN}}'
    password: '{{env.MATRIX42_API_TOKEN}}'
  tokenSource:
    from: body
    jsonPath: access_token
  expiry:
    ttl: 1h
    refreshBefore: 5m
    refreshOn401: true
  inject:
    header: Authorization
    template: Bearer {{auth.token}}
healthcheck:
  tool: matrix42_query_users
  http:
    method: GET
    path: /api/data/fragments/SPSScUserClassBase?columns=ID&$top=1
instructions: |
  **Setup**
  1. In Matrix42 open **Administration → Integration → API Tokens** and create a token for a service account with the roles the agent needs. Matrix42 applies role-based access on top of the API, so a restricted account sees fewer fragments.
  2. Set `MATRIX42_URL` to your instance root (e.g. `https://esm.example.com/M42Services`, no trailing slash) and `MATRIX42_API_TOKEN` to the token.
  3. The adapter exchanges that token for a short-lived bearer at `/api/ApiToken/Token` and refreshes it automatically. supermcp stores the bearer encrypted in `connector_auth_cache`.

  **Everything is a fragment.** Matrix42's data model is *Configuration Items* made of typed *fragments*: `SPSActivityTypeIncident` for an incident, `SPSAssetClassBase` for an asset, `SPSScUserClassBase` for a user. The query API takes the fragment name plus the columns you want, and returns rows. There is no per-entity REST path — this is why every tool here takes a `fragmentName`.

  **`columns` is not optional in practice.** Matrix42 fragments have dozens of columns and omitting the list returns all of them. Name what you need.

  **`where` is SQL-flavoured**, e.g. `State = 3 AND CreatedDate > '2026-09-01'`. Column names are the fragment's, which differ from the labels shown in the web UI. `matrix42_get_fragment_schema` returns the real names.

  **`$skip` / `$top` page the result.** There is no cursor.

  **Unverified.** The paths and field names below follow the vendor's published documentation and have not been exercised against a live tenant. Treat a 404 as a docs-versus-reality gap and check the developer portal before concluding that the credential is wrong. A correction from anyone running this against a real system is genuinely welcome.

  **Self-hosted, which is the thing to plan for.**
  - On a **hosted supermcp instance** the instance must be reachable from the public internet on a real hostname with a valid TLS certificate. A self-signed certificate will fail: the connector offers no trust-anything switch.
  - On an internal host (`esm.intern`, `10.0.0.x`), self-host supermcp on the same network and add that host to `SSRF_ALLOWED_HOSTS`, or the outbound guard refuses the call before it is made.
tools:
  - name: matrix42_query_fragments
    description: Query any Matrix42 fragment by name with a column list and a SQL-flavoured where clause. The general-purpose read — everything in Matrix42 is reachable this way.
    input:
      type: object
      properties:
        fragmentName:
          type: string
          description: Fragment type name, e.g. SPSActivityTypeIncident, SPSAssetClassBase, SPSScUserClassBase.
        columns:
          type: string
          description: Comma-separated columns to return. Name them — fragments have dozens.
        where:
          type: string
          description: SQL-flavoured filter over that fragment's columns, e.g. State = 3.
        orderby:
          type: string
          description: Sort expression, e.g. `CreatedDate desc`.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
      required:
        - fragmentName
        - columns
    operation:
      method: GET
      path: /api/data/fragments/{{params.fragmentName}}
      query:
        columns: '{{params.columns}}'
        where: '{{params.where}}'
        orderby: '{{params.orderby}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
  - name: matrix42_get_fragment_schema
    description: 'Read the column definitions of one fragment: the real column names, their types and their relations. Needed because the UI labels differ from the column names.'
    input:
      type: object
      properties:
        fragmentName:
          type: string
          description: Fragment type name, e.g. SPSActivityTypeIncident.
      required:
        - fragmentName
    operation:
      method: GET
      path: /api/schema/fragments/{{params.fragmentName}}
  - name: matrix42_query_incidents
    description: 'Query incidents with a where clause over the incident fragment: state, priority, category, reported date and the affected user.'
    input:
      type: object
      properties:
        columns:
          type: string
          description: Comma-separated columns to return. Defaults to a useful subset when omitted.
        where:
          type: string
          description: SQL-flavoured filter, e.g. State = 3 AND Priority = 1.
        orderby:
          type: string
          description: Sort expression, e.g. `CreatedDate desc`.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /api/data/fragments/SPSActivityTypeIncident
      query:
        columns: '{{params.columns}}'
        where: '{{params.where}}'
        orderby: '{{params.orderby}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
  - name: matrix42_query_service_requests
    description: 'Query service requests with a where clause: their state, requested service, requester and fulfilment dates.'
    input:
      type: object
      properties:
        columns:
          type: string
          description: Comma-separated columns to return.
        where:
          type: string
          description: SQL-flavoured filter over the service-request fragment.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /api/data/fragments/SPSActivityTypeServiceRequest
      query:
        columns: '{{params.columns}}'
        where: '{{params.where}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
  - name: matrix42_query_assets
    description: 'Query the asset base: hardware and software configuration items with their name, type, serial number, status and assigned user.'
    input:
      type: object
      properties:
        columns:
          type: string
          description: Comma-separated columns to return.
        where:
          type: string
          description: SQL-flavoured filter over the asset fragment.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /api/data/fragments/SPSAssetClassBase
      query:
        columns: '{{params.columns}}'
        where: '{{params.where}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
  - name: matrix42_query_users
    description: Query the user base with their display name, e-mail, department and location. The quickest call for checking that the API token exchange works.
    input:
      type: object
      properties:
        columns:
          type: string
          description: Comma-separated columns to return.
        where:
          type: string
          description: SQL-flavoured filter, e.g. EmailAddress LIKE '%@example.com'.
        top:
          type: number
          description: Maximum rows to return.
        skip:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /api/data/fragments/SPSScUserClassBase
      query:
        columns: '{{params.columns}}'
        where: '{{params.where}}'
        $top: '{{params.top}}'
        $skip: '{{params.skip}}'
  - name: matrix42_get_object
    description: Read one configuration item by its object id, returning the named fragments attached to it. The detail call after a query has returned ids.
    input:
      type: object
      properties:
        objectId:
          type: string
          description: Matrix42 object id (GUID).
        fragments:
          type: string
          description: Comma-separated fragment names to include.
      required:
        - objectId
    operation:
      method: GET
      path: /api/data/objects/{{params.objectId}}
      query:
        fragments: '{{params.fragments}}'
