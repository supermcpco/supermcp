    description: List step list templates (reusable checklists). Returns Id, Name, MappingId, IsReleased, IsDurable, DateModified, and Version.
    input:
      type: object
      properties:
        $expand:
          type: string
          description: 'Expand: Steps (to include template steps)'
        $filter:
          type: string
          description: 'OData filter. Examples: "IsReleased eq true", "Name eq ''Safety Check''"'
    operation:
      method: GET
      path: /StepListTemplates
      query:
        $expand: '{{params.$expand}}'
        $filter: '{{params.$filter}}'
  - name: mfr_get_step_list_template
    description: Get a single step list template by its numeric ID.
    input:
      type: object
      properties:
        templateId:
          type: string
          description: The template numeric ID
        $expand:
          type: string
          description: 'Expand: Steps'
      required:
        - templateId
    operation:
      method: GET
      path: /StepListTemplates({{params.templateId}}L)
      query:
        $expand: '{{params.$expand}}'
  - name: mfr_create_step_list_template
    description: Create a new reusable step list template (checklist).
    input:
      type: object
      properties:
        Name:
          type: string
          description: Template name
        MappingId:
          type: string
          description: External mapping/reference ID
        IsReleased:
          type: boolean
          description: 'Whether the template is released for use (default: false)'
      required:
        - Name
    operation:
      method: POST
      path: /StepListTemplates
  - name: mfr_generate_report
    description: Generate a PDF report for a service request using a report definition. Returns a hash/URL to download the generated report.
    input:
      type: object
      properties:
        serviceRequestId:
          type: string
          description: The service request numeric ID
        reportDefinitionId:
          type: string
          description: The report definition ID to use for generation
      required:
        - serviceRequestId
        - reportDefinitionId
    operation:
      method: POST
      path: /ServiceRequests({{params.serviceRequestId}}L)/GenerateReportHash
