***************************************************************************<br/>Im Bereich der Gemeinde Rehlingen-Siersburg – in den Ortsteilen Biringen, Fürweiler, Gerlfangen,<br/>Hemmersdorf und Oberesch – wurde im Rahmen von Routinekontrollen des Trinkwassers eine<br/>mikrobiologische Verunreinigung festgestellt.<br/><br/>Es sind nur die genannten Ortsteile betroffen!<br/><br/>Die Ursache der Verunreinigung wird geklärt und Maßnahmen zur Behebung der Störung sind<br/>eingeleitet. Unter anderem werden engmaschige bakteriologische Kontrollen durchgeführt.<br/>In Abstimmung mit dem Gesundheitsamt Saarlouis wurde, gemäß dem bestehenden Maßnahmenplan<br/>nach Trinkwasserverordnung, eine Schutzchlorung angeordnet.<br/>Infolge der Schutzchlorung kann das Trinkwasser in den betroffenen Ortsteilen leicht nach Chlor<br/>riechen. Von dem Chlorgehalt geht jedoch keine Gesundheitsgefährdung aus – das Wasser kann<br/>uneingeschränkt genutzt werden.<br/>Die Babynahrung sollte bis zum Ende der Schutzchlorung mit abgepacktem Wasser<br/>zubereitet werden.<br/>Da weiterhin – u. a. in den Nachtstunden – Spülvorgänge im Netz stattfinden mit dem Auftreten von<br/>Trübung im Trinkwasser gerechnet werden.<br/>Die Trübung des Trinkwassers ist gesundheitlich unbedenklich.<br/>Es erfolgt eine erneute Information an die Bevölkerung, sobald die vorsorgliche Schutzchlorung<br/>beendet wird.<br/>Für Rückfragen erreichen Sie uns jederzeit unter folgender Telefon-Notrufnummer:<br/>06835 501933","instruction":"Informieren Sie sich, zum Beispiel im Radio.<br/>- Infolge der Schutzchlorung kann das Trinkwasser in den betroffenen Ortsteilen leicht nach Chlor<br/>riechen. Von dem Chlorgehalt geht jedoch keine Gesundheitsgefährdung aus –<br/>das Wasser kann uneingeschränkt genutzt werden.<br/><br/>- Die Babynahrung sollte bis zum Ende der Schutzchlorung mit abgepacktem Wasser<br/>zubereitet werden.","web":"https://twrs-gmbh.de/","contact":"TWRS Technische Werke der Gemeinde Rehlingen-Siersburg GmbH<br/