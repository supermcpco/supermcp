# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: lexware-office
  name: Lexware Office
  description: Lexware Office (formerly lexoffice) — Germany's most-used SMB bookkeeping app. Read and create contacts, invoices, quotations, credit notes, vouchers and articles, and pull the voucher list that drives the Buchhaltung. Public REST API v1, bearer token.
  region: de
  category: accounting
  icon: lexware-office
  docsUrl: https://developers.lexware.io/docs/
credentials:
  LEXWARE_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.lexware.io/v1
auth:
  type: bearer
  token: '{{env.LEXWARE_API_KEY}}'
healthcheck:
  tool: lexware_office_get_profile
  http:
    method: GET
    path: /profile
instructions: |-
  **Getting a token**
  1. Sign in to Lexware Office (lexoffice) with an account on a paid plan — the API is not available on the free tier.
  2. Open **Einstellungen → Erweiterungen → Öffentliche API** and create a new access token. The token is shown once; store it immediately.
  3. Set `LEXWARE_API_KEY` to that value. It is a personal token scoped to the one company (Mandant) it was created in; a tax adviser handling several clients needs one connector per client.

  **API version**: this adapter targets the public REST API **v1** at `https://api.lexware.io/v1`. Lexware still serves the historical `api.lexoffice.io` host; both answer the same tokens, but new integrations should use `api.lexware.io`.

  **Rate limit**: 2 requests per second per token. The API answers a burst with `429`; the agent should pace bulk work rather than retry in a tight loop.

  **Vouchers vs invoices**: `lexware_office_list_vouchers` reads the *voucher list* — the bookkeeping view that contains sales invoices, purchase invoices, credit notes and receipts alike, and is what you want for "what is unpaid". `lexware_office_get_invoice` reads a single sales invoice document with its line items.

  **Writes**: `lexware_office_create_contact` and `lexware_office_create_invoice` create real records in the live company. An invoice created with `finalize: false` stays a draft (Entwurf) and can still be deleted in the UI; finalized invoices are legally immutable under GoBD and can only be corrected with a credit note.

  **Cloud reachability**: api.lexware.io is public with a valid certificate, so a hosted supermcp instance reaches it with no extra setup.
tools:
  - name: lexware_office_get_profile
    description: 'Read the connected company profile: company name, tax number, VAT id, the connection''s user id and the small-business (Kleinunternehmer) flag. Fast call — use it to verify the token works.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /profile
  - name: lexware_office_list_contacts
    description: List contacts (customers and vendors) with paging. Filter by role or by a free-text name fragment to find the party before reading or creating a document for them.
    input:
      type: object
      properties:
        page:
          type: number
          description: Zero-based page index (default 0).
        size:
          type: number
          description: Page size, 1–250 (default 25).
        email:
          type: string
          description: Exact e-mail address to filter by.
        name:
          type: string
          description: Name fragment; matches company name or last name.
        customer:
          type: boolean
          description: When true, only contacts that have the customer role.
        vendor:
          type: boolean
          description: When true, only contacts that have the vendor role.
    operation:
      method: GET
      path: /contacts
      query:
        page: '{{params.page}}'
        size: '{{params.size}}'
        email: '{{params.email}}'
        name: '{{params.name}}'
        customer: '{{params.customer}}'
        vendor: '{{params.vendor}}'
  - name: lexware_office_get_contact
    description: Read one contact by its Lexware id, including all addresses, the customer/vendor roles, contact persons, e-mail addresses and phone numbers.
    input:
      type: object
      properties:
        id:
          type: string
          description: Contact UUID as returned by lexware_office_list_contacts.
      required:
        - id
    operation:
      method: GET
      path: /contacts/{{params.id}}
  - name: lexware_office_list_vouchers
    description: Search the voucher list — the bookkeeping view across sales invoices, purchase invoices, credit notes, down payments and receipts. This is the tool for questions like 'what is still open' or 'what did we book in Q3'.
    input:
      type: object
      properties:
        voucherType:
          type: string
          description: 'Comma-separated types: salesinvoice, salescreditnote, purchaseinvoice, purchasecreditnote, invoice, creditnote, orderconfirmation, quotation, deliverynote, downpaymentinvoice.'
        voucherStatus:
          type: string
          description: 'Comma-separated statuses: draft, open, paid, paidoff, voided, transferred, sepadebit, overdue, accepted, rejected.'
        archived:
          type: boolean
          description: When true, include archived vouchers.
        contactId:
          type: string
          description: Restrict to one contact's vouchers (UUID).
        voucherDateFrom:
          type: string
          description: Earliest voucher date, YYYY-MM-DD.
        voucherDateTo:
          type: string
          description: Latest voucher date, YYYY-MM-DD.
        page:
          type: number
          description: Zero-based page index (default 0).
        size:
          type: number
          description: Page size, 1–250 (default 25).
    operation:
      method: GET
      path: /voucherlist
      query:
        voucherType: '{{params.voucherType}}'
        voucherStatus: '{{params.voucherStatus}}'
        archived: '{{params.archived}}'
        contactId: '{{params.contactId}}'
        voucherDateFrom: '{{params.voucherDateFrom}}'
        voucherDateTo: '{{params.voucherDateTo}}'
        page: '{{params.page}}'
        size: '{{params.size}}'
  - name: lexware_office_get_invoice
    description: 'Read one sales invoice in full: header, addressee, every line item with net/gross and tax rate, the total amounts, the payment terms and the shipping date.'
    input:
      type: object
      properties:
        id:
          type: string
          description: Invoice UUID, as returned in the voucher list's `id` field.
      required:
        - id
    operation:
      method: GET
      path: /invoices/{{params.id}}
  - name: lexware_office_get_quotation
    description: Read one quotation (Angebot) in full, including its line items, totals, validity date and current status.
    input:
      type: object
      properties:
        id:
          type: string
          description: Quotation UUID.
      required:
        - id
    operation:
      method: GET
      path: /quotations/{{params.id}}
  - name: lexware_office_get_credit_note
    description: 'Read one credit note (Rechnungskorrektur) in full: the invoice it corrects, its line items and its totals.'
    input:
      type: object
      properties:
        id:
          type: string
          description: Credit note UUID.
      required:
        - id
    operation:
      method: GET
      path: /credit-notes/{{params.id}}
  - name: lexware_office_list_articles
    description: List articles (Artikel) from the product catalogue, optionally narrowed by article number or type, so an invoice line can reference a real product.
    input:
      type: object
      properties:
        articleNumber:
          type: string
          description: Exact article number to look up.
        type:
          type: string
          description: Either `PRODUCT` or `SERVICE`.
        page:
          type: number
          description: Zero-based page index (default 0).
        size:
          type: number
          description: Page size, 1–250 (default 25).
    operation:
      method: GET
      path: /articles
      query:
        articleNumber: '{{params.articleNumber}}'
        type: '{{params.type}}'
        page: '{{params.page}}'
        size: '{{params.size}}'
  - name: lexware_office_list_countries
    description: List the country codes Lexware Office accepts in an address, with their tax classification (intra-community, third country). Useful before creating a contact with a foreign address.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /countries
  - name: lexware_office_create_contact
    description: Create a new contact with the customer and/or vendor role. Writes to the live company — check with lexware_office_list_contacts first that the party does not already exist.
    input:
      type: object
      properties:
        companyName:
          type: string
          description: Company name. Provide this OR firstName+lastName, not both.
        firstName:
          type: string
          description: Given name, for a private person.
        lastName:
          type: string
          description: Family name, for a private person.
        isCustomer:
          type: boolean
          description: Give the contact the customer role (default true).
        isVendor:
          type: boolean
          description: Give the contact the vendor role.
        email:
          type: string
          description: Primary business e-mail address.
        phone:
          type: string
          description: Primary business phone number.
        street:
          type: string
          description: Street and house number of the billing address.
        zip:
          type: string
          description: Postal code of the billing address.
        city:
          type: string
          description: City of the billing address.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code, e.g. DE.
      required:
        - companyName
    operation:
      method: POST
      path: /contacts
      body:
        value:
          version: 0
          roles:
            customer: {}
            vendor: {}
          company:
            name: '{{params.companyName}}'
          person:
            firstName: '{{params.firstName}}'
            lastName: '{{params.lastName}}'
          addresses:
            billing:
              - street: '{{params.street}}'
                zip: '{{params.zip}}'
                city: '{{params.city}}'
                countryCode: '{{params.countryCode}}'
          emailAddresses:
            business:
              - '{{params.email}}'
          phoneNumbers:
            business:
              - '{{params.phone}}'
  - name: lexware_office_create_invoice
    description: Create a sales invoice. With finalize=false it is saved as a draft that can still be edited or deleted; with finalize=true it is booked and becomes legally immutable under GoBD.
    input:
      type: object
      properties:
        contactId:
          type: string
          description: UUID of the customer the invoice is addressed to.
        voucherDate:
          type: string
          description: Invoice date in ISO 8601, e.g. 2026-09-17T00:00:00.000+02:00.
        lineItems:
          type: array
          description: 'Array of line items. Each: {type: ''custom'', name, quantity, unitName, unitPrice: {currency: ''EUR'', netAmount, taxRatePercentage}}.'
          items:
            type: object
        taxType:
          type: string
          description: 'Tax treatment: `net`, `gross`, `vatfree`, `intraCommunitySupply`, `constructionService13b` or `externalService13b`.'
        finalize:
          type: boolean
          description: When true the invoice is booked immediately instead of saved as a draft.
        introduction:
          type: string
          description: Text printed above the line items.
        remark:
          type: string
          description: Text printed below the line items, e.g. payment terms.
      required:
        - contactId
        - lineItems
    operation:
      method: POST
      path: /invoices
      query:
        finalize: '{{params.finalize}}'
      body:
        value:
          voucherDate: '{{params.voucherDate}}'
          address:
            contactId: '{{params.contactId}}'
          lineItems: '{{params.lineItems}}'
          totalPrice:
            currency: EUR
          taxConditions:
            taxType: '{{params.taxType}}'
          shippingConditions:
            shippingType: none
          introduction: '{{params.introduction}}'
          remark: '{{params.remark}}'
