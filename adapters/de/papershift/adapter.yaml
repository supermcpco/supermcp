# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: papershift
  name: Papershift
  description: 'Papershift workforce management: shift plans, working sessions, absences, employees and locations. Public API v1, authenticated with an api_token query parameter.'
  region: de
  category: hr
  icon: papershift
  docsUrl: https://developers.papershift.com/
credentials:
  PAPERSHIFT_API_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://app.papershift.com/public_api/v1
auth:
  type: query
  params:
    api_token: '{{env.PAPERSHIFT_API_TOKEN}}'
healthcheck:
  tool: papershift_list_users
  http:
    method: GET
    path: /users
instructions: |-
  **Getting a token**
  1. Sign in to Papershift as an administrator and open **Einstellungen → API** (Settings → API).
  2. Generate a **public API token** and copy it into `PAPERSHIFT_API_TOKEN`. The token is account-wide and carries administrator rights — anyone holding it can read the whole roster, so treat it as a password.

  **The token travels as a query parameter**, not a header: Papershift's public API expects `?api_token=…` on every request. supermcp appends it automatically (QUERY_AUTH), so it never appears in a tool's parameters and never has to be pasted into a prompt.

  **Shift plan vs worked time.** Papershift keeps the two apart, and mixing them up is the usual source of wrong answers:
  - `papershift_list_shifts` is the *plan* — who is scheduled, when.
  - `papershift_list_working_sessions` is the *record* — who actually clocked in and out.
  A question about payroll wants working sessions; a question about next week wants shifts.

  **Date filters** are `YYYY-MM-DD` and most list endpoints require both `start_date` and `end_date`. Papershift caps the span server-side; a whole year usually needs to be requested month by month.

  **Paging** is `page` (1-based) plus `per_page`. Responses carry the rows under the resource name, e.g. `{"shifts": [...]}`.

  **Cloud reachability**: app.papershift.com is public with a valid certificate.
tools:
  - name: papershift_list_users
    description: List employees with their name, e-mail, employee number and the locations they belong to. No parameters needed — the quickest check that the token is accepted.
    input:
      type: object
      properties:
        page:
          type: number
          description: Page number, starting at 1.
        per_page:
          type: number
          description: Rows per page (default 25).
    operation:
      method: GET
      path: /users
      query:
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: papershift_get_user
    description: 'Read one employee by id: contact details, employment data, assigned locations and tags.'
    input:
      type: object
      properties:
        id:
          type: string
          description: Papershift user id.
      required:
        - id
    operation:
      method: GET
      path: /users/{{params.id}}
  - name: papershift_list_locations
    description: List the locations (Standorte) the account is organised into, with their address and working-area structure.
    input:
      type: object
      properties:
        page:
          type: number
          description: Page number, starting at 1.
        per_page:
          type: number
          description: Rows per page.
    operation:
      method: GET
      path: /locations
      query:
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: papershift_list_shifts
    description: 'Read the *planned* roster in a date range: who is scheduled where and when. This is the plan, not what was actually worked.'
    input:
      type: object
      properties:
        start_date:
          type: string
          description: First day of the range, YYYY-MM-DD.
        end_date:
          type: string
          description: Last day of the range, YYYY-MM-DD.
        location_id:
          type: string
          description: Restrict to one location.
        user_id:
          type: string
          description: Restrict to one employee.
        page:
          type: number
          description: Page number, starting at 1.
        per_page:
          type: number
          description: Rows per page.
      required:
        - start_date
        - end_date
    operation:
      method: GET
      path: /shifts
      query:
        start_date: '{{params.start_date}}'
        end_date: '{{params.end_date}}'
        location_id: '{{params.location_id}}'
        user_id: '{{params.user_id}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: papershift_list_working_sessions
    description: Read *actually worked* time in a date range — clock-in and clock-out, breaks and the resulting duration. This is what payroll is based on.
    input:
      type: object
      properties:
        start_date:
          type: string
          description: First day of the range, YYYY-MM-DD.
        end_date:
          type: string
          description: Last day of the range, YYYY-MM-DD.
        user_id:
          type: string
          description: Restrict to one employee.
        page:
          type: number
          description: Page number, starting at 1.
        per_page:
          type: number
          description: Rows per page.
      required:
        - start_date
        - end_date
    operation:
      method: GET
      path: /working_sessions
      query:
        start_date: '{{params.start_date}}'
        end_date: '{{params.end_date}}'
        user_id: '{{params.user_id}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: papershift_list_absences
    description: Read absences (holiday, sickness, special leave) in a date range with their type and approval state, to explain gaps in the roster.
    input:
      type: object
      properties:
        start_date:
          type: string
          description: First day of the range, YYYY-MM-DD.
        end_date:
          type: string
          description: Last day of the range, YYYY-MM-DD.
        user_id:
          type: string
          description: Restrict to one employee.
        page:
          type: number
          description: Page number, starting at 1.
        per_page:
          type: number
          description: Rows per page.
      required:
        - start_date
        - end_date
    operation:
      method: GET
      path: /absences
      query:
        start_date: '{{params.start_date}}'
        end_date: '{{params.end_date}}'
        user_id: '{{params.user_id}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: papershift_list_working_areas
    description: List the working areas (Arbeitsbereiche) inside the locations — the roles a shift can be planned for, such as bar, kitchen or till.
    input:
      type: object
      properties:
        location_id:
          type: string
          description: Restrict to one location.
        page:
          type: number
          description: Page number, starting at 1.
        per_page:
          type: number
          description: Rows per page.
    operation:
      method: GET
      path: /working_areas
      query:
        location_id: '{{params.location_id}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
