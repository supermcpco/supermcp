# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: bundesbank
  name: Deutsche Bundesbank Statistics
  description: Access macroeconomic data, exchange rates, interest rates, and financial statistics from the Deutsche Bundesbank via the SDMX REST API.
  region: de
  category: finance
  icon: bundesbank
  docsUrl: https://api.statistiken.bundesbank.de/doc/index.html
  lint:
    allow:
      - instructions-min-800
transport:
  type: http
  baseUrl: https://api.statistiken.bundesbank.de/rest
auth:
  type: none
healthcheck:
  tool: bundesbank_get_exchange_rates
  params:
    currency: USD
tools:
  - name: bundesbank_get_exchange_rates
    description: Daily euro foreign exchange reference rates (ECB/Bundesbank) for one currency against EUR. Pass startPeriod to limit the range — the full history is very large.
    input:
      type: object
      properties:
        currency:
          type: string
          description: ISO 4217 currency code (e.g. 'USD', 'GBP', 'CHF', 'JPY'). Use 'USD' for EUR/USD rate.
        startPeriod:
          type: string
          description: Start date in YYYY-MM-DD format (e.g. '2024-01-01')
        endPeriod:
          type: string
          description: End date in YYYY-MM-DD format (e.g. '2024-12-31')
      required:
        - currency
    operation:
      method: GET
      path: /data/BBEX3/D.{{params.currency}}.EUR.BB.AC.000
      query:
        startPeriod: '{{params.startPeriod}}'
        endPeriod: '{{params.endPeriod}}'
        detail: dataonly
        format: json
      headers:
        Accept: application/json
  - name: bundesbank_get_bund_yields
    description: Daily yield of German federal securities (Bunds) for a given residual maturity, from the Bundesbank term-structure statistics (BBSIS). Use as the risk-free EUR rate. Returns SDMX-JSON.
    input:
      type: object
      properties:
        maturityYears:
          type: string
          description: 'Residual maturity in years, two digits: 01, 02, 05, 10 or 30.'
          enum:
            - "01"
            - "02"
            - "05"
            - "10"
            - "30"
          default: "10"
        startPeriod:
          type: string
          description: First period, e.g. 2026-01-01 (daily) or 2026-01 (monthly). Omit for the full history — can be large.
        endPeriod:
          type: string
          description: Last period, same format as startPeriod.
      required:
        - maturityYears
    operation:
      method: GET
      path: /data/BBSIS/D.I.ZAR.ZI.EUR.S1311.B.A604.R{{params.maturityYears}}XX.R.A.A._Z._Z.A
      query:
        startPeriod: '{{params.startPeriod}}'
        endPeriod: '{{params.endPeriod}}'
        detail: dataonly
        format: json
  - name: bundesbank_get_timeseries
    description: 'Fetch any Bundesbank time series by SDMX dataflow and series key. Examples: flow BBEX3 + key D.USD.EUR.BB.AC.000 (EUR/USD reference rate, daily); flow BBSIS + key D.I.ZAR.ZI.EUR.S1311.B.A604.R10XX.R.A.A._Z._Z.A (10-year Bund yield, daily). Returns SDMX-JSON; observations are under data.dataSets[0].series.'
    input:
      type: object
      properties:
        flow:
          type: string
          description: Dataflow id, e.g. BBEX3, BBSIS, BBAF3, BBFI1.
        key:
          type: string
          description: Dot-separated series key within the flow, e.g. D.USD.EUR.BB.AC.000.
        startPeriod:
          type: string
          description: First period, e.g. 2026-01-01 (daily) or 2026-01 (monthly). Omit for the full history — can be large.
        endPeriod:
          type: string
          description: Last period, same format as startPeriod.
      required:
        - flow
        - key
    operation:
      method: GET
      path: /data/{{params.flow}}/{{params.key}}
      query:
        startPeriod: '{{params.startPeriod}}'
        endPeriod: '{{params.endPeriod}}'
        detail: dataonly
        format: json
