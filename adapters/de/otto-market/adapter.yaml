# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: otto-market
  name: OTTO Market
  description: 'OTTO Market partner API: orders and their positions, product variations, stock and price updates, and returns for sellers on otto.de. OAuth 2.0 with the partner''s client credentials.'
  region: de
  category: e-commerce
  icon: otto-market
  docsUrl: https://api.otto.market/docs
credentials:
  OTTO_USERNAME:
    required: true
  OTTO_PASSWORD:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.otto.market
  headers:
    Content-Type: application/json
auth:
  type: oauth2
  grant: client_credentials
  clientId: '{{env.OTTO_USERNAME}}'
  clientSecret: '{{env.OTTO_PASSWORD}}'
  tokenUrl: https://api.otto.market/v1/token
healthcheck:
  tool: otto_market_list_products
  http:
    method: GET
    path: /v4/orders?limit=1
instructions: |-
  **Getting credentials**
  1. You must already be an OTTO Market partner. In the **OTTO Partner Connect** portal open the API area and create API credentials for your account.
  2. OTTO issues a **username and password** for the token endpoint rather than a classic client id/secret pair; the token request is a password grant against `https://api.otto.market/v1/token`.
  3. Set `OTTO_USERNAME` and `OTTO_PASSWORD`. supermcp exchanges them for an access token and refreshes it automatically.

  **Every endpoint is versioned separately.** OTTO versions per resource, not per API: orders are on `/v4/orders`, quantities on `/v1/quantities`, prices on `/v3/prices`. The tools below carry the version each resource is actually on — do not assume one prefix works everywhere.

  **Orders page with a cursor.** `otto_market_list_orders` returns `nextCursor`; pass it back as `nextCursor` to walk the list. Do not compute an offset; OTTO's order stream is append-only and offsets drift.

  **`fromOrderDate` is required and is a hard filter.** Asking without it returns the default window, which is much shorter than most people expect. State the date you mean.

  **Stock and price are eventually consistent.** A quantity update is accepted with a 202 and applied asynchronously; reading the value back immediately will often still show the old number. That is OTTO's design, not a failed write.

  **Unverified.** The paths and field names below follow the vendor's published documentation and have not been exercised against a live tenant. Treat a 404 as a docs-versus-reality gap and check the developer portal before concluding that the credential is wrong. A correction from anyone running this against a real system is genuinely welcome.

  **Writes**: `otto_market_update_quantity` and `otto_market_update_price` change what shoppers on otto.de see.
tools:
  - name: otto_market_list_orders
    description: List orders from a date onwards, with their positions, buyer, delivery address and fulfilment status. Page by passing back the returned nextCursor.
    input:
      type: object
      properties:
        fromOrderDate:
          type: string
          description: Earliest order date, ISO 8601 with a zone, e.g. 2026-09-01T00:00:00Z. Required — omitting it silently narrows the window.
        limit:
          type: number
          description: Rows per page (default 50).
        nextCursor:
          type: string
          description: Cursor from the previous page's response.
        fulfillmentStatus:
          type: string
          description: Restrict by status, e.g. PROCESSABLE, SENT, RETURNED, CANCELLED.
      required:
        - fromOrderDate
    operation:
      method: GET
      path: /v4/orders
      query:
        fromOrderDate: '{{params.fromOrderDate}}'
        limit: '{{params.limit}}'
        nextCursor: '{{params.nextCursor}}'
        fulfillmentStatus: '{{params.fulfillmentStatus}}'
  - name: otto_market_get_order
    description: 'Read one order in full: every position with SKU, price and status, the delivery and invoice addresses, and the payment method.'
    input:
      type: object
      properties:
        orderNumber:
          type: string
          description: OTTO order number.
      required:
        - orderNumber
    operation:
      method: GET
      path: /v4/orders/{{params.orderNumber}}
  - name: otto_market_list_products
    description: List the seller's product variations with their SKU, EAN, product reference and current market status on otto.de.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Rows per page.
        nextCursor:
          type: string
          description: Cursor from the previous page's response.
    operation:
      method: GET
      path: /v2/products/variations
      query:
        limit: '{{params.limit}}'
        nextCursor: '{{params.nextCursor}}'
  - name: otto_market_get_product
    description: 'Read one product variation by SKU: its attributes, category, media and the current status of its listing on otto.de.'
    input:
      type: object
      properties:
        sku:
          type: string
          description: Seller-defined SKU.
      required:
        - sku
    operation:
      method: GET
      path: /v2/products/variations/{{params.sku}}
  - name: otto_market_list_quantities
    description: Read the current stock quantities OTTO holds for the seller's SKUs, so a discrepancy with the ERP can be spotted.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Rows per page.
        nextCursor:
          type: string
          description: Cursor from the previous page's response.
    operation:
      method: GET
      path: /v1/quantities
      query:
        limit: '{{params.limit}}'
        nextCursor: '{{params.nextCursor}}'
  - name: otto_market_list_returns
    description: List returns with their SKU, quantity, reason and the order they belong to — the input to any returns-rate question.
    input:
      type: object
      properties:
        fromReturnDate:
          type: string
          description: Earliest return date, ISO 8601 with a zone.
        limit:
          type: number
          description: Rows per page.
        nextCursor:
          type: string
          description: Cursor from the previous page's response.
    operation:
      method: GET
      path: /v1/returns
      query:
        fromReturnDate: '{{params.fromReturnDate}}'
        limit: '{{params.limit}}'
        nextCursor: '{{params.nextCursor}}'
  - name: otto_market_update_quantity
    description: Set the available stock for one SKU. Accepted with a 202 and applied asynchronously — reading it straight back will often still show the old value.
    input:
      type: object
      properties:
        sku:
          type: string
          description: Seller-defined SKU.
        quantity:
          type: number
          description: New available quantity.
        lastModified:
          type: string
          description: Timestamp of the change, ISO 8601 with a zone. OTTO uses it to order concurrent updates.
      required:
        - sku
        - quantity
    operation:
      method: POST
      path: /v1/quantities
      body:
        value:
          - sku: '{{params.sku}}'
            quantity: '{{params.quantity}}'
            lastModified: '{{params.lastModified}}'
  - name: otto_market_update_price
    description: Set the price for one SKU. Shoppers on otto.de see the change once OTTO has applied it, which is asynchronous.
    input:
      type: object
      properties:
        sku:
          type: string
          description: Seller-defined SKU.
        amount:
          type: string
          description: New gross price as a decimal string, e.g. 29.99.
        currency:
          type: string
          description: ISO 4217 currency code, normally EUR.
      required:
        - sku
        - amount
        - currency
    operation:
      method: POST
      path: /v3/prices
      body:
        value:
          - sku: '{{params.sku}}'
            standardPrice:
              amount: '{{params.amount}}'
              currency: '{{params.currency}}'
