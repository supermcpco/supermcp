# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: sendcloud
  name: Sendcloud Multi-Carrier Shipping
  description: Create parcels, print labels, track shipments, and manage returns across major EU carriers (DHL, DPD, UPS, PostNL, Hermes, Colissimo, Bpost and 40+ more) through Sendcloud — the largest multi-carrier shipping platform in EU.
  region: de
  category: logistics
  icon: sendcloud
  docsUrl: https://api.sendcloud.dev/docs/sendcloud-public-api/
  lint:
    allow:
      - healthcheck-present
credentials:
  SENDCLOUD_PUBLIC_KEY:
    required: true
    secret: true
  SENDCLOUD_SECRET_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://panel.sendcloud.sc/api/v2
auth:
  type: basic
  username: '{{env.SENDCLOUD_PUBLIC_KEY}}'
  password: '{{env.SENDCLOUD_SECRET_KEY}}'
instructions: |-
  This connector uses the Sendcloud v2 REST API.

  **Credentials** (two values, Basic auth): generate an API key pair at https://panel.sendcloud.sc/#/settings/integrations → 'Sendcloud API'. Paste the public key into `SENDCLOUD_PUBLIC_KEY` and the secret into `SENDCLOUD_SECRET_KEY` when importing.

  **Carriers covered**: DHL, DPD, UPS, PostNL, Hermes, Colissimo, Bpost, GLS, Chronopost, Mondial Relay, and 40+ more across EU. Use `sendcloud_list_shipping_methods` to get IDs and pricing per carrier.

  **Typical flow**:
  1. `sendcloud_list_shipping_methods` → pick a `shipping_method_id`
  2. `sendcloud_create_parcel` with `request_label: true` → returns parcel id + label URL + tracking number
  3. `sendcloud_get_parcel` → check current status (polled from carrier)

  **Test mode**: set `request_label: false` on create_parcel to get a price quote without generating a label (no billing).

  **Returns portal**: Sendcloud also provides a branded returns portal — configuration is done in the dashboard, not via this adapter.
tools:
  - name: sendcloud_list_shipping_methods
    description: List shipping methods (carrier, service, weight bracket, price) for a destination country. ALWAYS pass `to_country` — without it, the Sendcloud API returns every method for every country worldwide (10+ seconds, thousands of rows, no caching). If the user hasn't specified a destination yet, ask them or default to their account's primary destination before calling.
    input:
      type: object
      properties:
        to_country:
          type: string
          description: REQUIRED in practice. Destination country ISO 3166-1 alpha-2 code (e.g. 'DE', 'FR', 'NL'). Omitting this returns the global catalog and times out for most accounts — always pass a value.
        from_country:
          type: string
          description: Origin country ISO 3166-1 alpha-2 code (defaults to the account's warehouse country).
        is_return:
          type: boolean
          description: If true, return only return-shipment methods.
      required:
        - to_country
    operation:
      method: GET
      path: /shipping_methods
      query:
        to_country: '{{params.to_country}}'
        from_country: '{{params.from_country}}'
        is_return: '{{params.is_return}}'
  - name: sendcloud_create_parcel
    description: Create a parcel and optionally generate a shipping label. Returns parcel id, tracking_number, tracking_url, label URL, and price.
    input:
      type: object
      properties:
        parcel:
          type: object
          description: 'Parcel object: { name, company_name?, address, address_2?, house_number, city, postal_code, country (ISO-2), email?, telephone?, weight (kg), length?, width?, height? (cm), order_number?, shipment: { id: shipping_method_id } }.'
        request_label:
          type: boolean
          description: If true, generate a real label and bill. If false (default), creates an 'announced' parcel without a label.
      required:
        - parcel
    operation:
      method: POST
      path: /parcels
      body:
        value:
          parcel: '{{params.parcel}}'
          request_label: '{{params.request_label}}'
  - name: sendcloud_get_parcel
    description: Retrieve a parcel by its Sendcloud id. Returns full parcel data including tracking number, current status, label URL, and tracking events.
    input:
      type: object
      properties:
        id:
          type: string
          description: The Sendcloud parcel id.
      required:
        - id
    operation:
      method: GET
      path: /parcels/{{params.id}}
  - name: sendcloud_list_parcels
    description: List recent parcels, filterable by order number, tracking number, or creation date.
    input:
      type: object
      properties:
        order_number:
          type: string
          description: Filter by your shop order number.
        tracking_number:
          type: string
          description: Filter by the carrier's tracking number.
        created_at__gte:
          type: string
          description: Created at or after this ISO 8601 datetime (e.g. '2026-04-01T00:00:00Z').
        created_at__lte:
          type: string
          description: Created at or before this ISO 8601 datetime.
        page:
          type: number
          description: Page number, 1-based.
    operation:
      method: GET
      path: /parcels
      query:
        order_number: '{{params.order_number}}'
        tracking_number: '{{params.tracking_number}}'
        created_at__gte: '{{params.created_at__gte}}'
        created_at__lte: '{{params.created_at__lte}}'
        page: '{{params.page}}'
  - name: sendcloud_get_parcel_status
    description: Get the current status and event timeline of a parcel — includes scan-point locations, timestamps, and status codes from the underlying carrier.
    input:
      type: object
      properties:
        id:
          type: string
          description: The Sendcloud parcel id.
      required:
        - id
    operation:
      method: GET
      path: /parcels/{{params.id}}/status
