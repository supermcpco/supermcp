# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: fastbill
  name: FastBill Invoicing
  description: Manage invoices, customers, expenses, and revenue with FastBill. Popular invoicing and bookkeeping tool for German freelancers and small businesses.
  region: de
  category: finance
  icon: fastbill
  docsUrl: https://apidocs.fastbill.com/fastbill/
  lint:
    allow:
      - healthcheck-present
      - instructions-min-800
credentials:
  FASTBILL_EMAIL:
    required: true
  FASTBILL_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://my.fastbill.com/api/1.0
auth:
  type: basic
  username: '{{env.FASTBILL_EMAIL}}'
  password: '{{env.FASTBILL_API_KEY}}'
tools:
  - name: fastbill_list_customers
    description: List customers from FastBill. Returns customer number, name, address, email, and payment terms.
    input:
      type: object
      properties:
        LIMIT:
          type: number
          description: 'Maximum number of results (default: 25)'
        OFFSET:
          type: number
          description: Offset for pagination
        TERM:
          type: string
          description: Search term to filter customers
    operation:
      method: POST
      path: /api.php
      body:
        value:
          SERVICE: customer.get
          LIMIT: '{{params.LIMIT}}'
          OFFSET: '{{params.OFFSET}}'
          FILTER:
            TERM: '{{params.TERM}}'
  - name: fastbill_list_invoices
    description: List invoices from FastBill. Returns invoice number, date, amount, tax, payment status, and customer info.
    input:
      type: object
      properties:
        LIMIT:
          type: number
          description: 'Maximum number of results (default: 25)'
        OFFSET:
          type: number
          description: Offset for pagination
        CUSTOMER_ID:
          type: string
          description: Filter by customer ID
        MONTH:
          type: number
          description: Filter by month (1-12)
        YEAR:
          type: number
          description: Filter by year
    operation:
      method: POST
      path: /api.php
      body:
        value:
          SERVICE: invoice.get
          LIMIT: '{{params.LIMIT}}'
          OFFSET: '{{params.OFFSET}}'
          FILTER:
            CUSTOMER_ID: '{{params.CUSTOMER_ID}}'
            MONTH: '{{params.MONTH}}'
            YEAR: '{{params.YEAR}}'
  - name: fastbill_list_expenses
    description: List expenses from FastBill. Returns expense date, amount, category, and vendor info.
    input:
      type: object
      properties:
        LIMIT:
          type: number
          description: 'Maximum number of results (default: 25)'
        OFFSET:
          type: number
          description: Offset for pagination
        MONTH:
          type: number
          description: Filter by month (1-12)
        YEAR:
          type: number
          description: Filter by year
    operation:
      method: POST
      path: /api.php
      body:
        value:
          SERVICE: expense.get
          LIMIT: '{{params.LIMIT}}'
          OFFSET: '{{params.OFFSET}}'
          FILTER:
            MONTH: '{{params.MONTH}}'
            YEAR: '{{params.YEAR}}'
  - name: fastbill_list_revenues
    description: List revenue entries from FastBill. Returns revenue date, amount, invoice reference, and category.
    input:
      type: object
      properties:
        LIMIT:
          type: number
          description: 'Maximum number of results (default: 25)'
        OFFSET:
          type: number
          description: Offset for pagination
    operation:
      method: POST
      path: /api.php
      body:
        value:
          SERVICE: revenue.get
          LIMIT: '{{params.LIMIT}}'
          OFFSET: '{{params.OFFSET}}'
  - name: fastbill_get_invoice
    description: Get a specific invoice by ID with full details including line items, taxes, and payment information.
    input:
      type: object
      properties:
        INVOICE_ID:
          type: string
          description: The FastBill invoice ID
      required:
        - INVOICE_ID
    operation:
      method: POST
      path: /api.php
      body:
        value:
          SERVICE: invoice.get
          FILTER:
            INVOICE_ID: '{{params.INVOICE_ID}}'
