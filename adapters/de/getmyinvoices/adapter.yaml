# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: getmyinvoices
  name: GetMyInvoices
  description: Retrieve invoices, documents, attachments and suppliers from GetMyInvoices, the German invoice & document management platform by fino data services GmbH (Kassel).
  region: de
  category: finance
  icon: getmyinvoices
  docsUrl: https://api.getmyinvoices.com/accounts/v3/doc/
  lint:
    allow:
      - healthcheck-present
credentials:
  GETMYINVOICES_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.getmyinvoices.com/accounts/v3
  headers:
    Accept: application/json
auth:
  type: apiKey
  in: header
  name: X-API-KEY
  value: '{{env.GETMYINVOICES_API_KEY}}'
instructions: |-
  GetMyInvoices (operated by fino data services GmbH, Kassel) automatically collects invoices and documents from thousands of online portals and mailboxes. This connector wraps the v3 Accounts API at https://api.getmyinvoices.com/accounts/v3.

  ## Authentication
  Generate an API key in the GetMyInvoices web app via the top-right menu → 'API access'. Set it as `GETMYINVOICES_API_KEY`. The connector sends it in the `X-API-KEY` header on every request. (Note: the older v1/v2 Go/PHP SDKs use a POST body `api_key` — that is NOT v3; v3 uses the header.)

  ## Core concepts
  - **Documents** (`/documents`) — the single resource for every document, including invoices, discriminated by `documentType` (e.g. `INCOMING_INVOICE`, `SALES_INVOICE`, `RECEIPT`, `CREDIT_NOTE`, `PAYROLL`). Use `documentTypeFilter` to narrow.
  - **Companies** (`/companies`) — in GetMyInvoices terminology these are suppliers / online portals the documents come from.
  - **Attachments** — extra files linked to a document under `/documents/{documentUid}/attachments`.

  ## Pagination (documents only)
  `GET /documents` is paginated with `perPage` (default 500) and `pageNumber` (default 1). The response envelope carries `totalCount`, `maxPages`, `offset` and the `records` array. Iterate `pageNumber` up to `maxPages`. `GET /companies` returns a plain array with no pagination.

  ## Incremental sync & file content
  - Use `updatedOrNewSinceFilter=YYYY-MM-DD` to fetch only documents created or modified since a date — ideal for syncing.
  - To get the actual file bytes, call `getmyinvoices_get_document` (it returns `fileContent` as base64, plus `meta_data` and OCR `readableContent`). Set `includeDocument=false` when you only need metadata.

  ## Rate limits
  The API enforces per-minute and per-hour limits and returns `X-RateLimit-Remaining-*` headers plus `Retry-After` on HTTP 429 — respect those values and back off.
tools:
  - name: getmyinvoices_list_documents
    description: List documents (invoices, receipts, credit notes, etc.) from GetMyInvoices with filters for type, date range, payment status and incremental sync. Returns paginated metadata records.
    input:
      type: object
      properties:
        pageNumber:
          type: number
          description: Page number, 1-based (default 1)
        perPage:
          type: number
          description: Results per page (default 500)
        searchQuery:
          type: string
          description: Free-text search across documents, like the web UI
        documentTypeFilter:
          type: string
          description: Document type, e.g. INCOMING_INVOICE, SALES_INVOICE, RECEIPT, CREDIT_NOTE, PAYROLL
        companyFilter:
          type: number
          description: 'Filter by company/supplier: 0=any, -1=unassigned, or a specific companyUid'
        startDateFilter:
          type: string
          description: Earliest document date, YYYY-MM-DD
        endDateFilter:
          type: string
          description: Latest document date, YYYY-MM-DD
        updatedOrNewSinceFilter:
          type: string
          description: Return only documents created or modified since this timestamp — use for incremental sync. MUST be a full date-time in 'YYYY-MM-DD HH:MM:SS' format, e.g. '2026-01-01 00:00:00' (a plain date is rejected with HTTP 422)
        paymentStatusFilter:
          type: string
          description: 'Payment status filter: paid, not_paid, unknown or all'
        loadLineItems:
          type: boolean
          description: Include parsed line items in each record
    operation:
      method: GET
      path: /documents
      query:
        pageNumber: '{{params.pageNumber}}'
        perPage: '{{params.perPage}}'
        searchQuery: '{{params.searchQuery}}'
        documentTypeFilter: '{{params.documentTypeFilter}}'
        companyFilter: '{{params.companyFilter}}'
        startDateFilter: '{{params.startDateFilter}}'
        endDateFilter: '{{params.endDateFilter}}'
        updatedOrNewSinceFilter: '{{params.updatedOrNewSinceFilter}}'
        paymentStatusFilter: '{{params.paymentStatusFilter}}'
        loadLineItems: '{{params.loadLineItems}}'
  - name: getmyinvoices_get_document
    description: Get a single GetMyInvoices document by its documentUid, including metadata, parsed line items, OCR text and optionally the base64 file content.
    input:
      type: object
      properties:
        documentUid:
          type: string
          description: The document unique id
        loadLineItems:
          type: boolean
          description: Include parsed line items
        includeDocument:
          type: boolean
          description: Include the file content (base64) in the response; set false for metadata only
        readableText:
          type: boolean
          description: Include the OCR/readable text content
      required:
        - documentUid
    operation:
      method: GET
      path: /documents/{{params.documentUid}}
      query:
        loadLineItems: '{{params.loadLineItems}}'
        includeDocument: '{{params.includeDocument}}'
        readableText: '{{params.readableText}}'
  - name: getmyinvoices_list_document_attachments
    description: List all attachments linked to a specific GetMyInvoices document, returning each attachment's uid, filename and metadata.
    input:
      type: object
      properties:
        documentUid:
          type: string
          description: The parent document unique id
      required:
        - documentUid
    operation:
      method: GET
      path: /documents/{{params.documentUid}}/attachments
  - name: getmyinvoices_get_document_attachment
    description: Get a single attachment of a GetMyInvoices document by document and attachment uid, including its file content and metadata.
    input:
      type: object
      properties:
        documentUid:
          type: string
          description: The parent document unique id
        attachmentUid:
          type: string
          description: The attachment unique id
      required:
        - documentUid
        - attachmentUid
    operation:
      method: GET
      path: /documents/{{params.documentUid}}/attachments/{{params.attachmentUid}}
  - name: getmyinvoices_list_companies
    description: List companies (suppliers and online portals) configured in GetMyInvoices, filterable by status and type. Returns companyUid, name, type and tags.
    input:
      type: object
      properties:
        statusFilter:
          type: number
          description: 'Status: 0=any, 1=active, -1=inactive, -2=pending'
        companyTypeFilter:
          type: string
          description: 'Company type: 0 for any, or ONLINE_PORTAL / CUSTOM_COMPANY'
        returnPortalRecords:
          type: number
          description: 0 to hide portal records, 1 to include them
    operation:
      method: GET
      path: /companies
      query:
        statusFilter: '{{params.statusFilter}}'
        companyTypeFilter: '{{params.companyTypeFilter}}'
        returnPortalRecords: '{{params.returnPortalRecords}}'
  - name: getmyinvoices_get_company
    description: Get a single company (supplier/portal) from GetMyInvoices by its companyUid, returning full details and linked portal records.
    input:
      type: object
      properties:
        companyUid:
          type: string
          description: The company unique id
      required:
        - companyUid
    operation:
      method: GET
      path: /companies/{{params.companyUid}}
