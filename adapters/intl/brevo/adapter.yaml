# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: brevo
  name: Brevo
  description: Drive Brevo (formerly Sendinblue) — transactional email/SMS, marketing campaigns, contacts and lists — from any AI agent. 14 tools, api-key header auth, EU-based deliverability.
  region: intl
  category: email
  icon: brevo
  docsUrl: https://developers.brevo.com/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  BREVO_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.brevo.com/v3
auth:
  type: apiKey
  in: header
  name: api-key
  value: '{{env.BREVO_API_KEY}}'
instructions: |-
  This connector uses the Brevo REST API v3 (formerly known as Sendinblue API).

  **Setup**:
  1. Sign in to https://app.brevo.com → top-right avatar → **SMTP & API → API Keys → Generate a new API key**.
  2. Name it ('supermcp'). It's prefixed `xkeysib-`. Set `BREVO_API_KEY`.

  **Authentication**: custom header `api-key: ${BREVO_API_KEY}` (lowercase header name — Brevo-specific). The adapter sets it via API_KEY profile.

  **Verified sender**: just like SendGrid, you must verify your sending domain or sender email before transactional email actually delivers (otherwise it lands in spam or is rejected). Brevo → **Senders & IP → Senders → Add a sender** OR domain authentication via SPF/DKIM.

  **Transactional vs Marketing**: `brevo_send_transactional_email` is for app-triggered 1-to-1 sends (receipts, password resets). `brevo_create_email_campaign` + `brevo_send_email_campaign_now` are for newsletter-style sends to a list. Pricing tiers are split per channel.

  **Contact lists vs folders**: contacts can belong to multiple `lists`. Lists can be organized into `folders` (for UI tidiness; folders have no behavioral meaning). Use `brevo_list_contact_lists` to discover list IDs.

  **Custom attributes**: each contact has `attributes` (FIRSTNAME, LASTNAME, plus any you define). Set them in `brevo_create_contact` via the `attributes` object: `{FIRSTNAME:'Jane', LANGUAGE:'fr'}`.

  **Pagination**: most list endpoints use `limit` (max 50 typically, 100 for some) + `offset`.

  **SMS sending**: also via the API. `brevo_send_transactional_sms` requires a verified sender name (≤11 chars, alphanumeric) AND the recipient phone in international format with `+` prefix.

  **Webhooks** out of scope (configured in UI for delivery to your hosted endpoint).

  **Rate limits**: ~400 req/sec for transactional email, lower for management endpoints. On 429, `Retry-After` is set.

  **Out of scope here**: WhatsApp Business via Brevo (use the dedicated WhatsApp Business connector), CRM/deals (separate Brevo product, not on the same API surface), conversations, automation workflows, attribute creation.
tools:
  - name: brevo_get_account
    description: 'Return account info: companyName, email, firstName, lastName, address, plan (credits, type, creditsType), relay servers. Health check + plan visibility.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /account
  - name: brevo_send_transactional_email
    description: 'Send a transactional email. Required: sender + to + (subject AND htmlContent/textContent) OR templateId+params. For templates, design + variables come from Brevo''s UI templates.'
    input:
      type: object
      properties:
        sender:
          type: object
          description: '{email, name?}. email MUST be a verified sender.'
        to:
          type: array
          description: 'Recipients: [{email, name?}]. Up to 50 per call (more = use bulk endpoint).'
        cc:
          type: array
          description: 'Optional CCs: [{email, name?}].'
        bcc:
          type: array
          description: Optional BCCs.
        replyTo:
          type: object
          description: '{email, name?}.'
        subject:
          type: string
          description: Email subject (required unless using templateId).
        htmlContent:
          type: string
          description: HTML body.
        textContent:
          type: string
          description: Plain-text body. Recommended alongside htmlContent for deliverability.
        templateId:
          type: integer
          description: Brevo template ID. Omit subject/htmlContent if using.
        params:
          type: object
          description: Template variables (referenced as {{params.X}} in the template).
        attachment:
          type: array
          description: 'Up to 100 attachments: [{name, content (base64)}] or [{name, url}].'
        tags:
          type: array
          description: Up to 5 tag strings for stats grouping.
        headers:
          type: object
          description: Custom headers (e.g. {'X-My-Tag':'abc'}).
        scheduledAt:
          type: string
          description: ISO 8601 datetime to schedule the send (up to 72h ahead).
      required:
        - sender
        - to
    operation:
      method: POST
      path: /smtp/email
      body:
        value:
          sender: '{{params.sender}}'
          to: '{{params.to}}'
          cc: '{{params.cc}}'
          bcc: '{{params.bcc}}'
          replyTo: '{{params.replyTo}}'
          subject: '{{params.subject}}'
          htmlContent: '{{params.htmlContent}}'
          textContent: '{{params.textContent}}'
          templateId: '{{params.templateId}}'
          params: '{{params.params}}'
          attachment: '{{params.attachment}}'
          tags: '{{params.tags}}'
          headers: '{{params.headers}}'
          scheduledAt: '{{params.scheduledAt}}'
  - name: brevo_send_transactional_sms
    description: 'Send a transactional SMS. Required: sender (≤11 alphanumeric chars, must be pre-approved), recipient (international format with +), content (≤160 chars per part).'
    input:
      type: object
      properties:
        sender:
          type: string
          description: Alphanumeric sender name ≤11 chars, must be pre-registered in Brevo.
        recipient:
          type: string
          description: Phone in international format with leading +, e.g. '+33612345678'.
        content:
          type: string
          description: SMS body. Per SMSC encoding (GSM-7 = 160 chars/part, UCS-2 = 70 chars/part).
        type:
          type: string
          description: transactional or marketing. Default transactional.
        tag:
          type: string
          description: Stats tag.
        webUrl:
          type: string
          description: Optional URL for click-tracking.
        unicodeEnabled:
          type: boolean
          description: true = allow non-GSM chars (emoji, é, ç) — encoding flips to UCS-2.
      required:
        - sender
        - recipient
        - content
    operation:
      method: POST
      path: /transactionalSMS/sms
      body:
        value:
          sender: '{{params.sender}}'
          recipient: '{{params.recipient}}'
          content: '{{params.content}}'
          type: '{{params.type}}'
          tag: '{{params.tag}}'
          webUrl: '{{params.webUrl}}'
          unicodeEnabled: '{{params.unicodeEnabled}}'
  - name: brevo_list_contacts
    description: List contacts (paginated). Each contact has id, email, attributes object, createdAt, modifiedAt, listIds[].
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Max per page (default 50, max 1000).
        offset:
          type: integer
          description: Pagination offset.
        modifiedSince:
          type: string
          description: ISO 8601 — only contacts modified after this time.
        createdSince:
          type: string
          description: ISO 8601.
        sort:
          type: string
          description: asc or desc by id.
    operation:
      method: GET
      path: /contacts
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        modifiedSince: '{{params.modifiedSince}}'
        createdSince: '{{params.createdSince}}'
        sort: '{{params.sort}}'
  - name: brevo_get_contact
    description: Fetch a contact by email or ID.
    input:
      type: object
      properties:
        identifier:
          type: string
          description: URL-encoded email address OR numeric contact ID.
      required:
        - identifier
    operation:
      method: GET
      path: /contacts/{{params.identifier}}
  - name: brevo_create_contact
    description: Create or update a contact (upsert by email). Set `listIds` to add to existing lists. `updateEnabled:true` to update if email already exists (default false → 409 on duplicate).
    input:
      type: object
      properties:
        email:
          type: string
          description: Contact email (required unless using ext_id).
        ext_id:
          type: string
          description: External ID if you maintain a separate identifier system.
        attributes:
          type: object
          description: '{FIRSTNAME, LASTNAME, SMS:''+33...'', LANGUAGE:''fr'', custom...}. Reserved attrs are uppercase.'
        emailBlacklisted:
          type: boolean
          description: true = mark as unsubscribed from emails.
        smsBlacklisted:
          type: boolean
          description: true = mark as unsubscribed from SMS.
        listIds:
          type: array
          description: Array of list IDs to add to.
        updateEnabled:
          type: boolean
          description: true = update existing if email already exists. Default false.
        smtpBlacklistSender:
          type: array
          description: List of senders to block.
      required:
        - email
    operation:
      method: POST
      path: /contacts
      body:
        value:
          email: '{{params.email}}'
          ext_id: '{{params.ext_id}}'
          attributes: '{{params.attributes}}'
          emailBlacklisted: '{{params.emailBlacklisted}}'
          smsBlacklisted: '{{params.smsBlacklisted}}'
          listIds: '{{params.listIds}}'
          updateEnabled: '{{params.updateEnabled}}'
          smtpBlacklistSender: '{{params.smtpBlacklistSender}}'
  - name: brevo_update_contact
    description: Partial update of an existing contact.
    input:
      type: object
      properties:
        identifier:
          type: string
          description: URL-encoded email or numeric ID.
        attributes:
          type: object
          description: Attributes to update.
        emailBlacklisted:
          type: boolean
          description: Mark unsubscribed.
        smsBlacklisted:
          type: boolean
          description: Mark SMS unsubscribed.
        listIds:
          type: array
          description: Lists to ADD to (use unlinkListIds to remove).
        unlinkListIds:
          type: array
          description: Lists to remove from.
      required:
        - identifier
    operation:
      method: PUT
      path: /contacts/{{params.identifier}}
      body:
        value:
          attributes: '{{params.attributes}}'
          emailBlacklisted: '{{params.emailBlacklisted}}'
          smsBlacklisted: '{{params.smsBlacklisted}}'
          listIds: '{{params.listIds}}'
          unlinkListIds: '{{params.unlinkListIds}}'
  - name: brevo_list_contact_lists
    description: List contact lists. Each list has id, name, folderId, totalSubscribers, totalBlacklisted, createdAt.
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Max per page (default 10, max 50).
        offset:
          type: integer
          description: Pagination offset.
        sort:
          type: string
          description: asc or desc by id.
    operation:
      method: GET
      path: /contacts/lists
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        sort: '{{params.sort}}'
  - name: brevo_create_contact_list
    description: Create a new list. Each list belongs to a folder (use brevo_list_folders to discover folderId).
    input:
      type: object
      properties:
        name:
          type: string
          description: List name (unique within folder).
        folderId:
          type: integer
          description: Parent folder ID.
      required:
        - name
        - folderId
    operation:
      method: POST
      path: /contacts/lists
      body:
        value:
          name: '{{params.name}}'
          folderId: '{{params.folderId}}'
  - name: brevo_list_folders
    description: List folders (organize contact lists).
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Per page.
        offset:
          type: integer
          description: Offset.
        sort:
          type: string
          description: asc or desc.
    operation:
      method: GET
      path: /contacts/folders
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        sort: '{{params.sort}}'
  - name: brevo_list_email_campaigns
    description: List email campaigns (newsletters). Filter by type (classic/trigger) and status (suspended/archive/sent/queued/draft/inProcess).
    input:
      type: object
      properties:
        type:
          type: string
          description: classic or trigger.
        status:
          type: string
          description: suspended, archive, sent, queued, draft, inProcess.
        startDate:
          type: string
          description: ISO 8601 — only campaigns starting after.
        endDate:
          type: string
          description: ISO 8601.
        limit:
          type: integer
          description: Max per page (default 500, max 1000).
        offset:
          type: integer
          description: Pagination offset.
    operation:
      method: GET
      path: /emailCampaigns
      query:
        type: '{{params.type}}'
        status: '{{params.status}}'
        startDate: '{{params.startDate}}'
        endDate: '{{params.endDate}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: brevo_create_email_campaign
    description: 'Create an email campaign (does NOT send — see brevo_send_email_campaign_now to fire). Required: name, subject, sender (verified), htmlContent OR templateId.'
    input:
      type: object
      properties:
        name:
          type: string
          description: Internal campaign name.
        subject:
          type: string
          description: Email subject line.
        sender:
          type: object
          description: '{name?, email|id}. email must be verified, OR id of a sender object.'
        htmlContent:
          type: string
          description: HTML body OR omit if using templateId.
        textContent:
          type: string
          description: Plain-text body.
        templateId:
          type: integer
          description: Use a saved template.
        params:
          type: object
          description: Template vars.
        recipients:
          type: object
          description: '{listIds:[N], excludedListIds?:[M], segmentIds?:[K]}.'
        scheduledAt:
          type: string
          description: ISO 8601 — schedule. Omit to leave as draft.
        replyTo:
          type: string
          description: Reply-To email.
        toField:
          type: string
          description: Personalized To-field, e.g. '{{FIRSTNAME}} {{LASTNAME}}'.
        tag:
          type: string
          description: Stats tag.
      required:
        - name
        - subject
        - sender
        - recipients
    operation:
      method: POST
      path: /emailCampaigns
      body:
        value:
          name: '{{params.name}}'
          subject: '{{params.subject}}'
          sender: '{{params.sender}}'
          htmlContent: '{{params.htmlContent}}'
          textContent: '{{params.textContent}}'
          templateId: '{{params.templateId}}'
          params: '{{params.params}}'
          recipients: '{{params.recipients}}'
          scheduledAt: '{{params.scheduledAt}}'
          replyTo: '{{params.replyTo}}'
          toField: '{{params.toField}}'
          tag: '{{params.tag}}'
  - name: brevo_send_email_campaign_now
    description: Send a previously-created email campaign immediately (overrides any scheduledAt). The campaign must pass Brevo's content/sender checks first.
    input:
      type: object
      properties:
        campaignId:
          type: integer
          description: Campaign ID to send now.
      required:
        - campaignId
    operation:
      method: POST
      path: /emailCampaigns/{{params.campaignId}}/sendNow
  - name: brevo_get_transactional_email_report
    description: 'Get aggregated transactional email stats for a date range: total requests, delivered, hardBounces, softBounces, opened, clicked, spam.'
    input:
      type: object
      properties:
        days:
          type: integer
          description: Last N days (1, 7, 30, 90, 365).
        startDate:
          type: string
          description: YYYY-MM-DD (mutually exclusive with days).
        endDate:
          type: string
          description: YYYY-MM-DD.
        tag:
          type: string
          description: Filter by tag.
    operation:
      method: GET
      path: /smtp/statistics/aggregatedReport
      query:
        days: '{{params.days}}'
        startDate: '{{params.startDate}}'
        endDate: '{{params.endDate}}'
        tag: '{{params.tag}}'
