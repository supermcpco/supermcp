# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: workable
  name: Workable
  description: Manage Workable ATS (candidates, jobs, members, stages, comments) from any AI agent. 9 tools, Bearer token auth.
  region: intl
  category: hr
  icon: workable
  docsUrl: https://workable.readme.io/reference/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  WORKABLE_SUBDOMAIN:
    required: true
  WORKABLE_ACCESS_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://{{env.WORKABLE_SUBDOMAIN}}.workable.com/spi/v3
auth:
  type: bearer
  token: '{{env.WORKABLE_ACCESS_TOKEN}}'
instructions: |-
  This connector wraps the Workable Hiring API (per-subdomain — yoursub.workable.com/spi/v3).

  **Setup**:
  1. Log into your Workable account → top-right avatar → **Integrations → Workable API → Generate access token**.
  2. Note your subdomain (the part before `.workable.com`).
  3. Set `WORKABLE_SUBDOMAIN` and `WORKABLE_ACCESS_TOKEN`.

  **Authentication**: `Authorization: Bearer ${WORKABLE_ACCESS_TOKEN}`.

  **Per-tenant baseUrl**: `https://${WORKABLE_SUBDOMAIN}.workable.com/spi/v3`. Substituted at import time.

  **Job 'shortcode'**: Workable identifies jobs by short hash strings (`AC123ABCDE`) in URLs/API. Use `workable_list_jobs` to discover.

  **Candidate disqualification**: writes use a stage `disqualified` and a `disqualification_reason_id`. Reasons are configured per-account.

  **Pagination**: cursor-based — response has `paging.next` (full URL). Pass back the URL's `since_id` or use the full cursor query.

  **Rate limits**: 300 req/min per account. 429 → exponential.

  **Out of scope here**: assessments, video interviews, requisitions, payroll fields (Workable HR Cloud is separate).
tools:
  - name: workable_account_info
    description: Returns the account info (subdomain, name, summary).
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /
  - name: workable_list_jobs
    description: List jobs. Filter by state (published, draft, closed, archived).
    input:
      type: object
      properties:
        state:
          type: string
          description: published, draft, closed, archived.
        department:
          type: string
          description: Filter by department.
        include_fields:
          type: string
          description: 'Comma-separated extras: description, requirements, benefits.'
        limit:
          type: integer
          description: Max per page (100 default).
        since_id:
          type: string
          description: Cursor — only newer than this job shortcode.
    operation:
      method: GET
      path: /jobs
      query:
        state: '{{params.state}}'
        department: '{{params.department}}'
        include_fields: '{{params.include_fields}}'
        limit: '{{params.limit}}'
        since_id: '{{params.since_id}}'
  - name: workable_get_job
    description: Get a single job by shortcode with full description + requirements + benefits.
    input:
      type: object
      properties:
        shortcode:
          type: string
          description: Job shortcode (e.g. AC123ABCDE).
      required:
        - shortcode
    operation:
      method: GET
      path: /jobs/{{params.shortcode}}
  - name: workable_list_candidates
    description: List candidates for a job. Filter by stage, state, created date.
    input:
      type: object
      properties:
        shortcode:
          type: string
          description: Job shortcode.
        stage:
          type: string
          description: Stage slug to filter (e.g. 'interview').
        state:
          type: string
          description: active, hired, disqualified.
        limit:
          type: integer
          description: Max per page.
        since_id:
          type: string
          description: Cursor.
      required:
        - shortcode
    operation:
      method: GET
      path: /jobs/{{params.shortcode}}/candidates
      query:
        stage: '{{params.stage}}'
        state: '{{params.state}}'
        limit: '{{params.limit}}'
        since_id: '{{params.since_id}}'
  - name: workable_get_candidate
    description: Get one candidate by ID with full profile + answers to job questions.
    input:
      type: object
      properties:
        candidate_id:
          type: string
          description: Candidate ID.
      required:
        - candidate_id
    operation:
      method: GET
      path: /candidates/{{params.candidate_id}}
  - name: workable_create_candidate
    description: 'Create a candidate on a job (sourced / referral). Required: candidate.firstname, candidate.lastname, candidate.email.'
    input:
      type: object
      properties:
        shortcode:
          type: string
          description: Job shortcode.
        sourced:
          type: boolean
          description: If true, marks as sourced; otherwise applied.
        candidate:
          type: object
          description: Candidate object {firstname, lastname, email, phone, address, headline, summary, resume_url, ...}.
      required:
        - shortcode
        - candidate
    operation:
      method: POST
      path: /jobs/{{params.shortcode}}/candidates
      body:
        value:
          sourced: '{{params.sourced}}'
          candidate: '{{params.candidate}}'
  - name: workable_move_candidate_stage
    description: Move a candidate to a different pipeline stage.
    input:
      type: object
      properties:
        candidate_id:
          type: string
          description: Candidate ID.
        target_stage:
          type: string
          description: Target stage slug.
        member_id:
          type: string
          description: Member performing the move.
      required:
        - candidate_id
        - target_stage
    operation:
      method: POST
      path: /candidates/{{params.candidate_id}}/move
      body:
        value:
          target_stage: '{{params.target_stage}}'
          member_id: '{{params.member_id}}'
  - name: workable_disqualify_candidate
    description: Disqualify (reject) a candidate with a reason.
    input:
      type: object
      properties:
        candidate_id:
          type: string
          description: Candidate ID.
        disqualification_reason_id:
          type: string
          description: Reason ID configured in Workable.
        member_id:
          type: string
          description: Member performing the disqualification.
      required:
        - candidate_id
    operation:
      method: POST
      path: /candidates/{{params.candidate_id}}/disqualify
      body:
        value:
          disqualification_reason_id: '{{params.disqualification_reason_id}}'
          member_id: '{{params.member_id}}'
  - name: workable_list_stages
    description: List pipeline stages defined in the account.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /stages
