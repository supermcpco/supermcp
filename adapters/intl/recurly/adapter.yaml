# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: recurly
  name: Recurly
  description: 'Drive Recurly (subscription billing, US-focused) from any AI agent: accounts, subscriptions, invoices, plans, coupons. 11 tools, Basic-auth.'
  region: intl
  category: payments
  icon: recurly
  docsUrl: https://recurly.com/developers/api/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  RECURLY_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://v3.recurly.com
auth:
  type: basic
  username: '{{env.RECURLY_API_KEY}}'
instructions: |-
  This connector uses the Recurly API v2021-02-25 (recurly.com/developers).

  **Setup**:
  1. Sign in to Recurly → **Integrations → API Credentials → Add Key**.
  2. Pick a Private API key (NOT a public site key — different purpose).
  3. Set `RECURLY_API_KEY`.

  **Authentication**: HTTP Basic with username=API_KEY, password=empty (Stripe-style).

  **Required Accept header pinned per-tool**: Recurly REQUIRES `Accept: application/vnd.recurly.v2021-02-25` on every request. The adapter pins this on each endpoint's headers.

  **Account model**: every customer is an `account`. Subscriptions, invoices, transactions all link to an account. Accounts can be `parent_account` for hierarchies (B2B).

  **Subscription states**: future, active, paused, expired, canceled, failed.

  **Currency**: each account has a 3-letter currency code. Subscriptions must use one of the plan's supported currencies.

  **Pagination**: cursor-based — `limit` (max 200) + response includes `has_more` + `next` URL.

  **Rate limits**: 1000 req/min per site. On 429 honor headers.

  **Out of scope here**: hosted pages, billing-info CRUD beyond list, refunds beyond invoice creation, gift cards, measured units, transactions detail, custom fields management.
tools:
  - name: recurly_list_accounts
    description: List accounts (customers).
    input:
      type: object
      properties:
        subscriber:
          type: boolean
          description: true = only with active subscription.
        email:
          type: string
          description: Filter by email.
        begin_time:
          type: string
          description: ISO 8601 — accounts modified after.
        end_time:
          type: string
          description: ISO 8601.
        sort:
          type: string
          description: created_at, updated_at.
        order:
          type: string
          description: asc or desc.
        limit:
          type: integer
          description: Per page (max 200).
    operation:
      method: GET
      path: /accounts
      query:
        subscriber: '{{params.subscriber}}'
        email: '{{params.email}}'
        begin_time: '{{params.begin_time}}'
        end_time: '{{params.end_time}}'
        sort: '{{params.sort}}'
        order: '{{params.order}}'
        limit: '{{params.limit}}'
      headers:
        Accept: application/vnd.recurly.v2021-02-25
  - name: recurly_get_account
    description: Fetch one account.
    input:
      type: object
      properties:
        accountId:
          type: string
          description: Account ID (or code prefixed with 'code-').
      required:
        - accountId
    operation:
      method: GET
      path: /accounts/{{params.accountId}}
      headers:
        Accept: application/vnd.recurly.v2021-02-25
  - name: recurly_create_account
    description: 'Create an account. Required: code (your unique customer ID).'
    input:
      type: object
      properties:
        code:
          type: string
          description: Your unique customer code.
        username:
          type: string
          description: Username.
        email:
          type: string
          description: Email.
        first_name:
          type: string
          description: First name.
        last_name:
          type: string
          description: Last name.
        company:
          type: string
          description: Company.
        vat_number:
          type: string
          description: VAT number.
        preferred_locale:
          type: string
          description: Locale (en-US, de-DE, etc.).
        preferred_time_zone:
          type: string
          description: TZ database name.
        cc_emails:
          type: string
          description: Comma-separated CC emails for invoices.
        address:
          type: object
          description: '{street1, street2?, city, region, postal_code, country, phone?}.'
        billing_info:
          type: object
          description: '{token_id?, number?, month?, year?, cvv?, first_name?, last_name?, address?}.'
      required:
        - code
    operation:
      method: POST
      path: /accounts
      headers:
        Accept: application/vnd.recurly.v2021-02-25
        Content-Type: application/json
      body:
        value:
          code: '{{params.code}}'
          username: '{{params.username}}'
          email: '{{params.email}}'
          first_name: '{{params.first_name}}'
          last_name: '{{params.last_name}}'
          company: '{{params.company}}'
          vat_number: '{{params.vat_number}}'
          preferred_locale: '{{params.preferred_locale}}'
          preferred_time_zone: '{{params.preferred_time_zone}}'
          cc_emails: '{{params.cc_emails}}'
          address: '{{params.address}}'
          billing_info: '{{params.billing_info}}'
  - name: recurly_list_subscriptions
    description: List subscriptions with filters.
    input:
      type: object
      properties:
        state:
          type: string
          description: future, active, paused, expired, canceled, failed.
        begin_time:
          type: string
          description: ISO 8601.
        end_time:
          type: string
          description: ISO 8601.
        sort:
          type: string
          description: created_at, updated_at.
        order:
          type: string
          description: asc or desc.
        limit:
          type: integer
          description: Per page.
    operation:
      method: GET
      path: /subscriptions
      query:
        state: '{{params.state}}'
        begin_time: '{{params.begin_time}}'
        end_time: '{{params.end_time}}'
        sort: '{{params.sort}}'
        order: '{{params.order}}'
        limit: '{{params.limit}}'
      headers:
        Accept: application/vnd.recurly.v2021-02-25
  - name: recurly_get_subscription
    description: Fetch one subscription.
    input:
      type: object
      properties:
        subscriptionId:
          type: string
          description: Subscription UUID.
      required:
        - subscriptionId
    operation:
      method: GET
      path: /subscriptions/{{params.subscriptionId}}
      headers:
        Accept: application/vnd.recurly.v2021-02-25
  - name: recurly_create_subscription
    description: 'Create a subscription on an account. Required: account.code OR account_id + plan_code + currency.'
    input:
      type: object
      properties:
        plan_code:
          type: string
          description: Plan code.
        currency:
          type: string
          description: ISO 4217 currency (USD, EUR, etc.).
        account:
          type: object
          description: '{code:''EXISTING'' OR code+billing_info+address+...} — Recurly auto-creates the account if it doesn''t exist.'
        unit_amount:
          type: number
          description: Override plan price.
        quantity:
          type: integer
          description: Default 1.
        coupon_code:
          type: string
          description: Coupon to apply.
        trial_ends_at:
          type: string
          description: ISO 8601 — extend/override trial.
        starts_at:
          type: string
          description: ISO 8601 — future start.
        po_number:
          type: string
          description: Purchase order.
        auto_renew:
          type: boolean
          description: Default true. false = cancels at period end.
      required:
        - plan_code
        - currency
        - account
    operation:
      method: POST
      path: /subscriptions
      headers:
        Accept: application/vnd.recurly.v2021-02-25
        Content-Type: application/json
      body:
        value:
          plan_code: '{{params.plan_code}}'
          currency: '{{params.currency}}'
          account: '{{params.account}}'
          unit_amount: '{{params.unit_amount}}'
          quantity: '{{params.quantity}}'
          coupon_code: '{{params.coupon_code}}'
          trial_ends_at: '{{params.trial_ends_at}}'
          starts_at: '{{params.starts_at}}'
          po_number: '{{params.po_number}}'
          auto_renew: '{{params.auto_renew}}'
  - name: recurly_cancel_subscription
    description: Cancel a subscription at the end of the current term. Use recurly_terminate for immediate.
    input:
      type: object
      properties:
        subscriptionId:
          type: string
          description: Subscription UUID.
      required:
        - subscriptionId
    operation:
      method: PUT
      path: /subscriptions/{{params.subscriptionId}}/cancel
      headers:
        Accept: application/vnd.recurly.v2021-02-25
  - name: recurly_terminate_subscription
    description: Immediately terminate a subscription with refund options (none/partial/full).
    input:
      type: object
      properties:
        subscriptionId:
          type: string
          description: Subscription UUID.
        refund:
          type: string
          description: none (default), partial, full.
        charge:
          type: boolean
          description: If true, post any unsettled charges.
      required:
        - subscriptionId
    operation:
      method: PUT
      path: /subscriptions/{{params.subscriptionId}}/terminate
      query:
        refund: '{{params.refund}}'
        charge: '{{params.charge}}'
      headers:
        Accept: application/vnd.recurly.v2021-02-25
  - name: recurly_list_invoices
    description: List invoices across the site.
    input:
      type: object
      properties:
        state:
          type: string
          description: pending, processing, past_due, paid, failed, voided, closed.
        type:
          type: string
          description: charge, credit, legacy, non_legacy.
        begin_time:
          type: string
          description: ISO 8601.
        end_time:
          type: string
          description: ISO 8601.
        sort:
          type: string
          description: created_at, updated_at.
        limit:
          type: integer
          description: Per page.
    operation:
      method: GET
      path: /invoices
      query:
        state: '{{params.state}}'
        type: '{{params.type}}'
        begin_time: '{{params.begin_time}}'
        end_time: '{{params.end_time}}'
        sort: '{{params.sort}}'
        limit: '{{params.limit}}'
      headers:
        Accept: application/vnd.recurly.v2021-02-25
  - name: recurly_list_plans
    description: List plans (subscription products). Each has code, name, intervals[], currencies[], trial_length, setup_fee.
    input:
      type: object
      properties:
        state:
          type: string
          description: active, inactive.
        limit:
          type: integer
          description: Per page.
    operation:
      method: GET
      path: /plans
      query:
        state: '{{params.state}}'
        limit: '{{params.limit}}'
      headers:
        Accept: application/vnd.recurly.v2021-02-25
  - name: recurly_list_coupons
    description: List coupons.
    input:
      type: object
      properties:
        state:
          type: string
          description: redeemable, expired, maxed_out, inactive.
        limit:
          type: integer
          description: Per page.
    operation:
      method: GET
      path: /coupons
      query:
        state: '{{params.state}}'
        limit: '{{params.limit}}'
      headers:
        Accept: application/vnd.recurly.v2021-02-25
