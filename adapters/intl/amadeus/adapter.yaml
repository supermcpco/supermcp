# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: amadeus
  name: Amadeus for Developers
  description: Drive Amadeus Travel APIs (flight offers, hotel search, airport autocomplete, points of interest) from any AI agent. 8 tools, OAuth2 client-credentials Bearer auth.
  region: intl
  category: travel
  icon: amadeus
  docsUrl: https://developers.amadeus.com/self-service
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  AMADEUS_ACCESS_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://test.api.amadeus.com
auth:
  type: bearer
  token: '{{env.AMADEUS_ACCESS_TOKEN}}'
instructions: |-
  This connector uses the Amadeus Self-Service REST APIs (developers.amadeus.com).

  **Setup**:
  1. Register at https://developers.amadeus.com → **My Self-Service Workspace → Create New App**.
  2. Get **API Key** + **API Secret**. Use the **test** environment by default (free, real data, low rate limits); switch to production after applying for production access.
  3. Run OAuth2 client_credentials flow to get an access token (~30 min expiry):
     ```
     POST https://test.api.amadeus.com/v1/security/oauth2/token
     grant_type=client_credentials&client_id=...&client_secret=...
     ```
  4. Set `AMADEUS_ACCESS_TOKEN`. Refresh externally.

  **Authentication**: `Authorization: Bearer ${AMADEUS_ACCESS_TOKEN}`.

  **Test vs Production base URL**:
    - Test: `https://test.api.amadeus.com`
    - Production: `https://api.amadeus.com`
  The adapter uses test by default; switch to production by overriding `AMADEUS_BASE_URL` env var (not exposed as a connector field — change baseUrl in your fork).

  **Date format**: ISO 8601 (YYYY-MM-DD).

  **Currency / Locale**: most search endpoints accept `currencyCode` (ISO 4217) and locale-specific responses.

  **Rate limits**: test environment is heavily throttled (~10 req/sec). On 429 back off significantly.

  **Out of scope here**: booking flow (Flight Create Orders requires special partnership), Self-Service vs Enterprise APIs differences, Amadeus Travel Channel API, hotel ratings via Sabre (different vendor).
tools:
  - name: amadeus_flight_offers_search
    description: Search for flight offers. Returns ranked itineraries with price, segments, validatingAirlineCodes, travelerPricings.
    input:
      type: object
      properties:
        originLocationCode:
          type: string
          description: IATA airport/city code (e.g. 'JFK', 'NYC').
        destinationLocationCode:
          type: string
          description: IATA airport/city code (e.g. 'LHR', 'LON').
        departureDate:
          type: string
          description: YYYY-MM-DD.
        returnDate:
          type: string
          description: YYYY-MM-DD — omit for one-way.
        adults:
          type: integer
          description: Number of adults (default 1).
        children:
          type: integer
          description: Number of children (2-11 years).
        infants:
          type: integer
          description: Infants (<2 years).
        travelClass:
          type: string
          description: ECONOMY, PREMIUM_ECONOMY, BUSINESS, FIRST.
        includedAirlineCodes:
          type: string
          description: Comma-separated airline codes to include.
        excludedAirlineCodes:
          type: string
          description: Comma-separated to exclude.
        nonStop:
          type: boolean
          description: If true, only non-stop.
        currencyCode:
          type: string
          description: ISO 4217.
        maxPrice:
          type: integer
          description: Max price per traveler.
        max:
          type: integer
          description: Max offers returned (1-250, default 250).
      required:
        - originLocationCode
        - destinationLocationCode
        - departureDate
        - adults
    operation:
      method: GET
      path: /v2/shopping/flight-offers
      query:
        originLocationCode: '{{params.originLocationCode}}'
        destinationLocationCode: '{{params.destinationLocationCode}}'
        departureDate: '{{params.departureDate}}'
        returnDate: '{{params.returnDate}}'
        adults: '{{params.adults}}'
        children: '{{params.children}}'
        infants: '{{params.infants}}'
        travelClass: '{{params.travelClass}}'
        includedAirlineCodes: '{{params.includedAirlineCodes}}'
        excludedAirlineCodes: '{{params.excludedAirlineCodes}}'
        nonStop: '{{params.nonStop}}'
        currencyCode: '{{params.currencyCode}}'
        maxPrice: '{{params.maxPrice}}'
        max: '{{params.max}}'
  - name: amadeus_flight_offer_price
    description: Confirm the price + availability of a previously-found flight offer. POST the flight offer back to validate before booking.
    input:
      type: object
      properties:
        data:
          type: object
          description: '{type:''flight-offers-pricing'', flightOffers:[...]} — wrap the flight offer(s) from search.'
      required:
        - data
    operation:
      method: POST
      path: /v1/shopping/flight-offers/pricing
      body:
        value:
          data: '{{params.data}}'
  - name: amadeus_flight_destinations
    description: 'Cheapest destinations from a city (inspirational search). Required: origin.'
    input:
      type: object
      properties:
        origin:
          type: string
          description: IATA city code.
        departureDate:
          type: string
          description: YYYY-MM-DD or YYYY-MM-DD,YYYY-MM-DD range.
        oneWay:
          type: boolean
          description: Default false (round trip).
        duration:
          type: string
          description: Duration of stay range, e.g. '1,15' days.
        nonStop:
          type: boolean
          description: Direct only.
        maxPrice:
          type: integer
          description: Max price.
        currencyCode:
          type: string
          description: ISO 4217.
      required:
        - origin
    operation:
      method: GET
      path: /v1/shopping/flight-destinations
      query:
        origin: '{{params.origin}}'
        departureDate: '{{params.departureDate}}'
        oneWay: '{{params.oneWay}}'
        duration: '{{params.duration}}'
        nonStop: '{{params.nonStop}}'
        maxPrice: '{{params.maxPrice}}'
        currencyCode: '{{params.currencyCode}}'
  - name: amadeus_airport_search
    description: Search for airports/cities by keyword (autocomplete).
    input:
      type: object
      properties:
        keyword:
          type: string
          description: Substring of city or airport name.
        subType:
          type: string
          description: AIRPORT, CITY, or AIRPORT,CITY.
        page_limit:
          type: integer
          description: Max results (default 10, max 100).
        view:
          type: string
          description: FULL or LIGHT.
      required:
        - keyword
        - subType
    operation:
      method: GET
      path: /v1/reference-data/locations
      query:
        keyword: '{{params.keyword}}'
        subType: '{{params.subType}}'
        page[limit]: '{{params.page_limit}}'
        view: '{{params.view}}'
  - name: amadeus_hotel_list_by_city
    description: List hotels in a city (returns hotelIds you can use in hotel offer search).
    input:
      type: object
      properties:
        cityCode:
          type: string
          description: IATA city code (e.g. 'PAR' for Paris).
        radius:
          type: integer
          description: Search radius (default 5).
        radiusUnit:
          type: string
          description: KM or MILE.
        ratings:
          type: string
          description: Comma-separated 1-5 star ratings.
      required:
        - cityCode
    operation:
      method: GET
      path: /v1/reference-data/locations/hotels/by-city
      query:
        cityCode: '{{params.cityCode}}'
        radius: '{{params.radius}}'
        radiusUnit: '{{params.radiusUnit}}'
        ratings: '{{params.ratings}}'
  - name: amadeus_hotel_search_offers
    description: Search hotel offers (available rates) for a set of hotelIds + check-in/out dates.
    input:
      type: object
      properties:
        hotelIds:
          type: string
          description: Comma-separated hotelIds (from hotel_list_by_city).
        adults:
          type: integer
          description: Number of adults.
        checkInDate:
          type: string
          description: YYYY-MM-DD.
        checkOutDate:
          type: string
          description: YYYY-MM-DD.
        roomQuantity:
          type: integer
          description: Number of rooms.
        currency:
          type: string
          description: ISO 4217.
        lang:
          type: string
          description: Language code.
      required:
        - hotelIds
        - adults
        - checkInDate
        - checkOutDate
    operation:
      method: GET
      path: /v3/shopping/hotel-offers
      query:
        hotelIds: '{{params.hotelIds}}'
        adults: '{{params.adults}}'
        checkInDate: '{{params.checkInDate}}'
        checkOutDate: '{{params.checkOutDate}}'
        roomQuantity: '{{params.roomQuantity}}'
        currency: '{{params.currency}}'
        lang: '{{params.lang}}'
  - name: amadeus_points_of_interest
    description: Get points of interest around a location (sightseeing/attractions). Returns POIs with name, category, rank, tags.
    input:
      type: object
      properties:
        latitude:
          type: number
          description: Latitude.
        longitude:
          type: number
          description: Longitude.
        radius:
          type: integer
          description: Search radius in km (default 1, max 20).
        categories:
          type: string
          description: 'Comma-separated: SIGHTS, NIGHTLIFE, RESTAURANT, SHOPPING.'
      required:
        - latitude
        - longitude
    operation:
      method: GET
      path: /v1/reference-data/locations/pois
      query:
        latitude: '{{params.latitude}}'
        longitude: '{{params.longitude}}'
        radius: '{{params.radius}}'
        categories: '{{params.categories}}'
  - name: amadeus_flight_status
    description: Get real-time flight status by carrier code + flight number + date.
    input:
      type: object
      properties:
        carrierCode:
          type: string
          description: Airline IATA code (e.g. 'BA' for British Airways).
        flightNumber:
          type: string
          description: Flight number (digits only).
        scheduledDepartureDate:
          type: string
          description: YYYY-MM-DD.
      required:
        - carrierCode
        - flightNumber
        - scheduledDepartureDate
    operation:
      method: GET
      path: /v2/schedule/flights
      query:
        carrierCode: '{{params.carrierCode}}'
        flightNumber: '{{params.flightNumber}}'
        scheduledDepartureDate: '{{params.scheduledDepartureDate}}'
