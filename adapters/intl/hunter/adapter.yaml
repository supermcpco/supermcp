# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: hunter
  name: Hunter.io
  description: Find and verify email addresses via Hunter.io. 7 tools for domain search, email finder, email verifier, account stats. Bearer-token / query-key auth.
  region: intl
  category: enrichment
  icon: hunter
  docsUrl: https://hunter.io/api-documentation/v2
  lint:
    allow:
      - healthcheck-present
credentials:
  HUNTER_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.hunter.io/v2
auth:
  type: query
  params:
    api_key: '{{env.HUNTER_API_KEY}}'
instructions: |-
  This connector uses the Hunter.io API v2 (hunter.io/api-documentation/v2).

  **Setup**:
  1. Sign in to https://hunter.io → top-right avatar → **API → API Keys**.
  2. Copy the key. Set `HUNTER_API_KEY`.

  **Authentication**: query-string `?api_key=...` on every call (QUERY_AUTH). Hunter also accepts the API key in an `X-API-Key` header but query-string is the documented default.

  **Credits model**: every request consumes credits per your plan. `domain_search` is the most expensive (returns up to 100 emails per call); `email_verifier` and `email_finder` are 1 credit each. `email_count` and `account` are FREE (don't deduct).

  **Confidence scores**: every email returned has a `confidence` 0-100 — Hunter's estimate of deliverability. >90 = reliable, 50-90 = use with care, <50 = high bounce risk.

  **Verifier vs Finder**:
    - `email_verifier`: 'is this email deliverable?' — returns status (valid/invalid/accept_all/disposable/webmail/unknown).
    - `email_finder`: 'find the email for this person at this company' — returns the most-likely email pattern with confidence.

  **Out of scope here**: Hunter Campaigns (their cold-email product), Leads (CRM-lite), webhooks.
tools:
  - name: hunter_account
    description: 'Return account info: email, plan_name, plan_level, calls.used, calls.available. FREE — doesn''t consume credits. Use at startup to verify credentials and check remaining quota.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /account
  - name: hunter_domain_search
    description: Find email addresses associated with a domain. Returns up to 100 emails (per_page param) with name, position, seniority, department, confidence, sources. The most credit-expensive endpoint.
    input:
      type: object
      properties:
        domain:
          type: string
          description: Domain to search (e.g. 'acme.com'). Mutually exclusive with company.
        company:
          type: string
          description: Company name (Hunter resolves to domain).
        limit:
          type: integer
          description: Max emails to return (default 10, max 100).
        offset:
          type: integer
          description: Pagination offset.
        type:
          type: string
          description: 'Filter by type: personal or generic.'
        seniority:
          type: string
          description: 'Filter: junior, senior, executive (comma-separated).'
        department:
          type: string
          description: 'Filter by department: executive, it, finance, management, sales, legal, support, hr, marketing, communication, education, design, health, operations (comma-separated).'
    operation:
      method: GET
      path: /domain-search
      query:
        domain: '{{params.domain}}'
        company: '{{params.company}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        type: '{{params.type}}'
        seniority: '{{params.seniority}}'
        department: '{{params.department}}'
  - name: hunter_email_finder
    description: 'Find the most-likely email for a specific person at a domain. Required: domain + (first_name+last_name OR full_name). Returns email + confidence + sources.'
    input:
      type: object
      properties:
        domain:
          type: string
          description: Domain (e.g. 'acme.com'). Mutually exclusive with company.
        company:
          type: string
          description: Company name.
        first_name:
          type: string
          description: First name.
        last_name:
          type: string
          description: Last name.
        full_name:
          type: string
          description: Or full name as single string.
        max_duration:
          type: integer
          description: Max seconds Hunter spends searching (3-20, default 10).
    operation:
      method: GET
      path: /email-finder
      query:
        domain: '{{params.domain}}'
        company: '{{params.company}}'
        first_name: '{{params.first_name}}'
        last_name: '{{params.last_name}}'
        full_name: '{{params.full_name}}'
        max_duration: '{{params.max_duration}}'
  - name: hunter_email_verifier
    description: Verify if an email is deliverable. Returns status (valid/invalid/accept_all/webmail/disposable/unknown) + score 0-100 + smtp_check + mx_records.
    input:
      type: object
      properties:
        email:
          type: string
          description: Email to verify.
      required:
        - email
    operation:
      method: GET
      path: /email-verifier
      query:
        email: '{{params.email}}'
  - name: hunter_email_count
    description: Count emails Hunter has indexed for a domain. FREE (no credits). Useful to estimate before a domain_search.
    input:
      type: object
      properties:
        domain:
          type: string
          description: Domain.
        company:
          type: string
          description: Or company name.
        type:
          type: string
          description: personal or generic.
    operation:
      method: GET
      path: /email-count
      query:
        domain: '{{params.domain}}'
        company: '{{params.company}}'
        type: '{{params.type}}'
  - name: hunter_combined_enrichment
    description: Combined person + company enrichment in one call. Provide an email — returns the person's name, role, employment + the company's industry, employees, location, technologies.
    input:
      type: object
      properties:
        email:
          type: string
          description: Email to enrich.
      required:
        - email
    operation:
      method: GET
      path: /combined/find
      query:
        email: '{{params.email}}'
  - name: hunter_company_enrichment
    description: Enrich a company by domain. Returns industry, employee count, address, country, technologies, social profiles, description.
    input:
      type: object
      properties:
        domain:
          type: string
          description: Company domain.
      required:
        - domain
    operation:
      method: GET
      path: /companies/find
      query:
        domain: '{{params.domain}}'
