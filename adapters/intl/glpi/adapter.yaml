# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: glpi
  name: GLPI
  description: 'GLPI open-source ITSM and asset management: tickets, computers, monitors, software, users and entities, plus GLPI''s search engine. REST API on your own instance, session-token auth with an App-Token.'
  region: intl
  category: itsm
  icon: glpi
  docsUrl: https://github.com/glpi-project/glpi/blob/main/apirest.md
credentials:
  GLPI_URL:
    required: true
  GLPI_APP_TOKEN:
    required: true
    secret: true
  GLPI_USER_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: '{{env.GLPI_URL}}/apirest.php'
auth:
  type: login
  request:
    method: GET
    url: '{{env.GLPI_URL}}/apirest.php/initSession'
    headers:
      Authorization: user_token {{env.GLPI_USER_TOKEN}}
      App-Token: '{{env.GLPI_APP_TOKEN}}'
      Content-Type: application/json
    query: {}
  credentials:
    username: '{{env.GLPI_USER_TOKEN}}'
    password: '{{env.GLPI_APP_TOKEN}}'
  tokenSource:
    from: body
    jsonPath: session_token
  expiry:
    ttl: 1h
    refreshBefore: 5m
    refreshOn401: true
  inject:
    header: Session-Token
    template: '{{auth.token}}'
  extraHeaders:
    App-Token: '{{env.GLPI_APP_TOKEN}}'
healthcheck:
  tool: glpi_get_active_entities
  http:
    method: GET
    path: /getActiveEntities
instructions: |
  **GLPI needs two tokens, and both are easy to confuse.**
  1. **App-Token** — identifies the *application*. In GLPI go to **Setup → General → API**, enable 'Enable Rest API' and 'Enable login with external token', add an API client, and copy its **application token**. Put it in `GLPI_APP_TOKEN`.
  2. **User-Token** — identifies the *person*. Open the GLPI user the agent should act as, go to the **API** tab of their profile, and regenerate the **remote access key** (personal API token). Put it in `GLPI_USER_TOKEN`.
  3. Set `GLPI_URL` to the instance root (no trailing slash); the adapter appends `/apirest.php`.

  The adapter calls `/initSession` with `Authorization: user_token <token>` plus the App-Token, caches the session token GLPI returns, and sends it back as `Session-Token: …` on every call, refreshing it when GLPI expires it. supermcp keeps the session encrypted in the `connector_auth_cache` table.

  **Why a user token rather than a username and password.** GLPI's initSession also accepts HTTP Basic credentials, but this connector deliberately does not use them: a login credential would have to be spelled out in the request, and a user token can be revoked on its own without changing the person's password. It is also the only one of the two that works when the GLPI user authenticates against LDAP or SSO.

  **Range, not page.** GLPI's list endpoints do not take a page number; they take a `range` of `start-end`, e.g. `0-49`. Ask for `0-49`, then `50-99`. The response carries `Content-Range` so you know when to stop.

  **The search engine is the powerful part.** `glpi_search` takes `criteria[0][field]`, `criteria[0][searchtype]` and `criteria[0][value]` and can express far more than the list endpoints. Field *numbers* are itemtype-specific — `glpi_list_search_options` returns the map for a given itemtype, and you will need it.

  **Entities scope everything.** A user restricted to one entity sees only that entity's tickets and assets, and GLPI reports the rest as simply absent.

  **Self-hosted, which is the thing to plan for.**
  - On a **hosted supermcp instance** the instance must be reachable from the public internet on a real hostname with a valid TLS certificate. A self-signed certificate will fail: the connector offers no trust-anything switch.
  - On an internal host (`glpi.intern`, `10.0.0.x`), self-host supermcp on the same network and add that host to `SSRF_ALLOWED_HOSTS`, or the outbound guard refuses the call before it is made.
tools:
  - name: glpi_get_active_entities
    description: Read the entities the logged-in user is currently scoped to. No parameters — the quickest proof that the App-Token, username and password all line up.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /getActiveEntities
  - name: glpi_list_tickets
    description: 'List tickets in the active entity with their status, priority, category, requester and dates. Use `range` to page: 0-49, then 50-99.'
    input:
      type: object
      properties:
        range:
          type: string
          description: Row range as start-end, e.g. `0-49`. GLPI has no page number.
        sort:
          type: number
          description: Search-option field number to sort by.
        order:
          type: string
          description: '`ASC` or `DESC`.'
        expand_dropdowns:
          type: boolean
          description: When true, resolve dropdown ids to their labels.
    operation:
      method: GET
      path: /Ticket
      query:
        range: '{{params.range}}'
        sort: '{{params.sort}}'
        order: '{{params.order}}'
        expand_dropdowns: '{{params.expand_dropdowns}}'
  - name: glpi_get_ticket
    description: Read one ticket in full, with its description, status, urgency, impact, priority, requester, assignee and SLA dates.
    input:
      type: object
      properties:
        id:
          type: number
          description: Numeric ticket id.
        expand_dropdowns:
          type: boolean
          description: When true, resolve dropdown ids to their labels.
      required:
        - id
    operation:
      method: GET
      path: /Ticket/{{params.id}}
      query:
        expand_dropdowns: '{{params.expand_dropdowns}}'
  - name: glpi_get_ticket_followups
    description: Read the follow-ups (the conversation) on one ticket, in order, with author, date and whether each is private.
    input:
      type: object
      properties:
        id:
          type: number
          description: Numeric ticket id.
        range:
          type: string
          description: Row range as start-end, e.g. `0-49`.
      required:
        - id
    operation:
      method: GET
      path: /Ticket/{{params.id}}/ITILFollowup
      query:
        range: '{{params.range}}'
  - name: glpi_search
    description: Run a GLPI search with criteria. Far more expressive than the list endpoints, but the field numbers are itemtype-specific — get them from glpi_list_search_options first.
    input:
      type: object
      properties:
        itemtype:
          type: string
          description: Item type to search, e.g. Ticket, Computer, User, Software.
        field0:
          type: number
          description: Search-option field number for the first criterion.
        searchtype0:
          type: string
          description: 'Match type: contains, equals, notequals, lessthan, morethan, under.'
        value0:
          type: string
          description: Value to match for the first criterion.
        range:
          type: string
          description: Row range as start-end, e.g. `0-49`.
        forcedisplay:
          type: string
          description: Comma-separated field numbers to include in the output.
      required:
        - itemtype
        - field0
        - searchtype0
        - value0
    operation:
      method: GET
      path: /search/{{params.itemtype}}
      query:
        criteria[0][field]: '{{params.field0}}'
        criteria[0][searchtype]: '{{params.searchtype0}}'
        criteria[0][value]: '{{params.value0}}'
        range: '{{params.range}}'
        forcedisplay[0]: '{{params.forcedisplay}}'
  - name: glpi_list_search_options
    description: 'Read the searchable field map for one item type: which field number means status, requester, serial number and so on. Needed before any glpi_search call.'
    input:
      type: object
      properties:
        itemtype:
          type: string
          description: Item type, e.g. Ticket, Computer, User.
      required:
        - itemtype
    operation:
      method: GET
      path: /listSearchOptions/{{params.itemtype}}
  - name: glpi_list_computers
    description: List computers from the asset inventory with their name, serial number, model, operating system and assigned user.
    input:
      type: object
      properties:
        range:
          type: string
          description: Row range as start-end, e.g. `0-49`.
        expand_dropdowns:
          type: boolean
          description: When true, resolve dropdown ids to their labels.
    operation:
      method: GET
      path: /Computer
      query:
        range: '{{params.range}}'
        expand_dropdowns: '{{params.expand_dropdowns}}'
  - name: glpi_get_computer
    description: 'Read one computer in full: hardware, OS, network interfaces, contracts, location and the user it is assigned to.'
    input:
      type: object
      properties:
        id:
          type: number
          description: Numeric computer id.
        expand_dropdowns:
          type: boolean
          description: When true, resolve dropdown ids to their labels.
      required:
        - id
    operation:
      method: GET
      path: /Computer/{{params.id}}
      query:
        expand_dropdowns: '{{params.expand_dropdowns}}'
  - name: glpi_list_users
    description: List GLPI users with their login, name, e-mail, entity and active flag, to resolve who a ticket or an asset belongs to.
    input:
      type: object
      properties:
        range:
          type: string
          description: Row range as start-end, e.g. `0-49`.
        expand_dropdowns:
          type: boolean
          description: When true, resolve dropdown ids to their labels.
    operation:
      method: GET
      path: /User
      query:
        range: '{{params.range}}'
        expand_dropdowns: '{{params.expand_dropdowns}}'
  - name: glpi_list_software
    description: List software items from the inventory with their publisher, category and the number of installations, for licence questions.
    input:
      type: object
      properties:
        range:
          type: string
          description: Row range as start-end, e.g. `0-49`.
        expand_dropdowns:
          type: boolean
          description: When true, resolve dropdown ids to their labels.
    operation:
      method: GET
      path: /Software
      query:
        range: '{{params.range}}'
        expand_dropdowns: '{{params.expand_dropdowns}}'
