# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: acuity-scheduling
  name: Acuity Scheduling
  description: 'Drive Acuity Scheduling (Squarespace-owned booking SaaS) from any AI agent: appointments, availability, appointment types, calendars, clients, products. 12 tools, Basic-auth.'
  region: intl
  category: scheduling
  icon: acuity
  docsUrl: https://developers.acuityscheduling.com/reference/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
      - tool-name-prefix
credentials:
  ACUITY_USER_ID:
    required: true
  ACUITY_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://acuityscheduling.com/api/v1
auth:
  type: basic
  username: '{{env.ACUITY_USER_ID}}'
  password: '{{env.ACUITY_API_KEY}}'
instructions: |-
  This connector uses the Acuity Scheduling API v1 (developers.acuityscheduling.com).

  **Setup**:
  1. Sign in to Acuity → **Integrations → API**.
  2. Note your **User ID** and copy the **API Key**.
  3. Set:
     - `ACUITY_USER_ID` = numeric user ID (e.g. `12345`)
     - `ACUITY_API_KEY` = the API key

  **Authentication**: HTTP Basic with username=USER_ID and password=API_KEY.

  **Availability flow**:
    1. List appointment types (`acuity_list_appointment_types`) — get appointmentTypeID.
    2. List calendars (`acuity_list_calendars`) — get calendarID(s).
    3. List available dates (`acuity_list_available_dates`) for date+appointmentType+calendar.
    4. List available times (`acuity_list_available_times`) for a specific date.
    5. Book the appointment (`acuity_create_appointment`).

  **Cancellation**: appointments can be canceled (POST /appointments/{id}/cancel) — irreversible but client can rebook.

  **Timezones**: Acuity normalizes everything to the appointment's calendar timezone. Dates use ISO 8601 with offset.

  **Forms and custom fields**: appointments can have forms with custom fields — pass an array of {id, value} in `fields`.

  **Rate limits**: ~10 req/sec. On 429 back off.

  **Out of scope here**: products/packages purchases beyond list, certificates, email templates, scheduling-page customization.
tools:
  - name: acuity_get_me
    description: 'Return account info: name, email, country, timezone. Health check.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /me
  - name: acuity_list_appointment_types
    description: List appointment types defined in the account. Each has id, name, duration, price, color, calendarIDs[], active.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /appointment-types
  - name: acuity_list_calendars
    description: List calendars (staff/resources). Each has id, name, email, location, description, timezone.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /calendars
  - name: acuity_list_available_dates
    description: List dates with available slots in a month, for a given appointmentTypeID and optional calendarID.
    input:
      type: object
      properties:
        appointmentTypeID:
          type: integer
          description: Appointment type ID.
        month:
          type: string
          description: YYYY-MM month to scan.
        calendarID:
          type: integer
          description: Optional calendar ID — limit to this staff/resource.
        timezone:
          type: string
          description: TZ database name (e.g. 'America/New_York'). Default uses account's.
      required:
        - appointmentTypeID
        - month
    operation:
      method: GET
      path: /availability/dates
      query:
        appointmentTypeID: '{{params.appointmentTypeID}}'
        month: '{{params.month}}'
        calendarID: '{{params.calendarID}}'
        timezone: '{{params.timezone}}'
  - name: acuity_list_available_times
    description: List specific time slots for a date.
    input:
      type: object
      properties:
        appointmentTypeID:
          type: integer
          description: Appointment type ID.
        date:
          type: string
          description: YYYY-MM-DD.
        calendarID:
          type: integer
          description: Optional calendar ID.
        timezone:
          type: string
          description: Timezone for the returned times.
      required:
        - appointmentTypeID
        - date
    operation:
      method: GET
      path: /availability/times
      query:
        appointmentTypeID: '{{params.appointmentTypeID}}'
        date: '{{params.date}}'
        calendarID: '{{params.calendarID}}'
        timezone: '{{params.timezone}}'
  - name: acuity_list_appointments
    description: List appointments with filtering.
    input:
      type: object
      properties:
        minDate:
          type: string
          description: ISO 8601 — appointments at/after.
        maxDate:
          type: string
          description: ISO 8601 — at/before.
        calendarID:
          type: integer
          description: Filter by calendar.
        appointmentTypeID:
          type: integer
          description: Filter by type.
        canceled:
          type: boolean
          description: If true, only canceled. Default excludes canceled.
        max:
          type: integer
          description: Max results (default 50).
    operation:
      method: GET
      path: /appointments
      query:
        minDate: '{{params.minDate}}'
        maxDate: '{{params.maxDate}}'
        calendarID: '{{params.calendarID}}'
        appointmentTypeID: '{{params.appointmentTypeID}}'
        canceled: '{{params.canceled}}'
        max: '{{params.max}}'
  - name: acuity_get_appointment
    description: Fetch a single appointment with client + forms + payment details.
    input:
      type: object
      properties:
        appointmentId:
          type: integer
          description: Appointment ID.
      required:
        - appointmentId
    operation:
      method: GET
      path: /appointments/{{params.appointmentId}}
  - name: acuity_create_appointment
    description: 'Book an appointment. Required: datetime + appointmentTypeID + firstName + lastName + email.'
    input:
      type: object
      properties:
        datetime:
          type: string
          description: ISO 8601 datetime of the slot.
        appointmentTypeID:
          type: integer
          description: Appointment type ID.
        calendarID:
          type: integer
          description: Optional calendar (round-robin if omitted).
        firstName:
          type: string
          description: Client first name.
        lastName:
          type: string
          description: Client last name.
        email:
          type: string
          description: Client email.
        phone:
          type: string
          description: Client phone.
        fields:
          type: array
          description: 'Custom form fields: [{id, value}].'
        smsOptIn:
          type: boolean
          description: Opt in to SMS reminders.
        noEmail:
          type: boolean
          description: If true, skip the confirmation email.
        labels:
          type: array
          description: '[{id}] — apply labels.'
        addonIDs:
          type: array
          description: Add-on IDs.
        certificate:
          type: string
          description: Coupon/cert code.
      required:
        - datetime
        - appointmentTypeID
        - firstName
        - lastName
        - email
    operation:
      method: POST
      path: /appointments
      body:
        value:
          datetime: '{{params.datetime}}'
          appointmentTypeID: '{{params.appointmentTypeID}}'
          calendarID: '{{params.calendarID}}'
          firstName: '{{params.firstName}}'
          lastName: '{{params.lastName}}'
          email: '{{params.email}}'
          phone: '{{params.phone}}'
          fields: '{{params.fields}}'
          smsOptIn: '{{params.smsOptIn}}'
          noEmail: '{{params.noEmail}}'
          labels: '{{params.labels}}'
          addonIDs: '{{params.addonIDs}}'
          certificate: '{{params.certificate}}'
  - name: acuity_reschedule_appointment
    description: Move an appointment to a new datetime/calendar.
    input:
      type: object
      properties:
        appointmentId:
          type: integer
          description: Appointment ID.
        datetime:
          type: string
          description: New ISO 8601 datetime.
        calendarID:
          type: integer
          description: Optional new calendar.
      required:
        - appointmentId
        - datetime
    operation:
      method: PUT
      path: /appointments/{{params.appointmentId}}/reschedule
      body:
        value:
          datetime: '{{params.datetime}}'
          calendarID: '{{params.calendarID}}'
  - name: acuity_cancel_appointment
    description: Cancel an appointment. Irreversible.
    input:
      type: object
      properties:
        appointmentId:
          type: integer
          description: Appointment ID.
        noEmail:
          type: boolean
          description: If true, skip the cancellation email.
        cancelNote:
          type: string
          description: Reason note.
      required:
        - appointmentId
    operation:
      method: PUT
      path: /appointments/{{params.appointmentId}}/cancel
      body:
        value:
          noEmail: '{{params.noEmail}}'
          cancelNote: '{{params.cancelNote}}'
  - name: acuity_list_clients
    description: List clients (people who have booked). Search by name or email.
    input:
      type: object
      properties:
        search:
          type: string
          description: Name or email substring.
    operation:
      method: GET
      path: /clients
      query:
        search: '{{params.search}}'
  - name: acuity_list_forms
    description: List intake forms (custom forms). Each has id, name, fields[]. Use field IDs in appointment create's `fields` param.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /forms
