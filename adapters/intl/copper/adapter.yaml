# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: copper
  name: Copper CRM
  description: 'Drive Copper (Google Workspace-native CRM) from any AI agent: people, companies, opportunities, leads, activities, tasks. 12 tools, API-token auth with email + token + appname headers.'
  region: intl
  category: crm
  icon: copper
  docsUrl: https://developer.copper.com/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  COPPER_API_KEY:
    required: true
    secret: true
  COPPER_USER_EMAIL:
    required: true
  COPPER_APP_NAME:
    required: true
    usage: manual
transport:
  type: http
  baseUrl: https://api.copper.com/developer_api/v1
auth:
  type: apiKey
  in: header
  name: X-PW-AccessToken
  value: '{{env.COPPER_API_KEY}}'
  extraHeaders:
    X-PW-Application: developer_api
    X-PW-UserEmail: '{{env.COPPER_USER_EMAIL}}'
instructions: |-
  This connector uses the Copper REST API v1 (developer.copper.com).

  **Setup**:
  1. Sign in to Copper → top-right avatar → **Settings → Integrations → API Keys → Generate API Key**.
  2. Copy: the key + the email of the user it belongs to.
  3. Set:
     - `COPPER_API_KEY` = generated key
     - `COPPER_USER_EMAIL` = the email of the API key owner
     - `COPPER_APP_NAME` = a label for your integration (e.g. `supermcp`)

  **Authentication**: three custom headers — `X-PW-AccessToken: ${COPPER_API_KEY}`, `X-PW-Application: developer_api`, `X-PW-UserEmail: ${COPPER_USER_EMAIL}`. Quirky but it's Copper's convention.

  **Pluralization quirk**: most endpoints use the PLURAL form (`/people`, `/companies`, `/opportunities`, `/leads`). Single-record GETs use `/people/{id}`. Search uses `POST /people/search` (yes, POST for read — Copper-specific).

  **People = contacts**, **Leads = unqualified prospects** (separate object before they become a person attached to a company). A 'company' is one record; a 'person' belongs to one company.

  **Pagination**: search endpoints use `page_number` (1-based) + `page_size` (max 200). The response is a flat array; total count is NOT returned by default.

  **Custom fields**: `custom_fields` on every record — array of `{custom_field_definition_id, value}`. Discover IDs via `copper_list_custom_field_definitions`.

  **Rate limits**: ~10 req/sec per account. On 429, back off.

  **Out of scope here**: webhooks, projects, automations, custom activity types beyond standard, file attachments.
tools:
  - name: copper_search_people
    description: Search people (contacts). POST a filter body — accepts page_number/page_size/name/email_domains/contact_type_ids/tags/assignee_ids/age, etc. Returns list of person records.
    input:
      type: object
      properties:
        page_number:
          type: integer
          description: 1-based page.
        page_size:
          type: integer
          description: Per page (max 200).
        sort_by:
          type: string
          description: name, date_modified, date_created.
        sort_direction:
          type: string
          description: asc or desc.
        name:
          type: string
          description: Filter by name substring.
        emails:
          type: array
          description: Array of email substrings to match.
        assignee_ids:
          type: array
          description: Filter by assignee user IDs.
        tags:
          type: array
          description: Filter by tag names.
    operation:
      method: POST
      path: /people/search
      body:
        value:
          page_number: '{{params.page_number}}'
          page_size: '{{params.page_size}}'
          sort_by: '{{params.sort_by}}'
          sort_direction: '{{params.sort_direction}}'
          name: '{{params.name}}'
          emails: '{{params.emails}}'
          assignee_ids: '{{params.assignee_ids}}'
          tags: '{{params.tags}}'
  - name: copper_get_person
    description: Fetch a person by ID with full fields including emails, phone_numbers, address, custom_fields, websites, socials, company info, assignee.
    input:
      type: object
      properties:
        personId:
          type: integer
          description: Person numeric ID.
      required:
        - personId
    operation:
      method: GET
      path: /people/{{params.personId}}
  - name: copper_create_person
    description: 'Create a new person. Required: name. emails/phone_numbers are arrays of {email, category} / {number, category}.'
    input:
      type: object
      properties:
        name:
          type: string
          description: Full name.
        emails:
          type: array
          description: '[{email, category:''work''|''personal''|''other''}].'
        phone_numbers:
          type: array
          description: '[{number, category:''work''|''mobile''|''home''|''other''}].'
        title:
          type: string
          description: Job title.
        company_id:
          type: integer
          description: Linked company ID.
        assignee_id:
          type: integer
          description: User ID of assignee.
        tags:
          type: array
          description: Array of tag name strings.
        custom_fields:
          type: array
          description: '[{custom_field_definition_id, value}].'
        address:
          type: object
          description: '{street, city, state, postal_code, country}.'
      required:
        - name
    operation:
      method: POST
      path: /people
      body:
        value:
          name: '{{params.name}}'
          emails: '{{params.emails}}'
          phone_numbers: '{{params.phone_numbers}}'
          title: '{{params.title}}'
          company_id: '{{params.company_id}}'
          assignee_id: '{{params.assignee_id}}'
          tags: '{{params.tags}}'
          custom_fields: '{{params.custom_fields}}'
          address: '{{params.address}}'
  - name: copper_update_person
    description: Update a person. Partial — only pass fields to change.
    input:
      type: object
      properties:
        personId:
          type: integer
          description: Person ID.
        name:
          type: string
          description: New name.
        emails:
          type: array
          description: Replace emails array.
        phone_numbers:
          type: array
          description: Replace phones.
        title:
          type: string
          description: New title.
        company_id:
          type: integer
          description: Reassign company.
        assignee_id:
          type: integer
          description: Reassign owner.
        tags:
          type: array
          description: Replace tags.
        custom_fields:
          type: array
          description: Custom fields.
      required:
        - personId
    operation:
      method: PUT
      path: /people/{{params.personId}}
      body:
        value:
          name: '{{params.name}}'
          emails: '{{params.emails}}'
          phone_numbers: '{{params.phone_numbers}}'
          title: '{{params.title}}'
          company_id: '{{params.company_id}}'
          assignee_id: '{{params.assignee_id}}'
          tags: '{{params.tags}}'
          custom_fields: '{{params.custom_fields}}'
  - name: copper_search_companies
    description: Search companies (organizations). POST filter body — name, contact_type_ids, tags, assignee_ids, etc.
    input:
      type: object
      properties:
        page_number:
          type: integer
          description: 1-based page.
        page_size:
          type: integer
          description: Per page.
        name:
          type: string
          description: Name substring.
        tags:
          type: array
          description: Tag filter.
        assignee_ids:
          type: array
          description: Owner filter.
    operation:
      method: POST
      path: /companies/search
      body:
        value:
          page_number: '{{params.page_number}}'
          page_size: '{{params.page_size}}'
          name: '{{params.name}}'
          tags: '{{params.tags}}'
          assignee_ids: '{{params.assignee_ids}}'
  - name: copper_create_company
    description: 'Create a company. Required: name.'
    input:
      type: object
      properties:
        name:
          type: string
          description: Company name.
        assignee_id:
          type: integer
          description: Owner user ID.
        tags:
          type: array
          description: Tag names.
        address:
          type: object
          description: '{street, city, state, postal_code, country}.'
        email_domain:
          type: string
          description: Primary domain (auto-link people by email).
        websites:
          type: array
          description: '[{url, category:''work''|''personal''|''other''}].'
        phone_numbers:
          type: array
          description: '[{number, category}].'
        custom_fields:
          type: array
          description: '[{custom_field_definition_id, value}].'
        details:
          type: string
          description: Free-text description.
      required:
        - name
    operation:
      method: POST
      path: /companies
      body:
        value:
          name: '{{params.name}}'
          assignee_id: '{{params.assignee_id}}'
          tags: '{{params.tags}}'
          address: '{{params.address}}'
          email_domain: '{{params.email_domain}}'
          websites: '{{params.websites}}'
          phone_numbers: '{{params.phone_numbers}}'
          custom_fields: '{{params.custom_fields}}'
          details: '{{params.details}}'
  - name: copper_search_opportunities
    description: Search opportunities (deals). Filter by name, status (open/won/lost/abandoned), pipeline_stage_ids, assignee.
    input:
      type: object
      properties:
        page_number:
          type: integer
          description: 1-based page.
        page_size:
          type: integer
          description: Per page.
        name:
          type: string
          description: Name substring.
        status_ids:
          type: array
          description: 'Status IDs: 0=open, 1=won, 2=lost, 3=abandoned.'
        pipeline_stage_ids:
          type: array
          description: Stage ID filter.
        assignee_ids:
          type: array
          description: Owner filter.
    operation:
      method: POST
      path: /opportunities/search
      body:
        value:
          page_number: '{{params.page_number}}'
          page_size: '{{params.page_size}}'
          name: '{{params.name}}'
          status_ids: '{{params.status_ids}}'
          pipeline_stage_ids: '{{params.pipeline_stage_ids}}'
          assignee_ids: '{{params.assignee_ids}}'
  - name: copper_create_opportunity
    description: 'Create an opportunity (deal). Required: name + primary_contact_id + pipeline_id + pipeline_stage_id. Monetary value in `monetary_value` (cents).'
    input:
      type: object
      properties:
        name:
          type: string
          description: Deal name.
        primary_contact_id:
          type: integer
          description: Person ID of the main contact.
        company_id:
          type: integer
          description: Linked company ID.
        pipeline_id:
          type: integer
          description: Pipeline ID (use copper_list_pipelines).
        pipeline_stage_id:
          type: integer
          description: Stage ID within the pipeline.
        assignee_id:
          type: integer
          description: Owner user ID.
        monetary_value:
          type: number
          description: Deal value (uses account's currency).
        status:
          type: string
          description: Open, Won, Lost, Abandoned.
        tags:
          type: array
          description: Tag names.
        custom_fields:
          type: array
          description: '[{custom_field_definition_id, value}].'
        close_date:
          type: string
          description: Expected close date MM/DD/YYYY.
      required:
        - name
        - primary_contact_id
    operation:
      method: POST
      path: /opportunities
      body:
        value:
          name: '{{params.name}}'
          primary_contact_id: '{{params.primary_contact_id}}'
          company_id: '{{params.company_id}}'
          pipeline_id: '{{params.pipeline_id}}'
          pipeline_stage_id: '{{params.pipeline_stage_id}}'
          assignee_id: '{{params.assignee_id}}'
          monetary_value: '{{params.monetary_value}}'
          status: '{{params.status}}'
          tags: '{{params.tags}}'
          custom_fields: '{{params.custom_fields}}'
          close_date: '{{params.close_date}}'
  - name: copper_update_opportunity
    description: 'Update a deal — common: pipeline_stage_id (move stage), status (close as Won/Lost).'
    input:
      type: object
      properties:
        opportunityId:
          type: integer
          description: Opportunity ID.
        name:
          type: string
          description: New name.
        pipeline_stage_id:
          type: integer
          description: New stage.
        status:
          type: string
          description: Open / Won / Lost / Abandoned.
        monetary_value:
          type: number
          description: New value.
        assignee_id:
          type: integer
          description: Reassign owner.
      required:
        - opportunityId
    operation:
      method: PUT
      path: /opportunities/{{params.opportunityId}}
      body:
        value:
          name: '{{params.name}}'
          pipeline_stage_id: '{{params.pipeline_stage_id}}'
          status: '{{params.status}}'
          monetary_value: '{{params.monetary_value}}'
          assignee_id: '{{params.assignee_id}}'
  - name: copper_list_pipelines
    description: List pipelines with their stages. Returns id, name, stages[{id, name, win_probability}]. Required to compose create-opportunity calls.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /pipelines
  - name: copper_list_custom_field_definitions
    description: List custom-field definitions for all object types. Returns id, name, data_type, available_on (people/companies/opportunities/leads). Required for composing custom_fields arrays.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /custom_field_definitions
  - name: copper_create_activity
    description: 'Log an activity (note/call/meeting) on a record. Activity type IDs come from /activity_types. Most common: type=0 (user) for notes.'
    input:
      type: object
      properties:
        parent:
          type: object
          description: '{type:''person''|''company''|''opportunity''|''lead'', id: ID}.'
        type:
          type: object
          description: '{category:''user''|''system'', id: ACTIVITY_TYPE_ID}. Discover via /activity_types.'
        details:
          type: string
          description: Activity body / note.
        activity_date:
          type: integer
          description: Unix timestamp.
      required:
        - parent
        - type
        - details
    operation:
      method: POST
      path: /activities
      body:
        value:
          parent: '{{params.parent}}'
          type: '{{params.type}}'
          details: '{{params.details}}'
          activity_date: '{{params.activity_date}}'
