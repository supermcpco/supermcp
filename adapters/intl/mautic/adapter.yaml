# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: mautic
  name: Mautic
  description: 'Mautic open-source marketing automation: contacts and their activity, segments, campaigns, e-mails with their send statistics, forms and form submissions. REST API, Basic auth against your own instance.'
  region: intl
  category: marketing-automation
  icon: mautic
  docsUrl: https://docs.mautic.org/en/5.x/rest_api/
credentials:
  MAUTIC_URL:
    required: true
  MAUTIC_USERNAME:
    required: true
  MAUTIC_PASSWORD:
    required: true
    secret: true
transport:
  type: http
  baseUrl: '{{env.MAUTIC_URL}}/api'
  headers:
    Accept: application/json
auth:
  type: basic
  username: '{{env.MAUTIC_USERNAME}}'
  password: '{{env.MAUTIC_PASSWORD}}'
healthcheck:
  tool: mautic_list_segments
  http:
    method: GET
    path: /contacts?limit=1
instructions: |
  **Turn the API on first.** Mautic ships with it disabled.
  1. As an administrator go to **Settings → Configuration → API Settings** and set *API enabled* to Yes, and *Enable HTTP basic auth* to Yes.
  2. Create a Mautic user for the integration with a role that grants view permissions on contacts, segments, campaigns and e-mails.
  3. Set `MAUTIC_URL` to your instance root (no trailing slash), plus `MAUTIC_USERNAME` and `MAUTIC_PASSWORD`. The adapter appends `/api`.

  **Basic auth is the simple path; OAuth 2 is the safer one.** Mautic supports both. Basic auth sends the user's real password on every request, so give the integration its own account and rotate it like any other credential — do not reuse an admin login.

  **Search is one string with a small grammar.** `search=email:*@example.com` matches contacts by e-mail; `is:anonymous`, `!is:anonymous`, `segment:my-segment-alias`, `ids:1,2,3` and `gt:date_added:2026-01-01` all work, joined by spaces for AND. Bare words match names and e-mail addresses.

  **Contacts default to including anonymous visitors**, which on a busy site outnumber the real ones by an order of magnitude. `search=!is:anonymous` is almost always what a question about 'contacts' actually means.

  **Responses key the rows by id.** `{"total": "42", "contacts": {"17": {…}, "18": {…}}}` — an object, not an array. `total` is a string.

  **Paging** is `limit` and `start` (an offset, not a page number).

  **Self-hosted, which is the thing to plan for.**
  - On a **hosted supermcp instance** the instance must be reachable from the public internet on a real hostname with a valid TLS certificate. A self-signed certificate will fail: the connector offers no trust-anything switch.
  - On an internal host (`mautic.intern`, `10.0.0.x`), self-host supermcp on the same network and add that host to `SSRF_ALLOWED_HOSTS`, or the outbound guard refuses the call before it is made.
tools:
  - name: mautic_list_contacts
    description: List contacts with their e-mail, name, company, points and stage. Pass `!is:anonymous` in search — anonymous visitors otherwise swamp the results.
    input:
      type: object
      properties:
        search:
          type: string
          description: Mautic search string, e.g. `!is:anonymous email:*@example.com`.
        limit:
          type: number
          description: Rows to return (default 30).
        start:
          type: number
          description: Rows to skip — an offset, not a page number.
        orderBy:
          type: string
          description: Column to sort by, e.g. date_added.
        orderByDir:
          type: string
          description: '`ASC` or `DESC`.'
    operation:
      method: GET
      path: /contacts
      query:
        search: '{{params.search}}'
        limit: '{{params.limit}}'
        start: '{{params.start}}'
        orderBy: '{{params.orderBy}}'
        orderByDir: '{{params.orderByDir}}'
  - name: mautic_get_contact
    description: 'Read one contact in full: every field, their points, the segments and campaigns they belong to, and their owner.'
    input:
      type: object
      properties:
        contactId:
          type: number
          description: Numeric Mautic contact id.
      required:
        - contactId
    operation:
      method: GET
      path: /contacts/{{params.contactId}}
  - name: mautic_get_contact_activity
    description: 'Read one contact''s activity timeline: page hits, e-mail opens and clicks, form submissions and campaign steps, in order.'
    input:
      type: object
      properties:
        contactId:
          type: number
          description: Numeric Mautic contact id.
        limit:
          type: number
          description: Events to return.
        page:
          type: number
          description: Page number, starting at 1.
        search:
          type: string
          description: Filter the timeline, e.g. by event type.
      required:
        - contactId
    operation:
      method: GET
      path: /contacts/{{params.contactId}}/activity
      query:
        limit: '{{params.limit}}'
        page: '{{params.page}}'
        search: '{{params.search}}'
  - name: mautic_list_segments
    description: List segments with their name, alias and the number of contacts in each. No parameters — the quickest check that the API is enabled and Basic auth works.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Rows to return.
        start:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /segments
      query:
        limit: '{{params.limit}}'
        start: '{{params.start}}'
  - name: mautic_list_segment_contacts
    description: List the contacts in one segment — who would actually receive a send to that segment.
    input:
      type: object
      properties:
        segmentId:
          type: number
          description: Numeric segment id.
        limit:
          type: number
          description: Rows to return.
        start:
          type: number
          description: Rows to skip, for paging.
      required:
        - segmentId
    operation:
      method: GET
      path: /contacts
      query:
        search: segment:$segmentId
        limit: '{{params.limit}}'
        start: '{{params.start}}'
  - name: mautic_list_campaigns
    description: List campaigns with their name, description, publish status and the number of contacts in each.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Rows to return.
        start:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /campaigns
      query:
        limit: '{{params.limit}}'
        start: '{{params.start}}'
  - name: mautic_list_emails
    description: List e-mails with their subject, type, publish status and send statistics — sent count, read count and the resulting read rate.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Rows to return.
        start:
          type: number
          description: Rows to skip, for paging.
        search:
          type: string
          description: Search fragment matched against name and subject.
    operation:
      method: GET
      path: /emails
      query:
        limit: '{{params.limit}}'
        start: '{{params.start}}'
        search: '{{params.search}}'
  - name: mautic_get_email
    description: 'Read one e-mail in full: its subject, from address, HTML body, the segments it targets and its send and read counts.'
    input:
      type: object
      properties:
        emailId:
          type: number
          description: Numeric Mautic e-mail id.
      required:
        - emailId
    operation:
      method: GET
      path: /emails/{{params.emailId}}
  - name: mautic_list_forms
    description: List forms with their name, alias, publish status and submission count — the capture points feeding the contact base.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Rows to return.
        start:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /forms
      query:
        limit: '{{params.limit}}'
        start: '{{params.start}}'
  - name: mautic_list_form_submissions
    description: List the submissions of one form with their date, IP, referrer and the field values submitted — the raw leads.
    input:
      type: object
      properties:
        formId:
          type: number
          description: Numeric form id.
        limit:
          type: number
          description: Rows to return.
        start:
          type: number
          description: Rows to skip, for paging.
      required:
        - formId
    operation:
      method: GET
      path: /forms/{{params.formId}}/submissions
      query:
        limit: '{{params.limit}}'
        start: '{{params.start}}'
