# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: klaviyo
  name: Klaviyo
  description: 'Drive Klaviyo (e-commerce email + SMS) from any AI agent: profiles, lists, segments, events tracking, flows, campaigns, catalogs. 14 tools targeting the modern 2024+ API.'
  region: intl
  category: marketing-automation
  icon: klaviyo
  docsUrl: https://developers.klaviyo.com/en/reference/api_overview
  lint:
    allow:
      - healthcheck-present
credentials:
  KLAVIYO_PRIVATE_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://a.klaviyo.com/api
auth:
  type: apiKey
  in: header
  name: Authorization
  value: Klaviyo-API-Key {{env.KLAVIYO_PRIVATE_API_KEY}}
instructions: |-
  This connector uses the Klaviyo REST API revision **2024-10-15** (current stable).

  **Setup**:
  1. Sign in to Klaviyo → bottom-left avatar → **Settings → API Keys → Create Private API Key**.
  2. Set scopes — at minimum: Profiles (Full), Lists (Full), Segments (Read), Events (Full), Catalogs (Read), Campaigns (Read), Flows (Read).
  3. Copy the key. It's prefixed with `pk_`. Set `KLAVIYO_PRIVATE_API_KEY`.

  **Authentication**: `Authorization: Klaviyo-API-Key ${KLAVIYO_PRIVATE_API_KEY}` (the literal prefix is `Klaviyo-API-Key`, NOT `Bearer`). The adapter sets this via API_KEY + custom apiKey value.

  **Revision header**: every request MUST include `revision: 2024-10-15`. The adapter pins this in `connector.headers`. If you upgrade revision, expect breaking changes — read https://developers.klaviyo.com/en/docs/api_versioning_and_deprecation_policy.

  **JSON:API spec**: Klaviyo follows JSON:API for resource shape. Every response: `{data: {id, type, attributes, relationships}, links, meta}`. Use `?include=` (comma-separated) to side-load related resources in one call.

  **Filtering syntax**: Klaviyo uses a custom filter DSL on most list endpoints. Example: `?filter=equals(properties,{'$source':'newsletter'})` or `?filter=greater-than(created,2025-01-01T00:00:00Z)`. The adapter exposes common filters as explicit query params.

  **Profile model**: Klaviyo's central object. Each profile has `email`, `phone_number`, `external_id`, plus arbitrary `properties` (custom fields). Profiles are upserted by email/phone/external_id — you cannot have duplicates on the same identifier.

  **Events**: the heart of Klaviyo's behavioral targeting. Send events via `klaviyo_create_event` with a profile identifier + a metric name (e.g. 'Placed Order') + properties. Klaviyo automatically creates the metric if it doesn't exist. Events drive flows (triggered automations) — sending the right events at the right time is 80% of Klaviyo work.

  **Pagination**: cursor-based via `page[cursor]` (response includes `links.next` with the cursor). `page[size]` is typically 20 default, 100 max.

  **Lists vs Segments**: lists are static (manually-managed subscribers). Segments are dynamic queries (recompute every few minutes). Use lists for opt-in newsletters, segments for behavioral cohorts ('opened a campaign in last 30 days').

  **Rate limits**: vary per endpoint. Profile reads: 75/sec burst, 700/min steady. Profile writes: 150/min. Klaviyo returns `429` with `Retry-After` — honor it.

  **Webhooks** out of scope (use Klaviyo's UI to configure event webhooks to your hosted endpoint).

  **Out of scope here**: sending individual emails via the legacy track/identify endpoints (use the Events API + flows instead), template editing, image library, reviews, the older v1/v2 REST API.
tools:
  - name: klaviyo_get_accounts
    description: 'Return account info: id, name, contact_info, industry, locale, timezone, public_api_key (for client-side tracking). Health check + identifies which Klaviyo account the key is for.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /accounts
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
  - name: klaviyo_list_profiles
    description: List profiles (paginated). Supports filtering by email, phone_number, external_id, created/updated date.
    input:
      type: object
      properties:
        filter:
          type: string
          description: Klaviyo filter DSL, e.g. equals(email,'a@b.com') or greater-than(updated,2024-01-01T00:00:00Z).
        fields_profile:
          type: string
          description: Comma-separated attributes to return (sparse fieldsets).
        include:
          type: string
          description: 'Side-load: lists, segments.'
        sort:
          type: string
          description: Sort by created, updated, email, etc. Prefix with - for desc.
        page_cursor:
          type: string
          description: Pagination cursor (from prior links.next).
    operation:
      method: GET
      path: /profiles
      query:
        filter: '{{params.filter}}'
        fields[profile]: '{{params.fields_profile}}'
        include: '{{params.include}}'
        sort: '{{params.sort}}'
        page[cursor]: '{{params.page_cursor}}'
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
  - name: klaviyo_get_profile
    description: Fetch one profile by ID. Returns email, phone_number, external_id, first/last_name, organization, properties (custom fields), created, updated, last_event_date.
    input:
      type: object
      properties:
        profileId:
          type: string
          description: Klaviyo profile ID (starts with '01...').
        include:
          type: string
          description: 'Side-load: lists, segments.'
      required:
        - profileId
    operation:
      method: GET
      path: /profiles/{{params.profileId}}
      query:
        include: '{{params.include}}'
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
  - name: klaviyo_create_or_update_profile
    description: Upsert a profile by email, phone_number, or external_id (in that priority). Returns the profile (status 201 if new, 200 if updated). Use this for onboarding new subscribers.
    input:
      type: object
      properties:
        data:
          type: object
          description: '{type: ''profile'', attributes: {email?, phone_number?, external_id?, first_name?, last_name?, organization?, title?, image?, location:{address1,city,country,...}, properties:{custom...}}}. Wrap inside {data:{...}}. At least one identifier (email/phone/external_id) required.'
      required:
        - data
    operation:
      method: POST
      path: /profile-import
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
        Content-Type: application/vnd.api+json
      body:
        value:
          data: '{{params.data}}'
  - name: klaviyo_list_lists
    description: List all opted-in lists (newsletter subscriber lists). Each list has name, created, updated, opt_in_process (single_opt_in or double_opt_in).
    input:
      type: object
      properties:
        filter:
          type: string
          description: Filter DSL.
        page_cursor:
          type: string
          description: Pagination cursor.
    operation:
      method: GET
      path: /lists
      query:
        filter: '{{params.filter}}'
        page[cursor]: '{{params.page_cursor}}'
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
  - name: klaviyo_add_profiles_to_list
    description: Subscribe profiles to a list (silent — does NOT send the double-opt-in email even on lists that require it; for double-opt-in respecting, use klaviyo_subscribe_profiles instead).
    input:
      type: object
      properties:
        listId:
          type: string
          description: List ID.
        data:
          type: array
          description: 'Array of profile references: [{type:''profile'', id:''01...''}, ...]. Each profile must already exist (use klaviyo_create_or_update_profile first).'
      required:
        - listId
        - data
    operation:
      method: POST
      path: /lists/{{params.listId}}/relationships/profiles
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
        Content-Type: application/vnd.api+json
      body:
        value:
          data: '{{params.data}}'
  - name: klaviyo_subscribe_profiles
    description: Subscribe profiles to a list with CONSENT (triggers the double-opt-in email if the list requires it). Use this instead of klaviyo_add_profiles_to_list for compliance-sensitive onboarding.
    input:
      type: object
      properties:
        data:
          type: object
          description: '{type:''profile-subscription-bulk-create-job'', attributes:{custom_source?:''string'',profiles:{data:[{type:''profile'',attributes:{email,subscriptions:{email:{marketing:{consent:''SUBSCRIBED''}}}}}]},relationships:{list:{data:{type:''list'',id:''LIST_ID''}}}}}. Wrap in {data:{...}}.'
      required:
        - data
    operation:
      method: POST
      path: /profile-subscription-bulk-create-jobs
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
        Content-Type: application/vnd.api+json
      body:
        value:
          data: '{{params.data}}'
  - name: klaviyo_remove_profiles_from_list
    description: Unsubscribe profiles from a list. Removes them from the list — does NOT mark them as globally unsubscribed.
    input:
      type: object
      properties:
        listId:
          type: string
          description: List ID.
        data:
          type: array
          description: 'Array of profile references: [{type:''profile'', id:''01...''}].'
      required:
        - listId
        - data
    operation:
      method: DELETE
      path: /lists/{{params.listId}}/relationships/profiles
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
        Content-Type: application/vnd.api+json
      body:
        value:
          data: '{{params.data}}'
  - name: klaviyo_list_segments
    description: List dynamic segments. Each segment has name, definition, profile_count (estimated), is_active.
    input:
      type: object
      properties:
        filter:
          type: string
          description: Filter DSL.
        page_cursor:
          type: string
          description: Pagination cursor.
    operation:
      method: GET
      path: /segments
      query:
        filter: '{{params.filter}}'
        page[cursor]: '{{params.page_cursor}}'
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
  - name: klaviyo_create_event
    description: Track an event on a profile — the cornerstone of Klaviyo's behavioral targeting. Use for purchases, page views, cart adds, support tickets, anything triggering a flow.
    input:
      type: object
      properties:
        data:
          type: object
          description: '{type:''event'', attributes:{properties:{...}, metric:{data:{type:''metric'',attributes:{name:''Placed Order'',service:''api''}}}, profile:{data:{type:''profile'',attributes:{email:''a@b.com''}}}, value?:99.99, value_currency?:''USD'', unique_id?:''uuid'', time?:''2025-01-15T12:00:00Z''}}. Wrap in {data:{...}}.'
      required:
        - data
    operation:
      method: POST
      path: /events
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
        Content-Type: application/vnd.api+json
      body:
        value:
          data: '{{params.data}}'
  - name: klaviyo_list_events
    description: List events with filters. Each event has metric_id, profile_id, properties, datetime, uuid.
    input:
      type: object
      properties:
        filter:
          type: string
          description: 'Filter DSL: equals(metric_id,''METRIC_ID''), greater-than(datetime,2024-01-01T00:00:00Z), etc.'
        include:
          type: string
          description: 'Side-load: profile, metric.'
        sort:
          type: string
          description: datetime, -datetime, timestamp, -timestamp.
        page_cursor:
          type: string
          description: Pagination cursor.
    operation:
      method: GET
      path: /events
      query:
        filter: '{{params.filter}}'
        include: '{{params.include}}'
        sort: '{{params.sort}}'
        page[cursor]: '{{params.page_cursor}}'
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
  - name: klaviyo_list_metrics
    description: List metrics (event types) the account has seen. Each metric has name, integration_id, created, updated. Use to discover metric IDs for event filtering.
    input:
      type: object
      properties:
        filter:
          type: string
          description: Filter DSL on name or integration name.
        page_cursor:
          type: string
          description: Pagination cursor.
    operation:
      method: GET
      path: /metrics
      query:
        filter: '{{params.filter}}'
        page[cursor]: '{{params.page_cursor}}'
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
  - name: klaviyo_list_campaigns
    description: List email/SMS campaigns. Filter by channel (email|sms) and status (Sent/Draft/Scheduled/etc).
    input:
      type: object
      properties:
        filter:
          type: string
          description: 'REQUIRED: must include equals(messages.channel,''email'') or ''sms''. E.g. ''and(equals(messages.channel,\''email\''),equals(status,\''Sent\''))''.'
        include:
          type: string
          description: 'Side-load: campaign-messages, tags.'
        sort:
          type: string
          description: created_at, scheduled_at.
        page_cursor:
          type: string
          description: Pagination cursor.
      required:
        - filter
    operation:
      method: GET
      path: /campaigns
      query:
        filter: '{{params.filter}}'
        include: '{{params.include}}'
        sort: '{{params.sort}}'
        page[cursor]: '{{params.page_cursor}}'
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
  - name: klaviyo_list_flows
    description: List flows (triggered automation sequences). Each flow has name, status, trigger_type, created, updated. Filter by status (active/draft/manual).
    input:
      type: object
      properties:
        filter:
          type: string
          description: Filter DSL.
        include:
          type: string
          description: 'Side-load: flow-actions, tags.'
        sort:
          type: string
          description: id, name, status, created, updated, trigger_type.
        page_cursor:
          type: string
          description: Pagination cursor.
    operation:
      method: GET
      path: /flows
      query:
        filter: '{{params.filter}}'
        include: '{{params.include}}'
        sort: '{{params.sort}}'
        page[cursor]: '{{params.page_cursor}}'
      headers:
        revision: "2024-10-15"
        Accept: application/vnd.api+json
