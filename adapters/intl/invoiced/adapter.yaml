# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: invoiced
  name: Invoiced
  description: 'Manage Invoiced (A/R automation: customers, invoices, payments, subscriptions, credit notes) from any AI agent. 9 tools, basic-auth.'
  region: intl
  category: accounting
  icon: invoiced
  docsUrl: https://invoiced.com/api
  lint:
    allow:
      - description-min-60
      - healthcheck-present
      - instructions-min-800
credentials:
  INVOICED_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.invoiced.com
auth:
  type: basic
  username: '{{env.INVOICED_API_KEY}}'
instructions: |-
  This connector wraps the Invoiced REST API (api.invoiced.com).

  **Setup**:
  1. Log into https://app.invoiced.com → **Developers → API Keys → Create API Key**.
  2. Set `INVOICED_API_KEY`.
  3. **Sandbox**: for testing, point baseUrl at `https://api.sandbox.invoiced.com` instead.

  **Authentication**: HTTP Basic — API key as username, empty password.

  **Hierarchy**: `Customer → Invoice → Line items → Payments`. Subscriptions generate recurring invoices automatically.

  **Pagination**: cursor-based via `Link` headers. Use `per_page` (max 100) and `page` (1-based).

  **Rate limits**: 60 req/min per API key, 1k/hr. 429 with `Retry-After`.

  **Out of scope here**: chasing workflow editor, payment-processor setup, dunning emails template management.
tools:
  - name: invoiced_list_customers
    description: List customers.
    input:
      type: object
      properties:
        filter_name:
          type: string
          description: Name filter.
        page:
          type: integer
          description: 1-based.
        per_page:
          type: integer
          description: Max 100.
    operation:
      method: GET
      path: /customers
      query:
        filter[name]: '{{params.filter_name}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: invoiced_get_customer
    description: Get one customer.
    input:
      type: object
      properties:
        id:
          type: integer
          description: Customer ID.
      required:
        - id
    operation:
      method: GET
      path: /customers/{{params.id}}
  - name: invoiced_create_customer
    description: Create a customer.
    input:
      type: object
      properties:
        name:
          type: string
          description: Customer or company name.
        email:
          type: string
          description: Email.
        type:
          type: string
          description: '''company'' or ''person''.'
        phone:
          type: string
          description: Phone.
        billing_address1:
          type: string
          description: Billing street.
        billing_city:
          type: string
          description: Billing city.
        billing_postal_code:
          type: string
          description: Billing ZIP.
        billing_country:
          type: string
          description: ISO 3166-1 alpha-2.
        payment_terms:
          type: string
          description: e.g. 'NET 30'.
        language:
          type: string
          description: ISO 639-1.
      required:
        - name
    operation:
      method: POST
      path: /customers
      body:
        value:
          name: '{{params.name}}'
          email: '{{params.email}}'
          type: '{{params.type}}'
          phone: '{{params.phone}}'
          billing_address1: '{{params.billing_address1}}'
          billing_city: '{{params.billing_city}}'
          billing_postal_code: '{{params.billing_postal_code}}'
          billing_country: '{{params.billing_country}}'
          payment_terms: '{{params.payment_terms}}'
          language: '{{params.language}}'
  - name: invoiced_list_invoices
    description: List invoices. Filter by customer, status (draft, sent, paid, voided), date range.
    input:
      type: object
      properties:
        customer:
          type: integer
          description: Customer ID filter.
        status:
          type: string
          description: draft, not_sent, sent, paid, voided.
        date_from:
          type: integer
          description: UNIX epoch (seconds).
        date_to:
          type: integer
          description: UNIX epoch (seconds).
        page:
          type: integer
          description: 1-based.
        per_page:
          type: integer
          description: Max 100.
    operation:
      method: GET
      path: /invoices
      query:
        customer: '{{params.customer}}'
        status: '{{params.status}}'
        date[start]: '{{params.date_from}}'
        date[end]: '{{params.date_to}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: invoiced_get_invoice
    description: Get one invoice with line items + payments.
    input:
      type: object
      properties:
        id:
          type: integer
          description: Invoice ID.
      required:
        - id
    operation:
      method: GET
      path: /invoices/{{params.id}}
  - name: invoiced_create_invoice
    description: Create an invoice. `items` is an array of {name, quantity, unit_cost, description}.
    input:
      type: object
      properties:
        customer:
          type: integer
          description: Customer ID.
        items:
          type: array
          description: Line items.
        date:
          type: integer
          description: Invoice date UNIX epoch.
        due_date:
          type: integer
          description: Due UNIX epoch.
        currency:
          type: string
          description: ISO 4217 (lowercase).
        notes:
          type: string
          description: Free-text notes.
        payment_terms:
          type: string
          description: e.g. 'NET 30'.
        draft:
          type: boolean
          description: If true, create as draft.
      required:
        - customer
        - items
    operation:
      method: POST
      path: /invoices
      body:
        value:
          customer: '{{params.customer}}'
          items: '{{params.items}}'
          date: '{{params.date}}'
          due_date: '{{params.due_date}}'
          currency: '{{params.currency}}'
          notes: '{{params.notes}}'
          payment_terms: '{{params.payment_terms}}'
          draft: '{{params.draft}}'
  - name: invoiced_send_invoice
    description: Send an invoice via email to its customer.
    input:
      type: object
      properties:
        id:
          type: integer
          description: Invoice ID.
        to:
          type: array
          description: Array of {name, address}.
        subject:
          type: string
          description: Subject.
        message:
          type: string
          description: Body.
      required:
        - id
    operation:
      method: POST
      path: /invoices/{{params.id}}/emails
      body:
        value:
          to: '{{params.to}}'
          subject: '{{params.subject}}'
          message: '{{params.message}}'
  - name: invoiced_list_payments
    description: List payments.
    input:
      type: object
      properties:
        customer:
          type: integer
          description: Customer ID filter.
        invoice:
          type: integer
          description: Invoice ID filter.
        page:
          type: integer
          description: 1-based.
        per_page:
          type: integer
          description: Max 100.
    operation:
      method: GET
      path: /payments
      query:
        customer: '{{params.customer}}'
        invoice: '{{params.invoice}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: invoiced_create_payment
    description: Record a payment (off-system) and optionally apply it to invoices.
    input:
      type: object
      properties:
        customer:
          type: integer
          description: Customer ID.
        amount:
          type: number
          description: Payment amount.
        currency:
          type: string
          description: ISO 4217 lowercase.
        method:
          type: string
          description: ach, cash, check, credit_card, wire_transfer, ...
        date:
          type: integer
          description: Date UNIX epoch.
        reference:
          type: string
          description: Reference / check number.
        applied_to:
          type: array
          description: 'Array of {type:''invoice'', invoice: <id>, amount: <n>} entries.'
      required:
        - customer
        - amount
    operation:
      method: POST
      path: /payments
      body:
        value:
          customer: '{{params.customer}}'
          amount: '{{params.amount}}'
          currency: '{{params.currency}}'
          method: '{{params.method}}'
          date: '{{params.date}}'
          reference: '{{params.reference}}'
          applied_to: '{{params.applied_to}}'
