# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: plane-so
  name: Plane
  description: Manage Plane (open-source project management) workspaces, projects, issues, cycles, modules from any AI agent. 10 tools, API key auth.
  region: intl
  category: project-management
  icon: plane-so
  docsUrl: https://docs.plane.so/api-reference/introduction
  lint:
    allow:
      - description-min-60
      - healthcheck-present
      - tool-name-prefix
credentials:
  PLANE_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.plane.so/api/v1
auth:
  type: apiKey
  in: header
  name: X-API-Key
  value: '{{env.PLANE_API_KEY}}'
instructions: |-
  This connector wraps the Plane REST API v1 (api.plane.so/api/v1 — or your self-hosted host).

  **Setup**:
  1. Log into your Plane instance → top-right avatar → **API Tokens → Create new token**.
  2. Note the **workspace slug** (the part of URLs like `app.plane.so/<slug>/projects`).
  3. Set `PLANE_API_KEY`. For self-hosted, also set `PLANE_HOST` (e.g. `https://plane.yourdomain.com`) — defaults to cloud (api.plane.so).

  **Authentication**: `X-API-Key: ${PLANE_API_KEY}`.

  **Hierarchy**: `Workspace → Project → Issue → Sub-issue`. Cycles + Modules are issue containers within a project for sprint planning / feature grouping.

  **Pagination**: `per_page` (max 100) + `cursor` (opaque, returned in response).

  **Rate limits**: 60 req/min on cloud. 429 with `Retry-After`.

  **Out of scope here**: workflow automation, view layout CRUD, document pages editor, the GraphQL backend used by the web app (not officially supported for third-party use).
tools:
  - name: plane_list_workspaces
    description: List all workspaces the API key can access.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /workspaces/
  - name: plane_list_projects
    description: List projects in a workspace.
    input:
      type: object
      properties:
        workspace_slug:
          type: string
          description: Workspace slug.
      required:
        - workspace_slug
    operation:
      method: GET
      path: /workspaces/{{params.workspace_slug}}/projects/
  - name: plane_get_project
    description: Get one project.
    input:
      type: object
      properties:
        workspace_slug:
          type: string
          description: Workspace slug.
        project_id:
          type: string
          description: Project UUID.
      required:
        - workspace_slug
        - project_id
    operation:
      method: GET
      path: /workspaces/{{params.workspace_slug}}/projects/{{params.project_id}}/
  - name: plane_list_issues
    description: List issues in a project. Filter by state, priority, assignee.
    input:
      type: object
      properties:
        workspace_slug:
          type: string
          description: Workspace slug.
        project_id:
          type: string
          description: Project UUID.
        state:
          type: string
          description: Filter by state UUID.
        priority:
          type: string
          description: urgent, high, medium, low, none.
        assignees:
          type: string
          description: Comma-separated user UUIDs.
        per_page:
          type: integer
          description: Max 100.
        cursor:
          type: string
          description: Pagination cursor.
      required:
        - workspace_slug
        - project_id
    operation:
      method: GET
      path: /workspaces/{{params.workspace_slug}}/projects/{{params.project_id}}/issues/
      query:
        state: '{{params.state}}'
        priority: '{{params.priority}}'
        assignees: '{{params.assignees}}'
        per_page: '{{params.per_page}}'
        cursor: '{{params.cursor}}'
  - name: plane_get_issue
    description: Get one issue with full description + custom properties.
    input:
      type: object
      properties:
        workspace_slug:
          type: string
          description: Workspace slug.
        project_id:
          type: string
          description: Project UUID.
        issue_id:
          type: string
          description: Issue UUID.
      required:
        - workspace_slug
        - project_id
        - issue_id
    operation:
      method: GET
      path: /workspaces/{{params.workspace_slug}}/projects/{{params.project_id}}/issues/{{params.issue_id}}/
  - name: plane_create_issue
    description: Create an issue.
    input:
      type: object
      properties:
        workspace_slug:
          type: string
          description: Workspace slug.
        project_id:
          type: string
          description: Project UUID.
        name:
          type: string
          description: Issue title.
        description_html:
          type: string
          description: HTML description.
        state:
          type: string
          description: State UUID.
        priority:
          type: string
          description: urgent, high, medium, low, none.
        assignees:
          type: array
          description: Array of user UUIDs.
        labels:
          type: array
          description: Array of label UUIDs.
        parent:
          type: string
          description: Parent issue UUID (for sub-issues).
        estimate_point:
          type: integer
          description: Estimate point.
        start_date:
          type: string
          description: YYYY-MM-DD.
        target_date:
          type: string
          description: YYYY-MM-DD.
      required:
        - workspace_slug
        - project_id
        - name
    operation:
      method: POST
      path: /workspaces/{{params.workspace_slug}}/projects/{{params.project_id}}/issues/
      body:
        value:
          name: '{{params.name}}'
          description_html: '{{params.description_html}}'
          state: '{{params.state}}'
          priority: '{{params.priority}}'
          assignees: '{{params.assignees}}'
          labels: '{{params.labels}}'
          parent: '{{params.parent}}'
          estimate_point: '{{params.estimate_point}}'
          start_date: '{{params.start_date}}'
          target_date: '{{params.target_date}}'
  - name: plane_update_issue
    description: Update an issue (PATCH semantics).
    input:
      type: object
      properties:
        workspace_slug:
          type: string
          description: Workspace slug.
        project_id:
          type: string
          description: Project UUID.
        issue_id:
          type: string
          description: Issue UUID.
        name:
          type: string
          description: New title.
        state:
          type: string
          description: Move to state UUID.
        priority:
          type: string
          description: New priority.
        assignees:
          type: array
          description: Replace assignees.
        description_html:
          type: string
          description: New HTML description.
      required:
        - workspace_slug
        - project_id
        - issue_id
    operation:
      method: PATCH
      path: /workspaces/{{params.workspace_slug}}/projects/{{params.project_id}}/issues/{{params.issue_id}}/
      body:
        value:
          name: '{{params.name}}'
          state: '{{params.state}}'
          priority: '{{params.priority}}'
          assignees: '{{params.assignees}}'
          description_html: '{{params.description_html}}'
  - name: plane_list_states
    description: List states (issue statuses) defined in a project. Use to discover state UUIDs.
    input:
      type: object
      properties:
        workspace_slug:
          type: string
          description: Workspace slug.
        project_id:
          type: string
          description: Project UUID.
      required:
        - workspace_slug
        - project_id
    operation:
      method: GET
      path: /workspaces/{{params.workspace_slug}}/projects/{{params.project_id}}/states/
  - name: plane_list_cycles
    description: List cycles (sprints) in a project.
    input:
      type: object
      properties:
        workspace_slug:
          type: string
          description: Workspace slug.
        project_id:
          type: string
          description: Project UUID.
      required:
        - workspace_slug
        - project_id
    operation:
      method: GET
      path: /workspaces/{{params.workspace_slug}}/projects/{{params.project_id}}/cycles/
  - name: plane_list_modules
    description: List modules (feature groups) in a project.
    input:
      type: object
      properties:
        workspace_slug:
          type: string
          description: Workspace slug.
        project_id:
          type: string
          description: Project UUID.
      required:
        - workspace_slug
        - project_id
    operation:
      method: GET
      path: /workspaces/{{params.workspace_slug}}/projects/{{params.project_id}}/modules/
