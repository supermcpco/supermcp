# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: heap
  name: Heap
  description: Send events, identify users and update properties in Heap (product analytics) from any AI agent. 5 tools, app_id-based auth.
  region: intl
  category: analytics
  icon: heap
  docsUrl: https://developers.heap.io/reference/server-side-apis-overview
  lint:
    allow:
      - healthcheck-present
credentials:
  HEAP_APP_ID:
    required: true
    usage: manual
transport:
  type: http
  baseUrl: https://heapanalytics.com/api
auth:
  type: none
instructions: |-
  This connector uses the Heap Server-Side API (developers.heap.io/docs/server-side-apis).

  **Setup**:
  1. Sign in to https://app.heap.io → top-right → **Account → Projects → select project → Project ID** (called `app_id`).
  2. Set `HEAP_APP_ID` to the numeric app/project ID.

  **Authentication**: NONE — Heap's server-side API uses the app_id in the request body to route events to your project. There's no secret on the ingestion endpoint (anyone with your app_id can fake events — same trust model as Google Analytics client-side JS).

  **identity vs user_id**: every event references a user via `identity` (a stable string you control — typically your user's UUID or email). Heap merges anonymous sessions to identified users on first identify call with the same identity.

  **Property types**: properties (event-level OR user-level) are arbitrary key-value pairs. Max 1024 properties per event, max 1MB total request size.

  **Out of scope here**: Read APIs (the Heap Read API requires a separate auth and is gated to higher plans), funnel/segment queries, account/billing.
tools:
  - name: heap_track_event
    description: 'Track a single behavioral event for a user. Required: app_id + identity + event. properties are arbitrary key/value.'
    input:
      type: object
      properties:
        app_id:
          type: string
          description: Heap app/project ID (use HEAP_APP_ID env var).
        identity:
          type: string
          description: Stable user identifier (your UUID or email).
        event:
          type: string
          description: Event name (e.g. 'Purchase Completed').
        properties:
          type: object
          description: Event properties (any keys + values).
        idempotency_key:
          type: string
          description: Optional dedupe key — Heap drops duplicates within ~24h.
        timestamp:
          type: string
          description: ISO 8601 — defaults to now.
      required:
        - app_id
        - identity
        - event
    operation:
      method: POST
      path: /track
      body:
        value:
          app_id: '{{params.app_id}}'
          identity: '{{params.identity}}'
          event: '{{params.event}}'
          properties: '{{params.properties}}'
          idempotency_key: '{{params.idempotency_key}}'
          timestamp: '{{params.timestamp}}'
  - name: heap_bulk_track
    description: Bulk-track many events in one call (up to 1000 events, 1MB total).
    input:
      type: object
      properties:
        app_id:
          type: string
          description: Heap app ID.
        events:
          type: array
          description: 'Array of event objects: [{identity, event, properties?, idempotency_key?, timestamp?}, ...].'
      required:
        - app_id
        - events
    operation:
      method: POST
      path: /track
      body:
        value:
          app_id: '{{params.app_id}}'
          events: '{{params.events}}'
  - name: heap_add_user_properties
    description: Set or update user-level properties (Heap merges with existing). User properties persist across all events for that identity.
    input:
      type: object
      properties:
        app_id:
          type: string
          description: Heap app ID.
        identity:
          type: string
          description: User identifier.
        properties:
          type: object
          description: User properties to set/merge.
      required:
        - app_id
        - identity
        - properties
    operation:
      method: POST
      path: /add_user_properties
      body:
        value:
          app_id: '{{params.app_id}}'
          identity: '{{params.identity}}'
          properties: '{{params.properties}}'
  - name: heap_add_account_properties
    description: 'Set or update properties on an account (B2B model — accounts group users). Required: account_id.'
    input:
      type: object
      properties:
        app_id:
          type: string
          description: Heap app ID.
        account_id:
          type: string
          description: Account identifier (your tenant/org ID).
        properties:
          type: object
          description: Account properties.
      required:
        - app_id
        - account_id
        - properties
    operation:
      method: POST
      path: /add_account_properties
      body:
        value:
          app_id: '{{params.app_id}}'
          account_id: '{{params.account_id}}'
          properties: '{{params.properties}}'
  - name: heap_add_user_to_account
    description: 'Associate a user (identity) with an account (account_id). Required: app_id + identity + account_id.'
    input:
      type: object
      properties:
        app_id:
          type: string
          description: Heap app ID.
        identity:
          type: string
          description: User identifier.
        account_id:
          type: string
          description: Account ID.
      required:
        - app_id
        - identity
        - account_id
    operation:
      method: POST
      path: /add_user_to_account
      body:
        value:
          app_id: '{{params.app_id}}'
          identity: '{{params.identity}}'
          account_id: '{{params.account_id}}'
