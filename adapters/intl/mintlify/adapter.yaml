# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: mintlify
  name: Mintlify
  description: Trigger Mintlify documentation updates, query analytics, and manage assistant queries via the Mintlify API. 5 tools, Bearer-token auth.
  region: intl
  category: publishing
  icon: mintlify
  docsUrl: https://mintlify.com/docs/api-reference
  lint:
    allow:
      - healthcheck-present
      - instructions-min-800
credentials:
  MINTLIFY_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.mintlify.com/v1
auth:
  type: bearer
  token: '{{env.MINTLIFY_API_KEY}}'
instructions: |-
  This connector uses the Mintlify API v1 (mintlify.com/docs/api-reference).

  **Setup**:
  1. Sign in to https://dashboard.mintlify.com → **Settings → API Keys → Create API key**.
  2. Copy the key (starts with `mint_`). Set `MINTLIFY_API_KEY`.

  **Authentication**: `Authorization: Bearer ${MINTLIFY_API_KEY}`.

  **Mintlify's API is scoped**: most write operations (trigger update, manage content) are not exposed because Mintlify expects content to live in a git repo and update on push. The API focuses on:
    - Triggering re-deploys
    - Querying assistant (chat) interactions
    - Pulling analytics / search data

  **Out of scope here**: page/content CRUD (manage via the git repo), team management, OAuth user actions.
tools:
  - name: mintlify_trigger_update
    description: Trigger a re-deploy of the documentation site (forces Mintlify to pull from the connected git repo and re-build). Use after a content change pipeline.
    input:
      type: object
      properties: {}
    operation:
      method: POST
      path: /project/update
  - name: mintlify_get_project_info
    description: 'Get project metadata: name, repo, deployment status, custom domain.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /project
  - name: mintlify_list_assistant_conversations
    description: List user conversations with the Mintlify AI assistant on your docs site. Returns query text, timestamp, helpful flag.
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Max per page.
        page:
          type: integer
          description: Page number.
        start_date:
          type: string
          description: ISO 8601.
        end_date:
          type: string
          description: ISO 8601.
    operation:
      method: GET
      path: /assistant/conversations
      query:
        limit: '{{params.limit}}'
        page: '{{params.page}}'
        start_date: '{{params.start_date}}'
        end_date: '{{params.end_date}}'
  - name: mintlify_list_search_queries
    description: List user search queries on the docs site (analytics). Useful to identify missing or confusing content.
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Max per page.
        page:
          type: integer
          description: Page number.
        start_date:
          type: string
          description: ISO 8601.
        end_date:
          type: string
          description: ISO 8601.
    operation:
      method: GET
      path: /search/queries
      query:
        limit: '{{params.limit}}'
        page: '{{params.page}}'
        start_date: '{{params.start_date}}'
        end_date: '{{params.end_date}}'
  - name: mintlify_get_analytics
    description: Retrieve site analytics aggregations (pageviews, unique visitors, top pages) for a date range.
    input:
      type: object
      properties:
        start_date:
          type: string
          description: ISO 8601 start.
        end_date:
          type: string
          description: ISO 8601 end.
        granularity:
          type: string
          description: hour, day, week, month.
      required:
        - start_date
        - end_date
    operation:
      method: GET
      path: /analytics
      query:
        start_date: '{{params.start_date}}'
        end_date: '{{params.end_date}}'
        granularity: '{{params.granularity}}'
