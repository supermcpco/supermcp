# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: fillout
  name: Fillout
  description: Read Fillout (modern form/survey builder) form definitions and submissions from any AI agent. 6 tools, Bearer auth.
  region: intl
  category: forms
  icon: fillout
  docsUrl: https://fillout.com/help/developers
  lint:
    allow:
      - description-min-60
      - healthcheck-present
      - instructions-min-800
credentials:
  FILLOUT_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.fillout.com/v1/api
auth:
  type: bearer
  token: '{{env.FILLOUT_API_KEY}}'
instructions: |-
  This connector uses the Fillout API v1 (fillout.com/help/developers).

  **Setup**:
  1. Sign in to https://fillout.com → top-right avatar → **Settings → Developer → API → Create API key**.
  2. Set `FILLOUT_API_KEY`.

  **Authentication**: `Authorization: Bearer ${FILLOUT_API_KEY}`.

  **Form IDs**: each form has a 32-character ID (visible in form URL). Use `fillout_list_forms` to discover.

  **Submission shape**: each submission has questions[] array of {id, name, type, value}. Cross-reference with form questions for human-readable names.

  **Pagination**: `?limit=N&offset=M`. Submissions endpoint supports `?afterDate=ISO&beforeDate=ISO`.

  **Out of scope here**: form creation (UI), file uploads, webhook subscription management.
tools:
  - name: fillout_list_forms
    description: List forms in the workspace.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /forms
  - name: fillout_get_form
    description: 'Fetch a form''s full definition: questions[] (id, name, type, options), settings.'
    input:
      type: object
      properties:
        formId:
          type: string
          description: Form ID.
      required:
        - formId
    operation:
      method: GET
      path: /forms/{{params.formId}}
  - name: fillout_list_submissions
    description: List submissions for a form, with optional date range filter.
    input:
      type: object
      properties:
        formId:
          type: string
          description: Form ID.
        limit:
          type: integer
          description: Per page (default 50, max 150).
        offset:
          type: integer
          description: Pagination offset.
        afterDate:
          type: string
          description: ISO 8601 — submissions after this.
        beforeDate:
          type: string
          description: ISO 8601 — submissions before this.
        status:
          type: string
          description: finished, in_progress.
        includeEditLink:
          type: boolean
          description: If true, include the edit link for each submission.
        search:
          type: string
          description: Substring search across answer values.
        sort:
          type: string
          description: asc or desc by submitted time.
      required:
        - formId
    operation:
      method: GET
      path: /forms/{{params.formId}}/submissions
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        afterDate: '{{params.afterDate}}'
        beforeDate: '{{params.beforeDate}}'
        status: '{{params.status}}'
        includeEditLink: '{{params.includeEditLink}}'
        search: '{{params.search}}'
        sort: '{{params.sort}}'
  - name: fillout_get_submission
    description: Fetch one submission with full answers.
    input:
      type: object
      properties:
        formId:
          type: string
          description: Form ID.
        submissionId:
          type: string
          description: Submission ID.
        includeEditLink:
          type: boolean
          description: Include edit link.
      required:
        - formId
        - submissionId
    operation:
      method: GET
      path: /forms/{{params.formId}}/submissions/{{params.submissionId}}
      query:
        includeEditLink: '{{params.includeEditLink}}'
  - name: fillout_delete_submissions
    description: Delete one or more submissions by ID.
    input:
      type: object
      properties:
        formId:
          type: string
          description: Form ID.
        submissionIds:
          type: array
          description: Array of submission IDs.
      required:
        - formId
        - submissionIds
    operation:
      method: DELETE
      path: /forms/{{params.formId}}/submissions
      body:
        value:
          submissionIds: '{{params.submissionIds}}'
  - name: fillout_create_submission
    description: Programmatically create a submission. submissions array has {questions:[{id, value}], hiddenFields?, urlParameters?}.
    input:
      type: object
      properties:
        formId:
          type: string
          description: Form ID.
        submissions:
          type: array
          description: 'Array of submissions: [{questions:[{id, value}], submissionTime?, hiddenFields?, urlParameters?}].'
      required:
        - formId
        - submissions
    operation:
      method: POST
      path: /forms/{{params.formId}}/submissions
      body:
        value:
          submissions: '{{params.submissions}}'
