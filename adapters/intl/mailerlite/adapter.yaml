# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: mailerlite
  name: MailerLite
  description: 'Manage MailerLite (email marketing: subscribers, groups, campaigns, automations, fields) from any AI agent. 10 tools, Bearer token.'
  region: intl
  category: email
  icon: mailerlite
  docsUrl: https://developers.mailerlite.com/docs/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  MAILERLITE_API_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://connect.mailerlite.com/api
auth:
  type: bearer
  token: '{{env.MAILERLITE_API_TOKEN}}'
instructions: |-
  This connector wraps the MailerLite API v2 (connect.mailerlite.com/api).

  **Setup**:
  1. Log into https://dashboard.mailerlite.com → bottom-left avatar → **Integrations → MailerLite API → Generate new token**.
  2. Pick scopes (read/write subscribers, groups, campaigns, fields, automations).
  3. Set `MAILERLITE_API_TOKEN`.

  **Authentication**: `Authorization: Bearer ${MAILERLITE_API_TOKEN}` + `Accept: application/json`.

  **Subscriber lifecycle**: every email becomes a `Subscriber` with status (active, unsubscribed, junk, unconfirmed, bounced). Adding the same email twice updates rather than duplicating.

  **Groups**: tags for segmentation. A subscriber can belong to many groups.

  **Pagination**: `cursor` style — response includes `links.next` with cursor URL. Use `cursor` query param to page. `limit` (max 100).

  **Rate limits**: 120 req/min per token (Free/Growing); 240/min on Advanced. 429 with `Retry-After`.

  **Out of scope here**: landing pages, popups, segment SQL builder, e-commerce attribution.
tools:
  - name: mailerlite_list_subscribers
    description: List subscribers. Filter by status, group, search.
    input:
      type: object
      properties:
        status:
          type: string
          description: active, unsubscribed, junk, unconfirmed, bounced.
        filter_search:
          type: string
          description: Email/name search.
        limit:
          type: integer
          description: Max 100.
        cursor:
          type: string
          description: Pagination cursor.
    operation:
      method: GET
      path: /subscribers
      query:
        filter[status]: '{{params.status}}'
        filter[search]: '{{params.filter_search}}'
        limit: '{{params.limit}}'
        cursor: '{{params.cursor}}'
  - name: mailerlite_get_subscriber
    description: Get one subscriber by ID or email.
    input:
      type: object
      properties:
        subscriber_id_or_email:
          type: string
          description: Numeric ID OR email.
      required:
        - subscriber_id_or_email
    operation:
      method: GET
      path: /subscribers/{{params.subscriber_id_or_email}}
  - name: mailerlite_upsert_subscriber
    description: Create or update a subscriber (idempotent on email). `fields` is a flat map of field-name → value.
    input:
      type: object
      properties:
        email:
          type: string
          description: Email (required).
        fields:
          type: object
          description: Custom field map (e.g. {name:'Jane', city:'Berlin'}).
        groups:
          type: array
          description: Array of group ID strings to add to.
        status:
          type: string
          description: active, unsubscribed, unconfirmed, ...
        subscribed_at:
          type: string
          description: ISO 8601 datetime.
        ip_address:
          type: string
          description: Subscriber IP.
      required:
        - email
    operation:
      method: POST
      path: /subscribers
      body:
        value:
          email: '{{params.email}}'
          fields: '{{params.fields}}'
          groups: '{{params.groups}}'
          status: '{{params.status}}'
          subscribed_at: '{{params.subscribed_at}}'
          ip_address: '{{params.ip_address}}'
  - name: mailerlite_delete_subscriber
    description: Permanently delete a subscriber.
    input:
      type: object
      properties:
        subscriber_id:
          type: string
          description: Subscriber ID.
      required:
        - subscriber_id
    operation:
      method: DELETE
      path: /subscribers/{{params.subscriber_id}}
  - name: mailerlite_list_groups
    description: List groups.
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Max 100.
        filter_name:
          type: string
          description: Filter by name.
    operation:
      method: GET
      path: /groups
      query:
        limit: '{{params.limit}}'
        filter[name]: '{{params.filter_name}}'
  - name: mailerlite_create_group
    description: Create a group.
    input:
      type: object
      properties:
        name:
          type: string
          description: Group name.
      required:
        - name
    operation:
      method: POST
      path: /groups
      body:
        value:
          name: '{{params.name}}'
  - name: mailerlite_assign_to_group
    description: Add a subscriber to a group.
    input:
      type: object
      properties:
        subscriber_id:
          type: string
          description: Subscriber ID.
        group_id:
          type: string
          description: Group ID.
      required:
        - subscriber_id
        - group_id
    operation:
      method: POST
      path: /subscribers/{{params.subscriber_id}}/groups/{{params.group_id}}
  - name: mailerlite_list_campaigns
    description: List campaigns. Filter by status (draft, sent, ready, queued).
    input:
      type: object
      properties:
        status:
          type: string
          description: draft, sent, ready, queued, canceled.
        limit:
          type: integer
          description: Max 100.
    operation:
      method: GET
      path: /campaigns
      query:
        filter[status]: '{{params.status}}'
        limit: '{{params.limit}}'
  - name: mailerlite_get_campaign
    description: Get one campaign with delivery stats.
    input:
      type: object
      properties:
        campaign_id:
          type: string
          description: Campaign ID.
      required:
        - campaign_id
    operation:
      method: GET
      path: /campaigns/{{params.campaign_id}}
  - name: mailerlite_list_fields
    description: List subscriber fields (built-in + custom). Use to discover what `fields` keys you can populate.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /fields
