# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: activecampaign
  name: ActiveCampaign
  description: 'Drive ActiveCampaign (marketing automation + CRM) from any AI agent: contacts, lists, tags, deals, pipelines, campaigns, automations. 16 tools. Custom Api-Token header auth, per-account API URL.'
  region: intl
  category: marketing-automation
  icon: activecampaign
  docsUrl: https://developers.activecampaign.com/reference/overview
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  ACTIVECAMPAIGN_API_URL:
    required: true
  ACTIVECAMPAIGN_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: '{{env.ACTIVECAMPAIGN_API_URL}}/api/3'
auth:
  type: apiKey
  in: header
  name: Api-Token
  value: '{{env.ACTIVECAMPAIGN_API_KEY}}'
instructions: |-
  This connector uses the ActiveCampaign API v3.

  **Setup**:
  1. Sign in to ActiveCampaign → **Settings → Developer**. Two values:
     - **URL** (your account's API URL): `https://{ACCOUNT}.api-us1.com` (or .api-eu1.com, etc.)
     - **Key**: a long alphanumeric API key.
  2. Set `ACTIVECAMPAIGN_API_URL` = the full URL from step 1 (no trailing slash, no `/api/3`).
  3. Set `ACTIVECAMPAIGN_API_KEY` = the key.

  **Authentication**: custom header `Api-Token: ${ACTIVECAMPAIGN_API_KEY}`.

  **Account-scoped base URL**: every account has its own subdomain. The adapter substitutes `{{ACTIVECAMPAIGN_API_URL}}/api/3` as the base. If you use OAuth2 instead of the API key, the URL is the same.

  **Contact model**: every contact has `email` (primary key), plus optional firstName, lastName, phone. Custom fields are 'field values' — separate POSTs to `/fieldValues`. The adapter exposes both contact CRUD and field-value management.

  **Lists are static, Tags are flexible**: lists need explicit subscribe operations and trigger double-opt-in by default. Tags are unlimited, free-form labels — easier for segmentation.

  **Status values for contact-list memberships**: 1=Active, 2=Unsubscribed, 0=Pending double-opt-in confirmation. Pass these as integers in `contactList.status`.

  **Deals are CRM-side**: separate from contacts (one deal links to one primary contact + one organization). Has stage_id (pipeline position), value, currency.

  **Pagination**: most list endpoints support `limit` (max 100) + `offset`. `?include=...` side-loads related resources.

  **Rate limits**: ~5 req/sec per account on Plus/Pro, higher on Enterprise. On 429, back off.

  **Out of scope here**: campaign content composition (use UI), automation creation (UI-only), site tracking JS, deep CRM custom-object schemas, eCommerce integrations.
tools:
  - name: activecampaign_list_contacts
    description: List contacts with optional filters. Each contact returns id, email, firstName, lastName, phone, cdate (created), udate (updated), fieldValues[].
    input:
      type: object
      properties:
        email:
          type: string
          description: Exact email filter.
        email_like:
          type: string
          description: Substring match on email.
        listid:
          type: integer
          description: Filter to contacts on this list.
        tagid:
          type: integer
          description: Filter to contacts with this tag.
        status:
          type: integer
          description: 'Filter by membership status: 1=Active, 2=Unsubscribed, 3=Bounced, 0=Pending.'
        search:
          type: string
          description: Free-text search across name + email.
        limit:
          type: integer
          description: Per page (default 20, max 100).
        offset:
          type: integer
          description: Pagination offset.
        orders_email:
          type: string
          description: Sort by email asc/desc.
    operation:
      method: GET
      path: /contacts
      query:
        email: '{{params.email}}'
        email_like: '{{params.email_like}}'
        listid: '{{params.listid}}'
        tagid: '{{params.tagid}}'
        status: '{{params.status}}'
        search: '{{params.search}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        orders[email]: '{{params.orders_email}}'
  - name: activecampaign_get_contact
    description: Fetch a contact by ID with relationships (contactLists, contactTags, fieldValues, etc.).
    input:
      type: object
      properties:
        contactId:
          type: integer
          description: Contact ID.
        include:
          type: string
          description: 'Side-load: contactLists,contactTags,fieldValues,contactDeals (comma-separated).'
      required:
        - contactId
    operation:
      method: GET
      path: /contacts/{{params.contactId}}
      query:
        include: '{{params.include}}'
  - name: activecampaign_sync_contact
    description: Upsert a contact by email (creates if missing, updates if exists). The preferred way to onboard contacts — avoids the 422 'duplicate' error of POST /contacts.
    input:
      type: object
      properties:
        contact:
          type: object
          description: '{email, firstName?, lastName?, phone?, fieldValues?: [{field, value}]}. Wrap inside {contact: {...}}.'
      required:
        - contact
    operation:
      method: POST
      path: /contact/sync
      body:
        value:
          contact: '{{params.contact}}'
  - name: activecampaign_update_contact
    description: Update an existing contact by ID. Use sync if you don't know whether the contact exists yet.
    input:
      type: object
      properties:
        contactId:
          type: integer
          description: Contact ID.
        contact:
          type: object
          description: '{email?, firstName?, lastName?, phone?}. Wrap inside {contact: {...}}.'
      required:
        - contactId
        - contact
    operation:
      method: PUT
      path: /contacts/{{params.contactId}}
      body:
        value:
          contact: '{{params.contact}}'
  - name: activecampaign_delete_contact
    description: Permanently delete a contact (GDPR right-to-be-forgotten). Irreversible.
    input:
      type: object
      properties:
        contactId:
          type: integer
          description: Contact ID.
      required:
        - contactId
    operation:
      method: DELETE
      path: /contacts/{{params.contactId}}
  - name: activecampaign_subscribe_contact_to_list
    description: Add a contact to a list with the given status. status=1 = Active (skips double-opt-in), 2=Unsubscribed.
    input:
      type: object
      properties:
        contactList:
          type: object
          description: '{list: LIST_ID, contact: CONTACT_ID, status: 1|2|0}. Wrap inside {contactList: {...}}.'
      required:
        - contactList
    operation:
      method: POST
      path: /contactLists
      body:
        value:
          contactList: '{{params.contactList}}'
  - name: activecampaign_list_lists
    description: List all subscriber lists. Each returns id, name, subscriber_count, created.
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Per page.
        offset:
          type: integer
          description: Pagination offset.
    operation:
      method: GET
      path: /lists
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: activecampaign_list_tags
    description: List tags. Each tag has id, tag (the name), tagType (contact/template), created.
    input:
      type: object
      properties:
        search:
          type: string
          description: Substring search on tag name.
        limit:
          type: integer
          description: Per page.
        offset:
          type: integer
          description: Pagination offset.
    operation:
      method: GET
      path: /tags
      query:
        search: '{{params.search}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: activecampaign_add_tag_to_contact
    description: Attach a tag to a contact (creates a contactTag join).
    input:
      type: object
      properties:
        contactTag:
          type: object
          description: '{contact: CONTACT_ID, tag: TAG_ID}. Wrap inside {contactTag: {...}}.'
      required:
        - contactTag
    operation:
      method: POST
      path: /contactTags
      body:
        value:
          contactTag: '{{params.contactTag}}'
  - name: activecampaign_remove_tag_from_contact
    description: Remove a tag→contact join (NOT delete the tag itself).
    input:
      type: object
      properties:
        contactTagId:
          type: integer
          description: contactTag ID (NOT the tag ID — get it from contactTags list under the contact).
      required:
        - contactTagId
    operation:
      method: DELETE
      path: /contactTags/{{params.contactTagId}}
  - name: activecampaign_list_deals
    description: List CRM deals with optional filters.
    input:
      type: object
      properties:
        stage:
          type: integer
          description: Filter by pipeline stage ID.
        status:
          type: integer
          description: 0=Open, 1=Won, 2=Lost.
        search:
          type: string
          description: Search title.
        limit:
          type: integer
          description: Per page.
        offset:
          type: integer
          description: Offset.
    operation:
      method: GET
      path: /deals
      query:
        filters[stage]: '{{params.stage}}'
        filters[status]: '{{params.status}}'
        search: '{{params.search}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: activecampaign_create_deal
    description: 'Create a CRM deal. Required: title, value (in cents), currency, group (pipeline ID), stage (stage ID), owner (user ID). Contact link via `contact` field.'
    input:
      type: object
      properties:
        deal:
          type: object
          description: '{title, description?, value: cents, currency:''usd'', group: PIPELINE_ID, stage: STAGE_ID, owner: USER_ID, contact: CONTACT_ID?, fields?:[{customFieldId, fieldValue}]}. Wrap inside {deal: {...}}.'
      required:
        - deal
    operation:
      method: POST
      path: /deals
      body:
        value:
          deal: '{{params.deal}}'
  - name: activecampaign_update_deal
    description: 'Update a deal — common: change stage_id (move pipeline), set status=1 (won) or 2 (lost), update value.'
    input:
      type: object
      properties:
        dealId:
          type: integer
          description: Deal ID.
        deal:
          type: object
          description: '{title?, value?, stage?, status?, owner?, fields?}. Wrap inside {deal: {...}}.'
      required:
        - dealId
        - deal
    operation:
      method: PUT
      path: /deals/{{params.dealId}}
      body:
        value:
          deal: '{{params.deal}}'
  - name: activecampaign_list_pipelines
    description: List deal pipelines (each pipeline has multiple stages). Returns id, title, currency, allow_html_descriptions.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /dealGroups
  - name: activecampaign_list_pipeline_stages
    description: List stages, optionally filtered to a pipeline. Each stage has id, title, color, width, order, group (pipeline ID).
    input:
      type: object
      properties:
        d_groupid:
          type: integer
          description: Filter by pipeline ID.
    operation:
      method: GET
      path: /dealStages
      query:
        filters[d_groupid]: '{{params.d_groupid}}'
  - name: activecampaign_list_custom_fields
    description: List custom fields defined on contacts. Returns id, title, type (text/dropdown/date/...), perstag (the merge tag name).
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Per page.
        offset:
          type: integer
          description: Pagination offset.
    operation:
      method: GET
      path: /fields
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
