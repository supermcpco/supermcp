# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: clockify
  name: Clockify
  description: Manage Clockify (time tracking, projects, tasks, clients, tags, workspace users, reports) from any AI agent. 18 tools, X-Api-Key auth.
  region: intl
  category: time-tracking
  icon: clockify
  docsUrl: https://docs.clockify.me/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  CLOCKIFY_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.clockify.me/api/v1
auth:
  type: apiKey
  in: header
  name: X-Api-Key
  value: '{{env.CLOCKIFY_API_KEY}}'
instructions: |-
  This connector wraps the Clockify REST API v1 (api.clockify.me/api/v1).

  **Setup**:
  1. Sign in to https://clockify.me → bottom-left avatar → **Preferences → Advanced → API → Generate API key**.
  2. Set `CLOCKIFY_API_KEY`.

  **Authentication**: `X-Api-Key: ${CLOCKIFY_API_KEY}` on every request.

  **Workspace IDs**: Clockify is workspace-scoped. Use `clockify_get_user` first — its response contains `defaultWorkspace` and `activeWorkspace`. List workspaces with `clockify_list_workspaces`.

  **Time entry shape**: `start` + `end` are ISO 8601 UTC with the literal `Z` suffix (e.g. `2026-05-20T14:30:00Z`). For a running entry, OMIT `end` — the entry will be live until you call `clockify_stop_current_entry`.

  **Project / Task / Tag IDs**: every entity ID is a 24-char hex Mongo-style ID (e.g. `5b1e7b7b7e8d8e3a4c5d6f78`). Always look them up first via the list endpoints; user-facing names are not accepted.

  **Deleting clients/tasks/projects**: Clockify forbids deleting an active client or project — archive it first (PUT with `archived:true`), then DELETE. Tasks must be set to `status:DONE` before deletion.

  **Reports**: the report tools (`clockify_detailed_report`, `clockify_summary_report`) hit a SEPARATE host — `reports.api.clockify.me/v1` — handled transparently here via absolute URLs. POST body needs `dateRangeStart`/`dateRangeEnd` (ISO 8601 with millis, e.g. `2026-05-01T00:00:00.000`). Detailed reports paginate via `detailedFilter.page`/`pageSize`; summary groups via `summaryFilter.groups` (e.g. `["PROJECT","USER"]`).

  **Regional workspaces**: workspaces hosted in EU/US regions use prefixed hosts (e.g. `euc1.clockify.me`, `reports.euc1.clockify.me`). This adapter targets the global host; regional accounts need a forked baseUrl.

  **Pagination**: `page` (1-based) + `page-size` (max 5000 but default 50). Some endpoints also support cursor pagination via `cursor`.

  **Rate limits**: ~10 req/s per API key. 429 with no Retry-After — back off 1s.

  **Out of scope here**: approval workflows, expenses, invoicing, webhooks, Pumble integration.
tools:
  - name: clockify_get_user
    description: 'Return the authenticated user: id, email, name, activeWorkspace, defaultWorkspace, profile picture URL.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /user
  - name: clockify_list_workspaces
    description: List workspaces the user belongs to.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /workspaces
  - name: clockify_list_workspace_users
    description: List all users (members) of a workspace. Returns each user's id, email, name, status (ACTIVE/INACTIVE), and memberships. Filter by name/email/status.
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        name:
          type: string
          description: Substring filter by name.
        email:
          type: string
          description: Filter by email.
        status:
          type: string
          description: ACTIVE, INACTIVE, PENDING, DECLINED, or ALL.
        page:
          type: integer
          description: 1-based.
        page_size:
          type: integer
          description: Default 50, max 5000.
      required:
        - workspace_id
    operation:
      method: GET
      path: /workspaces/{{params.workspace_id}}/users
      query:
        name: '{{params.name}}'
        email: '{{params.email}}'
        status: '{{params.status}}'
        page: '{{params.page}}'
        page-size: '{{params.page_size}}'
  - name: clockify_find_tasks
    description: List tasks within a project. Returns id, name, status (ACTIVE/DONE), assigneeIds, estimate, billable.
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        project_id:
          type: string
          description: Project ID.
        name:
          type: string
          description: Substring filter.
        is_active:
          type: boolean
          description: true = only ACTIVE tasks.
        page:
          type: integer
          description: 1-based.
        page_size:
          type: integer
          description: Default 50.
      required:
        - workspace_id
        - project_id
    operation:
      method: GET
      path: /workspaces/{{params.workspace_id}}/projects/{{params.project_id}}/tasks
      query:
        name: '{{params.name}}'
        is-active: '{{params.is_active}}'
        page: '{{params.page}}'
        page-size: '{{params.page_size}}'
  - name: clockify_add_task
    description: 'Add a task to a project. Required: name. Optionally assign users, set an estimate, or mark billable.'
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        project_id:
          type: string
          description: Project ID.
        name:
          type: string
          description: Task name.
        assignee_ids:
          type: array
          description: Array of user ID strings to assign.
        estimate:
          type: string
          description: ISO 8601 duration, e.g. PT2H30M.
        billable:
          type: boolean
          description: Billable flag.
      required:
        - workspace_id
        - project_id
        - name
    operation:
      method: POST
      path: /workspaces/{{params.workspace_id}}/projects/{{params.project_id}}/tasks
      body:
        value:
          name: '{{params.name}}'
          assigneeIds: '{{params.assignee_ids}}'
          estimate: '{{params.estimate}}'
          billable: '{{params.billable}}'
  - name: clockify_add_project
    description: 'Create a project in a workspace. Required: name. Optionally link a client, set color, billable, public, hourly rate.'
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        name:
          type: string
          description: Project name.
        client_id:
          type: string
          description: Client ID to attach.
        color:
          type: string
          description: 'Hex color, e.g. #03A9F4.'
        billable:
          type: boolean
          description: Billable by default.
        is_public:
          type: boolean
          description: Visible to all workspace members.
        note:
          type: string
          description: Free-text note.
      required:
        - workspace_id
        - name
    operation:
      method: POST
      path: /workspaces/{{params.workspace_id}}/projects
      body:
        value:
          name: '{{params.name}}'
          clientId: '{{params.client_id}}'
          color: '{{params.color}}'
          billable: '{{params.billable}}'
          isPublic: '{{params.is_public}}'
          note: '{{params.note}}'
  - name: clockify_add_client
    description: 'Create a client in a workspace. Required: name.'
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        name:
          type: string
          description: Client name.
        email:
          type: string
          description: Client email.
        address:
          type: string
          description: Client address.
        note:
          type: string
          description: Free-text note.
      required:
        - workspace_id
        - name
    operation:
      method: POST
      path: /workspaces/{{params.workspace_id}}/clients
      body:
        value:
          name: '{{params.name}}'
          email: '{{params.email}}'
          address: '{{params.address}}'
          note: '{{params.note}}'
  - name: clockify_add_tag
    description: 'Create a tag in a workspace. Required: name.'
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        name:
          type: string
          description: Tag name.
      required:
        - workspace_id
        - name
    operation:
      method: POST
      path: /workspaces/{{params.workspace_id}}/tags
      body:
        value:
          name: '{{params.name}}'
  - name: clockify_list_clients
    description: List clients in a workspace.
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        name:
          type: string
          description: Substring filter by name.
        archived:
          type: boolean
          description: Include archived.
        page:
          type: integer
          description: 1-based.
        page_size:
          type: integer
          description: Default 50, max 5000.
      required:
        - workspace_id
    operation:
      method: GET
      path: /workspaces/{{params.workspace_id}}/clients
      query:
        name: '{{params.name}}'
        archived: '{{params.archived}}'
        page: '{{params.page}}'
        page-size: '{{params.page_size}}'
  - name: clockify_list_projects
    description: List projects in a workspace. Returns id, name, clientId, billable, color, archived, public, estimate, hourlyRate.
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        name:
          type: string
          description: Substring filter.
        clients:
          type: string
          description: Comma-separated client IDs to filter to.
        archived:
          type: boolean
          description: Include archived.
        billable:
          type: boolean
          description: Filter billable.
        page:
          type: integer
          description: 1-based.
        page_size:
          type: integer
          description: Default 50.
      required:
        - workspace_id
    operation:
      method: GET
      path: /workspaces/{{params.workspace_id}}/projects
      query:
        name: '{{params.name}}'
        clients: '{{params.clients}}'
        archived: '{{params.archived}}'
        billable: '{{params.billable}}'
        page: '{{params.page}}'
        page-size: '{{params.page_size}}'
  - name: clockify_list_tags
    description: List tags in a workspace.
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        name:
          type: string
          description: Substring filter.
        archived:
          type: boolean
          description: Include archived.
      required:
        - workspace_id
    operation:
      method: GET
      path: /workspaces/{{params.workspace_id}}/tags
      query:
        name: '{{params.name}}'
        archived: '{{params.archived}}'
  - name: clockify_list_time_entries
    description: List a user's time entries in a workspace. Filter by start/end window, project, tag, billable. Returns each entry's id, description, project, task, tags, billable, timeInterval (start/end/duration).
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        user_id:
          type: string
          description: User ID (use clockify_get_user for own ID).
        start:
          type: string
          description: ISO 8601 UTC (e.g. 2026-05-20T00:00:00Z).
        end:
          type: string
          description: ISO 8601 UTC.
        project:
          type: string
          description: Project ID filter.
        tags:
          type: string
          description: Comma-separated tag IDs.
        billable:
          type: boolean
          description: Filter billable.
        in_progress:
          type: boolean
          description: Only currently running.
        page:
          type: integer
          description: 1-based.
        page_size:
          type: integer
          description: Default 50, max 5000.
      required:
        - workspace_id
        - user_id
    operation:
      method: GET
      path: /workspaces/{{params.workspace_id}}/user/{{params.user_id}}/time-entries
      query:
        start: '{{params.start}}'
        end: '{{params.end}}'
        project: '{{params.project}}'
        tags: '{{params.tags}}'
        billable: '{{params.billable}}'
        in-progress: '{{params.in_progress}}'
        page: '{{params.page}}'
        page-size: '{{params.page_size}}'
  - name: clockify_start_time_entry
    description: Start a new time entry. Omit `end` to start a running timer; supply both `start` and `end` to log a completed entry. Starting a new entry stops any currently-running one for the same user.
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        start:
          type: string
          description: ISO 8601 UTC start time.
        end:
          type: string
          description: ISO 8601 UTC end time (omit for running).
        billable:
          type: boolean
          description: Billable.
        description:
          type: string
          description: Free-text.
        project_id:
          type: string
          description: Project ID.
        task_id:
          type: string
          description: Task ID inside the project.
        tag_ids:
          type: array
          description: Array of tag ID strings.
      required:
        - workspace_id
        - start
    operation:
      method: POST
      path: /workspaces/{{params.workspace_id}}/time-entries
      body:
        value:
          start: '{{params.start}}'
          end: '{{params.end}}'
          billable: '{{params.billable}}'
          description: '{{params.description}}'
          projectId: '{{params.project_id}}'
          taskId: '{{params.task_id}}'
          tagIds: '{{params.tag_ids}}'
  - name: clockify_stop_current_entry
    description: Stop the currently running time entry for a user. Sets `end` to the supplied timestamp (default now).
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        user_id:
          type: string
          description: User ID.
        end:
          type: string
          description: ISO 8601 UTC end time.
      required:
        - workspace_id
        - user_id
        - end
    operation:
      method: PATCH
      path: /workspaces/{{params.workspace_id}}/user/{{params.user_id}}/time-entries
      body:
        value:
          end: '{{params.end}}'
  - name: clockify_update_time_entry
    description: Update a time entry's description, project, task, tags, billable status, or time range.
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        time_entry_id:
          type: string
          description: Time entry ID.
        start:
          type: string
          description: New start (ISO 8601 UTC).
        end:
          type: string
          description: New end (ISO 8601 UTC).
        billable:
          type: boolean
          description: Billable.
        description:
          type: string
          description: New description.
        project_id:
          type: string
          description: Move to project.
        task_id:
          type: string
          description: Move to task.
        tag_ids:
          type: array
          description: Replace tags.
      required:
        - workspace_id
        - time_entry_id
        - start
    operation:
      method: PUT
      path: /workspaces/{{params.workspace_id}}/time-entries/{{params.time_entry_id}}
      body:
        value:
          start: '{{params.start}}'
          end: '{{params.end}}'
          billable: '{{params.billable}}'
          description: '{{params.description}}'
          projectId: '{{params.project_id}}'
          taskId: '{{params.task_id}}'
          tagIds: '{{params.tag_ids}}'
  - name: clockify_delete_time_entry
    description: Permanently delete a time entry.
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        time_entry_id:
          type: string
          description: Time entry ID.
      required:
        - workspace_id
        - time_entry_id
    operation:
      method: DELETE
      path: /workspaces/{{params.workspace_id}}/time-entries/{{params.time_entry_id}}
  - name: clockify_detailed_report
    description: 'Detailed report: line-by-line time entries for a workspace over a date range, with totals (time, billable time, earned amount). Served by the Reports API host. Filter/paginate via detailed_filter.'
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        date_range_start:
          type: string
          description: ISO 8601 with millis, e.g. 2026-05-01T00:00:00.000.
        date_range_end:
          type: string
          description: ISO 8601 with millis, e.g. 2026-05-31T23:59:59.999.
        detailed_filter:
          type: object
          description: '{page:1, pageSize:50, sortColumn:''DATE''}. pageSize max 1000.'
        users:
          type: object
          description: 'User filter: {ids:[...], contains:''CONTAINS''}.'
        projects:
          type: object
          description: 'Project filter: {ids:[...], contains:''CONTAINS''}.'
      required:
        - workspace_id
        - date_range_start
        - date_range_end
    operation:
      method: POST
      path: https://reports.api.clockify.me/v1/workspaces/{{params.workspace_id}}/reports/detailed
      body:
        value:
          dateRangeStart: '{{params.date_range_start}}'
          dateRangeEnd: '{{params.date_range_end}}'
          detailedFilter: '{{params.detailed_filter}}'
          users: '{{params.users}}'
          projects: '{{params.projects}}'
  - name: clockify_summary_report
    description: 'Summary report: aggregated time/earnings grouped by one or more dimensions (PROJECT, USER, CLIENT, TASK, TAG, DATE) for a workspace over a date range. Served by the Reports API host.'
    input:
      type: object
      properties:
        workspace_id:
          type: string
          description: Workspace ID.
        date_range_start:
          type: string
          description: ISO 8601 with millis.
        date_range_end:
          type: string
          description: ISO 8601 with millis.
        summary_filter:
          type: object
          description: '{groups:[''PROJECT'',''USER''], sortColumn:''GROUP''}. groups required for grouping.'
        users:
          type: object
          description: 'User filter: {ids:[...], contains:''CONTAINS''}.'
        projects:
          type: object
          description: 'Project filter: {ids:[...], contains:''CONTAINS''}.'
      required:
        - workspace_id
        - date_range_start
        - date_range_end
        - summary_filter
    operation:
      method: POST
      path: https://reports.api.clockify.me/v1/workspaces/{{params.workspace_id}}/reports/summary
      body:
        value:
          dateRangeStart: '{{params.date_range_start}}'
          dateRangeEnd: '{{params.date_range_end}}'
          summaryFilter: '{{params.summary_filter}}'
          users: '{{params.users}}'
          projects: '{{params.projects}}'
