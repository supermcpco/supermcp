# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: mssql
  name: Microsoft SQL Server
  description: 'Query a Microsoft SQL Server database directly: list tables, describe columns and run read-only T-SQL. Supports SQL Server and Windows (NTLM) authentication. Installs read-only.'
  region: intl
  category: database
  icon: mssql
  docsUrl: https://learn.microsoft.com/en-us/sql/t-sql/language-reference
credentials:
  MSSQL_HOST:
    required: true
  MSSQL_PORT:
    required: true
  MSSQL_DATABASE:
    required: true
  MSSQL_USER:
    required: true
  MSSQL_PASSWORD:
    required: true
    secret: true
  MSSQL_DOMAIN:
    required: false
transport:
  type: database
  dsn: mssql://{{env.MSSQL_HOST}}:{{env.MSSQL_PORT}}/{{env.MSSQL_DATABASE}}
  driver: mssql
auth:
  type: database
  username: '{{env.MSSQL_USER}}'
  password: '{{env.MSSQL_PASSWORD}}'
  domain: '{{env.MSSQL_DOMAIN}}'
healthcheck:
  tool: mssql_list_tables
instructions: |
  **Setup**
  1. Create a login and a database user with only `db_datareader`:
     ```sql
     CREATE LOGIN amcp_reader WITH PASSWORD = 'change-me';
     USE sales;
     CREATE USER amcp_reader FOR LOGIN amcp_reader;
     ALTER ROLE db_datareader ADD MEMBER amcp_reader;
     ```
  2. Set `MSSQL_HOST`, `MSSQL_PORT` (1433), `MSSQL_DATABASE`, `MSSQL_USER` and `MSSQL_PASSWORD`.

  **Windows authentication**: set `MSSQL_DOMAIN` as well and the engine switches to NTLM instead of SQL Server auth. Leave it blank for a SQL login.

  **Named instances**: a host of the `SERVER\\INSTANCE` form does not fit a URL. Give the instance's TCP port in `MSSQL_PORT` and the plain hostname in `MSSQL_HOST` — the SQL Browser resolves the name to that port anyway, and naming the port directly removes a moving part.

  **The default schema is `dbo`**, so an unqualified name resolves there. Qualify (`sales.orders`) when the database uses more than one schema.

  **How a database connector behaves**

  - **It installs read-only.** The engine rejects anything that is not a read
    until you flip the switch in the connector's settings. That is a guard rail,
    not a security boundary: give the connection a database role that is itself
    read-only, and the guard rail never has to matter.
  - **Credentials live in the encrypted `authConfig`**, not in the connection
    string. `MSSQL_USER` and `MSSQL_PASSWORD` are stored encrypted and spliced into the
    DSN at call time; the host and database name are stored in the plaintext
    `baseUrl` column.
  - **Results are capped at 1000 rows.** A query that would return more comes
    back truncated with a flag. Aggregate in SQL rather than in the agent.
  - **A statement runs exactly as written.** There is no query rewriting and no
    automatic LIMIT — an unbounded scan on a large table is a real unbounded
    scan on your production database. Say LIMIT.

  **Reachable from where?**

  - On a **hosted supermcp instance** the server must accept connections from the public
    internet, which for a production database usually means it should not. Point
    the connector at a read replica, or self-host supermcp inside the network.
  - **Self-hosted**, add the host to `SSRF_ALLOWED_HOSTS`: the outbound guard
    blocks private address space by default, and `10.0.0.5` is exactly the shape
    it is there to block.
tools:
  - name: mssql_list_tables
    description: List the tables and views in the database with their schema and, where the server tracks it, an approximate row count. Start here — it is the map of what can be queried.
    input:
      type: object
      properties: {}
    operation:
      kind: sql
      statement: SELECT s.name AS table_schema, t.name AS table_name, 'BASE TABLE' AS table_type, p.rows AS approx_rows FROM sys.tables t JOIN sys.schemas s ON s.schema_id = t.schema_id JOIN sys.partitions p ON p.object_id = t.object_id AND p.index_id IN (0,1) ORDER BY s.name, t.name
  - name: mssql_describe_table
    description: 'Describe one table: every column with its data type, nullability and default. Read this before writing a query against a table you have not seen.'
    input:
      type: object
      properties:
        table_name:
          type: string
          description: Table name, without the schema prefix.
      required:
        - table_name
    operation:
      kind: sql
      statement: SELECT column_name, data_type, is_nullable, column_default, character_maximum_length FROM information_schema.columns WHERE table_name = {{params.table_name}} ORDER BY ordinal_position
  - name: mssql_find_columns
    description: Find columns across every table whose name matches a pattern — the fast way to locate where customer e-mail addresses, IBANs or order numbers actually live.
    input:
      type: object
      properties:
        pattern:
          type: string
          description: SQL LIKE pattern matched against the column name, e.g. %email% or %_id.
      required:
        - pattern
    operation:
      kind: sql
      statement: SELECT table_schema, table_name, column_name, data_type FROM information_schema.columns WHERE column_name LIKE {{params.pattern}} ORDER BY table_schema, table_name, column_name
  - name: mssql_query
    description: Run a read-only SQL statement against Microsoft SQL Server and return up to 1000 rows. The statement runs exactly as written — there is no automatic LIMIT, so say LIMIT.
    input:
      type: object
      properties:
        query:
          type: string
          description: A single SQL SELECT statement. Include your own LIMIT; nothing is added for you.
      required:
        - query
    operation:
      kind: sql
      statement: '{{params.query | raw}}'
  - name: mssql_query_examples
    description: 'Show worked example queries for Microsoft SQL Server: how to list schemas, find large tables, inspect indexes and check what is running right now. Costs nothing and touches no data.'
    input:
      type: object
      properties: {}
    operation:
      kind: static
      value: |
        Microsoft SQL Server example queries

        -- The ten largest tables
        SELECT TOP 10 s.name + '.' + t.name AS [table], SUM(p.rows) AS [rows],
               SUM(a.total_pages) * 8 / 1024 AS mb
        FROM sys.tables t
        JOIN sys.schemas s ON s.schema_id = t.schema_id
        JOIN sys.partitions p ON p.object_id = t.object_id AND p.index_id IN (0,1)
        JOIN sys.allocation_units a ON a.container_id = p.partition_id
        GROUP BY s.name, t.name ORDER BY 3 DESC;

        -- Indexes on a table
        SELECT i.name, i.type_desc, i.is_unique,
               STRING_AGG(c.name, ', ') WITHIN GROUP (ORDER BY ic.key_ordinal) AS columns
        FROM sys.indexes i
        JOIN sys.index_columns ic ON ic.object_id = i.object_id AND ic.index_id = i.index_id
        JOIN sys.columns c ON c.object_id = ic.object_id AND c.column_id = ic.column_id
        WHERE i.object_id = OBJECT_ID('dbo.orders')
        GROUP BY i.name, i.type_desc, i.is_unique;

        -- Foreign keys out of a table
        SELECT fk.name, OBJECT_NAME(fk.referenced_object_id) AS references_table
        FROM sys.foreign_keys fk WHERE fk.parent_object_id = OBJECT_ID('dbo.orders');

        -- What is running right now, longest first
        SELECT r.session_id, r.status, r.wait_type,
               DATEDIFF(second, r.start_time, GETDATE()) AS seconds,
               LEFT(t.text, 120) AS query
        FROM sys.dm_exec_requests r
        CROSS APPLY sys.dm_exec_sql_text(r.sql_handle) t
        WHERE r.session_id <> @@SPID ORDER BY seconds DESC;

        -- Columns whose name suggests personal data
        SELECT table_schema, table_name, column_name FROM information_schema.columns
        WHERE column_name LIKE '%email%' OR column_name LIKE '%phone%'
           OR column_name LIKE '%iban%'  OR column_name LIKE '%birth%'
        ORDER BY 1, 2;
