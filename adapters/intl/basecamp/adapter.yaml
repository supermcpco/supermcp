# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: basecamp
  name: Basecamp
  description: 'Drive Basecamp 4 (project & team collaboration) from any AI agent: projects, todo lists, todos, messages, comments, people. 12 tools, OAuth2 Bearer auth.'
  region: intl
  category: project-management
  icon: basecamp
  docsUrl: https://github.com/basecamp/bc3-api
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  BASECAMP_ACCESS_TOKEN:
    required: true
    secret: true
  BASECAMP_ACCOUNT_ID:
    required: true
transport:
  type: http
  baseUrl: https://3.basecampapi.com/{{env.BASECAMP_ACCOUNT_ID}}
auth:
  type: bearer
  token: '{{env.BASECAMP_ACCESS_TOKEN}}'
instructions: |-
  This connector uses the Basecamp 4 API (37signals.com — github.com/basecamp/bc3-api).

  **Setup**:
  1. Register an integration at https://launchpad.37signals.com/integrations.
  2. Implement OAuth2 authorization-code flow with `https://launchpad.37signals.com/authorization` (response includes user's account_id).
  3. Set `BASECAMP_ACCESS_TOKEN` to the obtained access token.
  4. Set `BASECAMP_ACCOUNT_ID` to your Basecamp account ID (a 6-9 digit number — visible in any Basecamp URL or returned by the OAuth identity endpoint).

  **Authentication**: `Authorization: Bearer ${BASECAMP_ACCESS_TOKEN}`.

  **Account-scoped base URL**: every Basecamp account has its own subdomain. The API URL is `https://3.basecampapi.com/${BASECAMP_ACCOUNT_ID}/...`. The adapter substitutes the account ID via env var template.

  **User-Agent header**: Basecamp REQUIRES a meaningful User-Agent header on every request (their support staff need it to identify integrations). The adapter sets `User-Agent: supermcp (https://supermcp.dev)` automatically.

  **Resource model**:
    - **Project** (called 'Basecamp' in the UI) — the top-level container.
    - **Dock** — array of tools enabled on the project (todoset, message_board, schedule, vault, chat, etc.) each with its own URL.
    - **Todoset** → multiple **Todolists** → multiple **Todos**.
    - **Message Board** → multiple **Messages**.
    - **Comments** can be attached to most recordings (todos, messages, etc.).

  **Recordings**: Basecamp's underlying primitive. A todo, message, comment, etc. is all a 'recording' with an `id` and a `type`. Many endpoints accept any recording_id and dispatch by type.

  **Person picker**: assignees are people IDs. List them via `basecamp_get_people` (account-wide) or per-project.

  **Status of completed todos**: completed=true sends a Boolean — not a separate endpoint. To 'reopen' a todo, send completed=false on the same todo.

  **Pagination**: 50 per page typical, Link header gives `next` URL. Some endpoints return all in one shot.

  **Rate limits**: 50 req per 10 sec per account. On 429 honor Retry-After.

  **Out of scope here**: Hill Charts, automatic check-ins, schedule entries, vault (file upload), Pings (DMs), Chat (Campfire) — all addressable via the API but each have idiosyncratic URLs returned by the Project dock; out of scope for this MVP connector.
tools:
  - name: basecamp_get_my_profile
    description: Return the authenticated user's profile (id, name, email_address, time_zone, avatar_url, can_manage_projects, etc.).
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /my/profile.json
      headers:
        User-Agent: supermcp (https://supermcp.dev)
  - name: basecamp_list_projects
    description: List active projects (Basecamps) the user has access to. Each project has id, name, description, dock[], purpose ('topic' or 'team').
    input:
      type: object
      properties:
        status:
          type: string
          description: active or archived or trashed.
    operation:
      method: GET
      path: /projects.json
      query:
        status: '{{params.status}}'
      headers:
        User-Agent: supermcp (https://supermcp.dev)
  - name: basecamp_get_project
    description: Fetch a single project with its dock — the array of tools (todoset, message_board, etc.) each with an `id` and `url`. You'll grab the todoset_id and message_board_id from here.
    input:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID.
      required:
        - projectId
    operation:
      method: GET
      path: /projects/{{params.projectId}}.json
      headers:
        User-Agent: supermcp (https://supermcp.dev)
  - name: basecamp_list_todolists
    description: List todolists within a project's todoset. Get the todoset_id from basecamp_get_project's dock[type=todoset].id.
    input:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID.
        todosetId:
          type: string
          description: Todoset ID (from project dock).
      required:
        - projectId
        - todosetId
    operation:
      method: GET
      path: /buckets/{{params.projectId}}/todosets/{{params.todosetId}}/todolists.json
      headers:
        User-Agent: supermcp (https://supermcp.dev)
  - name: basecamp_list_todos
    description: List todos in a todolist. Pass status=completed to see done items, archived to see archived.
    input:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID.
        todolistId:
          type: string
          description: Todolist ID.
        status:
          type: string
          description: completed or archived. Omit for active.
      required:
        - projectId
        - todolistId
    operation:
      method: GET
      path: /buckets/{{params.projectId}}/todolists/{{params.todolistId}}/todos.json
      query:
        status: '{{params.status}}'
      headers:
        User-Agent: supermcp (https://supermcp.dev)
  - name: basecamp_create_todo
    description: 'Create a todo in a todolist. Required: content. Assignees + notify are arrays of person IDs.'
    input:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID.
        todolistId:
          type: string
          description: Todolist ID.
        content:
          type: string
          description: Todo content (title).
        description:
          type: string
          description: Longer description (HTML or rich-text).
        assignee_ids:
          type: array
          description: Array of person IDs to assign.
        completion_subscriber_ids:
          type: array
          description: People to notify on completion.
        notify:
          type: boolean
          description: If true, notify assignees on create.
        due_on:
          type: string
          description: Due date YYYY-MM-DD.
        starts_on:
          type: string
          description: Start date YYYY-MM-DD.
      required:
        - projectId
        - todolistId
        - content
    operation:
      method: POST
      path: /buckets/{{params.projectId}}/todolists/{{params.todolistId}}/todos.json
      headers:
        User-Agent: supermcp (https://supermcp.dev)
      body:
        value:
          content: '{{params.content}}'
          description: '{{params.description}}'
          assignee_ids: '{{params.assignee_ids}}'
          completion_subscriber_ids: '{{params.completion_subscriber_ids}}'
          notify: '{{params.notify}}'
          due_on: '{{params.due_on}}'
          starts_on: '{{params.starts_on}}'
  - name: basecamp_complete_todo
    description: Mark a todo as completed. Use basecamp_uncomplete_todo to reopen.
    input:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID.
        todoId:
          type: string
          description: Todo ID.
      required:
        - projectId
        - todoId
    operation:
      method: POST
      path: /buckets/{{params.projectId}}/todos/{{params.todoId}}/completion.json
      headers:
        User-Agent: supermcp (https://supermcp.dev)
  - name: basecamp_uncomplete_todo
    description: Reopen a completed todo.
    input:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID.
        todoId:
          type: string
          description: Todo ID.
      required:
        - projectId
        - todoId
    operation:
      method: DELETE
      path: /buckets/{{params.projectId}}/todos/{{params.todoId}}/completion.json
      headers:
        User-Agent: supermcp (https://supermcp.dev)
  - name: basecamp_list_messages
    description: List messages on the project's message board. Get the message_board_id from basecamp_get_project's dock[type=message_board].id.
    input:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID.
        messageBoardId:
          type: string
          description: Message Board ID.
      required:
        - projectId
        - messageBoardId
    operation:
      method: GET
      path: /buckets/{{params.projectId}}/message_boards/{{params.messageBoardId}}/messages.json
      headers:
        User-Agent: supermcp (https://supermcp.dev)
  - name: basecamp_post_message
    description: Post a new message on the project's message board.
    input:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID.
        messageBoardId:
          type: string
          description: Message Board ID.
        subject:
          type: string
          description: Message subject (title).
        content:
          type: string
          description: Message body (HTML/rich-text).
        status:
          type: string
          description: active (default) or draft.
        category_id:
          type: integer
          description: Optional message category ID.
        subscriptions:
          type: array
          description: Array of person IDs to subscribe to replies.
      required:
        - projectId
        - messageBoardId
        - subject
        - content
    operation:
      method: POST
      path: /buckets/{{params.projectId}}/message_boards/{{params.messageBoardId}}/messages.json
      headers:
        User-Agent: supermcp (https://supermcp.dev)
      body:
        value:
          subject: '{{params.subject}}'
          content: '{{params.content}}'
          status: '{{params.status}}'
          category_id: '{{params.category_id}}'
          subscriptions: '{{params.subscriptions}}'
  - name: basecamp_add_comment
    description: Add a comment to a recording (todo, message, document, etc.). recordingId is the ID of whatever you're commenting on.
    input:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID.
        recordingId:
          type: string
          description: ID of the recording to comment on.
        content:
          type: string
          description: Comment body (HTML/rich-text).
      required:
        - projectId
        - recordingId
        - content
    operation:
      method: POST
      path: /buckets/{{params.projectId}}/recordings/{{params.recordingId}}/comments.json
      headers:
        User-Agent: supermcp (https://supermcp.dev)
      body:
        value:
          content: '{{params.content}}'
  - name: basecamp_get_people
    description: List all people in the Basecamp account. Returns id, name, email_address, time_zone, can_manage_projects, can_manage_people.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /people.json
      headers:
        User-Agent: supermcp (https://supermcp.dev)
