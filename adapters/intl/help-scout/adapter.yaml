# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: help-scout
  name: Help Scout
  description: 'Drive Help Scout (shared inbox + helpdesk) from any AI agent: conversations, customers, mailboxes, tags, threads. 13 tools, OAuth2 client_credentials auth (auto-refreshed).'
  region: intl
  category: support
  icon: helpscout
  docsUrl: https://developer.helpscout.com/mailbox-api/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  HELPSCOUT_CLIENT_ID:
    required: true
  HELPSCOUT_CLIENT_SECRET:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.helpscout.net/v2
auth:
  type: oauth2
  grant: client_credentials
  clientId: '{{env.HELPSCOUT_CLIENT_ID}}'
  clientSecret: '{{env.HELPSCOUT_CLIENT_SECRET}}'
  tokenUrl: https://api.helpscout.net/v2/oauth2/token
instructions: |-
  This connector uses the Help Scout Mailbox API v2 (developer.helpscout.com/mailbox-api). The Mailbox API is OAuth2-only — there are no Personal Access Tokens (those belong to the separate Docs API).

  **Setup (one-off)**:
  1. Sign in to Help Scout. Click your **avatar (top-right)** → **Your Profile** → **My Apps** → **Create App**.
  2. Pick any App Name (e.g. "supermcp") and a Redirection URL (placeholder is fine for client_credentials — e.g. `https://supermcp.dev/oauth/callback`). Copy the generated **App ID** and **App Secret**.
  3. Set the two env vars below to those values.

  **Token lifecycle**: the engine performs the OAuth2 `client_credentials` grant against `https://api.helpscout.net/v2/oauth2/token` and caches the access token. Help Scout tokens expire after 48h; the engine refreshes proactively 5 min before expiry — no manual rotation needed.

  **Authentication**: every API call sends `Authorization: Bearer <auto-issued access_token>`.

  **Conversations are central**: Help Scout calls tickets 'conversations'. They live in mailboxes. Each has customer (the requester), assignee, status (active/pending/closed/spam), threads (replies/notes).

  **Thread types**: customer (inbound from customer), reply (outbound public), note (internal), forward (forwarded by agent), phone (logged call), chat (live-chat).

  **Status values**: active, pending (snoozed), closed, spam, open (legacy). Use 'closed' to resolve.

  **HAL+JSON**: responses follow the HAL spec — `_embedded` contains nested collections, `_links` for navigation. Pagination via `?page=N&size=M` (max 50).

  **Custom fields**: each mailbox has its own custom fields. Set them via `customFields` array in conversation create/update.

  **Rate limits**: 400 req/min per app. On 429 back off.

  **Out of scope here**: Docs (separate Help Scout Docs API, uses API key + HTTP Basic), Beacon, Reports analytics endpoints, webhooks management.
tools:
  - name: help_scout_list_mailboxes
    description: List mailboxes (shared inboxes). Each has id, name, slug, email, createdAt.
    input:
      type: object
      properties:
        page:
          type: integer
          description: Page (1-based).
        size:
          type: integer
          description: Per page (default 10, max 50).
    operation:
      method: GET
      path: /mailboxes
      query:
        page: '{{params.page}}'
        size: '{{params.size}}'
  - name: help_scout_list_conversations
    description: List conversations with filters.
    input:
      type: object
      properties:
        mailbox:
          type: integer
          description: Filter by mailbox ID.
        folder:
          type: integer
          description: Filter by folder ID (mailbox sub-folders).
        status:
          type: string
          description: active, pending, closed, spam, open, all.
        tag:
          type: string
          description: Comma-separated tag names.
        assigned_to:
          type: integer
          description: Assignee user ID.
        modifiedSince:
          type: string
          description: ISO 8601 — only conversations modified after.
        embed:
          type: string
          description: threads — include threads inline (saves N+1).
        query:
          type: string
          description: Search query (Help Scout supports advanced syntax like 'subject:foo' AND 'body:bar').
        sortField:
          type: string
          description: createdAt, customerEmail, customerName, status, subject, modifiedAt, etc.
        sortOrder:
          type: string
          description: asc or desc.
        page:
          type: integer
          description: Page.
        size:
          type: integer
          description: Per page (max 50).
    operation:
      method: GET
      path: /conversations
      query:
        mailbox: '{{params.mailbox}}'
        folder: '{{params.folder}}'
        status: '{{params.status}}'
        tag: '{{params.tag}}'
        assigned_to: '{{params.assigned_to}}'
        modifiedSince: '{{params.modifiedSince}}'
        embed: '{{params.embed}}'
        query: '{{params.query}}'
        sortField: '{{params.sortField}}'
        sortOrder: '{{params.sortOrder}}'
        page: '{{params.page}}'
        size: '{{params.size}}'
  - name: help_scout_get_conversation
    description: Fetch a single conversation with full details. Pass embed=threads to also fetch the thread history.
    input:
      type: object
      properties:
        conversationId:
          type: integer
          description: Conversation ID.
        embed:
          type: string
          description: threads to include the conversation history.
      required:
        - conversationId
    operation:
      method: GET
      path: /conversations/{{params.conversationId}}
      query:
        embed: '{{params.embed}}'
  - name: help_scout_create_conversation
    description: 'Create a new conversation (ticket). Required: subject + customer (id OR email) + mailboxId + status + type + threads (at least one initial thread).'
    input:
      type: object
      properties:
        subject:
          type: string
          description: Conversation subject.
        customer:
          type: object
          description: '{id?:N, email?:''a@b''} — at least one required.'
        mailboxId:
          type: integer
          description: Target mailbox ID.
        type:
          type: string
          description: email, chat, phone.
        status:
          type: string
          description: active, pending, closed.
        threads:
          type: array
          description: 'Array of thread objects: [{type:''customer''|''reply''|''note'', text:''...'', customer?:{...}, user?:N}]. Must have at least 1.'
        assignTo:
          type: integer
          description: User ID to assign.
        tags:
          type: array
          description: Tag name strings.
        fields:
          type: array
          description: 'Custom fields: [{id:N, value:''X''}].'
      required:
        - subject
        - customer
        - mailboxId
        - type
        - status
        - threads
    operation:
      method: POST
      path: /conversations
      body:
        value:
          subject: '{{params.subject}}'
          customer: '{{params.customer}}'
          mailboxId: '{{params.mailboxId}}'
          type: '{{params.type}}'
          status: '{{params.status}}'
          threads: '{{params.threads}}'
          assignTo: '{{params.assignTo}}'
          tags: '{{params.tags}}'
          fields: '{{params.fields}}'
  - name: help_scout_update_conversation_status
    description: Change conversation status (close, reopen, snooze). Uses JSON Patch semantics.
    input:
      type: object
      properties:
        conversationId:
          type: integer
          description: Conversation ID.
        op:
          type: string
          description: replace.
        path:
          type: string
          description: /status.
        value:
          type: string
          description: active, pending, closed, spam.
      required:
        - conversationId
        - op
        - path
        - value
    operation:
      method: PATCH
      path: /conversations/{{params.conversationId}}
      body:
        value:
          op: '{{params.op}}'
          path: '{{params.path}}'
          value: '{{params.value}}'
  - name: help_scout_add_reply
    description: Add a public reply (emails the customer) to a conversation.
    input:
      type: object
      properties:
        conversationId:
          type: integer
          description: Conversation ID.
        text:
          type: string
          description: Reply body (HTML supported).
        user:
          type: integer
          description: User ID sending the reply.
        cc:
          type: array
          description: CC email addresses.
        bcc:
          type: array
          description: BCC email addresses.
        attachments:
          type: array
          description: Attachment IDs (must upload first).
      required:
        - conversationId
        - text
    operation:
      method: POST
      path: /conversations/{{params.conversationId}}/reply
      body:
        value:
          text: '{{params.text}}'
          user: '{{params.user}}'
          cc: '{{params.cc}}'
          bcc: '{{params.bcc}}'
          attachments: '{{params.attachments}}'
  - name: help_scout_add_note
    description: Add an internal note (not visible to customer).
    input:
      type: object
      properties:
        conversationId:
          type: integer
          description: Conversation ID.
        text:
          type: string
          description: Note body.
        user:
          type: integer
          description: User ID.
      required:
        - conversationId
        - text
    operation:
      method: POST
      path: /conversations/{{params.conversationId}}/notes
      body:
        value:
          text: '{{params.text}}'
          user: '{{params.user}}'
  - name: help_scout_list_conversation_threads
    description: List all threads (replies, notes, status changes) in a conversation.
    input:
      type: object
      properties:
        conversationId:
          type: integer
          description: Conversation ID.
        page:
          type: integer
          description: Page.
      required:
        - conversationId
    operation:
      method: GET
      path: /conversations/{{params.conversationId}}/threads
      query:
        page: '{{params.page}}'
  - name: help_scout_list_customers
    description: List customers (people the business interacts with).
    input:
      type: object
      properties:
        firstName:
          type: string
          description: Filter by first name.
        lastName:
          type: string
          description: Filter by last name.
        email:
          type: string
          description: Filter by email exact-match.
        modifiedSince:
          type: string
          description: ISO 8601.
        query:
          type: string
          description: Search query.
        page:
          type: integer
          description: Page.
        size:
          type: integer
          description: Per page (max 50).
    operation:
      method: GET
      path: /customers
      query:
        firstName: '{{params.firstName}}'
        lastName: '{{params.lastName}}'
        email: '{{params.email}}'
        modifiedSince: '{{params.modifiedSince}}'
        query: '{{params.query}}'
        page: '{{params.page}}'
        size: '{{params.size}}'
  - name: help_scout_get_customer
    description: Fetch a customer's full profile including emails[], phones[], chats[], social_profiles[], address.
    input:
      type: object
      properties:
        customerId:
          type: integer
          description: Customer ID.
      required:
        - customerId
    operation:
      method: GET
      path: /customers/{{params.customerId}}
  - name: help_scout_create_customer
    description: 'Create a customer. Required: firstName or lastName.'
    input:
      type: object
      properties:
        firstName:
          type: string
          description: First name.
        lastName:
          type: string
          description: Last name.
        emails:
          type: array
          description: '[{type:''work''|''home''|''other'', value:''a@b''}].'
        phones:
          type: array
          description: '[{type, value}].'
        address:
          type: object
          description: '{city, country, lines:[], postalCode, state}.'
        organization:
          type: string
          description: Company name.
        jobTitle:
          type: string
          description: Job title.
        background:
          type: string
          description: Notes about the customer.
    operation:
      method: POST
      path: /customers
      body:
        value:
          firstName: '{{params.firstName}}'
          lastName: '{{params.lastName}}'
          emails: '{{params.emails}}'
          phones: '{{params.phones}}'
          address: '{{params.address}}'
          organization: '{{params.organization}}'
          jobTitle: '{{params.jobTitle}}'
          background: '{{params.background}}'
  - name: help_scout_list_tags
    description: List tags on the account.
    input:
      type: object
      properties:
        page:
          type: integer
          description: Page.
        size:
          type: integer
          description: Per page.
    operation:
      method: GET
      path: /tags
      query:
        page: '{{params.page}}'
        size: '{{params.size}}'
  - name: help_scout_list_users
    description: List Help Scout agents.
    input:
      type: object
      properties:
        email:
          type: string
          description: Filter by email.
        mailbox:
          type: integer
          description: Filter to users in this mailbox.
        page:
          type: integer
          description: Page.
        size:
          type: integer
          description: Per page.
    operation:
      method: GET
      path: /users
      query:
        email: '{{params.email}}'
        mailbox: '{{params.mailbox}}'
        page: '{{params.page}}'
        size: '{{params.size}}'
