# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: postgres
  name: PostgreSQL
  description: 'Query a PostgreSQL database directly: list tables, describe columns and run read-only SQL. Installs read-only; credentials are held encrypted rather than in the connection string.'
  region: intl
  category: database
  icon: postgres
  docsUrl: https://www.postgresql.org/docs/current/
credentials:
  POSTGRES_HOST:
    required: true
  POSTGRES_PORT:
    required: true
  POSTGRES_DATABASE:
    required: true
  POSTGRES_USER:
    required: true
  POSTGRES_PASSWORD:
    required: true
    secret: true
transport:
  type: database
  dsn: postgres://{{env.POSTGRES_HOST}}:{{env.POSTGRES_PORT}}/{{env.POSTGRES_DATABASE}}
  driver: postgres
auth:
  type: database
  username: '{{env.POSTGRES_USER}}'
  password: '{{env.POSTGRES_PASSWORD}}'
healthcheck:
  tool: postgres_list_tables
instructions: |
  **Setup**
  1. Create a dedicated role for the agent and grant it only what it needs:
     ```sql
     CREATE ROLE amcp_reader LOGIN PASSWORD 'change-me';
     GRANT CONNECT ON DATABASE sales TO amcp_reader;
     GRANT USAGE ON SCHEMA public TO amcp_reader;
     GRANT SELECT ON ALL TABLES IN SCHEMA public TO amcp_reader;
     ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO amcp_reader;
     ```
     The last line matters: without it, tables created tomorrow are invisible.
  2. Set `POSTGRES_HOST`, `POSTGRES_PORT` (5432), `POSTGRES_DATABASE`, `POSTGRES_USER` and `POSTGRES_PASSWORD`.

  **`search_path` is not set for you.** Unqualified table names resolve against the role's default search path, which on a fresh role is `"$user", public`. Schema-qualify (`analytics.orders`) when in doubt.

  **How a database connector behaves**

  - **It installs read-only.** The engine rejects anything that is not a read
    until you flip the switch in the connector's settings. That is a guard rail,
    not a security boundary: give the connection a database role that is itself
    read-only, and the guard rail never has to matter.
  - **Credentials live in the encrypted `authConfig`**, not in the connection
    string. `POSTGRES_USER` and `POSTGRES_PASSWORD` are stored encrypted and spliced into the
    DSN at call time; the host and database name are stored in the plaintext
    `baseUrl` column.
  - **Results are capped at 1000 rows.** A query that would return more comes
    back truncated with a flag. Aggregate in SQL rather than in the agent.
  - **A statement runs exactly as written.** There is no query rewriting and no
    automatic LIMIT — an unbounded scan on a large table is a real unbounded
    scan on your production database. Say LIMIT.

  **Reachable from where?**

  - On a **hosted supermcp instance** the server must accept connections from the public
    internet, which for a production database usually means it should not. Point
    the connector at a read replica, or self-host supermcp inside the network.
  - **Self-hosted**, add the host to `SSRF_ALLOWED_HOSTS`: the outbound guard
    blocks private address space by default, and `10.0.0.5` is exactly the shape
    it is there to block.

  **Supersedes the marketing site's `postgres` placeholder**, which advertised a `POSTGRES_URL` connection string. This adapter takes host, port and database separately and keeps the password encrypted, which the single-URL form could not do.
tools:
  - name: postgres_list_tables
    description: List the tables and views in the database with their schema and, where the server tracks it, an approximate row count. Start here — it is the map of what can be queried.
    input:
      type: object
      properties: {}
    operation:
      kind: sql
      statement: SELECT table_schema, table_name, table_type FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema') ORDER BY table_schema, table_name
  - name: postgres_describe_table
    description: 'Describe one table: every column with its data type, nullability and default. Read this before writing a query against a table you have not seen.'
    input:
      type: object
      properties:
        table_name:
          type: string
          description: Table name, without the schema prefix.
      required:
        - table_name
    operation:
      kind: sql
      statement: SELECT column_name, data_type, is_nullable, column_default, character_maximum_length FROM information_schema.columns WHERE table_name = {{params.table_name}} ORDER BY ordinal_position
  - name: postgres_find_columns
    description: Find columns across every table whose name matches a pattern — the fast way to locate where customer e-mail addresses, IBANs or order numbers actually live.
    input:
      type: object
      properties:
        pattern:
          type: string
          description: SQL LIKE pattern matched against the column name, e.g. %email% or %_id.
      required:
        - pattern
    operation:
      kind: sql
      statement: SELECT table_schema, table_name, column_name, data_type FROM information_schema.columns WHERE column_name LIKE {{params.pattern}} AND table_schema NOT IN ('pg_catalog','information_schema') ORDER BY table_schema, table_name, column_name
  - name: postgres_query
    description: Run a read-only SQL statement against PostgreSQL and return up to 1000 rows. The statement runs exactly as written — there is no automatic LIMIT, so say LIMIT.
    input:
      type: object
      properties:
        query:
          type: string
          description: A single SQL SELECT statement. Include your own LIMIT; nothing is added for you.
      required:
        - query
    operation:
      kind: sql
      statement: '{{params.query | raw}}'
  - name: postgres_query_examples
    description: 'Show worked example queries for PostgreSQL: how to list schemas, find large tables, inspect indexes and check what is running right now. Costs nothing and touches no data.'
    input:
      type: object
      properties: {}
    operation:
      kind: static
      value: |
        PostgreSQL example queries

        -- Every schema, and how big it is
        SELECT schemaname, COUNT(*) AS tables,
               pg_size_pretty(SUM(pg_total_relation_size(schemaname||'.'||tablename))) AS size
        FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema')
        GROUP BY schemaname ORDER BY 3 DESC;

        -- The ten largest tables
        SELECT schemaname||'.'||relname AS table, n_live_tup AS approx_rows,
               pg_size_pretty(pg_total_relation_size(relid)) AS total_size
        FROM pg_stat_user_tables ORDER BY pg_total_relation_size(relid) DESC LIMIT 10;

        -- Indexes on a table
        SELECT indexname, indexdef FROM pg_indexes WHERE tablename = 'orders';

        -- Foreign keys out of a table
        SELECT conname, pg_get_constraintdef(oid) FROM pg_constraint
        WHERE conrelid = 'public.orders'::regclass AND contype = 'f';

        -- What is running right now, longest first
        SELECT pid, now() - query_start AS runtime, state, left(query, 120) AS query
        FROM pg_stat_activity WHERE state <> 'idle' ORDER BY runtime DESC;

        -- Columns whose name suggests personal data
        SELECT table_schema, table_name, column_name FROM information_schema.columns
        WHERE column_name ~* '(email|phone|iban|birth|passwor|ssn|tax)'
          AND table_schema NOT IN ('pg_catalog','information_schema')
        ORDER BY 1, 2;
