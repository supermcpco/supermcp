# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: proxmox
  name: Proxmox VE
  description: 'Proxmox Virtual Environment: cluster nodes, virtual machines and containers with their status and resource usage, storage, backup tasks and the task log. REST API with an API token, read-only by construction.'
  region: intl
  category: infrastructure
  icon: proxmox
  docsUrl: https://pve.proxmox.com/pve-docs/api-viewer/
credentials:
  PROXMOX_URL:
    required: true
  PROXMOX_TOKEN_ID:
    required: true
    secret: true
  PROXMOX_TOKEN_SECRET:
    required: true
    secret: true
transport:
  type: http
  baseUrl: '{{env.PROXMOX_URL}}/api2/json'
  headers:
    Accept: application/json
auth:
  type: apiKey
  in: header
  name: Authorization
  value: PVEAPIToken={{env.PROXMOX_TOKEN_ID}}={{env.PROXMOX_TOKEN_SECRET}}
healthcheck:
  tool: proxmox_get_version
  http:
    method: GET
    path: /version
instructions: |
  **Use an API token, not a password.**
  1. In the Proxmox web UI go to **Datacenter → Permissions → API Tokens** and add a token for a user — e.g. `readonly@pve` with token id `amcp`. Proxmox shows the secret once.
  2. Leave **Privilege Separation** ticked and grant the token the `PVEAuditor` role at path `/`. PVEAuditor is read-everything, change-nothing, which is exactly what this adapter needs and all it can do.
  3. Set `PROXMOX_URL` to `https://your-host:8006`, `PROXMOX_TOKEN_ID` to the full `user@realm!tokenid` string, and `PROXMOX_TOKEN_SECRET` to the secret.

  **The Authorization header is `PVEAPIToken=user@realm!tokenid=secret`** — Proxmox's own scheme, with the whole triple in one header value. The adapter assembles it; a space in the wrong place is the usual cause of a 401.

  **Valid TLS is required, and a fresh Proxmox does not have it.** Proxmox ships a self-signed certificate on port 8006, and this connector will refuse it — there is no trust-anything switch. Put a real certificate on the host (Proxmox has built-in ACME support under **Node → Certificates**) or put it behind a reverse proxy that has one.

  **Node names scope almost everything.** `/nodes/{node}/qemu` lists the VMs on *one* node. `proxmox_list_cluster_resources` is the exception and the better starting point: it returns every VM, container and storage across the whole cluster in one call.

  **VM vs container.** `qemu` is a full virtual machine, `lxc` is a container. They are separate collections with the same shape, and a question about 'all the machines' needs both — or `proxmox_list_cluster_resources`, which covers both.

  **Read-only by design**: no start, no stop, no snapshot, no delete. Restarting production from a chat window should be a decision, not an autocomplete.

  **Self-hosted, which is the thing to plan for.**
  - On a **hosted supermcp instance** the instance must be reachable from the public internet on a real hostname with a valid TLS certificate. A self-signed certificate will fail: the connector offers no trust-anything switch, and a homelab's default certificate is exactly the case that breaks.
  - On an internal host (`pve.intern`, `10.0.0.x`), self-host supermcp on the same network and add that host to `SSRF_ALLOWED_HOSTS`, or the outbound guard refuses the call before it is made.
tools:
  - name: proxmox_get_version
    description: Read the Proxmox VE version and release of the connected node. No parameters and the lightest possible permission — the fastest proof that URL, token id and secret all line up.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /version
  - name: proxmox_list_cluster_resources
    description: List every VM, container, node and storage across the whole cluster in one call, with status, CPU, memory and disk usage. The best starting point — it needs no node name.
    input:
      type: object
      properties:
        type:
          type: string
          description: 'Restrict to one kind: vm, storage, node or sdn.'
    operation:
      method: GET
      path: /cluster/resources
      query:
        type: '{{params.type}}'
  - name: proxmox_list_nodes
    description: List the cluster's nodes with their status, uptime, CPU count and memory. The node names every per-node tool needs.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /nodes
  - name: proxmox_get_node_status
    description: 'Read one node''s live status: load average, CPU and memory usage, root filesystem usage, kernel version and uptime.'
    input:
      type: object
      properties:
        node:
          type: string
          description: Node name, from proxmox_list_nodes.
      required:
        - node
    operation:
      method: GET
      path: /nodes/{{params.node}}/status
  - name: proxmox_list_vms
    description: List the QEMU virtual machines on one node, with their VMID, name, status, CPU and memory allocation and current usage.
    input:
      type: object
      properties:
        node:
          type: string
          description: Node name, from proxmox_list_nodes.
      required:
        - node
    operation:
      method: GET
      path: /nodes/{{params.node}}/qemu
  - name: proxmox_get_vm_status
    description: 'Read one virtual machine''s live status: running or stopped, uptime, CPU and memory usage, disk and network throughput.'
    input:
      type: object
      properties:
        node:
          type: string
          description: Node name.
        vmid:
          type: number
          description: VMID of the virtual machine.
      required:
        - node
        - vmid
    operation:
      method: GET
      path: /nodes/{{params.node}}/qemu/{{params.vmid}}/status/current
  - name: proxmox_get_vm_config
    description: 'Read one virtual machine''s configuration: its disks, network interfaces, boot order, CPU type and the notes recorded against it.'
    input:
      type: object
      properties:
        node:
          type: string
          description: Node name.
        vmid:
          type: number
          description: VMID of the virtual machine.
      required:
        - node
        - vmid
    operation:
      method: GET
      path: /nodes/{{params.node}}/qemu/{{params.vmid}}/config
  - name: proxmox_list_containers
    description: List the LXC containers on one node with their VMID, name, status and resource usage. Containers are a separate collection from VMs.
    input:
      type: object
      properties:
        node:
          type: string
          description: Node name, from proxmox_list_nodes.
      required:
        - node
    operation:
      method: GET
      path: /nodes/{{params.node}}/lxc
  - name: proxmox_list_storage
    description: List the storage configured on one node with each store's type, total and used space, and what content it accepts.
    input:
      type: object
      properties:
        node:
          type: string
          description: Node name.
        content:
          type: string
          description: Restrict to storage accepting one content type, e.g. backup, images, iso.
      required:
        - node
    operation:
      method: GET
      path: /nodes/{{params.node}}/storage
      query:
        content: '{{params.content}}'
  - name: proxmox_list_backups
    description: List the backup archives on one storage, with their VMID, creation time, size and format — the answer to 'when was this last backed up'.
    input:
      type: object
      properties:
        node:
          type: string
          description: Node name.
        storage:
          type: string
          description: Storage id, from proxmox_list_storage.
        vmid:
          type: number
          description: Restrict to one VM's backups.
      required:
        - node
        - storage
    operation:
      method: GET
      path: /nodes/{{params.node}}/storage/{{params.storage}}/content
      query:
        content: backup
        vmid: '{{params.vmid}}'
  - name: proxmox_list_tasks
    description: List recent tasks on one node with their type, VMID, user, start time and exit status — where a failed backup or migration shows up.
    input:
      type: object
      properties:
        node:
          type: string
          description: Node name.
        limit:
          type: number
          description: Maximum tasks to return.
        errors:
          type: number
          description: Pass 1 to list only tasks that failed.
        vmid:
          type: number
          description: Restrict to one VM's tasks.
      required:
        - node
    operation:
      method: GET
      path: /nodes/{{params.node}}/tasks
      query:
        limit: '{{params.limit}}'
        errors: '{{params.errors}}'
        vmid: '{{params.vmid}}'
