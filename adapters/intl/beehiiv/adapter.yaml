# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: beehiiv
  name: beehiiv
  description: 'Drive beehiiv (modern newsletter platform) from any AI agent: publications, posts, subscriptions, segments, custom fields. 11 tools, Bearer auth.'
  region: intl
  category: publishing
  icon: beehiiv
  docsUrl: https://developers.beehiiv.com/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  BEEHIIV_API_KEY:
    required: true
    secret: true
  BEEHIIV_PUBLICATION_ID:
    required: true
transport:
  type: http
  baseUrl: https://api.beehiiv.com/v2/publications/{{env.BEEHIIV_PUBLICATION_ID}}
auth:
  type: bearer
  token: '{{env.BEEHIIV_API_KEY}}'
instructions: |-
  This connector uses the beehiiv API v2 (developers.beehiiv.com).

  **Setup**:
  1. Sign in to https://app.beehiiv.com → bottom-left avatar → **Settings → Integrations → API → Generate New API key**.
  2. Set the key to `BEEHIIV_API_KEY`.
  3. Note your **Publication ID** — visible in the URL when you're on a publication's dashboard (`/p/pub_XXX/...`). Set `BEEHIIV_PUBLICATION_ID`.

  **Authentication**: `Authorization: Bearer ${BEEHIIV_API_KEY}`.

  **Publication-scoped URL**: most endpoints live under `/publications/{publicationId}/...`. The adapter bakes publication ID into baseUrl.

  **Subscription model**: each subscriber has email, status (active, validating, inactive, pending, needs_attention), tier (free, premium), subscription_premium_tier_names[], referring_site, utm_source, utm_medium, utm_campaign, custom_fields[].

  **Posts**: each post (newsletter issue) has id, title, subtitle, slug, status (draft/confirmed/archived/scheduled), audience (free/premium/all), platform (web/email/both), web_url, content (HTML).

  **Pagination**: `?limit=N&page=M` (max 100).

  **Out of scope here**: payments/premium-tier management, ads, segments-builder, automation journeys.
tools:
  - name: beehiiv_get_publication
    description: Get the publication metadata (name, organization_name, referral_program_enabled, created).
    input:
      type: object
      properties: {}
    operation:
      method: GET
  - name: beehiiv_list_posts
    description: List posts (newsletter issues). Filter by status / audience / platform.
    input:
      type: object
      properties:
        expand:
          type: string
          description: 'Comma-separated: free_email_click_count, free_email_open_count, free_web_view_count, premium_email_click_count, etc.'
        audience:
          type: string
          description: free, premium, all.
        platform:
          type: string
          description: web, email, both, all.
        status:
          type: string
          description: draft, confirmed, archived, scheduled.
        content_tags:
          type: string
          description: Comma-separated tag names.
        limit:
          type: integer
          description: Per page (max 100).
        page:
          type: integer
          description: Page.
        order_by:
          type: string
          description: created, publish_date, displayed_date.
        direction:
          type: string
          description: asc or desc.
    operation:
      method: GET
      path: /posts
      query:
        expand[]: '{{params.expand}}'
        audience: '{{params.audience}}'
        platform: '{{params.platform}}'
        status: '{{params.status}}'
        content_tags[]: '{{params.content_tags}}'
        limit: '{{params.limit}}'
        page: '{{params.page}}'
        order_by: '{{params.order_by}}'
        direction: '{{params.direction}}'
  - name: beehiiv_get_post
    description: Fetch a single post with full content.
    input:
      type: object
      properties:
        postId:
          type: string
          description: Post ID.
        expand:
          type: string
          description: Comma-separated expansions.
      required:
        - postId
    operation:
      method: GET
      path: /posts/{{params.postId}}
      query:
        expand[]: '{{params.expand}}'
  - name: beehiiv_list_subscriptions
    description: List subscribers with filters.
    input:
      type: object
      properties:
        email:
          type: string
          description: Filter by exact email.
        status:
          type: string
          description: active, validating, inactive, pending, needs_attention.
        tier:
          type: string
          description: free, premium.
        limit:
          type: integer
          description: Per page.
        page:
          type: integer
          description: Page.
        order_by:
          type: string
          description: created, email.
        direction:
          type: string
          description: asc or desc.
    operation:
      method: GET
      path: /subscriptions
      query:
        email: '{{params.email}}'
        status: '{{params.status}}'
        tier: '{{params.tier}}'
        limit: '{{params.limit}}'
        page: '{{params.page}}'
        order_by: '{{params.order_by}}'
        direction: '{{params.direction}}'
  - name: beehiiv_get_subscription
    description: Fetch a subscriber by ID or email.
    input:
      type: object
      properties:
        identifier:
          type: string
          description: Subscription ID OR URL-encoded email.
      required:
        - identifier
    operation:
      method: GET
      path: /subscriptions/{{params.identifier}}
  - name: beehiiv_create_subscription
    description: Create a subscription (subscribe an email). Idempotent — re-subscribing an existing email returns the existing record.
    input:
      type: object
      properties:
        email:
          type: string
          description: Subscriber email.
        reactivate_existing:
          type: boolean
          description: If true, reactivate inactive subscriber.
        send_welcome_email:
          type: boolean
          description: If true, trigger welcome email.
        utm_source:
          type: string
          description: Attribution.
        utm_medium:
          type: string
          description: Attribution.
        utm_campaign:
          type: string
          description: Attribution.
        referring_site:
          type: string
          description: Referring URL.
        custom_fields:
          type: array
          description: '[{name, value}] — custom field overrides.'
      required:
        - email
    operation:
      method: POST
      path: /subscriptions
      body:
        value:
          email: '{{params.email}}'
          reactivate_existing: '{{params.reactivate_existing}}'
          send_welcome_email: '{{params.send_welcome_email}}'
          utm_source: '{{params.utm_source}}'
          utm_medium: '{{params.utm_medium}}'
          utm_campaign: '{{params.utm_campaign}}'
          referring_site: '{{params.referring_site}}'
          custom_fields: '{{params.custom_fields}}'
  - name: beehiiv_update_subscription
    description: Update a subscriber (custom fields, UTM tags, tier).
    input:
      type: object
      properties:
        subscriptionId:
          type: string
          description: Subscription ID.
        tier:
          type: string
          description: free, premium.
        stripe_customer_id:
          type: string
          description: Stripe customer link.
        unsubscribe:
          type: boolean
          description: If true, mark unsubscribed.
        custom_fields:
          type: array
          description: '[{name, value}].'
      required:
        - subscriptionId
    operation:
      method: PATCH
      path: /subscriptions/{{params.subscriptionId}}
      body:
        value:
          tier: '{{params.tier}}'
          stripe_customer_id: '{{params.stripe_customer_id}}'
          unsubscribe: '{{params.unsubscribe}}'
          custom_fields: '{{params.custom_fields}}'
  - name: beehiiv_delete_subscription
    description: Permanently delete a subscriber (GDPR friendly).
    input:
      type: object
      properties:
        subscriptionId:
          type: string
          description: Subscription ID.
      required:
        - subscriptionId
    operation:
      method: DELETE
      path: /subscriptions/{{params.subscriptionId}}
  - name: beehiiv_list_segments
    description: List segments (saved subscriber queries).
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Per page.
        page:
          type: integer
          description: Page.
        status:
          type: string
          description: completed, calculating, pending.
    operation:
      method: GET
      path: /segments
      query:
        limit: '{{params.limit}}'
        page: '{{params.page}}'
        status: '{{params.status}}'
  - name: beehiiv_list_custom_fields
    description: List custom fields defined on subscribers.
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Per page.
        page:
          type: integer
          description: Page.
    operation:
      method: GET
      path: /custom_fields
      query:
        limit: '{{params.limit}}'
        page: '{{params.page}}'
  - name: beehiiv_send_test_email
    description: Send a test email of a post to specific addresses. Useful for previewing before scheduling.
    input:
      type: object
      properties:
        postId:
          type: string
          description: Post ID.
        emails:
          type: array
          description: Array of email strings to send to (max 5).
      required:
        - postId
        - emails
    operation:
      method: POST
      path: /posts/{{params.postId}}/test
      body:
        value:
          emails: '{{params.emails}}'
