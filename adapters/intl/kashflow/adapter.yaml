# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: kashflow
  name: KashFlow
  description: Manage KashFlow (UK accounting) customers, suppliers, invoices, receipts, products via SOAP envelope from any AI agent. 8 tools, embedded-auth.
  region: intl
  category: accounting
  icon: kashflow
  docsUrl: https://www.kashflow.com/developers/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  KASHFLOW_USERNAME:
    required: true
  KASHFLOW_PASSWORD:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://securedwebapp.com/api/v2
auth:
  type: none
instructions: |-
  This connector wraps the KashFlow REST API (securedwebapp.com/api).

  **Setup**:
  1. Log into https://securedwebapp.com → **Settings → API → Enable API access**.
  2. Note your Username + API password (separate from your login password).
  3. Set `KASHFLOW_USERNAME` and `KASHFLOW_PASSWORD`.

  **Authentication**: KashFlow uses a REST API with username + password in the URL path: `/api/v2/{username}/{password}/<endpoint>`. The adapter substitutes both via runtime envVars — the credentials never appear in query string or body.

  **API surface**: KashFlow exposes only a slim subset of the SOAP API as REST: customers, suppliers, invoices (CRUD), receipts, products. For features missing here (nominal codes, journals, projects) you'd need to call the SOAP endpoint directly — out of scope.

  **Pagination**: most list endpoints return a max of 100; pass `from` / `to` IDs to page.

  **Rate limits**: 60 req/min per account. 429 → back off 1s.

  **Out of scope here**: payroll, CIS, mileage logs, batch journals.
tools:
  - name: kashflow_list_customers
    description: List customers.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /{{env.KASHFLOW_USERNAME}}/{{env.KASHFLOW_PASSWORD}}/customers
  - name: kashflow_get_customer
    description: Get one customer by KashFlow CustomerID.
    input:
      type: object
      properties:
        customer_id:
          type: integer
          description: CustomerID.
      required:
        - customer_id
    operation:
      method: GET
      path: /{{env.KASHFLOW_USERNAME}}/{{env.KASHFLOW_PASSWORD}}/customers/{{params.customer_id}}
  - name: kashflow_create_customer
    description: Create a customer.
    input:
      type: object
      properties:
        Name:
          type: string
          description: Display name.
        Code:
          type: string
          description: Internal code.
        Email:
          type: string
          description: Email.
        Telephone:
          type: string
          description: Phone.
        Address1:
          type: string
          description: Address line 1.
        Address2:
          type: string
          description: Address line 2.
        Address3:
          type: string
          description: Town.
        Address4:
          type: string
          description: County.
        Postcode:
          type: string
          description: Postcode.
        CountryCode:
          type: string
          description: ISO 3166-1 alpha-2.
      required:
        - Name
    operation:
      method: POST
      path: /{{env.KASHFLOW_USERNAME}}/{{env.KASHFLOW_PASSWORD}}/customers
      body:
        value:
          Name: '{{params.Name}}'
          Code: '{{params.Code}}'
          Email: '{{params.Email}}'
          Telephone: '{{params.Telephone}}'
          Address1: '{{params.Address1}}'
          Address2: '{{params.Address2}}'
          Address3: '{{params.Address3}}'
          Address4: '{{params.Address4}}'
          Postcode: '{{params.Postcode}}'
          CountryCode: '{{params.CountryCode}}'
  - name: kashflow_list_suppliers
    description: List suppliers.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /{{env.KASHFLOW_USERNAME}}/{{env.KASHFLOW_PASSWORD}}/suppliers
  - name: kashflow_list_invoices
    description: List sales invoices.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /{{env.KASHFLOW_USERNAME}}/{{env.KASHFLOW_PASSWORD}}/invoices
  - name: kashflow_get_invoice
    description: Get a single invoice with line items.
    input:
      type: object
      properties:
        invoice_id:
          type: integer
          description: InvoiceID.
      required:
        - invoice_id
    operation:
      method: GET
      path: /{{env.KASHFLOW_USERNAME}}/{{env.KASHFLOW_PASSWORD}}/invoices/{{params.invoice_id}}
  - name: kashflow_create_invoice
    description: Create a sales invoice. `Lines` is an array of {Quantity, Description, Rate, ChargeType, VatRate, VatAmount, ProductID}.
    input:
      type: object
      properties:
        CustomerID:
          type: integer
          description: Customer ID.
        InvoiceDate:
          type: string
          description: ISO 8601 date.
        DueDate:
          type: string
          description: ISO 8601 date.
        InvoiceNumber:
          type: integer
          description: Invoice number (set 0 to auto-allocate).
        Lines:
          type: array
          description: Line items.
        CustomerReference:
          type: string
          description: Customer PO ref.
        ProjectID:
          type: integer
          description: Project ID (optional).
      required:
        - CustomerID
        - InvoiceDate
        - Lines
    operation:
      method: POST
      path: /{{env.KASHFLOW_USERNAME}}/{{env.KASHFLOW_PASSWORD}}/invoices
      body:
        value:
          CustomerID: '{{params.CustomerID}}'
          InvoiceDate: '{{params.InvoiceDate}}'
          DueDate: '{{params.DueDate}}'
          InvoiceNumber: '{{params.InvoiceNumber}}'
          Lines: '{{params.Lines}}'
          CustomerReference: '{{params.CustomerReference}}'
          ProjectID: '{{params.ProjectID}}'
  - name: kashflow_list_products
    description: List products / services.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /{{env.KASHFLOW_USERNAME}}/{{env.KASHFLOW_PASSWORD}}/products
