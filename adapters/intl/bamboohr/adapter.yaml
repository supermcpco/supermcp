# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: bamboohr
  name: BambooHR
  description: Manage BambooHR (employees, time-off, custom reports, fields, files) from any AI agent. 9 tools, basic-auth.
  region: intl
  category: hr
  icon: bamboohr
  docsUrl: https://documentation.bamboohr.com/reference/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  BAMBOOHR_SUBDOMAIN:
    required: true
  BAMBOOHR_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.bamboohr.com/api/gateway.php
auth:
  type: basic
  username: '{{env.BAMBOOHR_API_KEY}}'
  password: x
instructions: |-
  This connector wraps the BambooHR REST API v1 (per-subdomain — api.bamboohr.com/api/gateway.php/<subdomain>/v1).

  **Setup**:
  1. Sign in to your BambooHR portal → top-right avatar → **API Keys → Add a new key**.
  2. Note your subdomain (the part before `.bamboohr.com`) and copy the key.
  3. Set `BAMBOOHR_SUBDOMAIN` and `BAMBOOHR_API_KEY`.

  **Authentication**: HTTP Basic — API key as username, literal `x` as password.

  **Path subdomain**: BambooHR's API embeds the subdomain in the URL path. The adapter substitutes via runtime envVar.

  **Custom fields**: pass `fields` as comma-separated field IDs (e.g. `firstName,lastName,workEmail,jobTitle,supervisor,customField4000010`). Without `fields`, only the basic employee profile is returned.

  **JSON response**: set `Accept: application/json` (the adapter does this) — otherwise BambooHR returns XML.

  **Rate limits**: not publicly documented; expect 60 req/min as a soft cap. 429 with `Retry-After`.

  **Out of scope here**: payroll, performance review CRUD, signed-document workflows, the Time Tracking add-on API.
tools:
  - name: bamboohr_list_employees_directory
    description: 'Returns the company directory: every employee''s id, displayName, jobTitle, workEmail, department, division, location, supervisor.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /{{env.BAMBOOHR_SUBDOMAIN}}/v1/employees/directory
      headers:
        Accept: application/json
  - name: bamboohr_get_employee
    description: Get one employee by ID. Pass `fields` (comma-separated) to control what's returned — by default only id+name.
    input:
      type: object
      properties:
        employee_id:
          type: string
          description: Employee ID.
        fields:
          type: string
          description: Comma-separated field IDs.
      required:
        - employee_id
    operation:
      method: GET
      path: /{{env.BAMBOOHR_SUBDOMAIN}}/v1/employees/{{params.employee_id}}
      query:
        fields: '{{params.fields}}'
      headers:
        Accept: application/json
  - name: bamboohr_add_employee
    description: 'Create a new employee. Required: firstName + lastName. Returns the new employee URL in the Location header.'
    input:
      type: object
      properties:
        firstName:
          type: string
          description: First name.
        lastName:
          type: string
          description: Last name.
        jobTitle:
          type: string
          description: Job title.
        department:
          type: string
          description: Department.
        workEmail:
          type: string
          description: Work email.
        hireDate:
          type: string
          description: YYYY-MM-DD.
        supervisorEmail:
          type: string
          description: Supervisor's work email.
        employeeNumber:
          type: string
          description: Internal employee number.
      required:
        - firstName
        - lastName
    operation:
      method: POST
      path: /{{env.BAMBOOHR_SUBDOMAIN}}/v1/employees/
      headers:
        Accept: application/json
      body:
        value:
          firstName: '{{params.firstName}}'
          lastName: '{{params.lastName}}'
          jobTitle: '{{params.jobTitle}}'
          department: '{{params.department}}'
          workEmail: '{{params.workEmail}}'
          hireDate: '{{params.hireDate}}'
          supervisorEmail: '{{params.supervisorEmail}}'
          employeeNumber: '{{params.employeeNumber}}'
  - name: bamboohr_update_employee
    description: Update employee fields.
    input:
      type: object
      properties:
        employee_id:
          type: string
          description: Employee ID.
        fields:
          type: object
          description: Field-id → value map (e.g. {jobTitle:'Sr Engineer', workEmail:'new@x.com'}).
      required:
        - employee_id
        - fields
    operation:
      method: POST
      path: /{{env.BAMBOOHR_SUBDOMAIN}}/v1/employees/{{params.employee_id}}
      headers:
        Accept: application/json
      body:
        value:
          fields: '{{params.fields}}'
  - name: bamboohr_who_is_out
    description: Returns the company-wide who's-out list for a date range.
    input:
      type: object
      properties:
        start:
          type: string
          description: YYYY-MM-DD.
        end:
          type: string
          description: YYYY-MM-DD.
    operation:
      method: GET
      path: /{{env.BAMBOOHR_SUBDOMAIN}}/v1/time_off/whos_out
      query:
        start: '{{params.start}}'
        end: '{{params.end}}'
      headers:
        Accept: application/json
  - name: bamboohr_list_time_off_requests
    description: List time-off requests. Filter by employee, date range, status.
    input:
      type: object
      properties:
        employeeId:
          type: string
          description: Filter by employee.
        start:
          type: string
          description: YYYY-MM-DD.
        end:
          type: string
          description: YYYY-MM-DD.
        status:
          type: string
          description: approved, denied, superceded, requested, canceled.
    operation:
      method: GET
      path: /{{env.BAMBOOHR_SUBDOMAIN}}/v1/time_off/requests/
      query:
        employeeId: '{{params.employeeId}}'
        start: '{{params.start}}'
        end: '{{params.end}}'
        status: '{{params.status}}'
      headers:
        Accept: application/json
  - name: bamboohr_list_meta_fields
    description: List every field defined in this account (built-in + custom). Use to discover field IDs.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /{{env.BAMBOOHR_SUBDOMAIN}}/v1/meta/fields
      headers:
        Accept: application/json
  - name: bamboohr_run_custom_report
    description: Run a pre-defined custom report by its numeric ID. Returns the rows as JSON.
    input:
      type: object
      properties:
        report_id:
          type: integer
          description: Report ID.
      required:
        - report_id
    operation:
      method: GET
      path: /{{env.BAMBOOHR_SUBDOMAIN}}/v1/reports/{{params.report_id}}
      query:
        format: JSON
        fd: "yes"
      headers:
        Accept: application/json
  - name: bamboohr_get_employee_files
    description: List files in an employee's record categorized by section.
    input:
      type: object
      properties:
        employee_id:
          type: string
          description: Employee ID.
      required:
        - employee_id
    operation:
      method: GET
      path: /{{env.BAMBOOHR_SUBDOMAIN}}/v1/employees/{{params.employee_id}}/files/view/
      headers:
        Accept: application/json
