# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: less-annoying-crm
  name: Less Annoying CRM
  description: Manage Less Annoying CRM (contacts, companies, notes, tasks, pipelines) from any AI agent. 8 tools, dual-header API auth.
  region: intl
  category: crm
  icon: less-annoying-crm
  docsUrl: https://www.lessannoyingcrm.com/help/category/63/14/api
  lint:
    allow:
      - description-min-60
      - healthcheck-present
      - tool-name-prefix
credentials:
  LACRM_USER_CODE:
    required: true
  LACRM_API_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.lessannoyingcrm.com
auth:
  type: none
instructions: |-
  This connector wraps the Less Annoying CRM API (api.lessannoyingcrm.com).

  **Setup**:
  1. Sign in to https://www.lessannoyingcrm.com → top-right avatar → **My Account → API → Create new API key**.
  2. Note both the `UserCode` (your LACRM user code) and the `API Token`.
  3. Set `LACRM_USER_CODE` and `LACRM_API_TOKEN`.

  **Authentication**: LACRM uses a POST-only API — every call is `POST /` with `UserCode`, `APIToken`, `Function` and `Parameters` (JSON-stringified) as form fields. The adapter wraps this so each tool exposes a normal interface and hides the unusual envelope.

  **Function dispatch**: every LACRM operation is a single `Function` name (`GetContact`, `CreateContact`, ...). Parameters go inside the `Parameters` form field as JSON.

  **Custom fields**: are returned/posted by their numeric `FieldId`. Use `GetCustomFields` to discover IDs first.

  **Pagination**: `Page` (1-based) on list functions; results are 25 per page (fixed).

  **Rate limits**: 300 req/min per API token. 429 with `Retry-After`.

  **Out of scope here**: workflow automation (LACRM is intentionally minimal), email tracking, calendar sync.
tools:
  - name: lacrm_search_contacts
    description: Search contacts by name, email, phone, etc.
    input:
      type: object
      properties:
        search_term:
          type: string
          description: Free-text search.
        page:
          type: integer
          description: 1-based page.
      required:
        - search_term
    operation:
      method: POST
      path: /
      body:
        encoding: form
        value:
          UserCode: '{{env.LACRM_USER_CODE}}'
          APIToken: '{{env.LACRM_API_TOKEN}}'
          Function: SearchContacts
          Parameters:
            SearchTerm: '{{params.search_term}}'
            Page: '{{params.page}}'
  - name: lacrm_get_contact
    description: Get a single contact by LACRM Contact ID.
    input:
      type: object
      properties:
        contact_id:
          type: string
          description: Contact ID.
      required:
        - contact_id
    operation:
      method: POST
      path: /
      body:
        encoding: form
        value:
          UserCode: '{{env.LACRM_USER_CODE}}'
          APIToken: '{{env.LACRM_API_TOKEN}}'
          Function: GetContact
          Parameters:
            ContactId: '{{params.contact_id}}'
  - name: lacrm_create_contact
    description: Create a contact.
    input:
      type: object
      properties:
        name:
          type: string
          description: Full name.
        company_name:
          type: string
          description: Company name.
        email:
          type: array
          description: Array of {Text, Type:'Work'|'Personal'}.
        phone:
          type: array
          description: Array of {Text, Type}.
        address:
          type: array
          description: Array of {Street, City, State, Zip, Country, Type}.
        background_info:
          type: string
          description: Free-text background.
        custom_fields:
          type: object
          description: Map of CustomFieldId → value.
      required:
        - name
    operation:
      method: POST
      path: /
      body:
        encoding: form
        value:
          UserCode: '{{env.LACRM_USER_CODE}}'
          APIToken: '{{env.LACRM_API_TOKEN}}'
          Function: CreateContact
          Parameters:
            Name: '{{params.name}}'
            CompanyName: '{{params.company_name}}'
            Email: '{{params.email}}'
            Phone: '{{params.phone}}'
            Address: '{{params.address}}'
            BackgroundInfo: '{{params.background_info}}'
            CustomFields: '{{params.custom_fields}}'
  - name: lacrm_update_contact
    description: Update a contact — pass ContactId + only the fields to change.
    input:
      type: object
      properties:
        contact_id:
          type: string
          description: Contact ID.
        name:
          type: string
          description: New name.
        company_name:
          type: string
          description: New company.
        background_info:
          type: string
          description: New background.
        custom_fields:
          type: object
          description: CustomFieldId → value.
      required:
        - contact_id
    operation:
      method: POST
      path: /
      body:
        encoding: form
        value:
          UserCode: '{{env.LACRM_USER_CODE}}'
          APIToken: '{{env.LACRM_API_TOKEN}}'
          Function: EditContact
          Parameters:
            ContactId: '{{params.contact_id}}'
            Name: '{{params.name}}'
            CompanyName: '{{params.company_name}}'
            BackgroundInfo: '{{params.background_info}}'
            CustomFields: '{{params.custom_fields}}'
  - name: lacrm_create_note
    description: Add a note to a contact.
    input:
      type: object
      properties:
        contact_id:
          type: string
          description: Contact ID.
        note:
          type: string
          description: Note body.
      required:
        - contact_id
        - note
    operation:
      method: POST
      path: /
      body:
        encoding: form
        value:
          UserCode: '{{env.LACRM_USER_CODE}}'
          APIToken: '{{env.LACRM_API_TOKEN}}'
          Function: CreateNote
          Parameters:
            ContactId: '{{params.contact_id}}'
            Note: '{{params.note}}'
  - name: lacrm_create_task
    description: Create a task assigned to one or more users, optionally linked to a contact.
    input:
      type: object
      properties:
        name:
          type: string
          description: Task description.
        due_date:
          type: string
          description: YYYY-MM-DD.
        assigned_to:
          type: array
          description: Array of LACRM user codes.
        contact_id:
          type: string
          description: Linked contact.
        priority:
          type: string
          description: High, Medium, Low.
      required:
        - name
    operation:
      method: POST
      path: /
      body:
        encoding: form
        value:
          UserCode: '{{env.LACRM_USER_CODE}}'
          APIToken: '{{env.LACRM_API_TOKEN}}'
          Function: CreateTask
          Parameters:
            Name: '{{params.name}}'
            DueDate: '{{params.due_date}}'
            AssignedTo: '{{params.assigned_to}}'
            ContactId: '{{params.contact_id}}'
            Priority: '{{params.priority}}'
  - name: lacrm_get_pipeline_report
    description: Get the pipeline (opportunities) report.
    input:
      type: object
      properties:
        pipeline_id:
          type: string
          description: Pipeline ID (optional — defaults to all).
        sort_by:
          type: string
          description: Field name to sort by.
        num_rows:
          type: integer
          description: Max rows (default 25).
    operation:
      method: POST
      path: /
      body:
        encoding: form
        value:
          UserCode: '{{env.LACRM_USER_CODE}}'
          APIToken: '{{env.LACRM_API_TOKEN}}'
          Function: GetPipelineReport
          Parameters:
            PipelineId: '{{params.pipeline_id}}'
            SortBy: '{{params.sort_by}}'
            NumRows: '{{params.num_rows}}'
  - name: lacrm_get_custom_fields
    description: List all custom fields defined in the account — returns id, name, type. Call this first to discover CustomFieldId values you'll need for create/update.
    input:
      type: object
      properties: {}
    operation:
      method: POST
      path: /
      body:
        encoding: form
        value:
          UserCode: '{{env.LACRM_USER_CODE}}'
          APIToken: '{{env.LACRM_API_TOKEN}}'
          Function: GetCustomFields
          Parameters: {}
