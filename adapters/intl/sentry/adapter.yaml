# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: sentry
  name: Sentry
  description: Inspect Sentry projects, issues, and error events.
  region: intl
  category: monitoring
  icon: sentry
  docsUrl: https://docs.sentry.io/api/
  lint:
    allow:
      - healthcheck-present
credentials:
  SENTRY_AUTH_TOKEN:
    required: true
    secret: true
  SENTRY_ORG:
    required: true
transport:
  type: http
  baseUrl: https://sentry.io/api/0
auth:
  type: bearer
  token: '{{env.SENTRY_AUTH_TOKEN}}'
instructions: |-
  Connect to Sentry's hosted REST API to investigate projects, issues, and error events using four read-only tools.

  Setup: Create a Sentry personal authentication token under User settings > Personal Tokens with org:read and event:read scopes. Supply it as SENTRY_AUTH_TOKEN, and your organization ID or URL slug (the `acme` in sentry.io/organizations/acme) as SENTRY_ORG, when configuring this connector. The organization goes into every path for you, so no tool asks the model for it. org:read permits listing organization projects; event:read permits reading issues and their events. Access remains limited by the token owner's permissions. Authentication uses the Authorization: Bearer header. This adapter targets https://sentry.io/api/0.

  Workflow: Use sentry_list_projects to discover project IDs and slugs, then sentry_list_issues to find issues. Pass the returned issue id, rather than shortId, to sentry_get_issue or sentry_list_issue_events. An issue groups related errors; events are individual occurrences. Set full=true when listing events to include full event bodies and stack traces; Sentry then caps the page size at 10.

  Filtering: sentry_list_issues defaults to unresolved issues when query is omitted. Use project to select one project and statsPeriod to narrow the time range, for example 24h or 14d.

  Pagination: the list tools ask for Sentry's Link header, so each response carries `_pagination` next to the body. Call again with cursor = `_pagination.nextCursor` and repeat until `_pagination` is absent, which means that was the last page. Never invent a cursor value.

  Self-hosted Sentry: this adapter targets sentry.io. If you run your own Sentry, change the connector's base URL to your instance's /api/0 after installing; everything else is identical.
tools:
  - name: sentry_list_projects
    description: List one page of projects in a Sentry organization. Returns project IDs, slugs, names, and platforms. Optionally filter by project name or slug.
    input:
      type: object
      properties:
        query:
          type: string
          description: Filter projects by name or slug, for example 'backend'.
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of projects per page. Sentry defaults to 100; maximum 100.
        cursor:
          type: string
          description: Pagination cursor. Omit for the first page, then pass `_pagination.nextCursor` from the previous response and repeat until `_pagination` is absent, which means you are on the last page. Do not invent a cursor value.
    operation:
      method: GET
      path: /organizations/{{env.SENTRY_ORG}}/projects/
      query:
        query: '{{params.query}}'
        per_page: '{{params.per_page}}'
        cursor: '{{params.cursor}}'
    response:
      exposeHeaders:
        - link
        - x-sentry-rate-limit-remaining
  - name: sentry_list_issues
    description: List one page of issues in a Sentry organization. Returns issue IDs, titles, statuses, and occurrence counts. Use an issue ID with sentry_get_issue to investigate further.
    input:
      type: object
      properties:
        project:
          type: string
          description: Filter to one project ID or slug from sentry_list_projects. Omit for all accessible projects.
        query:
          type: string
          description: Sentry issue search, for example 'is:unresolved'. Omit to use Sentry's default unresolved-issue filter.
        statsPeriod:
          type: string
          description: Relative time range, for example '24h' or '14d'.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of issues to return, up to 100.
        cursor:
          type: string
          description: Pagination cursor. Omit for the first page, then pass `_pagination.nextCursor` from the previous response and repeat until `_pagination` is absent, which means you are on the last page. Do not invent a cursor value.
    operation:
      method: GET
      path: /organizations/{{env.SENTRY_ORG}}/issues/
      query:
        project: '{{params.project}}'
        query: '{{params.query}}'
        statsPeriod: '{{params.statsPeriod}}'
        limit: '{{params.limit}}'
        cursor: '{{params.cursor}}'
    response:
      exposeHeaders:
        - link
        - x-sentry-rate-limit-remaining
  - name: sentry_get_issue
    description: Retrieve details for a Sentry issue, including status, occurrence statistics, and a summary of the latest event.
    input:
      type: object
      properties:
        issue_id:
          type: string
          description: Issue ID from the 'id' field returned by sentry_list_issues, for example '123456'. Use the ID, not the shortId such as 'BACKEND-42'.
      required:
        - issue_id
    operation:
      method: GET
      path: /organizations/{{env.SENTRY_ORG}}/issues/{{params.issue_id}}/
  - name: sentry_list_issue_events
    description: List one page of error events belonging to a Sentry issue. Set full to true to include full event bodies and stack traces.
    input:
      type: object
      properties:
        issue_id:
          type: string
          description: Issue ID from sentry_list_issues, for example '123456'.
        statsPeriod:
          type: string
          description: Relative time range, for example '24h' or '14d'.
        full:
          type: boolean
          description: Include full event bodies and stack traces. When true, Sentry caps the page size at 10.
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          description: Events per page. Default and maximum 100, capped at 10 when full is true.
        cursor:
          type: string
          description: Pagination cursor. Omit for the first page, then pass `_pagination.nextCursor` from the previous response and repeat until `_pagination` is absent, which means you are on the last page. Do not invent a cursor value.
      required:
        - issue_id
    operation:
      method: GET
      path: /organizations/{{env.SENTRY_ORG}}/issues/{{params.issue_id}}/events/
      query:
        statsPeriod: '{{params.statsPeriod}}'
        full: '{{params.full}}'
        per_page: '{{params.per_page}}'
        cursor: '{{params.cursor}}'
    response:
      exposeHeaders:
        - link
        - x-sentry-rate-limit-remaining
