# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: attio
  name: Attio
  description: 'Drive Attio (modern relationship-graph CRM) from any AI agent: records (people, companies, deals, custom objects), lists, tasks, notes. 12 tools, Bearer auth.'
  region: intl
  category: crm
  icon: attio
  docsUrl: https://developers.attio.com/reference
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  ATTIO_ACCESS_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.attio.com/v2
auth:
  type: bearer
  token: '{{env.ATTIO_ACCESS_TOKEN}}'
instructions: |-
  This connector uses the Attio REST API v2 (developers.attio.com).

  **Setup**:
  1. Sign in to Attio → top-right avatar → **API & access → Create an access token** (or set up an OAuth app).
  2. Pick scopes: at minimum `object_configuration:read`, `record_permission:read`, `record_permission:read-write`, `list_configuration:read`, `note:read-write`.
  3. Copy the token. Set `ATTIO_ACCESS_TOKEN`.

  **Authentication**: `Authorization: Bearer ${ATTIO_ACCESS_TOKEN}`.

  **Object model**: Attio is highly schema-flexible. Default objects are `people`, `companies`, `deals`, `users`, `workspaces`. You can add custom objects (object_slug). Each object has attributes (fields) — different per workspace.

  **Records have a path-style ID**: `{object: 'people', record_id: 'abc-123-uuid'}`. Use `attio_list_objects` to see what's available.

  **Attributes / Values**: writing values requires the right shape per attribute type (text, number, date, status, select, multi-select, email-address, phone-number, currency, location, personal-name, record-reference). Wrap values in arrays: `{values: {email_addresses: [{email_address:'a@b.com'}]}}`.

  **Lists**: views/collections of records. Different from CRMs that use 'segments' or 'tags'. Each list has entries (record references).

  **Pagination**: `limit + offset`. Default 100, max 1000.

  **Rate limits**: 100 req per 10 sec per token. On 429 back off.

  **Out of scope here**: object/attribute schema CRUD, workspaces management, webhook subscription management.
tools:
  - name: attio_self
    description: Return the token's identity (workspace_id, workspace_name, access_token id, permissions).
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /self
  - name: attio_list_objects
    description: List all objects defined in the workspace (built-in + custom). Returns id, api_slug, singular_noun, plural_noun, created_at.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /objects
  - name: attio_list_object_attributes
    description: List attributes (fields) on an object. Returns id, api_slug, title, type (text/number/date/status/select/email-address/...), is_required, is_unique.
    input:
      type: object
      properties:
        objectSlug:
          type: string
          description: Object api slug (e.g. 'people', 'companies').
      required:
        - objectSlug
    operation:
      method: GET
      path: /objects/{{params.objectSlug}}/attributes
  - name: attio_query_records
    description: Query records on an object with filters + sorting.
    input:
      type: object
      properties:
        objectSlug:
          type: string
          description: Object api slug.
        filter:
          type: object
          description: Attio filter object, e.g. {email_addresses:{email_address:{contains:'@acme.com'}}}.
        sorts:
          type: array
          description: '[{attribute:''last_interaction'', field:''interacted_at'', direction:''desc''}].'
        limit:
          type: integer
          description: Per page (default 100, max 1000).
        offset:
          type: integer
          description: Offset.
      required:
        - objectSlug
    operation:
      method: POST
      path: /objects/{{params.objectSlug}}/records/query
      body:
        value:
          filter: '{{params.filter}}'
          sorts: '{{params.sorts}}'
          limit: '{{params.limit}}'
          offset: '{{params.offset}}'
  - name: attio_get_record
    description: Fetch a single record by object + record_id.
    input:
      type: object
      properties:
        objectSlug:
          type: string
          description: Object slug.
        recordId:
          type: string
          description: Record UUID.
      required:
        - objectSlug
        - recordId
    operation:
      method: GET
      path: /objects/{{params.objectSlug}}/records/{{params.recordId}}
  - name: attio_create_record
    description: Create a record. Values are nested under `values` and keyed by attribute api_slug. Most attributes accept ARRAYS even for single-value (Attio's design for multi-value support).
    input:
      type: object
      properties:
        objectSlug:
          type: string
          description: Object slug.
        data:
          type: object
          description: '{values: {api_slug: <value or [array of typed values]>, ...}}. E.g. for a person: {name:[{first_name:''Jane'',last_name:''Doe''}], email_addresses:[{email_address:''a@b.com''}]}.'
      required:
        - objectSlug
        - data
    operation:
      method: POST
      path: /objects/{{params.objectSlug}}/records
      body:
        value:
          data: '{{params.data}}'
  - name: attio_update_record
    description: Update a record (PATCH semantics — only updates passed values). Use append=true to add to multi-value, false to replace.
    input:
      type: object
      properties:
        objectSlug:
          type: string
          description: Object slug.
        recordId:
          type: string
          description: Record UUID.
        data:
          type: object
          description: '{values:{...}} — only attributes to update.'
      required:
        - objectSlug
        - recordId
        - data
    operation:
      method: PATCH
      path: /objects/{{params.objectSlug}}/records/{{params.recordId}}
      body:
        value:
          data: '{{params.data}}'
  - name: attio_assert_record
    description: 'Upsert by a unique attribute (e.g. email). Required: matching_attribute parameter to identify the unique attribute. Creates if missing, updates if exists.'
    input:
      type: object
      properties:
        objectSlug:
          type: string
          description: Object slug.
        data:
          type: object
          description: '{values:{...}} as in create.'
        matching_attribute:
          type: string
          description: Attribute api_slug used for matching (e.g. 'email_addresses').
      required:
        - objectSlug
        - data
        - matching_attribute
    operation:
      method: PUT
      path: /objects/{{params.objectSlug}}/records
      query:
        matching_attribute: '{{params.matching_attribute}}'
      body:
        value:
          data: '{{params.data}}'
  - name: attio_list_lists
    description: List the workspace's lists (views/collections of records). Returns id, name, parent_object, workspace_access.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /lists
  - name: attio_add_record_to_list
    description: 'Add a record (as a list entry) to a list. Required: listId + parent_record_id (the source record).'
    input:
      type: object
      properties:
        listId:
          type: string
          description: List ID.
        data:
          type: object
          description: '{parent_object: ''people'', parent_record_id: ''uuid'', entry_values?: {stage?:[{value:''New''}], ...} — list-specific attributes}.'
      required:
        - listId
        - data
    operation:
      method: POST
      path: /lists/{{params.listId}}/entries
      body:
        value:
          data: '{{params.data}}'
  - name: attio_list_notes
    description: List notes on records.
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Per page.
        offset:
          type: integer
          description: Offset.
        parent_object:
          type: string
          description: Filter to notes on a specific object slug.
        parent_record_id:
          type: string
          description: Filter to notes on a specific record.
    operation:
      method: GET
      path: /notes
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        parent_object: '{{params.parent_object}}'
        parent_record_id: '{{params.parent_record_id}}'
  - name: attio_create_note
    description: Add a note to a record. format='plaintext' (default) or 'markdown'.
    input:
      type: object
      properties:
        data:
          type: object
          description: '{parent_object: ''people'', parent_record_id: ''uuid'', title?: ''Meeting notes'', format:''plaintext''|''markdown'', content:''Discussed Q3...''}.'
      required:
        - data
    operation:
      method: POST
      path: /notes
      body:
        value:
          data: '{{params.data}}'
