# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: medium
  name: Medium
  description: Publish posts to Medium (your own profile or a publication) from any AI agent. 5 tools, integration-token Bearer auth.
  region: intl
  category: publishing
  icon: medium
  docsUrl: https://github.com/Medium/medium-api-docs
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  MEDIUM_INTEGRATION_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.medium.com/v1
auth:
  type: bearer
  token: '{{env.MEDIUM_INTEGRATION_TOKEN}}'
instructions: |-
  This connector uses the Medium API v1 (github.com/Medium/medium-api-docs).

  **Important — limited write API**: Medium's public API is **write-mostly** for the user that owns the integration token. There's no public read API for posts (Medium walked back most read endpoints in 2019). Use RSS or scraping for reads.

  **Setup**:
  1. Sign in to https://medium.com → top-right avatar → **Settings → Security and apps → Integration tokens → New integration token**.
  2. Name it ('supermcp'). Copy the token.
  3. Set `MEDIUM_INTEGRATION_TOKEN`.

  **Authentication**: `Authorization: Bearer ${MEDIUM_INTEGRATION_TOKEN}`.

  **Publishing flow**: get your userId (`medium_me`) → create a post (`medium_create_post`) under your user OR a publication (`medium_create_post_under_publication`).

  **Content format**: 'html' or 'markdown'. publishStatus: 'public', 'draft', 'unlisted'.

  **Tags**: max 5 tags per post, each ≤25 chars.

  **Out of scope here**: read posts (no public API), comments, claps, notifications.
tools:
  - name: medium_me
    description: 'Return the authenticated user: id, username, name, url, imageUrl.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /me
  - name: medium_list_user_publications
    description: List publications the user contributes to. Returns each publication's id, name, description, url, imageUrl.
    input:
      type: object
      properties:
        userId:
          type: string
          description: User ID from medium_me.
      required:
        - userId
    operation:
      method: GET
      path: /users/{{params.userId}}/publications
  - name: medium_get_publication_contributors
    description: List contributors of a publication.
    input:
      type: object
      properties:
        publicationId:
          type: string
          description: Publication ID.
      required:
        - publicationId
    operation:
      method: GET
      path: /publications/{{params.publicationId}}/contributors
  - name: medium_create_post
    description: 'Create a post under the user''s own profile. Required: userId + title + contentFormat + content.'
    input:
      type: object
      properties:
        userId:
          type: string
          description: User ID.
        title:
          type: string
          description: Post title.
        contentFormat:
          type: string
          description: html or markdown.
        content:
          type: string
          description: Post body (HTML or Markdown).
        canonicalUrl:
          type: string
          description: Canonical URL if cross-posting.
        tags:
          type: array
          description: Up to 5 tag strings, each ≤25 chars.
        publishStatus:
          type: string
          description: public (default), draft, unlisted.
        license:
          type: string
          description: all-rights-reserved (default), cc-40-by, cc-40-by-sa, cc-40-by-nd, cc-40-by-nc, cc-40-by-nc-nd, cc-40-by-nc-sa, cc-40-zero, public-domain.
        notifyFollowers:
          type: boolean
          description: Notify followers (default true for public posts).
      required:
        - userId
        - title
        - contentFormat
        - content
    operation:
      method: POST
      path: /users/{{params.userId}}/posts
      body:
        value:
          title: '{{params.title}}'
          contentFormat: '{{params.contentFormat}}'
          content: '{{params.content}}'
          canonicalUrl: '{{params.canonicalUrl}}'
          tags: '{{params.tags}}'
          publishStatus: '{{params.publishStatus}}'
          license: '{{params.license}}'
          notifyFollowers: '{{params.notifyFollowers}}'
  - name: medium_create_post_under_publication
    description: Create a post under a publication. Same fields as medium_create_post but pass publicationId instead of userId.
    input:
      type: object
      properties:
        publicationId:
          type: string
          description: Publication ID.
        title:
          type: string
          description: Title.
        contentFormat:
          type: string
          description: html or markdown.
        content:
          type: string
          description: Body.
        canonicalUrl:
          type: string
          description: Canonical URL.
        tags:
          type: array
          description: Tags.
        publishStatus:
          type: string
          description: public, draft, unlisted.
        license:
          type: string
          description: License.
        notifyFollowers:
          type: boolean
          description: Notify followers.
      required:
        - publicationId
        - title
        - contentFormat
        - content
    operation:
      method: POST
      path: /publications/{{params.publicationId}}/posts
      body:
        value:
          title: '{{params.title}}'
          contentFormat: '{{params.contentFormat}}'
          content: '{{params.content}}'
          canonicalUrl: '{{params.canonicalUrl}}'
          tags: '{{params.tags}}'
          publishStatus: '{{params.publishStatus}}'
          license: '{{params.license}}'
          notifyFollowers: '{{params.notifyFollowers}}'
