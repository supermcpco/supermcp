# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: adyen
  name: Adyen
  description: Drive Adyen (global payment processor) checkout + payments + balance platform from any AI agent. 10 tools, API-key auth, separate live and test environments.
  region: intl
  category: payments
  icon: adyen
  docsUrl: https://docs.adyen.com/api-explorer/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  ADYEN_API_KEY:
    required: true
    secret: true
  ADYEN_MERCHANT_ACCOUNT:
    required: true
    usage: manual
transport:
  type: http
  baseUrl: https://checkout-test.adyen.com/v71
auth:
  type: apiKey
  in: header
  name: X-API-Key
  value: '{{env.ADYEN_API_KEY}}'
instructions: |-
  This connector uses the Adyen Checkout API v71 and Payments Modifications API (docs.adyen.com).

  **Setup**:
  1. Sign in to https://ca-test.adyen.com (test) or https://ca-live.adyen.com (live) → **Developers → API credentials → New credential → API user**.
  2. Generate the API key. Note your **merchant account name** (visible in top dropdown, e.g. `AcmeCo`).
  3. Set:
     - `ADYEN_API_KEY` = the API key
     - `ADYEN_MERCHANT_ACCOUNT` = the merchant account name
     - `ADYEN_ENV` = `test` or `live`
     - For LIVE only: also set `ADYEN_LIVE_URL_PREFIX` = the URL prefix Adyen issued you (something like `abc123def-AcmeCo`). Find in CA → Developers → API URLs.

  **Authentication**: header `X-API-Key: ${ADYEN_API_KEY}`.

  **Base URL switches environment**: Adyen test → `https://checkout-test.adyen.com/v71`. Live → `https://{PREFIX}-checkout-live.adyenpayments.com/checkout/v71`. The adapter uses test by default; for live, point `ADYEN_CHECKOUT_BASE_URL` env var at the prefixed live URL.

  **Amount format**: `{currency: 'EUR', value: 1099}` — value in MINOR units (cents). EUR uses 2 decimals, JPY 0 decimals — Adyen handles per ISO 4217. NEVER pass decimals.

  **Idempotency**: pass `Idempotency-Key` header on POST `/payments` to dedupe retries.

  **Payment flow**:
    1. `adyen_payment_methods` — get available methods for currency/country/amount.
    2. `adyen_create_payment` — create the payment. Response includes `resultCode` (Authorised/Refused/Pending/RedirectShopper/etc.) and optional `action` (redirect/3DS challenge).
    3. If action: shopper completes it client-side; server gets back `details` to submit.
    4. `adyen_payments_details` — finalize.
    5. Track via `adyen_payments_capture` (manual capture flow), `adyen_payments_refund`, `adyen_payments_cancel`.

  **Modifications**: capture/refund/cancel use the dedicated modification endpoints, NOT the same endpoint as create.

  **Webhooks** out of scope.

  **Out of scope here**: Terminal API (in-person), Balance Platform deep features, Marketpay, Recurring API beyond basic.
tools:
  - name: adyen_payment_methods
    description: List available payment methods for a given currency / country / amount. Returns the methods array that the Adyen Drop-in/Components SDKs render.
    input:
      type: object
      properties:
        merchantAccount:
          type: string
          description: Merchant account name (use ADYEN_MERCHANT_ACCOUNT).
        amount:
          type: object
          description: '{currency:''EUR'', value:1099} — minor units.'
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country (e.g. 'DE', 'US').
        shopperLocale:
          type: string
          description: Locale (e.g. 'en-US', 'de-DE').
        channel:
          type: string
          description: iOS, Android, Web.
        shopperReference:
          type: string
          description: Shopper unique ID — required for showing stored payment methods.
      required:
        - merchantAccount
    operation:
      method: POST
      path: /paymentMethods
      body:
        value:
          merchantAccount: '{{params.merchantAccount}}'
          amount: '{{params.amount}}'
          countryCode: '{{params.countryCode}}'
          shopperLocale: '{{params.shopperLocale}}'
          channel: '{{params.channel}}'
          shopperReference: '{{params.shopperReference}}'
  - name: adyen_create_payment
    description: Create a payment. paymentMethod object varies by method type (card, ideal, paypal, etc.) — usually you get an opaque `paymentMethod` object from the client-side Drop-in. Returns resultCode + action (if 3DS/redirect needed).
    input:
      type: object
      properties:
        merchantAccount:
          type: string
          description: Merchant account name.
        amount:
          type: object
          description: '{currency, value (minor units)}.'
        reference:
          type: string
          description: Your unique reference for this payment (shown on reports).
        paymentMethod:
          type: object
          description: Method-specific payload, e.g. {type:'scheme', encryptedCardNumber:..., encryptedExpiryMonth:..., encryptedExpiryYear:..., encryptedSecurityCode:..., holderName:...}. From Drop-in/Components.
        returnUrl:
          type: string
          description: Where to return shopper after redirect-based payments (3DS, iDEAL).
        shopperReference:
          type: string
          description: Stable shopper ID for storing payment methods.
        shopperEmail:
          type: string
          description: Email.
        shopperIP:
          type: string
          description: Shopper IP (for risk scoring).
        shopperInteraction:
          type: string
          description: Ecommerce (default) or ContAuth (recurring).
        recurringProcessingModel:
          type: string
          description: CardOnFile, Subscription, UnscheduledCardOnFile — required for storing payment methods.
        storePaymentMethod:
          type: boolean
          description: If true and shopperReference is set, store the payment method for future use.
        billingAddress:
          type: object
          description: '{street, houseNumberOrName, postalCode, city, country, stateOrProvince?}.'
        channel:
          type: string
          description: Web, iOS, Android.
      required:
        - merchantAccount
        - amount
        - reference
        - paymentMethod
    operation:
      method: POST
      path: /payments
      body:
        value:
          merchantAccount: '{{params.merchantAccount}}'
          amount: '{{params.amount}}'
          reference: '{{params.reference}}'
          paymentMethod: '{{params.paymentMethod}}'
          returnUrl: '{{params.returnUrl}}'
          shopperReference: '{{params.shopperReference}}'
          shopperEmail: '{{params.shopperEmail}}'
          shopperIP: '{{params.shopperIP}}'
          shopperInteraction: '{{params.shopperInteraction}}'
          recurringProcessingModel: '{{params.recurringProcessingModel}}'
          storePaymentMethod: '{{params.storePaymentMethod}}'
          billingAddress: '{{params.billingAddress}}'
          channel: '{{params.channel}}'
  - name: adyen_payments_details
    description: Finalize a payment with the action result (3DS challenge result, redirect result, etc.). Called after the shopper completes the action returned by create_payment.
    input:
      type: object
      properties:
        details:
          type: object
          description: Action-specific details (e.g. {redirectResult:'...'} for redirect, {threeDSResult:'...'} for 3DS1).
        paymentData:
          type: string
          description: paymentData string from the create response.
      required:
        - details
    operation:
      method: POST
      path: /payments/details
      body:
        value:
          details: '{{params.details}}'
          paymentData: '{{params.paymentData}}'
  - name: adyen_payments_capture
    description: Capture an authorised payment (manual-capture flow). For instant capture, set captureDelayHours=0 on create_payment instead.
    input:
      type: object
      properties:
        paymentPspReference:
          type: string
          description: The pspReference from a prior successful payment authorisation.
        merchantAccount:
          type: string
          description: Merchant account name.
        amount:
          type: object
          description: '{currency, value} — must match authorisation currency. Smaller value = partial capture.'
        reference:
          type: string
          description: Your reference for the capture.
      required:
        - paymentPspReference
        - merchantAccount
        - amount
    operation:
      method: POST
      path: /payments/{{params.paymentPspReference}}/captures
      body:
        value:
          merchantAccount: '{{params.merchantAccount}}'
          amount: '{{params.amount}}'
          reference: '{{params.reference}}'
  - name: adyen_payments_refund
    description: Refund a captured payment. Partial refunds OK (smaller amount).
    input:
      type: object
      properties:
        paymentPspReference:
          type: string
          description: Original payment pspReference.
        merchantAccount:
          type: string
          description: Merchant account.
        amount:
          type: object
          description: '{currency, value}.'
        reference:
          type: string
          description: Your refund reference.
      required:
        - paymentPspReference
        - merchantAccount
        - amount
    operation:
      method: POST
      path: /payments/{{params.paymentPspReference}}/refunds
      body:
        value:
          merchantAccount: '{{params.merchantAccount}}'
          amount: '{{params.amount}}'
          reference: '{{params.reference}}'
  - name: adyen_payments_cancel
    description: Cancel an authorisation that hasn't been captured yet.
    input:
      type: object
      properties:
        paymentPspReference:
          type: string
          description: Payment pspReference.
        merchantAccount:
          type: string
          description: Merchant account.
        reference:
          type: string
          description: Your reference.
      required:
        - paymentPspReference
        - merchantAccount
    operation:
      method: POST
      path: /payments/{{params.paymentPspReference}}/cancels
      body:
        value:
          merchantAccount: '{{params.merchantAccount}}'
          reference: '{{params.reference}}'
  - name: adyen_payments_reversal
    description: Reverse an authorisation (handles capture + refund as one atomic op if needed).
    input:
      type: object
      properties:
        paymentPspReference:
          type: string
          description: Payment pspReference.
        merchantAccount:
          type: string
          description: Merchant account.
        reference:
          type: string
          description: Your reference.
      required:
        - paymentPspReference
        - merchantAccount
    operation:
      method: POST
      path: /payments/{{params.paymentPspReference}}/reversals
      body:
        value:
          merchantAccount: '{{params.merchantAccount}}'
          reference: '{{params.reference}}'
  - name: adyen_sessions_create
    description: Create a payment session (used by Drop-in v5+). Returns a session ID + sessionData the client uses to initialise the SDK.
    input:
      type: object
      properties:
        merchantAccount:
          type: string
          description: Merchant account.
        amount:
          type: object
          description: '{currency, value}.'
        reference:
          type: string
          description: Your unique reference.
        returnUrl:
          type: string
          description: Return URL.
        countryCode:
          type: string
          description: ISO country.
        shopperLocale:
          type: string
          description: Shopper locale.
        channel:
          type: string
          description: Web, iOS, Android.
      required:
        - merchantAccount
        - amount
        - reference
        - returnUrl
    operation:
      method: POST
      path: /sessions
      body:
        value:
          merchantAccount: '{{params.merchantAccount}}'
          amount: '{{params.amount}}'
          reference: '{{params.reference}}'
          returnUrl: '{{params.returnUrl}}'
          countryCode: '{{params.countryCode}}'
          shopperLocale: '{{params.shopperLocale}}'
          channel: '{{params.channel}}'
  - name: adyen_session_get_result
    description: Get the result of a session (after the shopper has completed payment in Drop-in).
    input:
      type: object
      properties:
        sessionId:
          type: string
          description: Session ID from sessions_create.
        sessionResult:
          type: string
          description: sessionResult string from Drop-in's onPaymentCompleted.
      required:
        - sessionId
        - sessionResult
    operation:
      method: GET
      path: /sessions/{{params.sessionId}}
      query:
        sessionResult: '{{params.sessionResult}}'
  - name: adyen_origin_keys
    description: Get origin keys for web-Drop-in (deprecated since 2023 in favor of clientKey — included for legacy integrations).
    input:
      type: object
      properties:
        originDomains:
          type: array
          description: Array of URLs (e.g. ['https://shop.acme.com']).
      required:
        - originDomains
    operation:
      method: POST
      path: /originKeys
      body:
        value:
          originDomains: '{{params.originDomains}}'
