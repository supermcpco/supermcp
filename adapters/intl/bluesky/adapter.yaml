# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: bluesky
  name: Bluesky
  description: Read & post on Bluesky (the AT Protocol social network) from any AI agent. 9 tools, app-password auth.
  region: intl
  category: social
  icon: bluesky
  docsUrl: https://docs.bsky.app/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  BLUESKY_HANDLE:
    required: true
    usage: manual
  BLUESKY_APP_PASSWORD:
    required: true
    secret: true
    usage: manual
transport:
  type: http
  baseUrl: https://bsky.social
auth:
  type: none
instructions: |-
  This connector wraps the Bluesky AT Protocol XRPC API (bsky.social).

  **Setup**:
  1. In the Bluesky app or web client → **Settings → Privacy and Security → App Passwords → Add App Password**.
  2. Name it (e.g. 'mcp') and copy the generated `xxxx-xxxx-xxxx-xxxx` password. App passwords scope down what they can do — never use your account password.
  3. Set `BLUESKY_HANDLE` (e.g. `you.bsky.social`) and `BLUESKY_APP_PASSWORD`.

  **Two-step auth**: AT Protocol uses a session model. You can't just send the app password on every call — you must first POST to `/xrpc/com.atproto.server.createSession` with `{identifier, password}` and use the returned `accessJwt` as the Bearer token. The `bluesky_create_session` tool does step 1; subsequent tools use the JWT.

  For production use the access JWT should be cached (it lasts ~2 hours) and refreshed with `refreshJwt` via `/xrpc/com.atproto.server.refreshSession`. This adapter exposes session create + refresh as tools so the caller can manage lifecycle.

  **DIDs vs handles**: Bluesky internally uses DIDs (`did:plc:abcd...`). Public APIs accept either DID or handle (`you.bsky.social`); use `bluesky_resolve_handle` to convert.

  **Post records**: posts are AT Protocol records of type `app.bsky.feed.post`. They have `text` (max 300 graphemes), `createdAt` (RFC3339), `langs[]`, and optional `embed` for images/links.

  **Rate limits**: 5k req / hour per JWT; create-session limited to 30/5min per IP. 429 with `Retry-After`.

  **Out of scope here**: image upload multipart (use the public URL embed pattern instead), labelers/moderation, custom feeds CRUD, DM (separate API), the firehose.
tools:
  - name: bluesky_create_session
    description: Exchange handle + app password for an access JWT (lasts ~2h) and refresh JWT. Returns `accessJwt`, `refreshJwt`, `handle`, `did`. Call this once at the start of a session, then pass `accessJwt` to other tools that need it.
    input:
      type: object
      properties:
        identifier:
          type: string
          description: Handle (e.g. you.bsky.social) or email.
        password:
          type: string
          description: App password.
      required:
        - identifier
        - password
    operation:
      method: POST
      path: /xrpc/com.atproto.server.createSession
      body:
        value:
          identifier: '{{params.identifier}}'
          password: '{{params.password}}'
  - name: bluesky_refresh_session
    description: Refresh an access JWT using the refresh JWT.
    input:
      type: object
      properties:
        refresh_jwt:
          type: string
          description: refreshJwt from create_session.
      required:
        - refresh_jwt
    operation:
      method: POST
      path: /xrpc/com.atproto.server.refreshSession
      headers:
        Authorization: Bearer {{params.refresh_jwt}}
  - name: bluesky_resolve_handle
    description: Resolve a Bluesky handle (e.g. `bsky.app`) to its DID. Public, no auth needed.
    input:
      type: object
      properties:
        handle:
          type: string
          description: Handle (no @).
      required:
        - handle
    operation:
      method: GET
      path: /xrpc/com.atproto.identity.resolveHandle
      query:
        handle: '{{params.handle}}'
  - name: bluesky_get_profile
    description: 'Get a user''s public profile: handle, did, displayName, description, followers, follows, posts count, avatar URL.'
    input:
      type: object
      properties:
        actor:
          type: string
          description: Handle or DID.
        access_jwt:
          type: string
          description: Access JWT from create_session.
      required:
        - actor
        - access_jwt
    operation:
      method: GET
      path: /xrpc/app.bsky.actor.getProfile
      query:
        actor: '{{params.actor}}'
      headers:
        Authorization: Bearer {{params.access_jwt}}
  - name: bluesky_get_timeline
    description: Get the authenticated user's home timeline (chronological feed of follows). Paginated.
    input:
      type: object
      properties:
        access_jwt:
          type: string
          description: Access JWT.
        limit:
          type: integer
          description: Max posts (1-100).
        cursor:
          type: string
          description: Pagination cursor from previous response.
      required:
        - access_jwt
    operation:
      method: GET
      path: /xrpc/app.bsky.feed.getTimeline
      query:
        limit: '{{params.limit}}'
        cursor: '{{params.cursor}}'
      headers:
        Authorization: Bearer {{params.access_jwt}}
  - name: bluesky_get_author_feed
    description: Get posts by a specific user (their public feed).
    input:
      type: object
      properties:
        actor:
          type: string
          description: Handle or DID.
        access_jwt:
          type: string
          description: Access JWT.
        limit:
          type: integer
          description: Max posts (1-100).
        cursor:
          type: string
          description: Pagination cursor.
        filter:
          type: string
          description: '''posts_with_replies'', ''posts_no_replies'', ''posts_with_media'', ''posts_and_author_threads''.'
      required:
        - actor
        - access_jwt
    operation:
      method: GET
      path: /xrpc/app.bsky.feed.getAuthorFeed
      query:
        actor: '{{params.actor}}'
        limit: '{{params.limit}}'
        cursor: '{{params.cursor}}'
        filter: '{{params.filter}}'
      headers:
        Authorization: Bearer {{params.access_jwt}}
  - name: bluesky_search_posts
    description: Full-text search across public posts.
    input:
      type: object
      properties:
        q:
          type: string
          description: Search query.
        access_jwt:
          type: string
          description: Access JWT.
        limit:
          type: integer
          description: Max results (1-100).
        cursor:
          type: string
          description: Pagination cursor.
        lang:
          type: string
          description: ISO language filter.
        sort:
          type: string
          description: '''top'' or ''latest''.'
      required:
        - q
        - access_jwt
    operation:
      method: GET
      path: /xrpc/app.bsky.feed.searchPosts
      query:
        q: '{{params.q}}'
        limit: '{{params.limit}}'
        cursor: '{{params.cursor}}'
        lang: '{{params.lang}}'
        sort: '{{params.sort}}'
      headers:
        Authorization: Bearer {{params.access_jwt}}
  - name: bluesky_create_post
    description: Post a new skeet. `text` is required (max 300 graphemes). Returns the post's URI + CID.
    input:
      type: object
      properties:
        access_jwt:
          type: string
          description: Access JWT.
        repo:
          type: string
          description: Your DID (from create_session response).
        text:
          type: string
          description: Post text, max 300 graphemes.
        created_at:
          type: string
          description: RFC3339 datetime (defaults to now if omitted).
        langs:
          type: array
          description: ISO 639-1 language codes, e.g. ['en'].
      required:
        - access_jwt
        - repo
        - text
        - created_at
    operation:
      method: POST
      path: /xrpc/com.atproto.repo.createRecord
      headers:
        Authorization: Bearer {{params.access_jwt}}
      body:
        value:
          repo: '{{params.repo}}'
          collection: app.bsky.feed.post
          record:
            $type: app.bsky.feed.post
            text: '{{params.text}}'
            createdAt: '{{params.created_at}}'
            langs: '{{params.langs}}'
  - name: bluesky_delete_post
    description: Delete one of your own posts by its rkey (record key, the last segment of the at:// URI).
    input:
      type: object
      properties:
        access_jwt:
          type: string
          description: Access JWT.
        repo:
          type: string
          description: Your DID.
        rkey:
          type: string
          description: Record key — the last segment of the post's at:// URI.
      required:
        - access_jwt
        - repo
        - rkey
    operation:
      method: POST
      path: /xrpc/com.atproto.repo.deleteRecord
      headers:
        Authorization: Bearer {{params.access_jwt}}
      body:
        value:
          repo: '{{params.repo}}'
          collection: app.bsky.feed.post
          rkey: '{{params.rkey}}'
