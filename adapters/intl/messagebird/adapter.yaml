# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: messagebird
  name: MessageBird (Bird)
  description: Drive MessageBird / Bird (multichannel CPaaS — SMS, voice, WhatsApp via Bird, RCS) from any AI agent. 8 tools, AccessKey header auth.
  region: intl
  category: messaging
  icon: messagebird
  docsUrl: https://developers.messagebird.com/api/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  MESSAGEBIRD_ACCESS_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://rest.messagebird.com
auth:
  type: apiKey
  in: header
  name: Authorization
  value: AccessKey {{env.MESSAGEBIRD_ACCESS_KEY}}
instructions: |-
  This connector uses the MessageBird API v1 (developers.messagebird.com).

  **Note**: MessageBird rebranded to **Bird** in 2023 (bird.com). The API endpoints at rest.messagebird.com remain functional for existing customers as of 2025; new accounts may have different endpoint paths. Verify with your account dashboard.

  **Setup**:
  1. Sign in to https://dashboard.messagebird.com → **Developers → API access** → Live or Test → copy AccessKey.
  2. Set `MESSAGEBIRD_ACCESS_KEY`.

  **Authentication**: header `Authorization: AccessKey ${MESSAGEBIRD_ACCESS_KEY}` (literal 'AccessKey' prefix).

  **Recipients format**: international phone numbers WITHOUT the `+` sign. e.g. `31612345678` for the Netherlands.

  **Datacoding**: 'plain' (default GSM-7), 'unicode' (UCS-2, allows emoji but doubles cost), 'auto' (let MessageBird pick).

  **Originator**: your sender ID. Can be alphanumeric (max 11 chars, sender-name approach) or a phone number you own/lease.

  **Voice via API**: also possible (/calls endpoint) but call flows are complex — out of scope here for the MVP.

  **Rate limits**: ~100 SMS/sec on standard, much higher with dedicated routes. On 429 back off.
tools:
  - name: messagebird_get_balance
    description: Return account balance (payment) and currency.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /balance
  - name: messagebird_send_sms
    description: 'Send an SMS. Required: originator + recipients + body.'
    input:
      type: object
      properties:
        originator:
          type: string
          description: Sender ID (≤11 alphanumeric chars) or your owned phone number.
        recipients:
          type: array
          description: Array of phones in international format WITHOUT '+'. e.g. ['31612345678'].
        body:
          type: string
          description: Message body. With plain datacoding ≤160 chars per part.
        type:
          type: string
          description: sms (default), binary, flash, premium.
        datacoding:
          type: string
          description: plain (default), unicode, auto.
        reference:
          type: string
          description: Free-text reference for delivery report correlation.
        scheduledDatetime:
          type: string
          description: ISO 8601 to schedule send up to 24h ahead.
        validity:
          type: integer
          description: Validity period in seconds (default 1 day).
      required:
        - originator
        - recipients
        - body
    operation:
      method: POST
      path: /messages
      body:
        value:
          originator: '{{params.originator}}'
          recipients: '{{params.recipients}}'
          body: '{{params.body}}'
          type: '{{params.type}}'
          datacoding: '{{params.datacoding}}'
          reference: '{{params.reference}}'
          scheduledDatetime: '{{params.scheduledDatetime}}'
          validity: '{{params.validity}}'
  - name: messagebird_get_message
    description: Get an SMS by ID with delivery status per recipient.
    input:
      type: object
      properties:
        messageId:
          type: string
          description: Message ID.
      required:
        - messageId
    operation:
      method: GET
      path: /messages/{{params.messageId}}
  - name: messagebird_list_messages
    description: List SMS messages with filters.
    input:
      type: object
      properties:
        originator:
          type: string
          description: Filter by sender.
        recipient:
          type: string
          description: Filter by recipient phone.
        from:
          type: string
          description: From datetime (ISO 8601).
        until:
          type: string
          description: Until datetime.
        status:
          type: string
          description: scheduled, sent, buffered, delivered, expired, delivery_failed, sent_failed.
        limit:
          type: integer
          description: Per page (default 10, max 100).
        offset:
          type: integer
          description: Offset.
    operation:
      method: GET
      path: /messages
      query:
        originator: '{{params.originator}}'
        recipient: '{{params.recipient}}'
        from: '{{params.from}}'
        until: '{{params.until}}'
        status: '{{params.status}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: messagebird_send_voice_call
    description: 'Start an outbound voice call. The call follows the steps in callFlow (XML or JSON). Required: source + destination + callFlow.'
    input:
      type: object
      properties:
        source:
          type: string
          description: Your number (international, no +). Must be MessageBird-issued or verified caller ID.
        destination:
          type: string
          description: Recipient phone (no +).
        callFlow:
          type: object
          description: '{steps: [{action:''say'', options:{payload:''Hello'', voice:''female'', language:''en-US''}}, {action:''transfer'', options:{destination:''31612345678''}}]}.'
        webhook:
          type: object
          description: '{url, token} — for event callbacks.'
      required:
        - source
        - destination
        - callFlow
    operation:
      method: POST
      path: /calls
      body:
        value:
          source: '{{params.source}}'
          destination: '{{params.destination}}'
          callFlow: '{{params.callFlow}}'
          webhook: '{{params.webhook}}'
  - name: messagebird_lookup_phone
    description: 'Look up phone number details: country, type (mobile/landline), formats. Useful for validation + carrier detection.'
    input:
      type: object
      properties:
        phoneNumber:
          type: string
          description: Phone number to look up (international, no +).
        countryCode:
          type: string
          description: ISO country code if you have a local number that needs disambiguation.
      required:
        - phoneNumber
    operation:
      method: GET
      path: /lookup/{{params.phoneNumber}}
      query:
        countryCode: '{{params.countryCode}}'
  - name: messagebird_verify_create
    description: Send a verification code (OTP) via SMS/voice. Default 6-digit code, 30 sec validity. Use messagebird_verify_check to validate.
    input:
      type: object
      properties:
        recipient:
          type: string
          description: Phone (international, no +).
        originator:
          type: string
          description: Sender ID.
        type:
          type: string
          description: sms (default), tts (voice).
        template:
          type: string
          description: Message template. Default 'Your verification code is %token.'. Must include %token literal.
        timeout:
          type: integer
          description: Seconds until code expires (default 30, max 3600).
        tokenLength:
          type: integer
          description: Code length 4-10 (default 6).
        voice:
          type: string
          description: 'For tts: male, female.'
        language:
          type: string
          description: 'For tts: en-us, en-gb, de-de, fr-fr, ...'
      required:
        - recipient
    operation:
      method: POST
      path: /verify
      body:
        value:
          recipient: '{{params.recipient}}'
          originator: '{{params.originator}}'
          type: '{{params.type}}'
          template: '{{params.template}}'
          timeout: '{{params.timeout}}'
          tokenLength: '{{params.tokenLength}}'
          voice: '{{params.voice}}'
          language: '{{params.language}}'
  - name: messagebird_verify_check
    description: Verify a token (OTP) against a previously-created verification ID.
    input:
      type: object
      properties:
        id:
          type: string
          description: Verification ID from verify_create response.
        token:
          type: string
          description: Code the user entered.
      required:
        - id
        - token
    operation:
      method: GET
      path: /verify/{{params.id}}
      query:
        token: '{{params.token}}'
