# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: savvycal
  name: SavvyCal
  description: 'Drive SavvyCal (modern team scheduling) from any AI agent: scheduling links, meetings, availability. 6 tools, API-key Bearer auth.'
  region: intl
  category: scheduling
  icon: savvycal
  docsUrl: https://developer.savvycal.com/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
      - instructions-min-800
credentials:
  SAVVYCAL_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.savvycal.com/v1
auth:
  type: bearer
  token: '{{env.SAVVYCAL_API_KEY}}'
instructions: |-
  This connector uses the SavvyCal API v1 (developer.savvycal.com).

  **Setup**:
  1. Sign in to https://savvycal.com → top-right avatar → **Developer → API Keys → Create new key**.
  2. Set `SAVVYCAL_API_KEY`.

  **Authentication**: `Authorization: Bearer ${SAVVYCAL_API_KEY}`.

  **Resource model**:
    - **Link**: a scheduling link template (`/me/intro-call`).
    - **Booking**: a scheduled meeting via a link.
    - **Calendar**: connected calendar source (Google/Outlook).

  **Pagination**: cursor — response has `meta.next_cursor`.

  **Out of scope here**: workflows automation editing, payments via Stripe, team round-robin config (UI-only).
tools:
  - name: savvycal_me
    description: Return the user the token belongs to.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /me
  - name: savvycal_list_links
    description: List scheduling links. Each has id, slug, name, public, single_use, link_url, durations[], owner.
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Per page (max 100).
        after:
          type: string
          description: Cursor.
    operation:
      method: GET
      path: /links
      query:
        limit: '{{params.limit}}'
        after: '{{params.after}}'
  - name: savvycal_get_link
    description: Fetch a scheduling link by ID with full details.
    input:
      type: object
      properties:
        linkId:
          type: string
          description: Link ID.
      required:
        - linkId
    operation:
      method: GET
      path: /links/{{params.linkId}}
  - name: savvycal_list_meetings
    description: List meetings (bookings).
    input:
      type: object
      properties:
        after:
          type: string
          description: Cursor.
        limit:
          type: integer
          description: Per page.
        from:
          type: string
          description: ISO 8601 — meetings starting after.
        to:
          type: string
          description: ISO 8601 — starting before.
        state:
          type: string
          description: scheduled, canceled.
    operation:
      method: GET
      path: /meetings
      query:
        after: '{{params.after}}'
        limit: '{{params.limit}}'
        from: '{{params.from}}'
        to: '{{params.to}}'
        state: '{{params.state}}'
  - name: savvycal_get_meeting
    description: Fetch a meeting by ID with invitee details, cancellation URL, reschedule URL.
    input:
      type: object
      properties:
        meetingId:
          type: string
          description: Meeting ID.
      required:
        - meetingId
    operation:
      method: GET
      path: /meetings/{{params.meetingId}}
  - name: savvycal_cancel_meeting
    description: Cancel a scheduled meeting. The invitee receives a cancellation email.
    input:
      type: object
      properties:
        meetingId:
          type: string
          description: Meeting ID.
        reason:
          type: string
          description: Cancellation reason (shown in email).
      required:
        - meetingId
    operation:
      method: DELETE
      path: /meetings/{{params.meetingId}}
      body:
        value:
          reason: '{{params.reason}}'
