# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: woocommerce
  name: WooCommerce
  description: AI-native commerce operations for any WooCommerce store. Semantic tools for products, variations, inventory, orders, refunds, customers, categories, and reports — plus documented multi-step recipes (inventory optimisation, SEO refresh, upsell/cross-sell, abandoned-order triage, revenue analysis).
  region: intl
  category: e-commerce
  icon: woocommerce
  docsUrl: https://woocommerce.github.io/woocommerce-rest-api-docs/
  priority: 50
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  WOOCOMMERCE_URL:
    required: true
  WOOCOMMERCE_CONSUMER_KEY:
    required: true
    secret: true
  WOOCOMMERCE_CONSUMER_SECRET:
    required: true
    secret: true
transport:
  type: http
  baseUrl: '{{env.WOOCOMMERCE_URL}}/wp-json/wc/v3'
auth:
  type: basic
  username: '{{env.WOOCOMMERCE_CONSUMER_KEY}}'
  password: '{{env.WOOCOMMERCE_CONSUMER_SECRET}}'
instructions: |-
  This connector talks to the WooCommerce REST API v3 (`/wp-json/wc/v3`). Works against any WordPress + WooCommerce site. HTTPS required.

  ## Setup

  1. **`WOOCOMMERCE_URL`** — site root (e.g. `https://shop.example.com`). Do NOT include `/wp-json`; the adapter appends `/wp-json/wc/v3`.
  2. **`WOOCOMMERCE_CONSUMER_KEY`** + **`WOOCOMMERCE_CONSUMER_SECRET`** — generate in WP admin → WooCommerce → Settings → Advanced → REST API → Add key. Use **Read/Write** for full functionality.

  HTTPS is mandatory: on HTTP, WC requires OAuth1 instead of Basic Auth (the connector only does Basic Auth).

  ## Pagination

  List endpoints default to `per_page=10`, max `100`. Pass explicit `per_page` + iterate `page` for full catalog scans. Total counts are in `X-WP-Total` / `X-WP-TotalPages` headers (not returned in the JSON body).

  ## Bulk writes

  For ≥ 3 product updates use `woocommerce_batch_update_products` (one call, up to 100 entries). Don't fan out single `update_product` calls.

  ## SEO meta (Yoast / Rank Math) on products

  Meta lives in the `meta_data` array on the product. Set it via `woocommerce_update_product`:

  ```json
  "meta_data": [
    { "key": "_yoast_wpseo_metadesc", "value": "..." },
    { "key": "_yoast_wpseo_focuskw", "value": "..." }
  ]
  ```

  Rank Math: `rank_math_description`, `rank_math_focus_keyword`, `rank_math_title`. Full reference: `wordpress_list_seo_meta_keys` (sibling WordPress connector).

  ## Multi-step workflows

  For inventory optimisation, product SEO, upsell/cross-sell, low-conversion analysis, abandoned-order triage, or KPI snapshots → call the dedicated **`woocommerce_skill_*`** tool. It returns the step-by-step playbook on demand. Don't preload that knowledge here.

  ## Enum reference cards

  Valid values for order status / product type / stock status / report period / payment methods → call **`woocommerce_list_*_options`**.

  ## Permissions cheat-sheet

  - All list / get / reports: Read-only key.
  - Product create/update/delete, order update, refund, batch: Read/Write key.
  - Customer create / coupon create: Read/Write key.
tools:
  - name: woocommerce_search_products
    description: Search/list products with rich filters — keyword (`search`), SKU, status, type (simple/variable/grouped/external), stock_status, on_sale, price range, category, tag, featured. Paginate with `page` + `per_page` (max 100).
    input:
      type: object
      properties:
        page:
          type: integer
          description: 1-based page.
        per_page:
          type: integer
          description: 1-100.
        search:
          type: string
          description: Free-text search across product name/description/SKU.
        sku:
          type: string
          description: Filter by exact SKU.
        slug:
          type: string
          description: Filter by exact slug.
        status:
          type: string
          description: 'any | draft | pending | private | publish. Default: publish.'
        type:
          type: string
          description: simple | grouped | external | variable.
        category:
          type: string
          description: Category term id.
        tag:
          type: string
          description: Tag term id.
        stock_status:
          type: string
          description: instock | outofstock | onbackorder.
        on_sale:
          type: boolean
        featured:
          type: boolean
        min_price:
          type: string
          description: Decimal as string.
        max_price:
          type: string
          description: Decimal as string.
        orderby:
          type: string
          description: date | id | include | title | slug | price | popularity | rating | menu_order.
        order:
          type: string
          description: asc | desc.
    operation:
      method: GET
      path: /products
      query:
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
        search: '{{params.search}}'
        sku: '{{params.sku}}'
        slug: '{{params.slug}}'
        status: '{{params.status}}'
        type: '{{params.type}}'
        category: '{{params.category}}'
        tag: '{{params.tag}}'
        stock_status: '{{params.stock_status}}'
        on_sale: '{{params.on_sale}}'
        featured: '{{params.featured}}'
        min_price: '{{params.min_price}}'
        max_price: '{{params.max_price}}'
        orderby: '{{params.orderby}}'
        order: '{{params.order}}'
  - name: woocommerce_get_product
    description: 'Get a single product by id, including all fields: name, slug, description, short_description, sku, price/regular_price/sale_price, stock_quantity, stock_status, categories, tags, images, attributes, variations array (for variable products), upsell_ids, cross_sell_ids, meta_data.'
    input:
      type: object
      properties:
        productId:
          type: integer
          description: Product id.
      required:
        - productId
    operation:
      method: GET
      path: /products/{{params.productId}}
  - name: woocommerce_create_product
    description: 'Create a product. Minimal required: `name`. For variable products set `type=variable` and add variations via `woocommerce_create_product_variation` after creation. Pass `meta_data` array for Yoast / Rank Math SEO keys.'
    input:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          description: 'simple | grouped | external | variable. Default: simple.'
        status:
          type: string
          description: publish | draft | pending | private.
        featured:
          type: boolean
        catalog_visibility:
          type: string
          description: visible | catalog | search | hidden.
        description:
          type: string
          description: Long description (HTML).
        short_description:
          type: string
          description: Short description (HTML).
        sku:
          type: string
        regular_price:
          type: string
          description: Decimal as string.
        sale_price:
          type: string
        manage_stock:
          type: boolean
        stock_quantity:
          type: integer
        stock_status:
          type: string
          description: instock | outofstock | onbackorder.
        backorders:
          type: string
          description: no | notify | yes.
        weight:
          type: string
        dimensions:
          type: object
          description: '{ length, width, height } — strings (cm or per store unit).'
        categories:
          type: array
          description: Array of { id }.
          items:
            type: object
        tags:
          type: array
          description: Array of { id }.
          items:
            type: object
        images:
          type: array
          description: Array of { id } (existing media) or { src } (URL — WC will sideload). First image = featured.
          items:
            type: object
        attributes:
          type: array
          description: Product attributes — see WC REST docs.
          items:
            type: object
        upsell_ids:
          type: array
          description: Product IDs to show as upsells.
          items:
            type: integer
        cross_sell_ids:
          type: array
          description: Product IDs to show as cross-sells.
          items:
            type: integer
        meta_data:
          type: array
          description: Array of { key, value } — for Yoast/Rank Math SEO keys.
          items:
            type: object
      required:
        - name
    operation:
      method: POST
      path: /products
      body:
        value:
          name: '{{params.name}}'
          slug: '{{params.slug}}'
          type: '{{params.type}}'
          status: '{{params.status}}'
          featured: '{{params.featured}}'
          catalog_visibility: '{{params.catalog_visibility}}'
          description: '{{params.description}}'
          short_description: '{{params.short_description}}'
          sku: '{{params.sku}}'
          regular_price: '{{params.regular_price}}'
          sale_price: '{{params.sale_price}}'
          manage_stock: '{{params.manage_stock}}'
          stock_quantity: '{{params.stock_quantity}}'
          stock_status: '{{params.stock_status}}'
          backorders: '{{params.backorders}}'
          weight: '{{params.weight}}'
          dimensions: '{{params.dimensions}}'
          categories: '{{params.categories}}'
          tags: '{{params.tags}}'
          images: '{{params.images}}'
          attributes: '{{params.attributes}}'
          upsell_ids: '{{params.upsell_ids}}'
          cross_sell_ids: '{{params.cross_sell_ids}}'
          meta_data: '{{params.meta_data}}'
  - name: woocommerce_update_product
    description: Partial-update a product by id. Only fields you pass are touched. Use for single-product edits; for bulk use `woocommerce_batch_update_products`.
    input:
      type: object
      properties:
        productId:
          type: integer
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          description: simple | grouped | external | variable.
        status:
          type: string
        featured:
          type: boolean
        catalog_visibility:
          type: string
          description: visible | catalog | search | hidden.
        description:
          type: string
        short_description:
          type: string
        sku:
          type: string
        regular_price:
          type: string
        sale_price:
          type: string
        manage_stock:
          type: boolean
        stock_quantity:
          type: integer
        stock_status:
          type: string
        backorders:
          type: string
        weight:
          type: string
        dimensions:
          type: object
          description: '{ length, width, height } — strings (cm or per store unit).'
        categories:
          type: array
          items:
            type: object
        tags:
          type: array
          items:
            type: object
        images:
          type: array
          items:
            type: object
        attributes:
          type: array
          items:
            type: object
        upsell_ids:
          type: array
          items:
            type: integer
        cross_sell_ids:
          type: array
          items:
            type: integer
        meta_data:
          type: array
          items:
            type: object
      required:
        - productId
    operation:
      method: PUT
      path: /products/{{params.productId}}
      body:
        value:
          name: '{{params.name}}'
          slug: '{{params.slug}}'
          type: '{{params.type}}'
          status: '{{params.status}}'
          featured: '{{params.featured}}'
          catalog_visibility: '{{params.catalog_visibility}}'
          description: '{{params.description}}'
          short_description: '{{params.short_description}}'
          sku: '{{params.sku}}'
          regular_price: '{{params.regular_price}}'
          sale_price: '{{params.sale_price}}'
          manage_stock: '{{params.manage_stock}}'
          stock_quantity: '{{params.stock_quantity}}'
          stock_status: '{{params.stock_status}}'
          backorders: '{{params.backorders}}'
          weight: '{{params.weight}}'
          dimensions: '{{params.dimensions}}'
          categories: '{{params.categories}}'
          tags: '{{params.tags}}'
          images: '{{params.images}}'
          attributes: '{{params.attributes}}'
          upsell_ids: '{{params.upsell_ids}}'
          cross_sell_ids: '{{params.cross_sell_ids}}'
          meta_data: '{{params.meta_data}}'
  - name: woocommerce_delete_product
    description: Move a product to trash, or pass `force=true` to delete permanently (cannot be undone).
    input:
      type: object
      properties:
        productId:
          type: integer
        force:
          type: boolean
          description: true = permanent delete; false (default) = move to trash.
      required:
        - productId
    operation:
      method: DELETE
      path: /products/{{params.productId}}
      query:
        force: '{{params.force}}'
  - name: woocommerce_batch_update_products
    description: Bulk create / update / delete products in a single call. WooCommerce allows up to 100 entries per array. Best primitive for inventory bumps, SEO refresh waves, or category re-tags.
    input:
      type: object
      properties:
        create:
          type: array
          description: Array of product objects to create.
          items:
            type: object
        update:
          type: array
          description: Array of product objects — each MUST include an `id` field.
          items:
            type: object
        delete:
          type: array
          description: Array of product IDs to delete.
          items:
            type: integer
    operation:
      method: POST
      path: /products/batch
      body:
        value:
          create: '{{params.create}}'
          update: '{{params.update}}'
          delete: '{{params.delete}}'
  - name: woocommerce_list_product_variations
    description: List variations for a variable product. Returns id, sku, price, stock_quantity, attributes per variation.
    input:
      type: object
      properties:
        productId:
          type: integer
          description: Parent (variable) product id.
        page:
          type: integer
        per_page:
          type: integer
        search:
          type: string
        stock_status:
          type: string
        on_sale:
          type: boolean
      required:
        - productId
    operation:
      method: GET
      path: /products/{{params.productId}}/variations
      query:
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
        search: '{{params.search}}'
        stock_status: '{{params.stock_status}}'
        on_sale: '{{params.on_sale}}'
  - name: woocommerce_update_product_variation
    description: Update a single variation of a variable product — price, SKU, stock, attributes.
    input:
      type: object
      properties:
        productId:
          type: integer
          description: Parent product id.
        variationId:
          type: integer
          description: Variation id.
        sku:
          type: string
        regular_price:
          type: string
        sale_price:
          type: string
        manage_stock:
          type: boolean
        stock_quantity:
          type: integer
        stock_status:
          type: string
        weight:
          type: string
        meta_data:
          type: array
          items:
            type: object
      required:
        - productId
        - variationId
    operation:
      method: PUT
      path: /products/{{params.productId}}/variations/{{params.variationId}}
      body:
        value:
          sku: '{{params.sku}}'
          regular_price: '{{params.regular_price}}'
          sale_price: '{{params.sale_price}}'
          manage_stock: '{{params.manage_stock}}'
          stock_quantity: '{{params.stock_quantity}}'
          stock_status: '{{params.stock_status}}'
          weight: '{{params.weight}}'
          meta_data: '{{params.meta_data}}'
  - name: woocommerce_list_product_categories
    description: List product categories. Returns id, name, slug, parent, count.
    input:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        search:
          type: string
        parent:
          type: integer
        hide_empty:
          type: boolean
        orderby:
          type: string
        order:
          type: string
    operation:
      method: GET
      path: /products/categories
      query:
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
        search: '{{params.search}}'
        parent: '{{params.parent}}'
        hide_empty: '{{params.hide_empty}}'
        orderby: '{{params.orderby}}'
        order: '{{params.order}}'
  - name: woocommerce_create_product_category
    description: Create a product category.
    input:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        parent:
          type: integer
        description:
          type: string
        display:
          type: string
          description: default | products | subcategories | both.
        image:
          type: object
          description: '{ id } or { src } for the category image.'
      required:
        - name
    operation:
      method: POST
      path: /products/categories
      body:
        value:
          name: '{{params.name}}'
          slug: '{{params.slug}}'
          parent: '{{params.parent}}'
          description: '{{params.description}}'
          display: '{{params.display}}'
          image: '{{params.image}}'
  - name: woocommerce_list_product_tags
    description: List product tags.
    input:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        search:
          type: string
        hide_empty:
          type: boolean
        orderby:
          type: string
        order:
          type: string
    operation:
      method: GET
      path: /products/tags
      query:
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
        search: '{{params.search}}'
        hide_empty: '{{params.hide_empty}}'
        orderby: '{{params.orderby}}'
        order: '{{params.order}}'
  - name: woocommerce_list_product_attributes
    description: List the global attribute definitions configured for the store (e.g. Size, Colour). Needed when building variable products.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /products/attributes
  - name: woocommerce_find_low_stock
    description: Find products that are out of stock OR have `manage_stock=true` with `stock_quantity` at/below `threshold`. Pages through the catalog using `per_page` (max 100) and the supplied `page`. Returns the raw `/products` page filtered by stock status — combine with the agent's own threshold check on `stock_quantity` if needed. For the simple case, set `stock_status=outofstock` or `stock_status=onbackorder`.
    input:
      type: object
      properties:
        stock_status:
          type: string
          description: 'outofstock | onbackorder | instock. Default: outofstock.'
        page:
          type: integer
        per_page:
          type: integer
          description: Max 100.
        category:
          type: string
          description: Restrict to a category id.
        orderby:
          type: string
          description: 'Default: date.'
    operation:
      method: GET
      path: /products
      query:
        stock_status: '{{params.stock_status}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
        category: '{{params.category}}'
        orderby: '{{params.orderby}}'
  - name: woocommerce_update_stock
    description: 'Convenience wrapper over `update_product`: enables stock management and sets quantity + status in one call. Use for single-product stock bumps; for bulk use `batch_update_products`.'
    input:
      type: object
      properties:
        productId:
          type: integer
        stock_quantity:
          type: integer
          description: New on-hand quantity.
        stock_status:
          type: string
          description: 'instock | outofstock | onbackorder. Default: instock.'
        manage_stock:
          type: boolean
          description: 'Default: true (enables WooCommerce stock management).'
      required:
        - productId
        - stock_quantity
    operation:
      method: PUT
      path: /products/{{params.productId}}
      body:
        value:
          manage_stock: '{{params.manage_stock}}'
          stock_quantity: '{{params.stock_quantity}}'
          stock_status: '{{params.stock_status}}'
  - name: woocommerce_list_orders
    description: List orders with status, date, customer, and product filters. For abandoned-order triage use status=pending,on-hold,failed with a recent `after`.
    input:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        search:
          type: string
        status:
          type: string
          description: 'Comma-separated: any | pending | processing | on-hold | completed | cancelled | refunded | failed | trash.'
        customer:
          type: integer
          description: Customer user id.
        product:
          type: integer
          description: Filter to orders that include this product id.
        after:
          type: string
          description: ISO 8601.
        before:
          type: string
          description: ISO 8601.
        orderby:
          type: string
          description: date | id | include | title | slug.
        order:
          type: string
    operation:
      method: GET
      path: /orders
      query:
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
        search: '{{params.search}}'
        status: '{{params.status}}'
        customer: '{{params.customer}}'
        product: '{{params.product}}'
        after: '{{params.after}}'
        before: '{{params.before}}'
        orderby: '{{params.orderby}}'
        order: '{{params.order}}'
  - name: woocommerce_get_order
    description: Get a single order by id — full payload incl. line_items, billing, shipping, customer_id, totals, payment, refunds.
    input:
      type: object
      properties:
        orderId:
          type: integer
      required:
        - orderId
    operation:
      method: GET
      path: /orders/{{params.orderId}}
  - name: woocommerce_update_order_status
    description: Set an order's status (e.g. processing → completed, on-hold → cancelled). Triggers WooCommerce's email + stock side-effects associated with the new status.
    input:
      type: object
      properties:
        orderId:
          type: integer
        status:
          type: string
          description: pending | processing | on-hold | completed | cancelled | refunded | failed.
      required:
        - orderId
        - status
    operation:
      method: PUT
      path: /orders/{{params.orderId}}
      body:
        value:
          status: '{{params.status}}'
  - name: woocommerce_add_order_note
    description: Add a note to an order. Customer-visible notes trigger an email; private notes are admin-only (audit trail).
    input:
      type: object
      properties:
        orderId:
          type: integer
        note:
          type: string
          description: Note body (plain text).
        customer_note:
          type: boolean
          description: true = customer-visible + emailed; false (default) = private admin note.
      required:
        - orderId
        - note
    operation:
      method: POST
      path: /orders/{{params.orderId}}/notes
      body:
        value:
          note: '{{params.note}}'
          customer_note: '{{params.customer_note}}'
  - name: woocommerce_list_refunds
    description: List refunds attached to an order.
    input:
      type: object
      properties:
        orderId:
          type: integer
      required:
        - orderId
    operation:
      method: GET
      path: /orders/{{params.orderId}}/refunds
  - name: woocommerce_create_refund
    description: Create a refund against an order. Pass an `amount` for a partial refund, or `api_refund=true` to also trigger refund via the payment gateway (Stripe, PayPal, etc.) when supported. Pass `line_items` to refund specific line items with their quantities.
    input:
      type: object
      properties:
        orderId:
          type: integer
        amount:
          type: string
          description: Decimal as string. Omit for full refund.
        reason:
          type: string
          description: Internal reason (admin-visible).
        refunded_by:
          type: integer
          description: User id performing the refund.
        api_refund:
          type: boolean
          description: When true (WC default), also refund via the payment gateway API (Stripe, PayPal, ...) where supported. Pass false to record the refund in WC only — useful for manual / bank-transfer flows.
        line_items:
          type: array
          description: Array of { id, quantity, refund_total, refund_tax }.
          items:
            type: object
      required:
        - orderId
    operation:
      method: POST
      path: /orders/{{params.orderId}}/refunds
      body:
        value:
          amount: '{{params.amount}}'
          reason: '{{params.reason}}'
          refunded_by: '{{params.refunded_by}}'
          api_refund: '{{params.api_refund}}'
          line_items: '{{params.line_items}}'
  - name: woocommerce_list_customers
    description: List customers. Filter by email, role, or registration date.
    input:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        search:
          type: string
          description: Match against email / first/last name.
        email:
          type: string
          description: Exact email match.
        role:
          type: string
          description: 'Default: customer.'
        orderby:
          type: string
          description: id | include | name | registered_date.
        order:
          type: string
    operation:
      method: GET
      path: /customers
      query:
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
        search: '{{params.search}}'
        email: '{{params.email}}'
        role: '{{params.role}}'
        orderby: '{{params.orderby}}'
        order: '{{params.order}}'
  - name: woocommerce_get_customer
    description: Get a customer by id (includes billing/shipping addresses, order count, total spent, last_order info).
    input:
      type: object
      properties:
        customerId:
          type: integer
      required:
        - customerId
    operation:
      method: GET
      path: /customers/{{params.customerId}}
  - name: woocommerce_sales_report
    description: Sales report for a date window or named period. Returns total_sales, net_sales, average_sales, total_orders, total_items, total_tax, total_shipping, total_refunds, total_discount.
    input:
