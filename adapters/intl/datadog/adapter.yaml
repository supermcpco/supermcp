# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: datadog
  name: Datadog
  description: Query Datadog (metrics, logs, monitors, events, incidents, dashboards) from any AI agent. 8 tools, dual-key auth.
  region: intl
  category: monitoring
  icon: datadog
  docsUrl: https://docs.datadoghq.com/api/latest/
  lint:
    allow:
      - healthcheck-present
credentials:
  DATADOG_API_KEY:
    required: true
    secret: true
  DATADOG_APP_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.datadoghq.com
auth:
  type: apiKey
  in: header
  name: DD-API-KEY
  value: '{{env.DATADOG_API_KEY}}'
  extraHeaders:
    DD-APPLICATION-KEY: '{{env.DATADOG_APP_KEY}}'
instructions: |-
  This connector wraps the Datadog REST API v1/v2 (api.datadoghq.com).

  **Setup**:
  1. In your Datadog org → **Personal Settings → Organization Settings → API Keys** → create or copy an API key. Set `DATADOG_API_KEY`.
  2. **Organization Settings → Application Keys** → create an application key with at least `monitors_read`, `logs_read_data`, `dashboards_read`, `events_read` scopes. Set `DATADOG_APP_KEY`.
  3. **Site matters**: Datadog has multiple regions: US1 (datadoghq.com — default), US3 (us3.datadoghq.com), US5 (us5.datadoghq.com), EU1 (datadoghq.eu), AP1 (ap1.datadoghq.com), US1-FED (ddog-gov.com). If your org is on a non-US1 site, change `baseUrl` accordingly. Wrong site = 403 with `Forbidden` and no useful body.

  **Authentication**: Datadog requires BOTH headers on every request:
  - `DD-API-KEY: ${DATADOG_API_KEY}` — identifies the org
  - `DD-APPLICATION-KEY: ${DATADOG_APP_KEY}` — identifies the user/permissions

  **Metrics query language**: `q` uses the Datadog metric query syntax — `avg:system.cpu.user{*}` or `sum:trace.web.request.hits{env:prod} by {service}`. See https://docs.datadoghq.com/dashboards/functions/.

  **Time windows**: `from` / `to` are UNIX epoch seconds (NOT milliseconds, NOT ISO strings). Default windows: last 1h for metrics, last 15min for logs.

  **Logs search**: uses the same query syntax as the Logs Explorer UI — `service:api status:error @http.status_code:>=500`. Returns `data[]` with `attributes.message`, `attributes.tags`, etc.

  **Rate limits**: most read endpoints are 300 req/h per org. Monitors API allows 100/min. 429 responses include `X-RateLimit-Reset` (epoch seconds).

  **Out of scope here**: agent install / install-script generation, SLO CRUD beyond list, RUM/synthetics CRUD.
tools:
  - name: datadog_query_metrics
    description: 'Run a metrics query over a time window. `q` uses the Datadog metric query language: e.g. `avg:system.cpu.user{*}` or `sum:requests{service:api,env:prod} by {host}`. Returns a series array with per-point [timestamp, value] pairs.'
    input:
      type: object
      properties:
        from:
          type: integer
          description: Start UNIX epoch seconds.
        to:
          type: integer
          description: End UNIX epoch seconds.
        query:
          type: string
          description: Datadog metric query expression.
      required:
        - from
        - to
        - query
    operation:
      method: GET
      path: /api/v1/query
      query:
        from: '{{params.from}}'
        to: '{{params.to}}'
        query: '{{params.query}}'
  - name: datadog_search_logs
    description: Search logs using the Logs Search syntax. Use this for 'show me errors in the last hour' or 'find logs containing X in service Y'.
    input:
      type: object
      properties:
        query:
          type: string
          description: Logs query string, e.g. 'service:api status:error'.
        from:
          type: string
          description: 'Start time: ISO 8601 OR relative like ''now-15m''.'
        to:
          type: string
          description: 'End time: ISO 8601 OR ''now''.'
        limit:
          type: integer
          description: Max events (1-1000). Default 10.
        sort:
          type: string
          description: '''timestamp'' (asc) or ''-timestamp'' (desc).'
      required:
        - query
    operation:
      method: POST
      path: /api/v2/logs/events/search
      body:
        value:
          filter:
            query: '{{params.query}}'
            from: '{{params.from}}'
            to: '{{params.to}}'
          page:
            limit: '{{params.limit}}'
          sort: '{{params.sort}}'
  - name: datadog_list_monitors
    description: List monitors. Filter by tags, name match, or monitor type. Returns each monitor's id, name, query, type, message, state.
    input:
      type: object
      properties:
        name:
          type: string
          description: Filter by name substring.
        tags:
          type: string
          description: Comma-separated tag list (AND).
        monitor_tags:
          type: string
          description: Filter by monitor-level tags.
        page:
          type: integer
          description: 0-based page index.
        page_size:
          type: integer
          description: Per page (max 100).
    operation:
      method: GET
      path: /api/v1/monitor
      query:
        name: '{{params.name}}'
        tags: '{{params.tags}}'
        monitor_tags: '{{params.monitor_tags}}'
        page: '{{params.page}}'
        page_size: '{{params.page_size}}'
  - name: datadog_get_monitor
    description: Get a single monitor by ID with full definition (query, thresholds, notifications, state).
    input:
      type: object
      properties:
        monitor_id:
          type: integer
          description: Monitor numeric ID.
      required:
        - monitor_id
    operation:
      method: GET
      path: /api/v1/monitor/{{params.monitor_id}}
  - name: datadog_list_dashboards
    description: List all dashboards in the org. Returns each dashboard's id, title, url, author, modified_at. Use this to find a dashboard ID before fetching its full layout.
    input:
      type: object
      properties:
        filter_shared:
          type: boolean
          description: If true, only shared dashboards.
    operation:
      method: GET
      path: /api/v1/dashboard
      query:
        filter[shared]: '{{params.filter_shared}}'
  - name: datadog_get_dashboard
    description: 'Fetch a dashboard''s full layout: widgets, queries, template variables.'
    input:
      type: object
      properties:
        dashboard_id:
          type: string
          description: Dashboard ID.
      required:
        - dashboard_id
    operation:
      method: GET
      path: /api/v1/dashboard/{{params.dashboard_id}}
  - name: datadog_list_events
    description: List events in a time range. Use for 'what deploys/alerts/changes happened today'. Filter by tags, priority, sources, or text query.
    input:
      type: object
      properties:
        start:
          type: integer
          description: Start UNIX epoch seconds.
        end:
          type: integer
          description: End UNIX epoch seconds.
        priority:
          type: string
          description: '''normal'' or ''low''.'
        sources:
          type: string
          description: Comma-separated sources, e.g. 'github,jira'.
        tags:
          type: string
          description: Comma-separated tags.
        unaggregated:
          type: boolean
          description: If true, return all events (not deduped/aggregated).
      required:
        - start
        - end
    operation:
      method: GET
      path: /api/v1/events
      query:
        start: '{{params.start}}'
        end: '{{params.end}}'
        priority: '{{params.priority}}'
        sources: '{{params.sources}}'
        tags: '{{params.tags}}'
        unaggregated: '{{params.unaggregated}}'
  - name: datadog_post_event
    description: Post an event to the Datadog event stream (useful for marking deploys, releases, manual incidents). Returns the created event's id + url.
    input:
      type: object
      properties:
        title:
          type: string
          description: Event title.
        text:
          type: string
          description: Event body (supports @-mentions and Markdown).
        tags:
          type: array
          description: Tag strings like 'env:prod' or 'service:api'.
        alert_type:
          type: string
          description: '''info'', ''warning'', ''error'', ''success'', ''user_update'', ''recommendation'', ''snapshot''.'
        priority:
          type: string
          description: '''normal'' or ''low''.'
      required:
        - title
        - text
    operation:
      method: POST
      path: /api/v1/events
      body:
        value:
          title: '{{params.title}}'
          text: '{{params.text}}'
          tags: '{{params.tags}}'
          alert_type: '{{params.alert_type}}'
          priority: '{{params.priority}}'
