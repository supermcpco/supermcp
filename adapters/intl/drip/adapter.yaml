# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: drip
  name: Drip
  description: 'Drive Drip (e-commerce-focused email + SMS automation) from any AI agent: subscribers, tags, campaigns, events, orders. 12 tools, Basic-auth + account_id in URL.'
  region: intl
  category: marketing-automation
  icon: drip
  docsUrl: https://developer.drip.com/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  DRIP_API_TOKEN:
    required: true
    secret: true
  DRIP_ACCOUNT_ID:
    required: true
transport:
  type: http
  baseUrl: https://api.getdrip.com/v2/{{env.DRIP_ACCOUNT_ID}}
auth:
  type: basic
  username: '{{env.DRIP_API_TOKEN}}'
instructions: |-
  This connector uses the Drip REST API v2 (developer.drip.com).

  **Setup**:
  1. Sign in to https://www.getdrip.com → top-right avatar → **My User Settings → API → API Token**.
  2. Note your **Account ID** (visible in the URL, e.g. `getdrip.com/9876543/...` → 9876543).
  3. Set:
     - `DRIP_API_TOKEN` = the API token
     - `DRIP_ACCOUNT_ID` = numeric account ID

  **Authentication**: HTTP Basic with username=API_TOKEN, password='' (empty). Adapter uses BASIC_AUTH with empty password.

  **Account-scoped URLs**: every endpoint is prefixed with `/v2/{account_id}/...`. The adapter substitutes via env var.

  **Subscriber model**: subscribers are identified by email (primary) or by external `user_id` (your DB's ID). Custom fields are unlimited key/value pairs.

  **Events drive workflows**: Drip's selling point is sending behavioral events (`drip_create_event`) that trigger automated workflows you've designed in the UI. Events: 'Placed Order', 'Browsed Category', 'Abandoned Cart', etc.

  **Tags**: simpler segmentation primitive. Apply via `drip_tag_subscriber` (POST /subscribers/{email}/tags).

  **Pagination**: `?page=N&per_page=M` (max 1000 for subscribers, smaller for others).

  **Rate limits**: 3600 req/hour per account on Free, higher on paid. On 429 honor Retry-After.

  **Out of scope here**: workflow management (UI-only), broadcasts (UI), conversion tracking goals, A/B testing.
tools:
  - name: drip_list_subscribers
    description: List subscribers with filters.
    input:
      type: object
      properties:
        status:
          type: string
          description: active, unsubscribed, all.
        tags:
          type: string
          description: Comma-separated tag names.
        subscribed_before:
          type: string
          description: ISO 8601.
        subscribed_after:
          type: string
          description: ISO 8601.
        page:
          type: integer
          description: Page (1-based).
        per_page:
          type: integer
          description: Per page (max 1000).
    operation:
      method: GET
      path: /subscribers
      query:
        status: '{{params.status}}'
        tags: '{{params.tags}}'
        subscribed_before: '{{params.subscribed_before}}'
        subscribed_after: '{{params.subscribed_after}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: drip_get_subscriber
    description: Fetch subscriber by ID OR email (URL-encoded). Returns all fields including tags, custom_fields.
    input:
      type: object
      properties:
        identifier:
          type: string
          description: Subscriber ID or URL-encoded email.
      required:
        - identifier
    operation:
      method: GET
      path: /subscribers/{{params.identifier}}
  - name: drip_create_or_update_subscriber
    description: Upsert subscriber by email. Drip auto-creates if missing, updates if exists.
    input:
      type: object
      properties:
        subscribers:
          type: array
          description: '[{email, user_id?, first_name?, last_name?, status?:''active''|''unsubscribed'', address1?, city?, state?, country?, postal_code?, time_zone?, lifetime_value?, custom_fields?:{...}, tags?:[], remove_tags?:[]}]. Wrap inside array.'
      required:
        - subscribers
    operation:
      method: POST
      path: /subscribers
      body:
        value:
          subscribers: '{{params.subscribers}}'
  - name: drip_unsubscribe
    description: Unsubscribe by email or ID.
    input:
      type: object
      properties:
        identifier:
          type: string
          description: ID or URL-encoded email.
      required:
        - identifier
    operation:
      method: POST
      path: /subscribers/{{params.identifier}}/unsubscribe_all
  - name: drip_tag_subscriber
    description: Add a single tag to a subscriber.
    input:
      type: object
      properties:
        tags:
          type: array
          description: '[{email, tag:''TagName''}].'
      required:
        - tags
    operation:
      method: POST
      path: /tags
      body:
        value:
          tags: '{{params.tags}}'
  - name: drip_remove_tag
    description: Remove a tag from a subscriber.
    input:
      type: object
      properties:
        email:
          type: string
          description: URL-encoded email.
        tag:
          type: string
          description: Tag name.
      required:
        - email
        - tag
    operation:
      method: DELETE
      path: /subscribers/{{params.email}}/tags/{{params.tag}}
  - name: drip_create_event
    description: 'Send a behavioral event for a subscriber. Triggers Drip workflows. Common: ''Placed Order'', ''Browsed Category'', ''Watched Video''.'
    input:
      type: object
      properties:
        events:
          type: array
          description: '[{email OR user_id, action:''EventName'', properties?:{...}, occurred_at?:ISO 8601}]. Wrap inside array.'
      required:
        - events
    operation:
      method: POST
      path: /events
      body:
        value:
          events: '{{params.events}}'
  - name: drip_list_campaigns
    description: List campaigns (active workflows / autoresponders). Each has id, name, status, from_email, from_name.
    input:
      type: object
      properties:
        status:
          type: string
          description: active, draft, paused, all.
        page:
          type: integer
          description: Page.
        per_page:
          type: integer
          description: Per page.
    operation:
      method: GET
      path: /campaigns
      query:
        status: '{{params.status}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: drip_subscribe_to_campaign
    description: Subscribe a contact to a campaign (enrolls in the workflow).
    input:
      type: object
      properties:
        campaignId:
          type: integer
          description: Campaign ID.
        subscribers:
          type: array
          description: '[{email, double_opt_in?:false, reactivate_if_removed?:true, ...subscriber fields...}].'
      required:
        - campaignId
        - subscribers
    operation:
      method: POST
      path: /campaigns/{{params.campaignId}}/subscribers
      body:
        value:
          subscribers: '{{params.subscribers}}'
  - name: drip_record_order
    description: 'Record an e-commerce order (used by Drip for revenue attribution and shopper segmentation). Required: order with email + provider + identifier.'
    input:
      type: object
      properties:
        orders:
          type: array
          description: '[{email, provider:''shopify''|''woocommerce''|..., identifier:''#1001'', amount:9999 (cents), items:[{product_id, sku, name, quantity, price, ...}], occurred_at?:ISO, currency?:''USD''}].'
      required:
        - orders
    operation:
      method: POST
      path: /orders
      body:
        value:
          orders: '{{params.orders}}'
  - name: drip_list_tags
    description: List all tags in the account with usage counts.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /tags
  - name: drip_list_custom_fields
    description: List custom field names defined on subscribers.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /custom_field_identifiers
