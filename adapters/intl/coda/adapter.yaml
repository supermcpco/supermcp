# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: coda
  name: Coda
  description: 'Drive Coda (docs + tables + formulas) from any AI agent: docs, tables, rows, columns, formulas, packs, controls. 13 tools, Bearer token auth.'
  region: intl
  category: project-management
  icon: coda
  docsUrl: https://coda.io/developers/apis/v1
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  CODA_API_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://coda.io/apis/v1
auth:
  type: bearer
  token: '{{env.CODA_API_TOKEN}}'
instructions: |-
  This connector uses the Coda API v1 (coda.io/developers/apis/v1).

  **Setup**:
  1. Sign in to https://coda.io → top-right avatar → **Account → API settings → Generate API token**.
  2. Name the token. Copy it. Set `CODA_API_TOKEN`.

  **Authentication**: `Authorization: Bearer ${CODA_API_TOKEN}`.

  **Resource hierarchy**: Doc → Section (Page) → Table → Row → Cell. Coda's twist: tables are first-class with structured columns and types; rows are addressable individually; columns can hold formulas.

  **Doc IDs** look like `dXXXXXXXXXX` (10-char prefix `d`). Visible in the doc URL.

  **Table IDs** look like `grid-XXXXX`. Discover via `coda_list_tables(docId)`.

  **Column IDs** look like `c-XXXX`. Discover via `coda_list_columns(docId, tableId)`. When upserting rows you reference cells by column ID OR column name.

  **Row IDs** look like `i-XXXX`. Available after a row is created.

  **Upserting rows (with key columns)**: pass `keyColumns` (array of column IDs/names) to `coda_upsert_rows` — Coda matches existing rows by those columns and updates them, otherwise inserts. Without `keyColumns`, it always inserts.

  **Cell value formats**:
    - Text/Number/Boolean: pass the raw value.
    - Date/DateTime: ISO 8601 string.
    - Person: pass an object `{email}`.
    - Lookup/Relation: pass the row ID of the related row OR the display value.
    - Image/Attachment: pass a public HTTPS URL.

  **Sync vs disableParsing**: by default Coda parses cell values (interprets formulas, types). Set `disableParsing=true` if you want raw string passthrough.

  **Pagination**: cursor via `pageToken` (returned in response's `nextPageToken`). `limit` default 25, max 200.

  **Rate limits**: 100 req/min per token. On 429 back off.

  **Out of scope here**: doc creation/publishing, control updates beyond list, pack version management, automations, formula evaluation arbitrary, sections beyond list.
tools:
  - name: coda_whoami
    description: Return the user the token belongs to. Returns name, loginId (email), pictureLink, type, tokenName, workspace.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /whoami
  - name: coda_list_docs
    description: List docs the user can access. Filter by owner, query, workspace. Pagination via pageToken.
    input:
      type: object
      properties:
        isOwner:
          type: boolean
          description: Only docs the user owns.
        isPublished:
          type: boolean
          description: Only published docs.
        query:
          type: string
          description: Substring search across doc names.
        sourceDoc:
          type: string
          description: Filter to copies of this doc ID.
        isStarred:
          type: boolean
          description: Only starred.
        inGallery:
          type: boolean
          description: Only gallery docs.
        workspaceId:
          type: string
          description: Filter by workspace.
        folderId:
          type: string
          description: Filter by folder.
        limit:
          type: integer
          description: Max per page (default 25, max 100).
        pageToken:
          type: string
          description: Pagination cursor.
    operation:
      method: GET
      path: /docs
      query:
        isOwner: '{{params.isOwner}}'
        isPublished: '{{params.isPublished}}'
        query: '{{params.query}}'
        sourceDoc: '{{params.sourceDoc}}'
        isStarred: '{{params.isStarred}}'
        inGallery: '{{params.inGallery}}'
        workspaceId: '{{params.workspaceId}}'
        folderId: '{{params.folderId}}'
        limit: '{{params.limit}}'
        pageToken: '{{params.pageToken}}'
  - name: coda_get_doc
    description: 'Fetch a single doc by ID. Returns metadata: name, owner, ownerName, browserLink, icon, workspace.'
    input:
      type: object
      properties:
        docId:
          type: string
          description: Doc ID (e.g. 'dXXXXXXXXXX').
      required:
        - docId
    operation:
      method: GET
      path: /docs/{{params.docId}}
  - name: coda_list_tables
    description: List tables in a doc. Each table has id (e.g. 'grid-XXXXX'), name, tableType (table/view), rowCount, displayColumn, sorts, layout.
    input:
      type: object
      properties:
        docId:
          type: string
          description: Doc ID.
        limit:
          type: integer
          description: Per page.
        pageToken:
          type: string
          description: Pagination cursor.
        sortBy:
          type: string
          description: name.
        tableTypes:
          type: string
          description: 'Comma-separated: table,view.'
      required:
        - docId
    operation:
      method: GET
      path: /docs/{{params.docId}}/tables
      query:
        limit: '{{params.limit}}'
        pageToken: '{{params.pageToken}}'
        sortBy: '{{params.sortBy}}'
        tableTypes: '{{params.tableTypes}}'
  - name: coda_list_columns
    description: List columns in a table. Each column has id (e.g. 'c-XXXX'), name, display (true if it's the display column), calculated, formula, format (type info).
    input:
      type: object
      properties:
        docId:
          type: string
          description: Doc ID.
        tableId:
          type: string
          description: Table ID.
        limit:
          type: integer
          description: Per page.
        pageToken:
          type: string
          description: Cursor.
      required:
        - docId
        - tableId
    operation:
      method: GET
      path: /docs/{{params.docId}}/tables/{{params.tableId}}/columns
      query:
        limit: '{{params.limit}}'
        pageToken: '{{params.pageToken}}'
  - name: coda_list_rows
    description: List rows in a table or view. Supports filtering by a query like 'Status="Active"' (uses Coda formula syntax with column IDs or names).
    input:
      type: object
      properties:
        docId:
          type: string
          description: Doc ID.
        tableId:
          type: string
          description: Table ID.
        query:
          type: string
          description: Filter formula, e.g. 'c-XXXX:"Active"' or 'Status="Active"'.
        useColumnNames:
          type: boolean
          description: If true, returned cells are keyed by column name. Default false (keyed by ID).
        valueFormat:
          type: string
          description: 'Output format: simple, simpleWithArrays, rich.'
        sortBy:
          type: string
          description: natural (default table order) or createdAt.
        visibleOnly:
          type: boolean
          description: Skip hidden columns.
        limit:
          type: integer
          description: Per page (default 25, max 200).
        pageToken:
          type: string
          description: Cursor.
      required:
        - docId
        - tableId
    operation:
      method: GET
      path: /docs/{{params.docId}}/tables/{{params.tableId}}/rows
      query:
        query: '{{params.query}}'
        useColumnNames: '{{params.useColumnNames}}'
        valueFormat: '{{params.valueFormat}}'
        sortBy: '{{params.sortBy}}'
        visibleOnly: '{{params.visibleOnly}}'
        limit: '{{params.limit}}'
        pageToken: '{{params.pageToken}}'
  - name: coda_get_row
    description: Fetch a single row by ID. Returns cells keyed by column ID (or name if useColumnNames=true).
    input:
      type: object
      properties:
        docId:
          type: string
          description: Doc ID.
        tableId:
          type: string
          description: Table ID.
        rowId:
          type: string
          description: Row ID (e.g. 'i-XXXX').
        useColumnNames:
          type: boolean
          description: Key cells by name vs ID.
        valueFormat:
          type: string
          description: simple, simpleWithArrays, rich.
      required:
        - docId
        - tableId
        - rowId
    operation:
      method: GET
      path: /docs/{{params.docId}}/tables/{{params.tableId}}/rows/{{params.rowId}}
      query:
        useColumnNames: '{{params.useColumnNames}}'
        valueFormat: '{{params.valueFormat}}'
  - name: coda_insert_rows
    description: Insert (or upsert with keyColumns) rows into a table. Returns a requestId for tracking the async ingest job.
    input:
      type: object
      properties:
        docId:
          type: string
          description: Doc ID.
        tableId:
          type: string
          description: Table ID.
        rows:
          type: array
          description: 'Array of row objects: [{cells: [{column: ''c-XXXX'' or column-name, value: ...}, ...]}, ...]. value can be string/number/boolean OR object for person ({email}) / row link (rowId string).'
        keyColumns:
          type: array
          description: Array of column IDs/names to match for upsert. Omit for pure insert.
        disableParsing:
          type: boolean
          description: If true, send raw values without Coda parsing.
      required:
        - docId
        - tableId
        - rows
    operation:
      method: POST
      path: /docs/{{params.docId}}/tables/{{params.tableId}}/rows
      query:
        disableParsing: '{{params.disableParsing}}'
      body:
        value:
          rows: '{{params.rows}}'
          keyColumns: '{{params.keyColumns}}'
  - name: coda_update_row
    description: Update a specific row by ID. Returns a requestId for tracking async update.
    input:
      type: object
      properties:
        docId:
          type: string
          description: Doc ID.
        tableId:
          type: string
          description: Table ID.
        rowId:
          type: string
          description: Row ID.
        row:
          type: object
          description: '{cells: [{column: ''c-XXXX'' or name, value: ...}, ...]}.'
        disableParsing:
          type: boolean
          description: Skip parsing.
      required:
        - docId
        - tableId
        - rowId
        - row
    operation:
      method: PUT
      path: /docs/{{params.docId}}/tables/{{params.tableId}}/rows/{{params.rowId}}
      query:
        disableParsing: '{{params.disableParsing}}'
      body:
        value:
          row: '{{params.row}}'
  - name: coda_delete_row
    description: Delete a single row by ID.
    input:
      type: object
      properties:
        docId:
          type: string
          description: Doc ID.
        tableId:
          type: string
          description: Table ID.
        rowId:
          type: string
          description: Row ID.
      required:
        - docId
        - tableId
        - rowId
    operation:
      method: DELETE
      path: /docs/{{params.docId}}/tables/{{params.tableId}}/rows/{{params.rowId}}
  - name: coda_delete_rows
    description: Bulk-delete rows by IDs (more efficient than per-row).
    input:
      type: object
      properties:
        docId:
          type: string
          description: Doc ID.
        tableId:
          type: string
          description: Table ID.
        rowIds:
          type: array
          description: Array of row IDs to delete.
      required:
        - docId
        - tableId
        - rowIds
    operation:
      method: DELETE
      path: /docs/{{params.docId}}/tables/{{params.tableId}}/rows
      body:
        value:
          rowIds: '{{params.rowIds}}'
  - name: coda_get_formula_result
    description: Evaluate a named formula on a doc. Returns the current value of a formula by name (defined in the doc via Add Formula).
    input:
      type: object
      properties:
        docId:
          type: string
          description: Doc ID.
        formulaIdOrName:
          type: string
          description: Formula ID or name (URL-encoded).
      required:
        - docId
        - formulaIdOrName
    operation:
      method: GET
      path: /docs/{{params.docId}}/formulas/{{params.formulaIdOrName}}
  - name: coda_get_mutation_status
    description: Check the status of an async mutation (insert/update/delete) by its requestId returned from those calls. Returns completed boolean.
    input:
      type: object
      properties:
        requestId:
          type: string
          description: RequestId from a prior mutation call.
      required:
        - requestId
    operation:
      method: GET
      path: /mutationStatus/{{params.requestId}}
