# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: redmine
  name: Redmine
  description: 'Redmine project management: issues with their journals, projects, versions, time entries, users and the enumerations behind statuses, priorities and trackers. REST API, API-key auth against your own instance.'
  region: intl
  category: project-management
  icon: redmine
  docsUrl: https://www.redmine.org/projects/redmine/wiki/Rest_api
credentials:
  REDMINE_URL:
    required: true
  REDMINE_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: '{{env.REDMINE_URL}}'
  headers:
    Accept: application/json
    Content-Type: application/json
auth:
  type: apiKey
  in: header
  name: X-Redmine-API-Key
  value: '{{env.REDMINE_API_KEY}}'
healthcheck:
  tool: redmine_get_current_user
  http:
    method: GET
    path: /users/current.json
instructions: |-
  **Turn the REST API on first.** It is off by default.
  1. As an administrator go to **Administration → Settings → API** and tick *Enable REST web service*.
  2. Open **My account** for the user the agent should act as; the **API access key** is in the right-hand sidebar. Show it and copy it.
  3. Set `REDMINE_URL` to your instance root (no trailing slash) and `REDMINE_API_KEY` to the key.

  **The header is `X-Redmine-API-Key`.** Redmine also accepts the key as a `key=` query parameter, but a header keeps it out of the web server's access log.

  **Permissions follow the user, per project role.** A project the user is not a member of is absent from the results rather than an error, and a role without *View issues* produces an empty issue list on a project that is full of them.

  **Custom fields are a nested array.** `cf_5` filters on custom field 5; the values come back in a `custom_fields` array of `{id, name, value}`, not as top-level properties.

  **Issue filters are query parameters with Redmine's own operators**: `status_id=open|closed|*|<id>`, `assigned_to_id=me|<id>`, `created_on=><2026-01-01|2026-03-31` for a range, `>=2026-01-01` for an open-ended one. `project_id` takes the numeric id *or* the project identifier string.

  **`include` fetches related data in one call.** On an issue, `include=journals,attachments,relations` saves several round trips — journals are the comment history and are omitted by default because they can be long.

  **Paging** is `offset` and `limit` (max 100), with `total_count` in the response body.

  **Self-hosted, which is the thing to plan for.**
  - On a **hosted supermcp instance** the instance must be reachable from the public internet on a real hostname with a valid TLS certificate. A self-signed certificate will fail: the connector offers no trust-anything switch.
  - On an internal host (`redmine.intern`, `10.0.0.x`), self-host supermcp on the same network and add that host to `SSRF_ALLOWED_HOSTS`, or the outbound guard refuses the call before it is made.

  **Writes**: `redmine_add_issue_note` posts a real note that notifies the issue's watchers.
tools:
  - name: redmine_get_current_user
    description: Read the user the API key belongs to, with their login, name, e-mail and project memberships. The fastest way to see which projects this connector can see.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /users/current.json
      query:
        include: memberships,groups
  - name: redmine_list_projects
    description: List projects with their id, identifier, name, description and status. The identifier string is what a project_id filter can take instead of the numeric id.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Rows per page, max 100.
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /projects.json
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: redmine_list_issues
    description: List issues with Redmine's filter operators. `status_id=open` and `assigned_to_id=me` are the two that answer most questions.
    input:
      type: object
      properties:
        project_id:
          type: string
          description: Numeric project id or the project identifier string.
        status_id:
          type: string
          description: '`open`, `closed`, `*` for all, or a numeric status id.'
        assigned_to_id:
          type: string
          description: '`me` or a numeric user id.'
        tracker_id:
          type: number
          description: Numeric tracker id, e.g. Bug or Feature.
        created_on:
          type: string
          description: Date filter, e.g. >=2026-01-01 or ><2026-01-01|2026-03-31.
        updated_on:
          type: string
          description: Date filter on the last update, same syntax.
        sort:
          type: string
          description: Sort expression, e.g. `updated_on:desc`.
        limit:
          type: number
          description: Rows per page, max 100.
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /issues.json
      query:
        project_id: '{{params.project_id}}'
        status_id: '{{params.status_id}}'
        assigned_to_id: '{{params.assigned_to_id}}'
        tracker_id: '{{params.tracker_id}}'
        created_on: '{{params.created_on}}'
        updated_on: '{{params.updated_on}}'
        sort: '{{params.sort}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: redmine_get_issue
    description: Read one issue in full with its journals — the comment and field-change history, which the list endpoint omits because it can be long.
    input:
      type: object
      properties:
        issueId:
          type: number
          description: Numeric issue id.
        include:
          type: string
          description: 'Comma-separated extras: journals, attachments, relations, children, watchers.'
      required:
        - issueId
    operation:
      method: GET
      path: /issues/{{params.issueId}}.json
      query:
        include: '{{params.include}}'
  - name: redmine_list_project_versions
    description: List the versions (milestones and sprints) of one project with their name, due date, status and sharing.
    input:
      type: object
      properties:
        projectId:
          type: string
          description: Numeric project id or the project identifier string.
      required:
        - projectId
    operation:
      method: GET
      path: /projects/{{params.projectId}}/versions.json
  - name: redmine_list_time_entries
    description: List logged time entries with their user, issue, project, date, hours and activity — the raw data behind any effort report.
    input:
      type: object
      properties:
        project_id:
          type: string
          description: Numeric project id or the project identifier string.
        user_id:
          type: string
          description: '`me` or a numeric user id.'
        spent_on:
          type: string
          description: Date filter, e.g. >=2026-09-01 or ><2026-09-01|2026-09-30.
        limit:
          type: number
          description: Rows per page, max 100.
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /time_entries.json
      query:
        project_id: '{{params.project_id}}'
        user_id: '{{params.user_id}}'
        spent_on: '{{params.spent_on}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: redmine_list_users
    description: List users with their login, name, e-mail and status, to resolve who an issue is assigned to. Requires an administrator key.
    input:
      type: object
      properties:
        status:
          type: number
          description: 1 active, 2 registered, 3 locked.
        name:
          type: string
          description: Fragment matched against login, name and e-mail.
        limit:
          type: number
          description: Rows per page, max 100.
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /users.json
      query:
        status: '{{params.status}}'
        name: '{{params.name}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: redmine_list_issue_statuses
    description: List the issue statuses this instance defines, with their id and whether each closes the issue. Needed to read a status_id filter correctly.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /issue_statuses.json
  - name: redmine_list_trackers
    description: List the trackers (Bug, Feature, Support and any custom ones) with their id and default status, so a tracker_id filter can be composed.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /trackers.json
  - name: redmine_add_issue_note
    description: Add a note to an issue. Writes to the live instance and notifies the watchers; set private_notes to keep it out of the customer's view.
    input:
      type: object
      properties:
        issueId:
          type: number
          description: Numeric issue id.
        notes:
          type: string
          description: Note text. Redmine's textile or markdown, depending on the instance's setting.
        private_notes:
          type: boolean
          description: When true, the note is visible only to users with the view-private-notes permission.
      required:
        - issueId
        - notes
    operation:
      method: PUT
      path: /issues/{{params.issueId}}.json
      body:
        value:
          issue:
            notes: '{{params.notes}}'
            private_notes: '{{params.private_notes}}'
