# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: height
  name: Height
  description: 'Drive Height (modern AI-native project management) from any AI agent: tasks, lists, fields, users, activities. 9 tools, API-key Bearer auth.'
  region: intl
  category: project-management
  icon: height
  docsUrl: https://height.app/api/docs
  lint:
    allow:
      - description-min-60
      - healthcheck-present
      - instructions-min-800
credentials:
  HEIGHT_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.height.app
auth:
  type: apiKey
  in: header
  name: Authorization
  value: api-key {{env.HEIGHT_API_KEY}}
instructions: |-
  This connector uses the Height API v1 (height.app/api/docs).

  **Setup**:
  1. Sign in to Height → top-right avatar → **Settings → API & webhooks → Generate API key**.
  2. Set `HEIGHT_API_KEY`.

  **Authentication**: `Authorization: api-key ${HEIGHT_API_KEY}` (literal `api-key ` prefix, NOT `Bearer`).

  **Tasks** are the primary object. Each task has status, name, description, assignees, dueDate, listIds[], fields (custom), parentTaskId (for subtasks).

  **Lists**: how tasks are organized (similar to ClickUp lists or Linear projects). A task can belong to multiple lists.

  **Custom fields**: defined at the workspace level. Reference via fields object {fieldId: value}.

  **Pagination**: cursor-based via `?cursor=...`.

  **Out of scope here**: chat, video huddles, integrations management.
tools:
  - name: height_get_workspace
    description: 'Return workspace info: id, model, url, name.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /workspace
  - name: height_list_lists
    description: List all lists in the workspace. Returns id, name, key, type (list/smartlist/section), appearance, archivedAt.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /lists
  - name: height_list_tasks
    description: 'List tasks with a filter query. Filter examples: ''{"listIds":{"values":["L-1"]}}'' or ''{"status":{"values":["backlog","started"]}}''. URL-encoded.'
    input:
      type: object
      properties:
        filters:
          type: string
          description: URL-encoded JSON filter expression.
        order:
          type: string
          description: JSON-encoded sort, e.g. '[{"field":"createdAt","direction":"desc"}]'.
    operation:
      method: GET
      path: /tasks
      query:
        filters: '{{params.filters}}'
        order: '{{params.order}}'
  - name: height_search_tasks
    description: Full-text search tasks.
    input:
      type: object
      properties:
        query:
          type: string
          description: Text query.
      required:
        - query
    operation:
      method: GET
      path: /tasks/search
      query:
        query: '{{params.query}}'
  - name: height_get_task
    description: Fetch a single task by ID OR index (e.g. 'T-42').
    input:
      type: object
      properties:
        taskIdOrIndex:
          type: string
          description: Task ID (UUID) or display index (e.g. 'T-42').
      required:
        - taskIdOrIndex
    operation:
      method: GET
      path: /tasks/{{params.taskIdOrIndex}}
  - name: height_create_task
    description: 'Create a task. Required: listIds + name.'
    input:
      type: object
      properties:
        listIds:
          type: array
          description: Array of list IDs the task belongs to (at least 1).
        name:
          type: string
          description: Task title.
        description:
          type: string
          description: Description (rich text, Markdown supported).
        assigneesIds:
          type: array
          description: Array of user IDs.
        status:
          type: string
          description: 'Status name (per workspace''s status list: e.g. ''backlog'', ''started'', ''completed'').'
        dueDate:
          type: string
          description: ISO 8601 date.
        parentTaskId:
          type: string
          description: If subtask, parent task ID.
        fields:
          type: object
          description: 'Custom fields: {fieldId: value, ...}.'
      required:
        - listIds
        - name
    operation:
      method: POST
      path: /tasks
      body:
        value:
          listIds: '{{params.listIds}}'
          name: '{{params.name}}'
          description: '{{params.description}}'
          assigneesIds: '{{params.assigneesIds}}'
          status: '{{params.status}}'
          dueDate: '{{params.dueDate}}'
          parentTaskId: '{{params.parentTaskId}}'
          fields: '{{params.fields}}'
  - name: height_update_task
    description: Update a task (PATCH).
    input:
      type: object
      properties:
        taskId:
          type: string
          description: Task ID.
        name:
          type: string
          description: New name.
        description:
          type: string
          description: New description.
        status:
          type: string
          description: Change status.
        assigneesIds:
          type: array
          description: Replace assignees.
        listIds:
          type: array
          description: Replace list memberships.
        dueDate:
          type: string
          description: Change due date.
        fields:
          type: object
          description: Update custom fields.
      required:
        - taskId
    operation:
      method: PATCH
      path: /tasks/{{params.taskId}}
      body:
        value:
          name: '{{params.name}}'
          description: '{{params.description}}'
          status: '{{params.status}}'
          assigneesIds: '{{params.assigneesIds}}'
          listIds: '{{params.listIds}}'
          dueDate: '{{params.dueDate}}'
          fields: '{{params.fields}}'
  - name: height_list_users
    description: List workspace users (members).
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /users
  - name: height_list_fields
    description: List custom fields defined in the workspace.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /fields
