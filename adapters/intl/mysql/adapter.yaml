# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: mysql
  name: MySQL / MariaDB
  description: 'Query a MySQL or MariaDB database directly: list tables, describe columns and run read-only SQL. Installs read-only; credentials are held encrypted rather than in the connection string.'
  region: intl
  category: database
  icon: mysql
  docsUrl: https://dev.mysql.com/doc/refman/8.4/en/
credentials:
  MYSQL_HOST:
    required: true
  MYSQL_PORT:
    required: true
  MYSQL_DATABASE:
    required: true
  MYSQL_USER:
    required: true
  MYSQL_PASSWORD:
    required: true
    secret: true
transport:
  type: database
  dsn: mysql://{{env.MYSQL_HOST}}:{{env.MYSQL_PORT}}/{{env.MYSQL_DATABASE}}
  driver: mysql
auth:
  type: database
  username: '{{env.MYSQL_USER}}'
  password: '{{env.MYSQL_PASSWORD}}'
healthcheck:
  tool: mysql_list_tables
instructions: |
  **Setup**
  1. Create a dedicated user and grant it only SELECT:
     ```sql
     CREATE USER 'amcp_reader'@'%' IDENTIFIED BY 'change-me';
     GRANT SELECT ON sales.* TO 'amcp_reader'@'%';
     FLUSH PRIVILEGES;
     ```
     Narrow `'%'` to the supermcp host if you can — MySQL's host part of the account name is a real access control and worth using.
  2. Set `MYSQL_HOST`, `MYSQL_PORT` (3306), `MYSQL_DATABASE`, `MYSQL_USER` and `MYSQL_PASSWORD`.

  **MariaDB works unchanged.** The engine also accepts a `mariadb://` DSN and normalises it, because the mysql2 driver only understands `mysql://`. Either scheme reaches a MariaDB server.

  **In MySQL a schema *is* a database.** `information_schema.tables.table_schema` holds the database name, so the listing below is scoped to the one database you configured rather than to a schema inside it.

  **How a database connector behaves**

  - **It installs read-only.** The engine rejects anything that is not a read
    until you flip the switch in the connector's settings. That is a guard rail,
    not a security boundary: give the connection a database role that is itself
    read-only, and the guard rail never has to matter.
  - **Credentials live in the encrypted `authConfig`**, not in the connection
    string. `MYSQL_USER` and `MYSQL_PASSWORD` are stored encrypted and spliced into the
    DSN at call time; the host and database name are stored in the plaintext
    `baseUrl` column.
  - **Results are capped at 1000 rows.** A query that would return more comes
    back truncated with a flag. Aggregate in SQL rather than in the agent.
  - **A statement runs exactly as written.** There is no query rewriting and no
    automatic LIMIT — an unbounded scan on a large table is a real unbounded
    scan on your production database. Say LIMIT.

  **Reachable from where?**

  - On a **hosted supermcp instance** the server must accept connections from the public
    internet, which for a production database usually means it should not. Point
    the connector at a read replica, or self-host supermcp inside the network.
  - **Self-hosted**, add the host to `SSRF_ALLOWED_HOSTS`: the outbound guard
    blocks private address space by default, and `10.0.0.5` is exactly the shape
    it is there to block.
tools:
  - name: mysql_list_tables
    description: List the tables and views in the database with their schema and, where the server tracks it, an approximate row count. Start here — it is the map of what can be queried.
    input:
      type: object
      properties: {}
    operation:
      kind: sql
      statement: SELECT table_schema, table_name, table_type, table_rows FROM information_schema.tables WHERE table_schema = DATABASE() ORDER BY table_name
  - name: mysql_describe_table
    description: 'Describe one table: every column with its data type, nullability and default. Read this before writing a query against a table you have not seen.'
    input:
      type: object
      properties:
        table_name:
          type: string
          description: Table name, without the schema prefix.
      required:
        - table_name
    operation:
      kind: sql
      statement: SELECT column_name, column_type, is_nullable, column_default, column_key FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = {{params.table_name}} ORDER BY ordinal_position
  - name: mysql_find_columns
    description: Find columns across every table whose name matches a pattern — the fast way to locate where customer e-mail addresses, IBANs or order numbers actually live.
    input:
      type: object
      properties:
        pattern:
          type: string
          description: SQL LIKE pattern matched against the column name, e.g. %email% or %_id.
      required:
        - pattern
    operation:
      kind: sql
      statement: SELECT table_name, column_name, column_type FROM information_schema.columns WHERE table_schema = DATABASE() AND column_name LIKE {{params.pattern}} ORDER BY table_name, column_name
  - name: mysql_query
    description: Run a read-only SQL statement against MySQL / MariaDB and return up to 1000 rows. The statement runs exactly as written — there is no automatic LIMIT, so say LIMIT.
    input:
      type: object
      properties:
        query:
          type: string
          description: A single SQL SELECT statement. Include your own LIMIT; nothing is added for you.
      required:
        - query
    operation:
      kind: sql
      statement: '{{params.query | raw}}'
  - name: mysql_query_examples
    description: 'Show worked example queries for MySQL / MariaDB: how to list schemas, find large tables, inspect indexes and check what is running right now. Costs nothing and touches no data.'
    input:
      type: object
      properties: {}
    operation:
      kind: static
      value: |
        MySQL / MariaDB example queries

        -- The ten largest tables in this database
        SELECT table_name, table_rows,
               ROUND((data_length + index_length) / 1024 / 1024, 1) AS mb
        FROM information_schema.tables WHERE table_schema = DATABASE()
        ORDER BY data_length + index_length DESC LIMIT 10;

        -- Indexes on a table
        SHOW INDEX FROM orders;

        -- Foreign keys out of a table
        SELECT constraint_name, column_name, referenced_table_name, referenced_column_name
        FROM information_schema.key_column_usage
        WHERE table_schema = DATABASE() AND table_name = 'orders'
          AND referenced_table_name IS NOT NULL;

        -- Tables with no primary key — usually a mistake worth reporting
        SELECT t.table_name FROM information_schema.tables t
        LEFT JOIN information_schema.table_constraints c
          ON c.table_schema = t.table_schema AND c.table_name = t.table_name
         AND c.constraint_type = 'PRIMARY KEY'
        WHERE t.table_schema = DATABASE() AND t.table_type = 'BASE TABLE'
          AND c.constraint_name IS NULL;

        -- Columns whose name suggests personal data
        SELECT table_name, column_name FROM information_schema.columns
        WHERE table_schema = DATABASE()
          AND column_name REGEXP '(email|phone|iban|birth|passwor|ssn|tax)'
        ORDER BY 1, 2;

        -- Character sets in use, for a mojibake investigation
        SELECT table_name, column_name, character_set_name, collation_name
        FROM information_schema.columns
        WHERE table_schema = DATABASE() AND character_set_name IS NOT NULL
        GROUP BY 1, 2, 3, 4;
