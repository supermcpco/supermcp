# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: substack
  name: Substack
  description: Read Substack publication content, posts, comments, podcast episodes via public RSS/JSON feeds. 5 tools, no auth required.
  region: intl
  category: publishing
  icon: substack
  docsUrl: https://substack.com/help/articles/4445-substack-content-api
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  SUBSTACK_PUBLICATION_URL:
    required: true
transport:
  type: http
  baseUrl: '{{env.SUBSTACK_PUBLICATION_URL}}'
auth:
  type: none
instructions: |-
  This connector uses Substack's PUBLIC content endpoints (Substack does not yet publish a formal REST API for writes — programmatic post creation/comments require the legacy session-cookie API which isn't supported here).

  **Setup**: NO API KEY. Set `SUBSTACK_PUBLICATION_URL` = the publication's base URL (e.g. `https://lennysnewsletter.substack.com`). For tools that target a specific publication, the URL is taken from this env var.

  **Authentication**: NONE. All reads use public endpoints (the same JSON Substack's own site fetches).

  **Content endpoints available**:
    - `/api/v1/posts?limit=N&offset=M` — paginated posts list (each post: id, title, slug, post_date, audience, type)
    - `/api/v1/posts/by-id/{id}` — single post detail
    - `/api/v1/comments/{post_id}` — top comments on a post
    - `/api/v1/podcast/feed` — podcast episodes (audio newsletters only)
    - `/feed` — standard RSS feed

  **Out of scope here**: creating posts (no public write API), email subscribers list, paid-subscriber management, comment moderation. All UI-only as of 2025.

  **Rate limits**: Substack doesn't publish numbers; be polite (1 req/sec recommended) and cache aggressively. They'll throttle abusive IPs.
tools:
  - name: substack_list_posts
    description: List recent posts from the publication. Each post has id, title, subtitle, slug, post_date, audience (everyone/only_paid/only_free/founding), type (newsletter/podcast/thread), wordcount, reactions.
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Max per page (default 12, max 50 typically).
        offset:
          type: integer
          description: Pagination offset.
        sort:
          type: string
          description: new (most-recent first, default) or popular.
    operation:
      method: GET
      path: /api/v1/posts
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        sort: '{{params.sort}}'
  - name: substack_search_posts
    description: 'Full-text search the publication''s post archive. Returns an array of matching posts (same shape as substack_list_posts: id, title, slug, post_date, audience, type). Empty array when nothing matches.'
    input:
      type: object
      properties:
        query:
          type: string
          description: Search query (matches title/body across the publication archive).
        limit:
          type: integer
          description: Max results (default 12).
        offset:
          type: integer
          description: Pagination offset.
      required:
        - query
    operation:
      method: GET
      path: /api/v1/archive
      query:
        sort: new
        search: '{{params.query}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: substack_get_post_by_id
    description: Fetch a single post by its numeric ID. Returns full body_html, subtitle, post_date, audience, podcast_url if applicable.
    input:
      type: object
      properties:
        postId:
          type: integer
          description: Post numeric ID.
      required:
        - postId
    operation:
      method: GET
      path: /api/v1/posts/by-id/{{params.postId}}
  - name: substack_get_comments
    description: Get top comments on a post. Returns nested comment threads.
    input:
      type: object
      properties:
        postId:
          type: integer
          description: Post ID.
      required:
        - postId
    operation:
      method: GET
      path: /api/v1/post/{{params.postId}}/comments
  - name: substack_get_rss_feed
    description: Fetch the publication's standard RSS feed (Atom format). Useful for systems that already speak RSS.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /feed
