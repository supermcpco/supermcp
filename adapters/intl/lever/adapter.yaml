# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: lever
  name: Lever
  description: Manage Lever ATS (candidates, opportunities, postings, stages, feedback) from any AI agent. 10 tools, basic-auth.
  region: intl
  category: hr
  icon: lever
  docsUrl: https://hire.lever.co/developer/documentation
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  LEVER_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.lever.co/v1
auth:
  type: basic
  username: '{{env.LEVER_API_KEY}}'
instructions: |-
  This connector wraps the Lever Hire API v1 (api.lever.co/v1).

  **Setup**:
  1. In Lever → **Settings → Integrations and API → API Credentials → Generate new key**.
  2. Set `LEVER_API_KEY`.
  3. **Sandbox**: use `https://api.sandbox.lever.co/v1` instead during testing.

  **Authentication**: HTTP Basic — API key as username, empty password.

  **Opportunity vs Candidate**: in Lever's modern API, an `Opportunity` represents a candidate's interest in a single posting. A person can have multiple opportunities (one per role). The legacy `Candidate` endpoint still works but Opportunity is preferred.

  **Pagination**: cursor-based. List endpoints return `next` (cursor) in the response body; pass back as `offset`.

  **Rate limits**: 8 req/sec per API key. 429 with `Retry-After`.

  **Out of scope here**: requisitions CRUD beyond list, EEO survey responses, the separate Nurture / Sourcer extension APIs.
tools:
  - name: lever_list_opportunities
    description: List opportunities (candidate × posting). Filter by stage, posting, owner, created_at.
    input:
      type: object
      properties:
        stage_id:
          type: string
          description: Filter by stage.
        posting_id:
          type: string
          description: Filter by posting.
        owner_id:
          type: string
          description: Filter by owner.
        archived:
          type: boolean
          description: Include archived.
        created_at_start:
          type: integer
          description: UNIX epoch ms.
        created_at_end:
          type: integer
          description: UNIX epoch ms.
        limit:
          type: integer
          description: Max per page.
        offset:
          type: string
          description: Cursor from previous response.
    operation:
      method: GET
      path: /opportunities
      query:
        stage_id: '{{params.stage_id}}'
        posting_id: '{{params.posting_id}}'
        owner_id: '{{params.owner_id}}'
        archived: '{{params.archived}}'
        created_at_start: '{{params.created_at_start}}'
        created_at_end: '{{params.created_at_end}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: lever_get_opportunity
    description: Get one opportunity with full contact, links, tags, applications.
    input:
      type: object
      properties:
        opportunity_id:
          type: string
          description: Opportunity ID.
      required:
        - opportunity_id
    operation:
      method: GET
      path: /opportunities/{{params.opportunity_id}}
  - name: lever_create_opportunity
    description: 'Create an opportunity (candidate with associated posting). Required: name + at least one email; perform_as is the Lever user ID acting.'
    input:
      type: object
      properties:
        perform_as:
          type: string
          description: Lever user ID making the create.
        name:
          type: string
          description: Candidate name.
        emails:
          type: array
          description: Array of email strings.
        phones:
          type: array
          description: Array of {type, value}.
        location:
          type: object
          description: '{name} location.'
        postings:
          type: array
          description: Array of posting ID strings to apply to.
        stage:
          type: string
          description: Initial stage ID.
        owner:
          type: string
          description: Lever user ID owner.
        tags:
          type: array
          description: Tag strings.
        origin:
          type: string
          description: applied, referred, sourced.
      required:
        - perform_as
        - name
        - emails
    operation:
      method: POST
      path: /opportunities
      query:
        perform_as: '{{params.perform_as}}'
      body:
        value:
          name: '{{params.name}}'
          emails: '{{params.emails}}'
          phones: '{{params.phones}}'
          location: '{{params.location}}'
          postings: '{{params.postings}}'
          stage: '{{params.stage}}'
          owner: '{{params.owner}}'
          tags: '{{params.tags}}'
          origin: '{{params.origin}}'
  - name: lever_update_opportunity_stage
    description: Move an opportunity to a different stage.
    input:
      type: object
      properties:
        opportunity_id:
          type: string
          description: Opportunity ID.
        perform_as:
          type: string
          description: Lever user ID.
        stage:
          type: string
          description: Target stage ID.
      required:
        - opportunity_id
        - perform_as
        - stage
    operation:
      method: PUT
      path: /opportunities/{{params.opportunity_id}}/stage
      query:
        perform_as: '{{params.perform_as}}'
      body:
        value:
          stage: '{{params.stage}}'
  - name: lever_archive_opportunity
    description: Archive an opportunity with an archive reason.
    input:
      type: object
      properties:
        opportunity_id:
          type: string
          description: Opportunity ID.
        perform_as:
          type: string
          description: Lever user ID.
        reason:
          type: string
          description: Archive reason ID.
      required:
        - opportunity_id
        - perform_as
        - reason
    operation:
      method: PUT
      path: /opportunities/{{params.opportunity_id}}/archived
      query:
        perform_as: '{{params.perform_as}}'
      body:
        value:
          reason: '{{params.reason}}'
  - name: lever_list_postings
    description: List job postings.
    input:
      type: object
      properties:
        state:
          type: string
          description: published, internal, closed, draft, pending, rejected.
        team:
          type: string
          description: Filter by team.
        location:
          type: string
          description: Filter by location.
        limit:
          type: integer
          description: Max per page.
        offset:
          type: string
          description: Cursor.
    operation:
      method: GET
      path: /postings
      query:
        state: '{{params.state}}'
        team: '{{params.team}}'
        location: '{{params.location}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: lever_list_stages
    description: List pipeline stages.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /stages
  - name: lever_list_users
    description: List Lever users (recruiters, hiring managers).
    input:
      type: object
      properties:
        access_role:
          type: string
          description: Filter by role.
        email:
          type: string
          description: Filter by email.
        limit:
          type: integer
          description: Max per page.
    operation:
      method: GET
      path: /users
      query:
        access_role: '{{params.access_role}}'
        email: '{{params.email}}'
        limit: '{{params.limit}}'
  - name: lever_list_archive_reasons
    description: List archive reasons configured in the org. Use this to find valid `reason` IDs for archive calls.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /archive_reasons
  - name: lever_list_feedback
    description: List interview feedback forms attached to an opportunity.
    input:
      type: object
      properties:
        opportunity_id:
          type: string
          description: Opportunity ID.
      required:
        - opportunity_id
    operation:
      method: GET
      path: /opportunities/{{params.opportunity_id}}/feedback
