# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: resy
  name: Resy
  description: Search Resy restaurants from any AI assistant. Find restaurants by city, geo coordinate, or curated list (top-rated, new, etc.), read venue detail, check live availability calendar. 6 tools, no auth — reverse-engineered from the Resy mobile app.
  region: intl
  category: food
  icon: resy
  docsUrl: https://resy.com
  priority: 84
  featured: true
  lint:
    allow:
      - healthcheck-present
transport:
  type: http
  baseUrl: https://api.resy.com
auth:
  type: none
instructions: |-
  This connector wraps the Resy mobile app's internal API (api.resy.com).

  **Setup**: nothing. The endpoints exposed here are the same the Resy iOS app uses for restaurant discovery and are accessible without a user login.

  **What it does NOT do**: complete reservations. Resy's notify/book flow requires a logged-in session and triggers bot-detection. Use this connector to *find* slots; book in the Resy app.

  **City codes**: Resy uses short codes like `ny` (NYC), `la` (LA), `lon` (London), `mia` (Miami), `dc` (Washington DC), `ath` (Athens). Use `resy_get_location_config` to discover available cities.

  **Curated lists**: Resy publishes editorial lists per city — `top-rated`, `new-on-resy`, `most-bookmarked`, etc. Use `resy_get_city_list` with the list slug to fetch them.

  **Date format**: `YYYY-MM-DD` (e.g. `2026-05-24`).

  **Suggested starter prompts**:
  - "Find the top-rated Italian restaurants in NYC this Saturday at 7 PM for 4 people."
  - "What's new on Resy in London this week?"
  - "Check Carbone's calendar for the next 30 days, party of 2."
tools:
  - name: resy_search_venues
    description: Geo search Resy venues near a coordinate, with optional party size and date filters. Returns venues with id, name, neighborhood, cuisine, price band, and available time slots.
    input:
      type: object
      properties:
        latitude:
          type: number
          description: Search center latitude.
        longitude:
          type: number
          description: Search center longitude.
        party_size:
          type: integer
          description: Party size.
          default: 2
          minimum: 1
          maximum: 20
        day:
          type: string
          description: Date in YYYY-MM-DD, e.g. '2026-05-24'.
      required:
        - latitude
        - longitude
    proxy: true
    operation:
      method: POST
      path: /3/venuesearch/search
      body:
        value:
          venue_filter:
            venue_id: []
          availability: true
          slot_filter:
            party_size: '{{params.party_size}}'
            day: '{{params.day}}'
          geo:
            user:
              latitude: '{{params.latitude}}'
              longitude: '{{params.longitude}}'
  - name: resy_find_availability
    description: Find available slots at one or more venues on a given day for a party size, optionally near a coordinate. Returns slots with start time, table type, and configuration token for booking.
    input:
      type: object
      properties:
        day:
          type: string
          description: Date in YYYY-MM-DD.
        party_size:
          type: integer
          default: 2
          minimum: 1
          maximum: 20
        location:
          type: string
          description: City code (e.g. 'ny', 'la', 'lon', 'mia', 'ath').
        venue_id:
          type: integer
          description: 'Optional: limit to one venue.'
        lat:
          type: number
          description: Search center latitude.
        long:
          type: number
          description: Search center longitude.
      required:
        - day
        - party_size
    proxy: true
    operation:
      method: GET
      path: /4/find
      query:
        day: '{{params.day}}'
        party_size: '{{params.party_size}}'
        location: '{{params.location}}'
        venue_id: '{{params.venue_id}}'
        lat: '{{params.lat}}'
        long: '{{params.long}}'
  - name: resy_get_venue
    description: Full venue detail — name, address, cuisine, photos, menu, hours, descriptions. Pass venue_id from search or find.
    input:
      type: object
      properties:
        id:
          type: integer
          description: Venue ID.
      required:
        - id
    proxy: true
    operation:
      method: GET
      path: /3/venue
      query:
        id: '{{params.id}}'
  - name: resy_get_venue_calendar
    description: Get the booking calendar for one venue across a date range — which days have availability for a given party size.
    input:
      type: object
      properties:
        venue_id:
          type: integer
        num_seats:
          type: integer
          description: Party size.
          default: 2
        start_date:
          type: string
          description: YYYY-MM-DD.
        end_date:
          type: string
          description: YYYY-MM-DD.
      required:
        - venue_id
        - start_date
        - end_date
    proxy: true
    operation:
      method: GET
      path: /4/venue/calendar
      query:
        venue_id: '{{params.venue_id}}'
        num_seats: '{{params.num_seats}}'
        start_date: '{{params.start_date}}'
        end_date: '{{params.end_date}}'
  - name: resy_get_city_list
    description: Get a Resy editorial list for a city — e.g. 'top-rated', 'new-on-resy', 'most-bookmarked'. Returns the curated venues.
    input:
      type: object
      properties:
        city:
          type: string
          description: City code, e.g. 'ny', 'la', 'lon', 'ath'.
        list:
          type: string
          description: List slug, e.g. 'top-rated', 'new-on-resy', 'climbing' (city-specific lists vary).
      required:
        - city
        - list
    proxy: true
    operation:
      method: GET
      path: /3/cities/{{params.city}}/list/{{params.list}}
  - name: resy_get_location_config
    description: Get Resy's configuration for available cities, neighborhoods, and cuisines. Use first to discover what's queryable.
    input:
      type: object
      properties: {}
    proxy: true
    operation:
      method: GET
      path: /3/location/config
