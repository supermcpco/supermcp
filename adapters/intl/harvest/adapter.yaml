# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: harvest
  name: Harvest
  description: Manage Harvest (time tracking, projects, clients, invoices, expenses) from any AI agent. 10 tools, Bearer auth with account-ID header.
  region: intl
  category: time-tracking
  icon: harvest
  docsUrl: https://help.getharvest.com/api-v2/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  HARVEST_ACCESS_TOKEN:
    required: true
    secret: true
  HARVEST_ACCOUNT_ID:
    required: true
transport:
  type: http
  baseUrl: https://api.harvestapp.com/v2
  headers:
    Harvest-Account-Id: '{{env.HARVEST_ACCOUNT_ID}}'
    User-Agent: supermcp (support@supermcp.dev)
auth:
  type: bearer
  token: '{{env.HARVEST_ACCESS_TOKEN}}'
instructions: |-
  This connector wraps the Harvest API v2 (api.harvestapp.com/v2).

  **Setup**:
  1. Log into https://id.getharvest.com → bottom-left avatar → **Developers → Create new personal access token**.
  2. Copy the **token** and the **Account ID** shown on the same page (a 7-digit number like `1234567`).
  3. Set both: `HARVEST_ACCESS_TOKEN` and `HARVEST_ACCOUNT_ID`.

  **Authentication**: every request requires BOTH:
  - `Authorization: Bearer ${HARVEST_ACCESS_TOKEN}`
  - `Harvest-Account-Id: ${HARVEST_ACCOUNT_ID}`
  - A `User-Agent` header (Harvest API requires it — the adapter sets `supermcp (support@supermcp.dev)`).

  Missing the account header returns `401 Unauthorized` even with a valid token — confusing but documented.

  **Hierarchy**: `Client → Project → Task assignment → Time entry`. To log time, you need the project ID + task ID. List projects to find IDs.

  **Dates** are ISO 8601 (`2026-05-20`). `spent_date` on a time entry is required.

  **Pagination**: `page` (1-based) + `per_page` (max 100). Total in `total_pages`.

  **Rate limits**: 100 req / 15s per account; 1k req / 15s globally per token. 429 returns no Retry-After — back off 15s.

  **Out of scope here**: invoice line CRUD beyond list/get, estimates, contacts, expenses categories management, recurring schedules.
tools:
  - name: harvest_who_am_i
    description: 'Return the currently authenticated user: id, first_name, last_name, email, is_admin, default_hourly_rate, weekly_capacity.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /users/me
  - name: harvest_list_clients
    description: List clients. Each has id, name, is_active, address, currency.
    input:
      type: object
      properties:
        is_active:
          type: boolean
          description: Filter to active only.
        updated_since:
          type: string
          description: ISO 8601 datetime — only clients updated after this.
        page:
          type: integer
          description: 1-based page index.
        per_page:
          type: integer
          description: Max 100.
    operation:
      method: GET
      path: /clients
      query:
        is_active: '{{params.is_active}}'
        updated_since: '{{params.updated_since}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: harvest_list_projects
    description: 'List projects. Most useful filter: `client_id` to drill into one client''s projects. Returns id, name, code, is_active, is_billable, budget, hourly_rate, client info.'
    input:
      type: object
      properties:
        client_id:
          type: integer
          description: Filter to one client's projects.
        is_active:
          type: boolean
          description: Filter to active only.
        page:
          type: integer
          description: 1-based.
        per_page:
          type: integer
          description: Max 100.
    operation:
      method: GET
      path: /projects
      query:
        client_id: '{{params.client_id}}'
        is_active: '{{params.is_active}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: harvest_list_tasks
    description: 'List task templates (the canonical Harvest ''task'' types: ''Programming'', ''Design'', etc.) that can be assigned to projects.'
    input:
      type: object
      properties:
        is_active:
          type: boolean
          description: Filter to active only.
        page:
          type: integer
          description: 1-based.
        per_page:
          type: integer
          description: Max 100.
    operation:
      method: GET
      path: /tasks
      query:
        is_active: '{{params.is_active}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: harvest_list_time_entries
    description: 'List time entries. Most useful filters: `from`/`to` for date range, `user_id` for one user, `project_id` for one project. Returns each entry with hours, notes, billable status, dates, project, task.'
    input:
      type: object
      properties:
        user_id:
          type: integer
          description: Filter to one user.
        client_id:
          type: integer
          description: Filter to one client.
        project_id:
          type: integer
          description: Filter to one project.
        task_id:
          type: integer
          description: Filter to one task.
        from:
          type: string
          description: Start date (ISO 8601 YYYY-MM-DD).
        to:
          type: string
          description: End date (YYYY-MM-DD).
        is_billed:
          type: boolean
          description: Filter by billed status.
        is_running:
          type: boolean
          description: Only currently-running timers.
        page:
          type: integer
          description: 1-based.
        per_page:
          type: integer
          description: Max 100.
    operation:
      method: GET
      path: /time_entries
      query:
        user_id: '{{params.user_id}}'
        client_id: '{{params.client_id}}'
        project_id: '{{params.project_id}}'
        task_id: '{{params.task_id}}'
        from: '{{params.from}}'
        to: '{{params.to}}'
        is_billed: '{{params.is_billed}}'
        is_running: '{{params.is_running}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: harvest_create_time_entry
    description: Log time on a project + task. EITHER supply `hours` for a manual entry OR omit hours to start a running timer (you'll need to stop it later with harvest_stop_timer).
    input:
      type: object
      properties:
        project_id:
          type: integer
          description: Project ID.
        task_id:
          type: integer
          description: Task ID assigned to this project.
        spent_date:
          type: string
          description: Date worked (YYYY-MM-DD).
        hours:
          type: number
          description: Hours worked. Omit to start a running timer.
        notes:
          type: string
          description: Optional notes.
        user_id:
          type: integer
          description: Defaults to current user; admins can log for others.
        external_reference:
          type: object
          description: External system reference {id, group_id, account_id, permalink, service, service_icon_url}.
      required:
        - project_id
        - task_id
        - spent_date
    operation:
      method: POST
      path: /time_entries
      body:
        value:
          project_id: '{{params.project_id}}'
          task_id: '{{params.task_id}}'
          spent_date: '{{params.spent_date}}'
          hours: '{{params.hours}}'
          notes: '{{params.notes}}'
          user_id: '{{params.user_id}}'
          external_reference: '{{params.external_reference}}'
  - name: harvest_update_time_entry
    description: Update fields on an existing time entry (notes, hours, project, task).
    input:
      type: object
      properties:
        time_entry_id:
          type: integer
          description: Time entry ID.
        hours:
          type: number
          description: New hours.
        notes:
          type: string
          description: New notes.
        project_id:
          type: integer
          description: Move to a different project.
        task_id:
          type: integer
          description: Move to a different task.
      required:
        - time_entry_id
    operation:
      method: PATCH
      path: /time_entries/{{params.time_entry_id}}
      body:
        value:
          hours: '{{params.hours}}'
          notes: '{{params.notes}}'
          project_id: '{{params.project_id}}'
          task_id: '{{params.task_id}}'
  - name: harvest_stop_timer
    description: Stop a currently-running time entry timer.
    input:
      type: object
      properties:
        time_entry_id:
          type: integer
          description: Running time entry ID.
      required:
        - time_entry_id
    operation:
      method: PATCH
      path: /time_entries/{{params.time_entry_id}}/stop
  - name: harvest_list_invoices
    description: List invoices. Filter by client_id, state ('draft', 'open', 'paid', 'closed'), date range. Returns each invoice's number, amount, due_date, paid_date, currency, line items count.
    input:
      type: object
      properties:
        client_id:
          type: integer
          description: Filter to one client.
        project_id:
          type: integer
          description: Filter to one project.
        state:
          type: string
          description: draft, open, paid, closed.
        from:
          type: string
          description: Issued from (YYYY-MM-DD).
        to:
          type: string
          description: Issued to (YYYY-MM-DD).
        page:
          type: integer
          description: 1-based.
        per_page:
          type: integer
          description: Max 100.
    operation:
      method: GET
      path: /invoices
      query:
        client_id: '{{params.client_id}}'
        project_id: '{{params.project_id}}'
        state: '{{params.state}}'
        from: '{{params.from}}'
        to: '{{params.to}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: harvest_list_expenses
    description: List expenses. Filter by client, project, user, date range. Returns each expense's amount, units, billable status, receipt URL.
    input:
      type: object
      properties:
        user_id:
          type: integer
          description: Filter to one user.
        client_id:
          type: integer
          description: Filter to one client.
        project_id:
          type: integer
          description: Filter to one project.
        is_billed:
          type: boolean
          description: Filter by billed status.
        from:
          type: string
          description: Spent from (YYYY-MM-DD).
        to:
          type: string
          description: Spent to (YYYY-MM-DD).
        page:
          type: integer
          description: 1-based.
        per_page:
          type: integer
          description: Max 100.
    operation:
      method: GET
      path: /expenses
      query:
        user_id: '{{params.user_id}}'
        client_id: '{{params.client_id}}'
        project_id: '{{params.project_id}}'
        is_billed: '{{params.is_billed}}'
        from: '{{params.from}}'
        to: '{{params.to}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
