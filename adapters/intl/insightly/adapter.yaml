# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: insightly
  name: Insightly
  description: 'Drive Insightly (CRM + project management) from any AI agent: contacts, organisations, leads, opportunities, projects, tasks. 12 tools, Basic auth.'
  region: intl
  category: crm
  icon: insightly
  docsUrl: https://api.insightly.com/v3.1/Help
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  INSIGHTLY_API_KEY:
    required: true
    secret: true
  INSIGHTLY_POD:
    required: true
transport:
  type: http
  baseUrl: https://api.{{env.INSIGHTLY_POD}}.insightly.com/v3.1
auth:
  type: basic
  username: '{{env.INSIGHTLY_API_KEY}}'
instructions: |-
  This connector uses the Insightly REST API v3.1 (api.insightly.com/v3.1).

  **Setup**:
  1. Sign in to Insightly → bottom-left avatar → **User Settings → API Key**.
  2. Copy the key. Set `INSIGHTLY_API_KEY`.
  3. Note the **API URL pod** — visible in the same screen as the API key (e.g. `api.na1.insightly.com` for North America #1). Set `INSIGHTLY_POD` (just the pod part, e.g. `na1`, `eu2`).

  **Authentication**: HTTP Basic with username=API_KEY, password=empty.

  **Pod-specific URL**: `https://api.{{INSIGHTLY_POD}}.insightly.com/v3.1`. Wrong pod → 404.

  **Lead vs Contact**: Insightly has both. Leads are unqualified (no opportunity yet); contacts are people in opportunities or just relationships.

  **Custom fields**: stored under `CUSTOMFIELDS` array of `{FIELD_NAME, FIELD_VALUE, CUSTOM_FIELD_ID}`.

  **Pipeline / Stage IDs**: opportunities live in pipelines with stages. Discover via `insightly_list_pipelines` + `insightly_list_pipeline_stages`.

  **Pagination**: `?skip=N&top=M` (max 500 per page).

  **Out of scope here**: emails CRUD, tasks recurrence, file attachments, custom-object schemas, project templates.
tools:
  - name: insightly_get_current_user
    description: Return the user the API key belongs to (whoami).
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /Users/me
  - name: insightly_list_contacts
    description: List contacts with filter/sort.
    input:
      type: object
      properties:
        skip:
          type: integer
          description: Pagination offset.
        top:
          type: integer
          description: Per page (max 500).
        brief:
          type: boolean
          description: true = compact response without long-text fields.
        updated_after_utc:
          type: string
          description: ISO 8601 — contacts modified after.
        field_name:
          type: string
          description: Filter field name.
        field_value:
          type: string
          description: Filter value.
    operation:
      method: GET
      path: /Contacts
      query:
        skip: '{{params.skip}}'
        top: '{{params.top}}'
        brief: '{{params.brief}}'
        updated_after_utc: '{{params.updated_after_utc}}'
        field_name: '{{params.field_name}}'
        field_value: '{{params.field_value}}'
  - name: insightly_get_contact
    description: Fetch one contact by ID.
    input:
      type: object
      properties:
        contactId:
          type: integer
          description: Contact ID.
      required:
        - contactId
    operation:
      method: GET
      path: /Contacts/{{params.contactId}}
  - name: insightly_create_contact
    description: 'Create a contact. Required: FIRST_NAME or LAST_NAME.'
    input:
      type: object
      properties:
        FIRST_NAME:
          type: string
          description: First name.
        LAST_NAME:
          type: string
          description: Last name.
        EMAIL_ADDRESS:
          type: string
          description: Email.
        TITLE:
          type: string
          description: Job title.
        PHONE:
          type: string
          description: Phone.
        PHONE_MOBILE:
          type: string
          description: Mobile phone.
        ORGANISATION_ID:
          type: integer
          description: Linked organisation.
        OWNER_USER_ID:
          type: integer
          description: Owner user.
        BACKGROUND:
          type: string
          description: Notes.
        CUSTOMFIELDS:
          type: array
          description: '[{FIELD_NAME, FIELD_VALUE, CUSTOM_FIELD_ID}].'
        TAGS:
          type: array
          description: '[{TAG_NAME}].'
    operation:
      method: POST
      path: /Contacts
      body:
        value:
          FIRST_NAME: '{{params.FIRST_NAME}}'
          LAST_NAME: '{{params.LAST_NAME}}'
          EMAIL_ADDRESS: '{{params.EMAIL_ADDRESS}}'
          TITLE: '{{params.TITLE}}'
          PHONE: '{{params.PHONE}}'
          PHONE_MOBILE: '{{params.PHONE_MOBILE}}'
          ORGANISATION_ID: '{{params.ORGANISATION_ID}}'
          OWNER_USER_ID: '{{params.OWNER_USER_ID}}'
          BACKGROUND: '{{params.BACKGROUND}}'
          CUSTOMFIELDS: '{{params.CUSTOMFIELDS}}'
          TAGS: '{{params.TAGS}}'
  - name: insightly_list_organisations
    description: List organisations (companies).
    input:
      type: object
      properties:
        skip:
          type: integer
          description: Offset.
        top:
          type: integer
          description: Per page.
        brief:
          type: boolean
          description: Compact response.
        field_name:
          type: string
          description: Filter field.
        field_value:
          type: string
          description: Filter value.
    operation:
      method: GET
      path: /Organisations
      query:
        skip: '{{params.skip}}'
        top: '{{params.top}}'
        brief: '{{params.brief}}'
        field_name: '{{params.field_name}}'
        field_value: '{{params.field_value}}'
  - name: insightly_list_leads
    description: List leads (unqualified prospects).
    input:
      type: object
      properties:
        skip:
          type: integer
          description: Offset.
        top:
          type: integer
          description: Per page.
    operation:
      method: GET
      path: /Leads
      query:
        skip: '{{params.skip}}'
        top: '{{params.top}}'
  - name: insightly_create_lead
    description: Create a lead.
    input:
      type: object
      properties:
        FIRST_NAME:
          type: string
          description: First name.
        LAST_NAME:
          type: string
          description: Last name.
        ORGANISATION_NAME:
          type: string
          description: Company name (free text — not linked to organisations record).
        EMAIL:
          type: string
          description: Email.
        PHONE_NUMBER:
          type: string
          description: Phone.
        TITLE:
          type: string
          description: Job title.
        LEAD_SOURCE_ID:
          type: integer
          description: Lead source ID.
        LEAD_STATUS_ID:
          type: integer
          description: Lead status ID.
        OWNER_USER_ID:
          type: integer
          description: Owner.
    operation:
      method: POST
      path: /Leads
      body:
        value:
          FIRST_NAME: '{{params.FIRST_NAME}}'
          LAST_NAME: '{{params.LAST_NAME}}'
          ORGANISATION_NAME: '{{params.ORGANISATION_NAME}}'
          EMAIL: '{{params.EMAIL}}'
          PHONE_NUMBER: '{{params.PHONE_NUMBER}}'
          TITLE: '{{params.TITLE}}'
          LEAD_SOURCE_ID: '{{params.LEAD_SOURCE_ID}}'
          LEAD_STATUS_ID: '{{params.LEAD_STATUS_ID}}'
          OWNER_USER_ID: '{{params.OWNER_USER_ID}}'
  - name: insightly_list_opportunities
    description: List opportunities.
    input:
      type: object
      properties:
        skip:
          type: integer
          description: Offset.
        top:
          type: integer
          description: Per page.
        field_name:
          type: string
          description: Filter field.
        field_value:
          type: string
          description: Filter value.
    operation:
      method: GET
      path: /Opportunities
      query:
        skip: '{{params.skip}}'
        top: '{{params.top}}'
        field_name: '{{params.field_name}}'
        field_value: '{{params.field_value}}'
  - name: insightly_create_opportunity
    description: 'Create an opportunity. Required: OPPORTUNITY_NAME.'
    input:
      type: object
      properties:
        OPPORTUNITY_NAME:
          type: string
          description: Name.
        OPPORTUNITY_DETAILS:
          type: string
          description: Description.
        OPPORTUNITY_STATE:
          type: string
          description: OPEN, WON, LOST, SUSPENDED, ABANDONED.
        PIPELINE_ID:
          type: integer
          description: Pipeline ID.
        STAGE_ID:
          type: integer
          description: Stage ID within pipeline.
        BID_AMOUNT:
          type: number
          description: Deal value.
        BID_CURRENCY:
          type: string
          description: ISO 4217 code.
        FORECAST_CLOSE_DATE:
          type: string
          description: ISO 8601.
        PROBABILITY:
          type: integer
          description: 0-100.
        OWNER_USER_ID:
          type: integer
          description: Owner.
        RESPONSIBLE_USER_ID:
          type: integer
          description: Responsible user.
      required:
        - OPPORTUNITY_NAME
    operation:
      method: POST
      path: /Opportunities
      body:
        value:
          OPPORTUNITY_NAME: '{{params.OPPORTUNITY_NAME}}'
          OPPORTUNITY_DETAILS: '{{params.OPPORTUNITY_DETAILS}}'
          OPPORTUNITY_STATE: '{{params.OPPORTUNITY_STATE}}'
          PIPELINE_ID: '{{params.PIPELINE_ID}}'
          STAGE_ID: '{{params.STAGE_ID}}'
          BID_AMOUNT: '{{params.BID_AMOUNT}}'
          BID_CURRENCY: '{{params.BID_CURRENCY}}'
          FORECAST_CLOSE_DATE: '{{params.FORECAST_CLOSE_DATE}}'
          PROBABILITY: '{{params.PROBABILITY}}'
          OWNER_USER_ID: '{{params.OWNER_USER_ID}}'
          RESPONSIBLE_USER_ID: '{{params.RESPONSIBLE_USER_ID}}'
  - name: insightly_list_pipelines
    description: List pipelines + their stages (FOR_OPPORTUNITIES or FOR_PROJECTS).
    input:
      type: object
      properties:
        skip:
          type: integer
          description: Offset.
        top:
          type: integer
          description: Per page.
    operation:
      method: GET
      path: /Pipelines
      query:
        skip: '{{params.skip}}'
        top: '{{params.top}}'
  - name: insightly_list_projects
    description: List projects.
    input:
      type: object
      properties:
        skip:
          type: integer
          description: Offset.
        top:
          type: integer
          description: Per page.
    operation:
      method: GET
      path: /Projects
      query:
        skip: '{{params.skip}}'
        top: '{{params.top}}'
  - name: insightly_list_tasks
    description: List tasks (CRM activities).
    input:
      type: object
      properties:
        skip:
          type: integer
          description: Offset.
        top:
          type: integer
          description: Per page.
        status:
          type: string
          description: NOT STARTED, IN PROGRESS, COMPLETED, DEFERRED, WAITING.
    operation:
      method: GET
      path: /Tasks
      query:
        skip: '{{params.skip}}'
        top: '{{params.top}}'
        field_name: STATUS
        field_value: '{{params.status}}'
