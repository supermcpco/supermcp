# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: convertkit
  name: Kit (ConvertKit)
  description: 'Drive Kit (formerly ConvertKit) — creator-focused email marketing — from any AI agent: subscribers, tags, forms, sequences, broadcasts, custom fields. 14 tools, v4 API with API-key Bearer auth.'
  region: intl
  category: email
  icon: convertkit
  docsUrl: https://developers.kit.com/v4
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  CONVERTKIT_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.convertkit.com/v4
auth:
  type: bearer
  token: '{{env.CONVERTKIT_API_KEY}}'
instructions: |-
  This connector uses the Kit v4 API (Kit was renamed from ConvertKit in 2024 — the API still works at api.convertkit.com under v4).

  **Setup**:
  1. Sign in to https://app.kit.com → **Advanced Settings → API → Show v4 API key**.
  2. Copy the v4 API key. Set `CONVERTKIT_API_KEY`.
  3. (Optional, only for older v3 endpoints not used here): the v3 API uses an `api_secret` — not needed for this connector.

  **Authentication**: `Authorization: Bearer ${CONVERTKIT_API_KEY}`. The adapter handles this via BEARER_TOKEN.

  **Subscriber model**: every email is a 'subscriber'. State machine: `active`, `inactive` (manually paused), `bounced`, `complained`, `cancelled`. New subscribers default to `active`. Adding to a sequence does NOT create an active subscriber automatically — they must be active first.

  **Tags vs Forms vs Sequences**:
    - **Forms**: capture points (signup widgets, landing pages). When a subscriber fills a form, they're added to the form's list AND tagged with any default tags the form applies.
    - **Tags**: free-form labels. The primary segmentation primitive. A subscriber can have unlimited tags.
    - **Sequences**: timed email courses (used to be 'autoresponder courses'). You subscribe a contact to a sequence and they receive its emails on a schedule.
    - **Broadcasts**: one-time emails to a subset (by tags/forms/sequences). The newsletter primitive.

  **Custom fields** are at the account level — define them in the UI, then set values per subscriber via `fields` object in create/update.

  **Pagination**: cursor-based. List responses include `pagination: {has_previous_page, has_next_page, start_cursor, end_cursor, per_page}`. Pass `after=$end_cursor` (or `before=$start_cursor`) on the next call. Default per_page=500, max 5000 for some endpoints.

  **Rate limits**: 600 requests per minute per API key. On 429, back off — `X-RateLimit-Reset` header tells you when.

  **Webhooks** out of scope (Kit supports them, configured in UI to point at your hosted endpoint).

  **Out of scope here**: writing automation rules, landing-page builder, commerce / digital products, deliverability headers config.
tools:
  - name: convertkit_get_account
    description: Return account info (name, plan, primary_email_address, created_at). Health check + plan visibility.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /account
  - name: convertkit_list_subscribers
    description: List subscribers with filters. Each has id, first_name, email_address, state, created_at, fields, tags.
    input:
      type: object
      properties:
        email_address:
          type: string
          description: Exact-match email filter.
        tagged_after:
          type: string
          description: ISO 8601 — subscribers tagged after this.
        tagged_before:
          type: string
          description: ISO 8601.
        created_after:
          type: string
          description: ISO 8601 created lower bound.
        created_before:
          type: string
          description: ISO 8601.
        updated_after:
          type: string
          description: ISO 8601 updated lower bound.
        updated_before:
          type: string
          description: ISO 8601.
        sort_field:
          type: string
          description: created_at, updated_at, cancelled_at.
        sort_order:
          type: string
          description: asc or desc.
        include_total_count:
          type: boolean
          description: If true, response includes total_count (expensive).
        per_page:
          type: integer
          description: Max per page (default 500, max 5000).
        after:
          type: string
          description: Cursor — return subscribers after this.
        before:
          type: string
          description: Cursor.
    operation:
      method: GET
      path: /subscribers
      query:
        email_address: '{{params.email_address}}'
        tagged_after: '{{params.tagged_after}}'
        tagged_before: '{{params.tagged_before}}'
        created_after: '{{params.created_after}}'
        created_before: '{{params.created_before}}'
        updated_after: '{{params.updated_after}}'
        updated_before: '{{params.updated_before}}'
        sort_field: '{{params.sort_field}}'
        sort_order: '{{params.sort_order}}'
        include_total_count: '{{params.include_total_count}}'
        per_page: '{{params.per_page}}'
        after: '{{params.after}}'
        before: '{{params.before}}'
  - name: convertkit_get_subscriber
    description: Fetch a subscriber by ID with full fields object and tags[].
    input:
      type: object
      properties:
        subscriberId:
          type: integer
          description: Subscriber numeric ID.
      required:
        - subscriberId
    operation:
      method: GET
      path: /subscribers/{{params.subscriberId}}
  - name: convertkit_create_subscriber
    description: 'Create a subscriber. Required: email_address. The subscriber starts in `active` state by default. To onboard with consent for a specific form/sequence, use the form-specific subscribe endpoints (out of scope here) — this endpoint is for direct programmatic add.'
    input:
      type: object
      properties:
        email_address:
          type: string
          description: Subscriber email (lowercase recommended).
        first_name:
          type: string
          description: First name (optional).
        state:
          type: string
          description: active or inactive. Default active.
        fields:
          type: object
          description: 'Custom fields object: {LAST_NAME:''Doe'', COMPANY:''ACME''} — keys must match fields defined in the UI.'
      required:
        - email_address
    operation:
      method: POST
      path: /subscribers
      body:
        value:
          email_address: '{{params.email_address}}'
          first_name: '{{params.first_name}}'
          state: '{{params.state}}'
          fields: '{{params.fields}}'
  - name: convertkit_update_subscriber
    description: Update a subscriber's email, first_name, or custom fields. To change state (active/inactive), use convertkit_unsubscribe or the subscriber-specific state endpoints.
    input:
      type: object
      properties:
        subscriberId:
          type: integer
          description: Subscriber ID.
        email_address:
          type: string
          description: New email.
        first_name:
          type: string
          description: New first name.
        fields:
          type: object
          description: Custom fields to update.
      required:
        - subscriberId
    operation:
      method: PUT
      path: /subscribers/{{params.subscriberId}}
      body:
        value:
          email_address: '{{params.email_address}}'
          first_name: '{{params.first_name}}'
          fields: '{{params.fields}}'
  - name: convertkit_unsubscribe
    description: Mark a subscriber as inactive (Kit's unsubscribe). They stop receiving emails and count against your subscriber quota until manually deleted.
    input:
      type: object
      properties:
        subscriberId:
          type: integer
          description: Subscriber ID.
      required:
        - subscriberId
    operation:
      method: POST
      path: /subscribers/{{params.subscriberId}}/unsubscribe
  - name: convertkit_list_tags
    description: List all tags. Each has id, name, created_at.
    input:
      type: object
      properties:
        per_page:
          type: integer
          description: Per page.
        after:
          type: string
          description: Cursor.
        before:
          type: string
          description: Cursor.
    operation:
      method: GET
      path: /tags
      query:
        per_page: '{{params.per_page}}'
        after: '{{params.after}}'
        before: '{{params.before}}'
  - name: convertkit_create_tag
    description: Create a tag. Tag names are unique within the account.
    input:
      type: object
      properties:
        name:
          type: string
          description: Tag name.
      required:
        - name
    operation:
      method: POST
      path: /tags
      body:
        value:
          name: '{{params.name}}'
  - name: convertkit_tag_subscriber
    description: Apply a tag to a subscriber. The subscriber must be `active`.
    input:
      type: object
      properties:
        tagId:
          type: integer
          description: Tag ID.
        subscriber_id:
          type: integer
          description: Subscriber ID to tag.
      required:
        - tagId
        - subscriber_id
    operation:
      method: POST
      path: /tags/{{params.tagId}}/subscribers
      body:
        value:
          subscriber_id: '{{params.subscriber_id}}'
  - name: convertkit_remove_tag_from_subscriber
    description: Remove a tag from a subscriber.
    input:
      type: object
      properties:
        tagId:
          type: integer
          description: Tag ID.
        subscriberId:
          type: integer
          description: Subscriber ID.
      required:
        - tagId
        - subscriberId
    operation:
      method: DELETE
      path: /tags/{{params.tagId}}/subscribers/{{params.subscriberId}}
  - name: convertkit_list_forms
    description: List signup forms / landing pages. Each form has id, name, type (embed/hosted/modal), format, total_subscriptions.
    input:
      type: object
      properties:
        type:
          type: string
          description: embed, hosted, modal.
        per_page:
          type: integer
          description: Per page.
        after:
          type: string
          description: Cursor.
    operation:
      method: GET
      path: /forms
      query:
        type: '{{params.type}}'
        per_page: '{{params.per_page}}'
        after: '{{params.after}}'
  - name: convertkit_list_sequences
    description: List sequences (drip email courses). Each has id, name, hold (paused?), repeat, created_at.
    input:
      type: object
      properties:
        per_page:
          type: integer
          description: Per page.
        after:
          type: string
          description: Cursor.
    operation:
      method: GET
      path: /sequences
      query:
        per_page: '{{params.per_page}}'
        after: '{{params.after}}'
  - name: convertkit_add_subscriber_to_sequence
    description: Enroll a subscriber in a sequence. They'll start receiving its emails on schedule. The subscriber must be `active`.
    input:
      type: object
      properties:
        sequenceId:
          type: integer
          description: Sequence ID.
        email_address:
          type: string
          description: Subscriber email.
      required:
        - sequenceId
        - email_address
    operation:
      method: POST
      path: /sequences/{{params.sequenceId}}/subscribers
      body:
        value:
          email_address: '{{params.email_address}}'
  - name: convertkit_list_broadcasts
    description: List broadcasts (one-off email sends). Each has id, subject, description, content, public, published_at, send_at, thumbnail_url.
    input:
      type: object
      properties:
        per_page:
          type: integer
          description: Per page.
        after:
          type: string
          description: Cursor.
    operation:
      method: GET
      path: /broadcasts
      query:
        per_page: '{{params.per_page}}'
        after: '{{params.after}}'
