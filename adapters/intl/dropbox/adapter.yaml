# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: dropbox
  name: Dropbox
  description: 'Manage Dropbox (file storage: list, download, upload, move, copy, delete, search, share, metadata) from any AI agent. 10 tools, OAuth2 token.'
  region: intl
  category: storage
  icon: dropbox
  docsUrl: https://www.dropbox.com/developers/documentation/http/documentation
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  DROPBOX_CLIENT_ID:
    required: true
  DROPBOX_CLIENT_SECRET:
    required: true
    secret: true
  DROPBOX_REFRESH_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.dropboxapi.com/2
auth:
  type: oauth2
  grant: refresh_token
  clientId: '{{env.DROPBOX_CLIENT_ID}}'
  clientSecret: '{{env.DROPBOX_CLIENT_SECRET}}'
  tokenUrl: https://api.dropboxapi.com/oauth2/token
  refreshToken: '{{env.DROPBOX_REFRESH_TOKEN}}'
instructions: |-
  This connector wraps the Dropbox API v2 (api.dropboxapi.com).

  **Setup — OAuth2**:
  1. Register at https://www.dropbox.com/developers/apps → **Create app** → 'Scoped access' → 'App folder' or 'Full Dropbox' depending on need.
  2. Add the scopes you need (files.metadata.read, files.content.read, files.content.write, sharing.write, ...).
  3. Generate a **Refresh token** via OAuth flow with `token_access_type=offline`.
  4. Set `DROPBOX_CLIENT_ID`, `DROPBOX_CLIENT_SECRET`, `DROPBOX_REFRESH_TOKEN`.

  **Authentication**: OAuth2 refresh handled by engine. Sends `Authorization: Bearer ACCESS_TOKEN`.

  **Two API hosts**: most endpoints live at `api.dropboxapi.com/2`. Content endpoints (upload/download) use `content.dropboxapi.com/2` — out of scope here for upload (multipart streaming). Use the link-based pattern: have content already accessible via URL → use `dropbox_save_url` to ingest, or use external upload then create_shared_link to share.

  **Path format**: paths use `/Folder/Subfolder/File.txt` (case-insensitive, no leading drive). Root is empty string or `/`. For App-folder apps, paths are relative to the app folder.

  **Pagination**: most list endpoints use a `cursor` returned in the response. Pass back as `cursor` to continue.

  **Rate limits**: per-endpoint quotas, generally 100-1000 req/min. 429 with `Retry-After`.

  **Out of scope here**: direct file upload (multipart, separate API), Paper docs, team admin, the legacy v1 API.
tools:
  - name: dropbox_get_current_account
    description: Return the authenticated user's account (account_id, name, email, country, locale, account_type).
    input:
      type: object
      properties: {}
    operation:
      method: POST
      path: /users/get_current_account
      body:
        value: {}
  - name: dropbox_list_folder
    description: List contents of a folder. Use `recursive=true` to walk subfolders.
    input:
      type: object
      properties:
        path:
          type: string
          description: Path like '/My Folder' or '' for root.
        recursive:
          type: boolean
          description: Walk subfolders.
        limit:
          type: integer
          description: Max per page (default 2000).
        include_deleted:
          type: boolean
          description: Include deleted entries.
      required:
        - path
    operation:
      method: POST
      path: /files/list_folder
      body:
        value:
          path: '{{params.path}}'
          recursive: '{{params.recursive}}'
          limit: '{{params.limit}}'
          include_deleted: '{{params.include_deleted}}'
  - name: dropbox_list_folder_continue
    description: Continue a list_folder cursor.
    input:
      type: object
      properties:
        cursor:
          type: string
          description: Cursor from previous response.
      required:
        - cursor
    operation:
      method: POST
      path: /files/list_folder/continue
      body:
        value:
          cursor: '{{params.cursor}}'
  - name: dropbox_get_metadata
    description: Get metadata for a single file/folder at a path.
    input:
      type: object
      properties:
        path:
          type: string
          description: Path.
        include_deleted:
          type: boolean
          description: Include if deleted.
      required:
        - path
    operation:
      method: POST
      path: /files/get_metadata
      body:
        value:
          path: '{{params.path}}'
          include_deleted: '{{params.include_deleted}}'
  - name: dropbox_search
    description: Search files by query within a path. Filter by file extension, category.
    input:
      type: object
      properties:
        query:
          type: string
          description: Search query.
        path:
          type: string
          description: Restrict to this folder ('' for root).
        max_results:
          type: integer
          description: Default 100, max 1000.
        file_extensions:
          type: array
          description: Array of extensions like ['pdf','docx'].
        file_categories:
          type: array
          description: 'Array: image, document, pdf, spreadsheet, presentation, audio, video, folder, ...'
      required:
        - query
    operation:
      method: POST
      path: /files/search_v2
      body:
        value:
          query: '{{params.query}}'
          options:
            path: '{{params.path}}'
            max_results: '{{params.max_results}}'
            file_extensions: '{{params.file_extensions}}'
            file_categories: '{{params.file_categories}}'
  - name: dropbox_create_folder
    description: Create a folder at a path.
    input:
      type: object
      properties:
        path:
          type: string
          description: Folder path to create.
        autorename:
          type: boolean
          description: If true, append a counter on conflict.
      required:
        - path
    operation:
      method: POST
      path: /files/create_folder_v2
      body:
        value:
          path: '{{params.path}}'
          autorename: '{{params.autorename}}'
  - name: dropbox_move
    description: Move a file/folder to a new path.
    input:
      type: object
      properties:
        from_path:
          type: string
          description: Source path.
        to_path:
          type: string
          description: Destination path.
        autorename:
          type: boolean
          description: Append counter on conflict.
      required:
        - from_path
        - to_path
    operation:
      method: POST
      path: /files/move_v2
      body:
        value:
          from_path: '{{params.from_path}}'
          to_path: '{{params.to_path}}'
          autorename: '{{params.autorename}}'
  - name: dropbox_copy
    description: Copy a file/folder to a new path.
    input:
      type: object
      properties:
        from_path:
          type: string
          description: Source path.
        to_path:
          type: string
          description: Destination path.
      required:
        - from_path
        - to_path
    operation:
      method: POST
      path: /files/copy_v2
      body:
        value:
          from_path: '{{params.from_path}}'
          to_path: '{{params.to_path}}'
  - name: dropbox_delete
    description: Delete a file/folder.
    input:
      type: object
      properties:
        path:
          type: string
          description: Path to delete.
      required:
        - path
    operation:
      method: POST
      path: /files/delete_v2
      body:
        value:
          path: '{{params.path}}'
  - name: dropbox_create_shared_link
    description: Create a public shared link for a file/folder.
    input:
      type: object
      properties:
        path:
          type: string
          description: Path to share.
        settings:
          type: object
          description: '{requested_visibility:''public''|''team_only''|''password'', link_password:''...'', expires:''<ISO>''}.'
      required:
        - path
    operation:
      method: POST
      path: /sharing/create_shared_link_with_settings
      body:
        value:
          path: '{{params.path}}'
          settings: '{{params.settings}}'
