# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: synology
  name: Synology DSM
  description: 'Synology DiskStation Manager: system and storage health, shared folders, running tasks, Download Station queue and the file station tree. Session-login auth against your own NAS.'
  region: intl
  category: storage
  icon: synology
  docsUrl: https://kb.synology.com/en-global/DG/DSM_Login_Web_API_Guide/1
credentials:
  SYNOLOGY_URL:
    required: true
  SYNOLOGY_USERNAME:
    required: true
  SYNOLOGY_PASSWORD:
    required: true
    secret: true
transport:
  type: http
  baseUrl: '{{env.SYNOLOGY_URL}}/webapi'
  headers:
    Accept: application/json
auth:
  type: login
  request:
    method: GET
    url: '{{env.SYNOLOGY_URL}}/webapi/auth.cgi'
    query:
      api: SYNO.API.Auth
      version: "6"
      method: login
      account: '{{auth.username}}'
      passwd: '{{auth.password}}'
      session: supermcp
      format: sid
  credentials:
    username: '{{env.SYNOLOGY_USERNAME}}'
    password: '{{env.SYNOLOGY_PASSWORD}}'
  tokenSource:
    from: body
    jsonPath: data.sid
  expiry:
    ttl: 1h
    refreshBefore: 5m
    refreshOn401: true
  inject:
    cookie: id
healthcheck:
  tool: synology_list_apis
  http:
    method: GET
    path: /query.cgi?api=SYNO.API.Info&version=1&method=query&query=all
instructions: |
  **Setup**
  1. In DSM create a user for the integration. Give it read access to the shared folders the agent should see and, if you want the system tools, membership of the administrators group — several `SYNO.Core` endpoints are admin-only.
  2. **Turn off two-factor authentication for that user**, or the login call cannot complete. This is the main reason to use a dedicated account rather than your own.
  3. Set `SYNOLOGY_URL` to your NAS (e.g. `https://nas.example.com:5001`, no trailing slash), plus `SYNOLOGY_USERNAME` and `SYNOLOGY_PASSWORD`.

  **DSM's session is a `sid`.** The adapter logs in at `/webapi/auth.cgi`, passing the account and password as query parameters (which is what DSM's auth CGI expects), and passes the returned `sid` back as a cookie on every call, re-logging in when DSM expires it. supermcp keeps the session encrypted in `connector_auth_cache`.

  **The password reaches DSM in a URL**, because that is the only thing `auth.cgi` accepts — so it lands in the NAS's own access log. This is another reason to give the integration its own account rather than reusing yours, and to rotate it like any other credential.

  **Every call names an API, a version and a method.** DSM's Web API is one CGI endpoint per family with `api`, `version` and `method` as query parameters — `entry.cgi?api=SYNO.Core.System&version=1&method=info`. That is why the tools here look repetitive in the trace; the parameters are what distinguish them.

  **Success is in the body, not the status code.** DSM answers `{"success": false, "error": {"code": 105}}` with HTTP 200. Code 105 is 'insufficient permission', 119 'session expired', 400 'no such account or wrong password'. A 200 is not a result.

  **Valid TLS is required, and a fresh DSM does not have it.** Synology ships a self-signed certificate; this connector will refuse it. DSM has built-in Let's Encrypt support under **Control Panel → Security → Certificate** — use it.

  **Read-only by design**: no file writes, no share changes, no package management.

  **Self-hosted, which is the thing to plan for.**
  - On a **hosted supermcp instance** the instance must be reachable from the public internet on a real hostname with a valid TLS certificate. A self-signed certificate will fail: the connector offers no trust-anything switch, and a homelab's default certificate is exactly the case that breaks.
  - On an internal host (`nas.intern`, `10.0.0.x`), self-host supermcp on the same network and add that host to `SSRF_ALLOWED_HOSTS`, or the outbound guard refuses the call before it is made.
tools:
  - name: synology_list_apis
    description: List the Web APIs this DSM publishes, with the version range and CGI path of each. Start here — DSM versions differ in what they expose, and this is the authority.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /query.cgi
      query:
        api: SYNO.API.Info
        version: "1"
        method: query
        query: all
  - name: synology_get_system_info
    description: 'Read the NAS''s system information: model, serial number, DSM version, uptime, CPU and total memory.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /entry.cgi
      query:
        api: SYNO.Core.System
        version: "1"
        method: info
  - name: synology_get_system_utilization
    description: 'Read live utilisation: CPU load, memory in use, disk throughput and network throughput right now.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /entry.cgi
      query:
        api: SYNO.Core.System.Utilization
        version: "1"
        method: get
  - name: synology_list_storage
    description: 'Read the storage overview: every volume and disk with its size, used space, filesystem and SMART health status. Where a failing disk shows up.'
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /entry.cgi
      query:
        api: SYNO.Storage.CGI.Storage
        version: "1"
        method: load_info
  - name: synology_list_shares
    description: List the shared folders with their name, path, description and whether each is encrypted — the map of what is on the NAS.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Maximum shares to return.
        offset:
          type: number
          description: Shares to skip, for paging.
    operation:
      method: GET
      path: /entry.cgi
      query:
        api: SYNO.Core.Share
        version: "1"
        method: list
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: synology_list_files
    description: List the files and folders under one path in File Station, with their size, type and modification time.
    input:
      type: object
      properties:
        folder_path:
          type: string
          description: Absolute DSM path, e.g. /volume1/documents.
        limit:
          type: number
          description: Maximum entries to return.
        offset:
          type: number
          description: Entries to skip, for paging.
        sort_by:
          type: string
          description: 'Sort field: name, size, user, group, mtime, atime, ctime or type.'
      required:
        - folder_path
    operation:
      method: GET
      path: /entry.cgi
      query:
        api: SYNO.FileStation.List
        version: "2"
        method: list
        folder_path: '{{params.folder_path}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        sort_by: '{{params.sort_by}}'
        additional: '["size","time","type"]'
  - name: synology_search_files
    description: Start a File Station search under one path for a filename pattern. Returns a task id — DSM's search is asynchronous by design.
    input:
      type: object
      properties:
        folder_path:
          type: string
          description: Absolute DSM path to search under, e.g. /volume1.
        pattern:
          type: string
          description: Filename pattern, e.g. *.pdf or invoice*.
        recursive:
          type: boolean
          description: When true, search subfolders too.
      required:
        - folder_path
        - pattern
    operation:
      method: GET
      path: /entry.cgi
      query:
        api: SYNO.FileStation.Search
        version: "2"
        method: start
        folder_path: '{{params.folder_path}}'
        pattern: '{{params.pattern}}'
        recursive: '{{params.recursive}}'
  - name: synology_list_download_tasks
    description: List the Download Station queue with each task's title, status, size, progress and speed — what the NAS is currently fetching.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Maximum tasks to return.
        offset:
          type: number
          description: Tasks to skip, for paging.
    operation:
      method: GET
      path: /entry.cgi
      query:
        api: SYNO.DownloadStation.Task
        version: "1"
        method: list
        additional: detail,transfer
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: synology_list_users
    description: List the DSM user accounts with their name, description, e-mail and whether each is expired or disabled. Requires an administrator account.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Maximum users to return.
        offset:
          type: number
          description: Users to skip, for paging.
    operation:
      method: GET
      path: /entry.cgi
      query:
        api: SYNO.Core.User
        version: "1"
        method: list
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
