# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: espocrm
  name: EspoCRM
  description: 'EspoCRM open-source CRM: accounts, contacts, leads, opportunities, cases, calls, meetings and tasks, plus a generic entity route for custom entities. API-key auth against your own instance.'
  region: intl
  category: crm
  icon: espocrm
  docsUrl: https://docs.espocrm.com/development/api/
credentials:
  ESPOCRM_URL:
    required: true
  ESPOCRM_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: '{{env.ESPOCRM_URL}}/api/v1'
  headers:
    Accept: application/json
auth:
  type: apiKey
  in: header
  name: X-Api-Key
  value: '{{env.ESPOCRM_API_KEY}}'
healthcheck:
  tool: espocrm_get_app_user
  http:
    method: GET
    path: /App/user
instructions: |
  **Getting a key**
  1. In EspoCRM go to **Administration → API Users** and create an API user. Choose **API Key** authentication (not HMAC — this adapter sends the plain key).
  2. Assign a role that grants read access to the entities the agent should see. EspoCRM enforces roles per entity *and* per field, so a restricted role produces fewer rows and fewer columns rather than an error.
  3. Copy the generated key into `ESPOCRM_API_KEY` and set `ESPOCRM_URL` to your instance root (no trailing slash, no `/api/v1`).

  **The header is `X-Api-Key`.**

  **One route shape for every entity.** `/api/v1/{entityType}` lists, `/api/v1/{entityType}/{id}` reads one. That covers Account, Contact, Lead, Opportunity, Case, Call, Meeting, Task and any custom entity your instance defines — which is why `espocrm_list_entities` takes the entity type as a parameter.

  **`where` is an indexed array, which is awkward and worth reading once.** EspoCRM expects `where[0][type]=equals&where[0][attribute]=status&where[0][value]=New`. Types include `equals`, `notEquals`, `contains`, `startsWith`, `greaterThan`, `lessThan`, `between`, `isNull`, `isNotNull`, `linkedWith`, `today`, `lastXDays`. The list tools below expose the first `where` clause directly, which covers most questions; for anything compound, EspoCRM's own documentation has the full grammar.

  **`select` keeps responses small.** Without it EspoCRM returns every readable attribute, which for an Account with custom fields is a lot.

  **Order is `orderBy` plus `order`** (`asc`/`desc`), not a single expression.

  **Self-hosted, which is the thing to plan for.**
  - On a **hosted supermcp instance** the instance must be reachable from the public internet on a real hostname with a valid TLS certificate. A self-signed certificate will fail: the connector offers no trust-anything switch.
  - On an internal host (`crm.intern`, `10.0.0.x`), self-host supermcp on the same network and add that host to `SSRF_ALLOWED_HOSTS`, or the outbound guard refuses the call before it is made.
tools:
  - name: espocrm_get_app_user
    description: Read the API user this key belongs to, with their roles and the entity permissions they carry. The fastest way to see what this connector is actually allowed to read.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /App/user
  - name: espocrm_list_entities
    description: 'List records of any entity type with a single where clause. The real API: Account, Contact, Lead, Opportunity, Case and any custom entity share this route.'
    input:
      type: object
      properties:
        entityType:
          type: string
          description: Entity type, e.g. Account, Contact, Lead, Opportunity, Case, Call, Meeting, Task.
        where_type:
          type: string
          description: 'Clause type: equals, notEquals, contains, startsWith, greaterThan, lessThan, isNull, isNotNull, today, lastXDays.'
        where_attribute:
          type: string
          description: Attribute the clause applies to, e.g. status or createdAt.
        where_value:
          type: string
          description: Value the clause compares against.
        select:
          type: string
          description: Comma-separated attributes to return, e.g. id,name,status,createdAt.
        orderBy:
          type: string
          description: Attribute to sort by, e.g. createdAt.
        order:
          type: string
          description: '`asc` or `desc`.'
        maxSize:
          type: number
          description: Rows to return (default 20, max 200).
        offset:
          type: number
          description: Rows to skip, for paging.
      required:
        - entityType
    operation:
      method: GET
      path: /{{params.entityType}}
      query:
        where[0][type]: '{{params.where_type}}'
        where[0][attribute]: '{{params.where_attribute}}'
        where[0][value]: '{{params.where_value}}'
        select: '{{params.select}}'
        orderBy: '{{params.orderBy}}'
        order: '{{params.order}}'
        maxSize: '{{params.maxSize}}'
        offset: '{{params.offset}}'
  - name: espocrm_get_entity
    description: Read one record of any entity type by id, with every attribute the API user's role permits.
    input:
      type: object
      properties:
        entityType:
          type: string
          description: Entity type, e.g. Account.
        id:
          type: string
          description: Record id.
      required:
        - entityType
        - id
    operation:
      method: GET
      path: /{{params.entityType}}/{{params.id}}
  - name: espocrm_list_accounts
    description: List accounts — the customer companies — with their name, industry, website, phone, billing city and assigned user.
    input:
      type: object
      properties:
        where_type:
          type: string
          description: Clause type, e.g. contains.
        where_attribute:
          type: string
          description: Attribute the clause applies to, e.g. name.
        where_value:
          type: string
          description: Value the clause compares against.
        maxSize:
          type: number
          description: Rows to return (max 200).
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /Account
      query:
        select: id,name,industry,website,phoneNumber,billingAddressCity,assignedUserName
        where[0][type]: '{{params.where_type}}'
        where[0][attribute]: '{{params.where_attribute}}'
        where[0][value]: '{{params.where_value}}'
        maxSize: '{{params.maxSize}}'
        offset: '{{params.offset}}'
        orderBy: name
        order: asc
  - name: espocrm_list_contacts
    description: List contacts with their name, account, e-mail, phone and title, to find the person before logging an interaction against them.
    input:
      type: object
      properties:
        where_type:
          type: string
          description: Clause type, e.g. equals.
        where_attribute:
          type: string
          description: Attribute the clause applies to, e.g. emailAddress.
        where_value:
          type: string
          description: Value the clause compares against.
        maxSize:
          type: number
          description: Rows to return (max 200).
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /Contact
      query:
        select: id,name,accountName,emailAddress,phoneNumber,title,assignedUserName
        where[0][type]: '{{params.where_type}}'
        where[0][attribute]: '{{params.where_attribute}}'
        where[0][value]: '{{params.where_value}}'
        maxSize: '{{params.maxSize}}'
        offset: '{{params.offset}}'
  - name: espocrm_list_opportunities
    description: List opportunities with their name, account, amount, stage, probability and close date — the sales-pipeline view.
    input:
      type: object
      properties:
        where_type:
          type: string
          description: Clause type, e.g. equals.
        where_attribute:
          type: string
          description: Attribute the clause applies to, e.g. stage.
        where_value:
          type: string
          description: Value the clause compares against, e.g. Proposal.
        maxSize:
          type: number
          description: Rows to return (max 200).
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /Opportunity
      query:
        select: id,name,accountName,amount,amountCurrency,stage,probability,closeDate,assignedUserName
        where[0][type]: '{{params.where_type}}'
        where[0][attribute]: '{{params.where_attribute}}'
        where[0][value]: '{{params.where_value}}'
        maxSize: '{{params.maxSize}}'
        offset: '{{params.offset}}'
        orderBy: closeDate
        order: asc
  - name: espocrm_list_leads
    description: List leads with their name, company, status, source, e-mail and phone — the top of the funnel, before conversion into an account.
    input:
      type: object
      properties:
        where_type:
          type: string
          description: Clause type, e.g. equals.
        where_attribute:
          type: string
          description: Attribute the clause applies to, e.g. status.
        where_value:
          type: string
          description: Value the clause compares against, e.g. New.
        maxSize:
          type: number
          description: Rows to return (max 200).
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /Lead
      query:
        select: id,name,accountName,status,source,emailAddress,phoneNumber,createdAt,assignedUserName
        where[0][type]: '{{params.where_type}}'
        where[0][attribute]: '{{params.where_attribute}}'
        where[0][value]: '{{params.where_value}}'
        maxSize: '{{params.maxSize}}'
        offset: '{{params.offset}}'
        orderBy: createdAt
        order: desc
  - name: espocrm_list_cases
    description: List support cases with their number, subject, status, priority, account and assigned user.
    input:
      type: object
      properties:
        where_type:
          type: string
          description: Clause type, e.g. equals.
        where_attribute:
          type: string
          description: Attribute the clause applies to, e.g. status.
        where_value:
          type: string
          description: Value the clause compares against, e.g. Open.
        maxSize:
          type: number
          description: Rows to return (max 200).
        offset:
          type: number
          description: Rows to skip, for paging.
    operation:
      method: GET
      path: /Case
      query:
        select: id,number,name,status,priority,accountName,assignedUserName,createdAt
        where[0][type]: '{{params.where_type}}'
        where[0][attribute]: '{{params.where_attribute}}'
        where[0][value]: '{{params.where_value}}'
        maxSize: '{{params.maxSize}}'
        offset: '{{params.offset}}'
        orderBy: createdAt
        order: desc
  - name: espocrm_get_related
    description: List the records linked to one record — the contacts on an account, the opportunities on a contact, the activities on anything. EspoCRM's history lives in these links.
    input:
      type: object
      properties:
        entityType:
          type: string
          description: Entity type of the anchor record, e.g. Account.
        id:
          type: string
          description: Id of the anchor record.
        link:
          type: string
          description: Link name, e.g. contacts, opportunities, cases, meetings.
        maxSize:
          type: number
          description: Rows to return.
        offset:
          type: number
          description: Rows to skip, for paging.
      required:
        - entityType
        - id
        - link
    operation:
      method: GET
      path: /{{params.entityType}}/{{params.id}}/{{params.link}}
      query:
        maxSize: '{{params.maxSize}}'
        offset: '{{params.offset}}'
