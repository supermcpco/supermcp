# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: wufoo
  name: Wufoo
  description: Read Wufoo (SurveyMonkey-owned classic form builder) submissions and form definitions from any AI agent. 6 tools, Basic auth, subdomain-templated URL.
  region: intl
  category: forms
  icon: wufoo
  docsUrl: https://wufoo.com/docs/api/v3/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  WUFOO_SUBDOMAIN:
    required: true
  WUFOO_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://{{env.WUFOO_SUBDOMAIN}}.wufoo.com/api/v3
auth:
  type: basic
  username: '{{env.WUFOO_API_KEY}}'
  password: footastic
instructions: |-
  This connector uses the Wufoo API v3 (wufoo.com/api).

  **Setup**:
  1. Sign in to Wufoo → top-right avatar → **Account → API Information**.
  2. Note your **API key** and your **subdomain** (e.g. if URL is `acme.wufoo.com` → `acme`).
  3. Set:
     - `WUFOO_SUBDOMAIN` = your subdomain
     - `WUFOO_API_KEY` = the API key

  **Authentication**: HTTP Basic with username=API_KEY, password='footastic' (literal — Wufoo's convention).

  **Subdomain in base URL**: `https://{{WUFOO_SUBDOMAIN}}.wufoo.com/api/v3`.

  **Form/Entry model**: forms (the definitions) contain fields (the questions). Entries (submissions) are field_id→value mappings keyed by short_field_id strings like 'Field1', 'Field2'.

  **Pagination**: `?pageStart=N&pageSize=M` (max 100).

  **Sort/filter**: pass filters via query params `Filter1=Field1+Is_equal_to+ACME&match=AND` (Wufoo's quirky filter syntax).

  **Out of scope here**: form creation (UI-only), reports, users, webhooks (configured in UI).
tools:
  - name: wufoo_list_forms
    description: List all forms on the account. Each form has Hash, Name, Description, EntryCount, DateCreated, DateUpdated, Url, IsPublic.
    input:
      type: object
      properties:
        pretty:
          type: boolean
          description: Pretty-print JSON.
        includeTodayCount:
          type: boolean
          description: Include today's entry count per form.
    operation:
      method: GET
      path: /forms.json
      query:
        pretty: '{{params.pretty}}'
        includeTodayCount: '{{params.includeTodayCount}}'
  - name: wufoo_get_form
    description: Fetch a single form's metadata by its Hash.
    input:
      type: object
      properties:
        formIdentifier:
          type: string
          description: Form Hash (e.g. 'x7w1q1') or URL slug.
      required:
        - formIdentifier
    operation:
      method: GET
      path: /forms/{{params.formIdentifier}}.json
  - name: wufoo_get_form_fields
    description: Get a form's fields (the questions). Returns Title, Type, ID (e.g. 'Field1'), IsRequired, Choices (for picker fields), DefaultVal.
    input:
      type: object
      properties:
        formIdentifier:
          type: string
          description: Form Hash.
        system:
          type: boolean
          description: If true, also return system fields (e.g. EntryId, DateCreated).
      required:
        - formIdentifier
    operation:
      method: GET
      path: /forms/{{params.formIdentifier}}/fields.json
      query:
        system: '{{params.system}}'
  - name: wufoo_list_form_entries
    description: List submissions (entries) for a form. Each entry is a row with Field1/Field2/.../EntryId/DateCreated/IP keys.
    input:
      type: object
      properties:
        formIdentifier:
          type: string
          description: Form Hash.
        pageStart:
          type: integer
          description: 0-based offset.
        pageSize:
          type: integer
          description: Per page (max 100).
        sort:
          type: string
          description: Field ID to sort by.
        sortDirection:
          type: string
          description: ASC or DESC.
        system:
          type: boolean
          description: Include system fields.
        Filter1:
          type: string
          description: 'Filter expression: ''Field1+Is_equal_to+ACME''.'
        match:
          type: string
          description: AND or OR (for multiple filters).
      required:
        - formIdentifier
    operation:
      method: GET
      path: /forms/{{params.formIdentifier}}/entries.json
      query:
        pageStart: '{{params.pageStart}}'
        pageSize: '{{params.pageSize}}'
        sort: '{{params.sort}}'
        sortDirection: '{{params.sortDirection}}'
        system: '{{params.system}}'
        Filter1: '{{params.Filter1}}'
        match: '{{params.match}}'
  - name: wufoo_count_form_entries
    description: Return just the entry count for a form (cheap — no entry payload).
    input:
      type: object
      properties:
        formIdentifier:
          type: string
          description: Form Hash.
      required:
        - formIdentifier
    operation:
      method: GET
      path: /forms/{{params.formIdentifier}}/entries/count.json
  - name: wufoo_create_form_entry
    description: 'Submit a new entry to a form (programmatic submission). Body is keyed by Field ID strings: {Field1:''value'', Field2:''value'', ...}. Get field IDs from wufoo_get_form_fields.'
    input:
      type: object
      properties:
        formIdentifier:
          type: string
          description: Form Hash.
        fields:
          type: object
          description: 'Map of {Field1: value, Field2: value, ...}.'
      required:
        - formIdentifier
        - fields
    operation:
      method: POST
      path: /forms/{{params.formIdentifier}}/entries.json
      body:
        encoding: form
        value:
          fields: '{{params.fields}}'
