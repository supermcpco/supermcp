# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: youtube-data
  name: YouTube Data API
  description: Read YouTube data — videos, channels, playlists, search, comments — and (with OAuth) manage your own uploads. 9 tools, API key + optional OAuth Bearer.
  region: intl
  category: social
  icon: youtube
  docsUrl: https://developers.google.com/youtube/v3/docs
  lint:
    allow:
      - description-min-60
      - healthcheck-present
      - tool-name-prefix
credentials:
  YOUTUBE_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://www.googleapis.com/youtube/v3
auth:
  type: query
  params:
    key: '{{env.YOUTUBE_API_KEY}}'
instructions: |-
  This connector uses the YouTube Data API v3 (developers.google.com/youtube/v3).

  **Setup**:
  1. Create / pick a Google Cloud project at https://console.cloud.google.com.
  2. **APIs & Services → Library → enable YouTube Data API v3**.
  3. **Credentials → Create credentials → API key**. (For write operations, also do OAuth2 client + get a Bearer token with `youtube.upload`/`youtube` scopes — out of scope here.)
  4. Set `YOUTUBE_API_KEY` to the API key.

  **Authentication**: query-string `?key=...`. Read operations don't need OAuth.

  **Quota model**: every API call costs **units** against your daily quota (default 10,000/day for new projects — request more via Google's quota form). search.list costs 100 units per call (most expensive), videos.list ~1 unit. Watch quota in the Cloud Console.

  **part parameter**: most resources let you choose which 'parts' of the object to return — e.g. `?part=snippet,statistics,contentDetails`. Slimmer = cheaper.

  **Pagination**: `nextPageToken` cursor.

  **Out of scope here**: video uploads (multipart + OAuth + resumable upload), captions, comment moderation, live broadcasts, monetization, channel branding.
tools:
  - name: youtube_search
    description: Search videos / channels / playlists. Costs 100 quota units. Filter by type, order, region, language, date range.
    input:
      type: object
      properties:
        q:
          type: string
          description: Search query.
        type:
          type: string
          description: channel, playlist, video, or comma-separated.
        order:
          type: string
          description: date, rating, relevance (default), title, viewCount, videoCount.
        regionCode:
          type: string
          description: ISO 3166-1 alpha-2.
        relevanceLanguage:
          type: string
          description: ISO 639-1.
        publishedAfter:
          type: string
          description: ISO 8601 datetime.
        publishedBefore:
          type: string
          description: ISO 8601 datetime.
        channelId:
          type: string
          description: Restrict to videos by this channel.
        videoDuration:
          type: string
          description: any, short (<4min), medium (4-20min), long (>20min).
        maxResults:
          type: integer
          description: 1-50 (default 5).
        pageToken:
          type: string
          description: Cursor for next page.
        part:
          type: string
          description: snippet (always for search). Other parts not available on search.list.
      required:
        - q
    operation:
      method: GET
      path: /search
      query:
        q: '{{params.q}}'
        type: '{{params.type}}'
        order: '{{params.order}}'
        regionCode: '{{params.regionCode}}'
        relevanceLanguage: '{{params.relevanceLanguage}}'
        publishedAfter: '{{params.publishedAfter}}'
        publishedBefore: '{{params.publishedBefore}}'
        channelId: '{{params.channelId}}'
        videoDuration: '{{params.videoDuration}}'
        maxResults: '{{params.maxResults}}'
        pageToken: '{{params.pageToken}}'
        part: '{{params.part}}'
  - name: youtube_get_videos
    description: Fetch video details by ID(s). Cheap (1 unit) — prefer this over search when you already have IDs.
    input:
      type: object
      properties:
        id:
          type: string
          description: Comma-separated video IDs (max 50).
        part:
          type: string
          description: 'Comma-separated: snippet, contentDetails, statistics, status, player, topicDetails, recordingDetails, fileDetails, liveStreamingDetails.'
      required:
        - id
        - part
    operation:
      method: GET
      path: /videos
      query:
        id: '{{params.id}}'
        part: '{{params.part}}'
  - name: youtube_get_videos_chart
    description: Get videos from a chart (currently only 'mostPopular'). Region-specific.
    input:
      type: object
      properties:
        chart:
          type: string
          description: mostPopular.
        regionCode:
          type: string
          description: ISO 3166-1 alpha-2 country.
        videoCategoryId:
          type: string
          description: Restrict to a category.
        maxResults:
          type: integer
          description: 1-50.
        part:
          type: string
          description: Parts.
      required:
        - chart
        - part
    operation:
      method: GET
      path: /videos
      query:
        chart: '{{params.chart}}'
        regionCode: '{{params.regionCode}}'
        videoCategoryId: '{{params.videoCategoryId}}'
        maxResults: '{{params.maxResults}}'
        part: '{{params.part}}'
  - name: youtube_get_channels
    description: Fetch channel details by ID, handle (@username), forUsername (legacy), or 'mine' (requires OAuth).
    input:
      type: object
      properties:
        id:
          type: string
          description: Comma-separated channel IDs.
        forHandle:
          type: string
          description: Channel handle (with or without leading @).
        forUsername:
          type: string
          description: Legacy username (mostly defunct).
        mine:
          type: boolean
          description: true = the OAuth-authenticated user's channel (requires OAuth scope).
        part:
          type: string
          description: snippet, contentDetails, statistics, status, brandingSettings, topicDetails, localizations.
      required:
        - part
    operation:
      method: GET
      path: /channels
      query:
        id: '{{params.id}}'
        forHandle: '{{params.forHandle}}'
        forUsername: '{{params.forUsername}}'
        mine: '{{params.mine}}'
        part: '{{params.part}}'
  - name: youtube_list_playlists
    description: List playlists, filtered by channelId or 'mine' (OAuth).
    input:
      type: object
      properties:
        channelId:
          type: string
          description: Channel ID.
        id:
          type: string
          description: Comma-separated playlist IDs.
        mine:
          type: boolean
          description: OAuth user's playlists.
        maxResults:
          type: integer
          description: 1-50.
        pageToken:
          type: string
          description: Cursor.
        part:
          type: string
          description: snippet, contentDetails, player, status.
      required:
        - part
    operation:
      method: GET
      path: /playlists
      query:
        channelId: '{{params.channelId}}'
        id: '{{params.id}}'
        mine: '{{params.mine}}'
        maxResults: '{{params.maxResults}}'
        pageToken: '{{params.pageToken}}'
        part: '{{params.part}}'
  - name: youtube_list_playlist_items
    description: List items in a playlist (videos in playlist).
    input:
      type: object
      properties:
        playlistId:
          type: string
          description: Playlist ID.
        videoId:
          type: string
          description: Filter to one specific video.
        maxResults:
          type: integer
          description: 1-50.
        pageToken:
          type: string
          description: Cursor.
        part:
          type: string
          description: snippet, contentDetails, status, id.
      required:
        - playlistId
        - part
    operation:
      method: GET
      path: /playlistItems
      query:
        playlistId: '{{params.playlistId}}'
        videoId: '{{params.videoId}}'
        maxResults: '{{params.maxResults}}'
        pageToken: '{{params.pageToken}}'
        part: '{{params.part}}'
  - name: youtube_list_video_comments
    description: List top-level comments on a video. Use commentThreads.list (not comments.list which is for child comments).
    input:
      type: object
      properties:
        videoId:
          type: string
          description: Video ID.
        order:
          type: string
          description: time (default) or relevance.
        maxResults:
          type: integer
          description: 1-100.
        pageToken:
          type: string
          description: Cursor.
        searchTerms:
          type: string
          description: Filter to comments containing this text.
        part:
          type: string
          description: snippet, replies, id.
      required:
        - videoId
        - part
    operation:
      method: GET
      path: /commentThreads
      query:
        videoId: '{{params.videoId}}'
        order: '{{params.order}}'
        maxResults: '{{params.maxResults}}'
        pageToken: '{{params.pageToken}}'
        searchTerms: '{{params.searchTerms}}'
        part: '{{params.part}}'
  - name: youtube_list_categories
    description: List video categories for a region.
    input:
      type: object
      properties:
        regionCode:
          type: string
          description: ISO 3166-1 alpha-2.
        part:
          type: string
          description: snippet.
      required:
        - part
    operation:
      method: GET
      path: /videoCategories
      query:
        regionCode: '{{params.regionCode}}'
        part: '{{params.part}}'
  - name: youtube_get_captions
    description: List caption tracks available for a video.
    input:
      type: object
      properties:
        videoId:
          type: string
          description: Video ID.
        part:
          type: string
          description: snippet, id.
      required:
        - videoId
        - part
    operation:
      method: GET
      path: /captions
      query:
        videoId: '{{params.videoId}}'
        part: '{{params.part}}'
