# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: microsoft-bookings
  name: Microsoft Bookings
  description: 'Drive Microsoft Bookings (Microsoft 365 scheduling product) via the Graph API: businesses, services, staff, appointments, customers. 8 tools, OAuth2 Bearer auth.'
  region: intl
  category: scheduling
  icon: microsoft-bookings
  docsUrl: https://learn.microsoft.com/en-us/graph/api/resources/booking-api-overview
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  MICROSOFT_GRAPH_ACCESS_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://graph.microsoft.com/v1.0
auth:
  type: bearer
  token: '{{env.MICROSOFT_GRAPH_ACCESS_TOKEN}}'
instructions: |-
  This connector uses the Microsoft Graph API v1.0 — Bookings endpoints (learn.microsoft.com/en-us/graph/api/resources/booking-api-overview).

  **Setup**:
  1. Register an Azure AD app at https://portal.azure.com → **App registrations → New registration**.
  2. **API permissions → Microsoft Graph → Delegated** (or Application) → add: `Bookings.Read.All`, `BookingsAppointment.ReadWrite.All` (write needs admin consent).
  3. Run OAuth2 authorization-code (or client-credentials) flow against `login.microsoftonline.com/{tenant}/oauth2/v2.0/token` to get an access token.
  4. Set `MICROSOFT_GRAPH_ACCESS_TOKEN`.

  **Authentication**: `Authorization: Bearer ${MICROSOFT_GRAPH_ACCESS_TOKEN}`.

  **Booking Business ID**: every Microsoft Bookings 'page' is a Booking Business. Discover them via `bookings_list_businesses`. The id looks like `Contoso@yourtenant.onmicrosoft.com` (an SMTP-like address, NOT a UUID).

  **Public booking endpoints**: most of Microsoft Bookings is private (admin-only). The public 'self-service' booking pages are at `https://outlook.office.com/owa/calendar/{biz_id}@{tenant}/bookings/` — out of scope; agents use the admin endpoints here.

  **Rate limits**: Graph throttling kicks in around 10k req per 10 min per app per user. On 429 honor Retry-After.

  **Out of scope here**: webhooks, custom questions per service, Microsoft Bookings staff scheduling rules.
tools:
  - name: microsoft_bookings_list_businesses
    description: List all Bookings Businesses (mailbox-style booking pages) on the tenant.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /solutions/bookingBusinesses
  - name: microsoft_bookings_get_business
    description: Get a Booking Business by ID with its public profile.
    input:
      type: object
      properties:
        businessId:
          type: string
          description: Bookings business ID (Contoso@tenant.onmicrosoft.com).
      required:
        - businessId
    operation:
      method: GET
      path: /solutions/bookingBusinesses/{{params.businessId}}
  - name: microsoft_bookings_list_services
    description: List services (offerings) of a Booking Business. Each service has id, displayName, duration, defaultPrice, staffMemberIds[], smsNotificationsEnabled.
    input:
      type: object
      properties:
        businessId:
          type: string
          description: Business ID.
      required:
        - businessId
    operation:
      method: GET
      path: /solutions/bookingBusinesses/{{params.businessId}}/services
  - name: microsoft_bookings_list_staff_members
    description: List staff members of a Booking Business.
    input:
      type: object
      properties:
        businessId:
          type: string
          description: Business ID.
      required:
        - businessId
    operation:
      method: GET
      path: /solutions/bookingBusinesses/{{params.businessId}}/staffMembers
  - name: microsoft_bookings_list_appointments
    description: List appointments (bookings) in a Booking Business.
    input:
      type: object
      properties:
        businessId:
          type: string
          description: Business ID.
        $top:
          type: integer
          description: Max results per page.
        $filter:
          type: string
          description: OData $filter, e.g. 'start/dateTime ge 2025-01-01T00:00:00Z'.
      required:
        - businessId
    operation:
      method: GET
      path: /solutions/bookingBusinesses/{{params.businessId}}/appointments
      query:
        $top: '{{params.$top}}'
        $filter: '{{params.$filter}}'
  - name: microsoft_bookings_get_appointment
    description: Get one appointment by ID.
    input:
      type: object
      properties:
        businessId:
          type: string
          description: Business ID.
        appointmentId:
          type: string
          description: Appointment ID.
      required:
        - businessId
        - appointmentId
    operation:
      method: GET
      path: /solutions/bookingBusinesses/{{params.businessId}}/appointments/{{params.appointmentId}}
  - name: microsoft_bookings_create_appointment
    description: 'Create a booked appointment. Required: serviceId + start + end + customers.'
    input:
      type: object
      properties:
        businessId:
          type: string
          description: Business ID.
        appointment:
          type: object
          description: '{serviceId, start:{dateTime:''2025-01-01T15:00:00'', timeZone:''Pacific Standard Time''}, end:{...}, customers:[{customerId? OR name+emailAddress}], staffMemberIds?:[], serviceLocation?:{...}, customerNotes?, smsNotificationsEnabled?:bool, isLocationOnline?:bool}.'
      required:
        - businessId
        - appointment
    operation:
      method: POST
      path: /solutions/bookingBusinesses/{{params.businessId}}/appointments
      headers:
        Content-Type: application/json
      body:
        encoding: raw
        value: '{{params.appointment}}'
  - name: microsoft_bookings_cancel_appointment
    description: Cancel an appointment. Optional cancellationMessage.
    input:
      type: object
      properties:
        businessId:
          type: string
          description: Business ID.
        appointmentId:
          type: string
          description: Appointment ID.
        cancellationMessage:
          type: string
          description: Message sent to the customer.
      required:
        - businessId
        - appointmentId
    operation:
      method: POST
      path: /solutions/bookingBusinesses/{{params.businessId}}/appointments/{{params.appointmentId}}/cancel
      body:
        value:
          cancellationMessage: '{{params.cancellationMessage}}'
