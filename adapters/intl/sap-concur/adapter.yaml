# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: sap-concur
  name: SAP Concur
  description: Manage Concur expense reports, approvals, attendees, locations, users and travel itineraries from any AI agent. OAuth 2.0 refresh-token flow. Free developer sandbox on developer.concur.com.
  region: intl
  category: finance
  icon: sap-concur
  docsUrl: https://developer.concur.com/api-reference/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
      - instructions-min-800
      - tool-name-prefix
credentials:
  CONCUR_REGION:
    required: true
  CONCUR_CLIENT_ID:
    required: true
  CONCUR_CLIENT_SECRET:
    required: true
    secret: true
  CONCUR_REFRESH_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://{{env.CONCUR_REGION}}.api.concursolutions.com
auth:
  type: oauth2
  grant: refresh_token
  clientId: '{{env.CONCUR_CLIENT_ID}}'
  clientSecret: '{{env.CONCUR_CLIENT_SECRET}}'
  tokenUrl: https://{{env.CONCUR_REGION}}.api.concursolutions.com/oauth2/v0/token
  scopes:
    - EXPRPT
    - USER
    - LIST
  refreshToken: '{{env.CONCUR_REFRESH_TOKEN}}'
instructions: |-
  **Setup**:
  1. Sign up on https://developer.concur.com and create a Company Sandbox.
  2. Register a new app in the **My Apps** page → request scopes `EXPRPT`, `USER`, `LIST` (and optionally `TRVPRO` for travel).
  3. Concur emails you a `Client ID` + `Client Secret`. Generate a `Refresh Token` via the Password Grant — needed once.
  4. Decide your region: `us` (https://us.api.concursolutions.com) or `eu` (https://eu.api.concursolutions.com).
  5. Set the four env vars below.

  **Authentication**: OAuth2 refresh-token grant. The adapter auto-refreshes the access token before expiry.

  **Rate limits**: 25 requests/sec per refresh token (defaults). Bulk export endpoints have stricter quotas.
tools:
  - name: concur_list_reports
    description: List expense reports for the connected company. Use `user=ALL` (default) for org-wide view or a specific login ID for a single user.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Page size (default 25, max 100)
        user:
          type: string
          description: Login ID of the user to filter, or `ALL` for all users (default)
        approvalStatusCode:
          type: string
          description: Approval status filter, e.g. A_PEND, A_APPR, A_REJC
    operation:
      method: GET
      path: /api/v3.0/expense/reports
      query:
        limit: '{{params.limit}}'
        user: '{{params.user}}'
        approvalStatusCode: '{{params.approvalStatusCode}}'
  - name: concur_get_report
    description: Get the full detail of one expense report by its ID.
    input:
      type: object
      properties:
        reportId:
          type: string
          description: The Concur Report ID
      required:
        - reportId
    operation:
      method: GET
      path: /api/v3.0/expense/reports/{{params.reportId}}
  - name: concur_list_report_entries
    description: List the individual expense entries (line items) inside a given report.
    input:
      type: object
      properties:
        reportId:
          type: string
          description: The Concur Report ID
        limit:
          type: number
          description: Page size
      required:
        - reportId
    operation:
      method: GET
      path: /api/v3.0/expense/entries
      query:
        reportID: '{{params.reportId}}'
        limit: '{{params.limit}}'
  - name: concur_submit_report
    description: Submit an expense report for approval. The report must be in a non-submitted state.
    input:
      type: object
      properties:
        reportId:
          type: string
          description: The Concur Report ID
      required:
        - reportId
    operation:
      method: POST
      path: /api/v3.0/expense/reports/{{params.reportId}}/submit
  - name: concur_workflow_action
    description: Approve, send-back or reject a submitted expense report. Action ∈ Approve, Send Back, Reject.
    input:
      type: object
      properties:
        reportId:
          type: string
          description: The Concur Report ID
        action:
          type: string
          description: Approve | Send Back | Reject
        comment:
          type: string
          description: Optional comment shown in the workflow
      required:
        - reportId
        - action
    operation:
      method: POST
      path: /api/v3.0/expense/reports/{{params.reportId}}/workflowaction
      body:
        value:
          Action: '{{params.action}}'
          Comment: '{{params.comment}}'
  - name: concur_list_attendees
    description: List meeting/expense attendees registered in the company directory.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Page size
    operation:
      method: GET
      path: /api/v3.0/common/attendees
      query:
        limit: '{{params.limit}}'
  - name: concur_list_locations
    description: List travel/expense locations (cities, regions) available to your tenant.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Page size
    operation:
      method: GET
      path: /api/v3.0/common/locations
      query:
        limit: '{{params.limit}}'
  - name: concur_list_users
    description: List user accounts in the connected Concur tenant.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Page size
    operation:
      method: GET
      path: /api/v3.0/common/users
      query:
        limit: '{{params.limit}}'
  - name: concur_get_user
    description: Get one user profile by its Concur user ID.
    input:
      type: object
      properties:
        userId:
          type: string
          description: Concur user ID
      required:
        - userId
    operation:
      method: GET
      path: /api/v3.0/common/users/{{params.userId}}
  - name: concur_list_itineraries
    description: List travel itineraries (Concur Travel). Requires TRVPRO scope on the OAuth client.
    input:
      type: object
      properties:
        limit:
          type: number
          description: Page size
    operation:
      method: GET
      path: /api/v3.0/travel/itineraries
      query:
        limit: '{{params.limit}}'
