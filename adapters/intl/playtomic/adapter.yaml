# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: playtomic
  name: Playtomic
  description: Full Playtomic access for padel, tennis, and futsal players. Search clubs and availability, find open matches to join, read your own profile, level, stats, history, and recommendations. 13 tools, email + password auth with automatic JWT refresh.
  region: intl
  category: sports
  icon: playtomic
  docsUrl: https://playtomic.io
  priority: 90
  featured: true
  lint:
    allow:
      - healthcheck-present
      - tool-name-unique-catalog
credentials:
  PLAYTOMIC_EMAIL:
    required: true
  PLAYTOMIC_PASSWORD:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.app.playtomic.io
auth:
  type: login
  request:
    method: POST
    url: https://api.app.playtomic.io/v3/auth/login
    body:
      requested_user_roles:
        - ROLE_CUSTOMER
      email: '{{auth.username}}'
      password: '{{auth.password}}'
  credentials:
    username: '{{env.PLAYTOMIC_EMAIL}}'
    password: '{{env.PLAYTOMIC_PASSWORD}}'
  tokenSource:
    from: body
    jsonPath: access_token
  expiry:
    jsonPath: access_token_expiration
    format: iso8601
    refreshBefore: 1m
    refreshOn401: true
  inject:
    header: Authorization
    template: Bearer {{auth.token}}
instructions: |-
  ## Authentication (handled automatically)

  Playtomic uses email + password to mint a ~1-hour JWT. The supermcp `LOGIN_TOKEN` engine handles login, caching, and refresh:

  1. `POST https://api.app.playtomic.io/v3/auth/login` with `{ email, password, requested_user_roles: ["ROLE_CUSTOMER"] }`.
  2. The response contains `access_token` (JWT, ~1h TTL) and `refresh_token` (~60d).
  3. Every tool call attaches `Authorization: Bearer <access_token>`.
  4. The engine proactively re-logs in 60 s before expiry and on any `401`. Tokens are cached encrypted in the `connector_auth_cache` DB table.

  ## Credentials

  - `PLAYTOMIC_EMAIL` — your Playtomic account email.
  - `PLAYTOMIC_PASSWORD` — your plain account password. Stored encrypted; only sent over TLS to Playtomic's login endpoint.

  ## When dedicated tools are not enough

  The 13 tools below cover the common Playtomic workflows. Anything not exposed (e.g. accepting a join request, creating a match, paying for a booking) requires Playtomic's mobile app — there is no documented public booking write API and we deliberately don't expose write endpoints.

  ## Public vs full connector

  If you only want to **search clubs and check availability** (no personal data), use the `playtomic-public` (Playtomic Lite) connector instead — the same 4 read tools with a lighter scope. It still needs a free Playtomic account, since Playtomic closed anonymous API access.

  ## Pricing notes

  - `price` is a string like `"48 EUR"` — parse amount + currency.
  - The same `start_time` may appear with several `duration` values (60/90/120 min). These are alternative bookings of the same slot, not separate free slots.
  - `duration` is in **minutes**.
  - If your account has linked club memberships, pricing returned by `playtomic_get_availability` reflects your member discount.

  ## Time handling

  - `local_start_min` / `local_start_max` are naive ISO-8601 in the **tenant's** local timezone (see `tenant.address.timezone`, e.g. `Europe/Berlin`). For a full day use `T00:00:00` → `T23:59:59` on the same date.
  - Match/course/tournament date filters use the same naive ISO format unless otherwise noted.

  ## Joining availability to courts

  Every availability row has a `resource_id`. Map it back to `tenant.resources[]` (from `playtomic_get_tenant`) to know court name, indoor/outdoor, single/double, surface.

  ## Levels & match recommendations

  - `level_value` is your Playtomic skill rating (typically 0–7). `level_confidence` reflects how many matches the rating is based on.
  - `playtomic_match_recommendations` returns open matches at your level near a coordinate. Empty array = no recommendations right now (it's normal).

  ## Rate limits

  Playtomic has no published SLA. Keep request volume reasonable (≤1 req/s steady state). The engine auto-handles `401` with a retry-after-relogin and gives up after one retry — if you see `401` twice, check that your credentials are correct.

  ## Stability

  This is an undocumented/internal API reverse-engineered from the Playtomic iOS app. Endpoints can change without notice. If a tool starts failing, check the supermcp docs for a connector update.

  ## Useful starter prompts

  - "Find open padel matches at my level near Milan this weekend." → `playtomic_match_recommendations`
  - "What's my current padel level on Playtomic?" → `playtomic_get_my_level`
  - "How many padel matches have I won this year?" → `playtomic_get_my_stats`
  - "At which clubs do I play the most?" → `playtomic_get_top_clubs`
  - "Show me free crystal-court slots tomorrow afternoon within 20 km of my home." → `playtomic_search_tenants` + `playtomic_get_availability`
  - "Are there any padel tournaments coming up near Barcelona?" → `playtomic_list_tournaments`
tools:
  - name: playtomic_search_tenants
    description: Search Playtomic clubs (tenants) — typically by geo coordinate + radius. Returns active clubs with their courts (`resources[]`), address, timezone, images. Use this first to find clubs near a city; pass `tenant_id` values into `playtomic_get_availability` to check free slots.
    input:
      type: object
      properties:
        coordinate:
          type: string
          description: Geo center as `lat,lon` (e.g. `48.0708,7.9006`). Required for geo search.
        radius:
          type: integer
          description: Search radius in meters. Default 50000 (50 km).
          default: 50000
        sport_id:
          type: string
          enum:
            - PADEL
            - TENNIS
            - FUTSAL
          description: Sport filter.
        size:
          type: integer
          description: Max clubs to return (default 20).
          default: 20
          minimum: 1
          maximum: 100
        page:
          type: integer
          description: 0-based page index.
          default: 0
      required:
        - coordinate
    proxy: true
    operation:
      method: GET
      path: /v1/tenants
      query:
        coordinate: '{{params.coordinate}}'
        radius: '{{params.radius}}'
        sport_id: '{{params.sport_id}}'
        size: '{{params.size}}'
        page: '{{params.page}}'
        playtomic_status: ACTIVE
  - name: playtomic_get_tenant
    description: Get full detail of a single Playtomic club by `tenant_id` (UUID) — including all courts, opening info, contact, gallery. Use after `playtomic_search_tenants` or to join availability rows to court metadata.
    input:
      type: object
      properties:
        tenant_id:
          type: string
          description: Tenant UUID.
      required:
        - tenant_id
    proxy: true
    operation:
      method: GET
      path: /v1/tenants/{{params.tenant_id}}
  - name: playtomic_get_availability
    description: Read free court slots for a given day at one or more clubs. With this connector pricing reflects your account (member discounts if any). Returns an array, one entry per court, each with `slots[]` of `{ start_time, duration (min), price (string e.g. "48 EUR") }`.
    input:
      type: object
      properties:
        sport_id:
          type: string
          enum:
            - PADEL
            - TENNIS
            - FUTSAL
          default: PADEL
        tenant_id:
          type: string
          description: One tenant UUID, or several comma-separated (e.g. `id1,id2,id3`).
        local_start_min:
          type: string
          description: Naive ISO-8601 lower bound in tenant local time, e.g. `2026-05-23T00:00:00`.
        local_start_max:
          type: string
          description: Naive ISO-8601 upper bound, e.g. `2026-05-23T23:59:59`.
      required:
        - tenant_id
        - local_start_min
        - local_start_max
    proxy: true
    operation:
      method: GET
      path: /v1/availability
      query:
        sport_id: '{{params.sport_id}}'
        tenant_id: '{{params.tenant_id}}'
        local_start_min: '{{params.local_start_min}}'
        local_start_max: '{{params.local_start_max}}'
        user_id: me
  - name: playtomic_get_sport_configuration
    description: Read Playtomic's canonical sport configuration — enums for allowed durations, court properties (indoor/outdoor/roofed, single/double, wall/crystal/panoramic), supported sports. Reference data; rarely changes.
    input:
      type: object
      properties: {}
    proxy: true
    operation:
      method: GET
      path: /v2/configuration
  - name: playtomic_get_my_profile
    description: Full profile of the authenticated user — name, email, phone, communications language, `linked_accounts` per club, accepted commercial/privacy flags. Useful as a health check.
    input:
      type: object
      properties: {}
    proxy: true
    operation:
      method: GET
      path: /v2/users/me
  - name: playtomic_get_my_level
    description: Your Playtomic skill level per sport — `level_value` (typically 0–7), `level_confidence` (matches-based confidence), `status`. Pass `with_history=true` to include historical level changes.
    input:
      type: object
      properties:
        with_history:
          type: boolean
          description: Include level history.
          default: false
    proxy: true
    operation:
      method: GET
      path: /v1/levels
      query:
        user_id: me
        with_history: '{{params.with_history}}'
  - name: playtomic_get_my_stats
    description: Lifetime match results for the authenticated user in a given sport — `played`, `won`, `lost`, `drawn`, `validating`, `rejected`.
    input:
      type: object
      properties:
        sport_id:
          type: string
          enum:
            - PADEL
            - TENNIS
            - FUTSAL
          default: PADEL
    proxy: true
    operation:
      method: GET
      path: /v1/matches_summary/results
      query:
        player_user_id: me
        sport_id: '{{params.sport_id}}'
  - name: playtomic_get_top_clubs
    description: Clubs where the authenticated user plays most often (all-time or last 3 months). Returns `[{ tenant_id, count }]` ordered by frequency. Enrich with `playtomic_get_tenant` to get names.
    input:
      type: object
      properties:
        sport_id:
          type: string
          enum:
            - PADEL
            - TENNIS
            - FUTSAL
          default: PADEL
        size:
          type: integer
          description: Max clubs to return (default 10).
          default: 10
        last_three_months_only:
          type: boolean
          description: Restrict to last 3 months (uses the `/last_three_months` variant). Default false (all-time).
          default: false
    proxy: true
    operation:
      method: GET
      path: /v1/matches_summary/top_tenants_by_player
      query:
        player_user_id: me
        sport_id: '{{params.sport_id}}'
        size: '{{params.size}}'
  - name: playtomic_find_open_matches
    description: Search open matches in a date window (people looking for partners). Filter by `match_status` and `join_request_status`. Useful with phrases like 'show me open padel matches this weekend at my level'.
    input:
      type: object
      properties:
        after_end_date:
          type: string
          description: Naive ISO-8601 lower bound on match end date (e.g. `2026-05-23T00:00:00`).
        before_end_date:
          type: string
          description: Naive ISO-8601 upper bound on match end date.
        match_status:
          type: string
          description: Comma-separated statuses (default `PENDING,IN_PROGRESS`).
          default: PENDING,IN_PROGRESS
        size:
          type: integer
          description: Max matches to return.
          default: 20
          minimum: 1
          maximum: 100
      required:
        - after_end_date
        - before_end_date
    proxy: true
    operation:
      method: GET
      path: /v1/matches
      query:
        after_end_date: '{{params.after_end_date}}'
        before_end_date: '{{params.before_end_date}}'
        match_status: '{{params.match_status}}'
        size: '{{params.size}}'
        sort: start_date,created_at,ASC
        disable_price_calculation: "true"
  - name: playtomic_get_match
    description: Full detail of a single match by `match_id` — teams, players, location/tenant, lock_id, status.
    input:
      type: object
      properties:
        match_id:
          type: string
          description: Match UUID.
      required:
        - match_id
    proxy: true
    operation:
      method: GET
      path: /v1/matches/{{params.match_id}}
  - name: playtomic_match_recommendations
    description: Playtomic's algorithmic match recommendations for the authenticated user, given a geo center. Returns open matches at the user's level near the coordinate. Empty array = no recommendations right now.
    input:
      type: object
      properties:
        coordinate:
          type: string
          description: Geo center as `lat,lon`.
        size:
          type: integer
          description: Max recommendations.
          default: 10
          minimum: 1
          maximum: 50
        page:
          type: integer
          default: 0
      required:
        - coordinate
    proxy: true
    operation:
      method: GET
      path: /v1/match_recommendations
      query:
        coordinate: '{{params.coordinate}}'
        size: '{{params.size}}'
        page: '{{params.page}}'
        user_id: me
        with_price_calculation: "false"
  - name: playtomic_list_tournaments
    description: List tournaments visible to the authenticated user, filtered by start date and status.
    input:
      type: object
      properties:
        to_start_date:
          type: string
          description: Upper bound (naive ISO-8601) on tournament start.
        status:
          type: string
          description: Comma-separated statuses.
          default: PENDING,IN_PROGRESS
        size:
          type: integer
          default: 20
      required:
        - to_start_date
    proxy: true
    operation:
      method: GET
      path: /v2/tournaments
      query:
        to_start_date: '{{params.to_start_date}}'
        status: '{{params.status}}'
        user_id: me
        size: '{{params.size}}'
        sort: start_date,created_at,ASC
  - name: playtomic_list_leagues
    description: List open leagues near a coordinate, optionally for a sport and skill level.
    input:
      type: object
      properties:
        coordinate:
          type: string
          description: '`lat,lon`.'
        radius:
          type: integer
          default: 50000
        sport_id:
          type: string
          enum:
            - PADEL
            - TENNIS
            - FUTSAL
          default: PADEL
        for_level:
          type: number
          description: Your level (e.g. 3.5) — Playtomic filters leagues you're eligible for.
        size:
          type: integer
          default: 10
      required:
        - coordinate
    proxy: true
    operation:
      method: GET
      path: /v1/leagues
      query:
        coordinate: '{{params.coordinate}}'
        radius: '{{params.radius}}'
        sport_id: '{{params.sport_id}}'
        status: OPEN,IN_PROGRESS
        visibility: PUBLIC
        available_places: "true"
        for_level: '{{params.for_level}}'
        size: '{{params.size}}'
        page: "0"
