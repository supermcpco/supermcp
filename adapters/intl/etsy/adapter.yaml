# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: etsy
  name: Etsy
  description: Read and update Etsy shop data (listings, transactions, receipts, reviews) from any AI agent. OAuth2 with automatic refresh-token rotation + x-api-key dual auth.
  region: intl
  category: e-commerce
  icon: etsy
  docsUrl: https://developers.etsy.com/documentation/
  lint:
    allow:
      - description-min-60
credentials:
  ETSY_CLIENT_ID:
    required: true
  ETSY_CLIENT_SECRET:
    required: true
    secret: true
  ETSY_REFRESH_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://openapi.etsy.com/v3/application
auth:
  type: oauth2
  grant: refresh_token
  clientId: '{{env.ETSY_CLIENT_ID}}'
  clientSecret: '{{env.ETSY_CLIENT_SECRET}}'
  tokenUrl: https://api.etsy.com/v3/public/oauth/token
  refreshToken: '{{env.ETSY_REFRESH_TOKEN}}'
  extraHeaders:
    x-api-key: '{{env.ETSY_CLIENT_ID}}:{{env.ETSY_CLIENT_SECRET}}'
healthcheck:
  http:
    method: GET
    path: /openapi-ping
instructions: |-
  This connector uses the Etsy Open API v3 (developers.etsy.com) with **automatic OAuth2 refresh-token rotation**. You set it up once with a long-lived refresh token; supermcp keeps the short-lived access token (1 hour TTL) refreshed in the background, so you never see expired-token errors.

  **Setup**:
  1. Register an app at https://www.etsy.com/developers/your-apps → **Create New App**.
  2. Note the **Keystring** (= `client_id`) and **Shared secret** (= `client_secret`). Etsy wants BOTH of them in the `x-api-key` header, joined by a colon; the connector builds that for you.
  3. Run the Etsy OAuth2 PKCE flow once (locally or via `https://www.etsy.com/oauth/connect?...`) with scopes such as `transactions_r listings_r listings_w shops_r email_r`. You'll receive an access token and a refresh token.
  4. Set the three env vars:
     - `ETSY_CLIENT_ID` = the Keystring
     - `ETSY_CLIENT_SECRET` = the Shared secret
     - `ETSY_REFRESH_TOKEN` = the OAuth2 refresh token from step 3

  **Authentication**: the connector attaches both headers on every request:
    - `Authorization: Bearer <auto-refreshed access token>`
    - `x-api-key: ${ETSY_CLIENT_ID}:${ETSY_CLIENT_SECRET}`

  Etsy requires the API key on **every** request, OAuth or not, and it must carry the
  Keystring AND the Shared secret separated by a colon. The Keystring alone earns a
  `403 {"error":"Invalid API key: should be in the format 'keystring:shared_secret'."}`
  on every call.

  The access token is kept in memory and written back, together with the rotated refresh token, into this connector's own encrypted configuration, so a restart does not lose it. Per Etsy's policy, **refresh tokens rotate on each use**; supermcp stores the new one from every refresh response and re-uses it automatically.

  **Shop ID**: every account has a shop_id. Get it from `etsy_get_authenticated_user` then `etsy_get_user_shops`.

  **Pagination**: `?limit=N&offset=M` (limit max 100).

  **Rate limits**: 10k req/24h per app. On 429 back off.

  **"No authorization URL configured"** on the connector page is expected: this connector uses the refresh-token grant, so there is no Authorize button and nothing to click. Step 3 above is the one-off manual part.

  **Out of scope here**: listing image uploads, payment account, billing, taxonomy edits.
tools:
  - name: etsy_get_authenticated_user
    description: Return the user the OAuth token belongs to. Returns user_id, login_name, primary_email.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /users/me
  - name: etsy_get_user_shops
    description: List shops owned by the user. Returns shop_id, shop_name, currency_code, languages, login_name, last_updated_tsz, listing_active_count.
    input:
      type: object
      properties:
        user_id:
          type: integer
          description: User ID.
      required:
        - user_id
    operation:
      method: GET
      path: /users/{{params.user_id}}/shops
  - name: etsy_get_shop
    description: Fetch one shop by shop_id with full details (announcement, sale message, etc.).
    input:
      type: object
      properties:
        shop_id:
          type: integer
          description: Shop ID.
      required:
        - shop_id
    operation:
      method: GET
      path: /shops/{{params.shop_id}}
  - name: etsy_get_shop_listings_active
    description: List active listings in a shop.
    input:
      type: object
      properties:
        shop_id:
          type: integer
          description: Shop ID.
        limit:
          type: integer
          description: Per page (max 100).
        offset:
          type: integer
          description: Pagination offset.
        sort_on:
          type: string
          description: created, price, updated, score.
        sort_order:
          type: string
          description: asc, ascending, desc, descending, up, down.
        keywords:
          type: string
          description: Substring search on title.
      required:
        - shop_id
    operation:
      method: GET
      path: /shops/{{params.shop_id}}/listings/active
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        sort_on: '{{params.sort_on}}'
        sort_order: '{{params.sort_order}}'
        keywords: '{{params.keywords}}'
  - name: etsy_get_listing
    description: Fetch one listing by listing_id with full details.
    input:
      type: object
      properties:
        listing_id:
          type: integer
          description: Listing ID.
        includes:
          type: string
          description: 'Comma-separated: Shipping, Images, Shop, User, Translations, Inventory, Videos.'
      required:
        - listing_id
    operation:
      method: GET
      path: /listings/{{params.listing_id}}
      query:
        includes: '{{params.includes}}'
  - name: etsy_get_shop_receipts
    description: List orders (receipts) for the shop.
    input:
      type: object
      properties:
        shop_id:
          type: integer
          description: Shop ID.
        min_created:
          type: integer
          description: Unix timestamp.
        max_created:
          type: integer
          description: Unix timestamp.
        min_last_modified:
          type: integer
          description: Unix timestamp.
        max_last_modified:
          type: integer
          description: Unix timestamp.
        limit:
          type: integer
          description: Per page (max 100).
        offset:
          type: integer
          description: Offset.
        sort_on:
          type: string
          description: created, updated, receipt_id.
        sort_order:
          type: string
          description: asc, desc.
        was_paid:
          type: boolean
          description: Filter paid status.
        was_shipped:
          type: boolean
          description: Filter shipped status.
      required:
        - shop_id
    operation:
      method: GET
      path: /shops/{{params.shop_id}}/receipts
      query:
        min_created: '{{params.min_created}}'
        max_created: '{{params.max_created}}'
        min_last_modified: '{{params.min_last_modified}}'
        max_last_modified: '{{params.max_last_modified}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        sort_on: '{{params.sort_on}}'
        sort_order: '{{params.sort_order}}'
        was_paid: '{{params.was_paid}}'
        was_shipped: '{{params.was_shipped}}'
  - name: etsy_get_shop_receipt
    description: Fetch one receipt with buyer info, transactions[], shipping address.
    input:
      type: object
      properties:
        shop_id:
          type: integer
          description: Shop ID.
        receipt_id:
          type: integer
          description: Receipt ID.
      required:
        - shop_id
        - receipt_id
    operation:
      method: GET
      path: /shops/{{params.shop_id}}/receipts/{{params.receipt_id}}
  - name: etsy_get_shop_reviews
    description: List reviews (transactions with feedback) for the shop.
    input:
      type: object
      properties:
        shop_id:
          type: integer
          description: Shop ID.
        limit:
          type: integer
          description: Per page.
        offset:
          type: integer
          description: Offset.
        min_created:
          type: integer
          description: Unix timestamp lower bound.
      required:
        - shop_id
    operation:
      method: GET
      path: /shops/{{params.shop_id}}/reviews
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        min_created: '{{params.min_created}}'
  - name: etsy_get_listings_by_shop_section
    description: List listings filtered by a shop section.
    input:
      type: object
      properties:
        shop_id:
          type: integer
          description: Shop ID.
        shop_section_ids:
          type: string
          description: Comma-separated section IDs.
        limit:
          type: integer
          description: Per page.
        offset:
          type: integer
          description: Offset.
      required:
        - shop_id
        - shop_section_ids
    operation:
      method: GET
      path: /shops/{{params.shop_id}}/shop-sections/listings/active
      query:
        shop_section_ids: '{{params.shop_section_ids}}'
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
