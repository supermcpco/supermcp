# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: mapbox
  name: Mapbox
  description: Drive Mapbox APIs (geocoding, directions, isochrones, matrix, tilequery) from any AI agent. 8 tools, access-token query auth.
  region: intl
  category: maps
  icon: mapbox
  docsUrl: https://docs.mapbox.com/api/
  lint:
    allow:
      - healthcheck-present
credentials:
  MAPBOX_ACCESS_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.mapbox.com
auth:
  type: query
  params:
    access_token: '{{env.MAPBOX_ACCESS_TOKEN}}'
instructions: |-
  This connector uses Mapbox's various REST APIs (docs.mapbox.com/api/).

  **Setup**:
  1. Sign in to https://account.mapbox.com → **Access tokens → Create a token**.
  2. Pick scopes: usually `styles:read` + `fonts:read` + `geocoding` + `directions` + `matrix` + `isochrone` + `tilequery`.
  3. Copy the token (starts with `pk.`). Set `MAPBOX_ACCESS_TOKEN`.

  **Authentication**: query-string `?access_token=...`.

  **Coordinate convention** (Mapbox-specific): **longitude FIRST**, then latitude. The order is `lng,lat`, NOT `lat,lng` like Google Maps. Trip up on this and your results land in the wrong country.

  **Geocoding v6 (forward + reverse)** is now the default — uses `/search/geocode/v6/forward` and `/reverse`. v5 still works at `/geocoding/v5/mapbox.places/...` but is in maintenance.

  **Directions profiles**: driving, walking, cycling, driving-traffic (live traffic, premium tier).

  **Cost**: all Mapbox APIs have a generous free tier (50k geocoding/month, 100k directions/month). Beyond that, paid per request — check pricing page. Each API call counts as 1 'API hit'.

  **Out of scope here**: tile rendering (use Mapbox GL JS), uploads, custom datasets, navigation SDK.
tools:
  - name: mapbox_geocode_forward
    description: Forward geocoding (address text → coordinates). Returns ranked candidates with [longitude, latitude], place_name, address components.
    input:
      type: object
      properties:
        q:
          type: string
          description: Free-text address or place name.
        limit:
          type: integer
          description: Max results (1-10, default 5).
        country:
          type: string
          description: Comma-separated ISO 3166-1 alpha-2 codes to limit results (e.g. 'us,ca').
        proximity:
          type: string
          description: '''lng,lat'' coordinate to bias results toward (e.g. user''s current location).'
        language:
          type: string
          description: IETF tag for the language of results (en, de, fr, es, ja, zh, etc.).
        types:
          type: string
          description: 'Comma-separated place types: country,region,postcode,district,place,locality,neighborhood,address,poi.'
      required:
        - q
    operation:
      method: GET
      path: /search/geocode/v6/forward
      query:
        q: '{{params.q}}'
        limit: '{{params.limit}}'
        country: '{{params.country}}'
        proximity: '{{params.proximity}}'
        language: '{{params.language}}'
        types: '{{params.types}}'
  - name: mapbox_geocode_reverse
    description: Reverse geocoding (coordinates → address). Pass longitude + latitude.
    input:
      type: object
      properties:
        longitude:
          type: number
          description: Longitude in decimal degrees.
        latitude:
          type: number
          description: Latitude in decimal degrees.
        types:
          type: string
          description: Place types to consider.
        language:
          type: string
          description: Result language tag.
        limit:
          type: integer
          description: Max results (default 1).
      required:
        - longitude
        - latitude
    operation:
      method: GET
      path: /search/geocode/v6/reverse
      query:
        longitude: '{{params.longitude}}'
        latitude: '{{params.latitude}}'
        types: '{{params.types}}'
        language: '{{params.language}}'
        limit: '{{params.limit}}'
  - name: mapbox_directions
    description: Compute driving / walking / cycling directions between waypoints. Returns route geometry, duration (seconds), distance (meters), turn-by-turn steps.
    input:
      type: object
      properties:
        profile:
          type: string
          description: driving, walking, cycling, driving-traffic.
        coordinates:
          type: string
          description: Semicolon-separated 'lng,lat' waypoints (2-25). E.g. '13.4050,52.5200;9.9937,53.5511'.
        alternatives:
          type: boolean
          description: Return alternative routes too.
        geometries:
          type: string
          description: geojson, polyline, polyline6 (default polyline).
        overview:
          type: string
          description: full, simplified, false.
        steps:
          type: boolean
          description: Include turn-by-turn steps.
        language:
          type: string
          description: Voice/text language.
      required:
        - profile
        - coordinates
    operation:
      method: GET
      path: /directions/v5/mapbox/{{params.profile}}/{{params.coordinates}}
      query:
        alternatives: '{{params.alternatives}}'
        geometries: '{{params.geometries}}'
        overview: '{{params.overview}}'
        steps: '{{params.steps}}'
        language: '{{params.language}}'
  - name: mapbox_isochrone
    description: Get the area reachable within N minutes from a starting point (an 'isochrone' — like 'how far can I drive in 15 min?'). Returns a GeoJSON polygon.
    input:
      type: object
      properties:
        profile:
          type: string
          description: driving, walking, cycling.
        coordinates:
          type: string
          description: Origin 'lng,lat'.
        contours_minutes:
          type: string
          description: Comma-separated minute thresholds (e.g. '5,10,15'). Max 4 contours, max 60 min each.
        contours_meters:
          type: string
          description: 'Or distance-based: ''500,1000,1500'' meters (alternative to minutes).'
        polygons:
          type: boolean
          description: If true return polygons (default), if false return linestrings.
        generalize:
          type: number
          description: Smoothing in meters (positive number).
      required:
        - profile
        - coordinates
    operation:
      method: GET
      path: /isochrone/v1/mapbox/{{params.profile}}/{{params.coordinates}}
      query:
        contours_minutes: '{{params.contours_minutes}}'
        contours_meters: '{{params.contours_meters}}'
        polygons: '{{params.polygons}}'
        generalize: '{{params.generalize}}'
  - name: mapbox_matrix
    description: Compute travel-time and distance MATRIX between many origins and destinations (e.g. 5 warehouses × 100 customers = 500 cells). Returns durations[][] in seconds and distances[][] in meters.
    input:
      type: object
      properties:
        profile:
          type: string
          description: driving, walking, cycling, driving-traffic.
        coordinates:
          type: string
          description: Semicolon-separated 'lng,lat' (max 25 for driving/walking/cycling, 10 for driving-traffic).
        sources:
          type: string
          description: Comma-separated 0-based indices into coordinates to use as sources. 'all' to use all.
        destinations:
          type: string
          description: Same for destinations.
        annotations:
          type: string
          description: duration, distance, or 'duration,distance' (default duration only).
      required:
        - profile
        - coordinates
    operation:
      method: GET
      path: /directions-matrix/v1/mapbox/{{params.profile}}/{{params.coordinates}}
      query:
        sources: '{{params.sources}}'
        destinations: '{{params.destinations}}'
        annotations: '{{params.annotations}}'
  - name: mapbox_static_image
    description: Generate a static PNG/JPG map of a location with optional pin overlays. Returns the image binary URL.
    input:
      type: object
      properties:
        username:
          type: string
          description: Mapbox style username (typically 'mapbox' for built-in styles).
        style_id:
          type: string
          description: Style ID, e.g. 'streets-v12', 'outdoors-v12', 'satellite-v9'.
        overlay:
          type: string
          description: Optional pin overlay, e.g. 'pin-s-a+9ed4bd(-87.0186,32.4055)'.
        lng:
          type: number
          description: Center longitude.
        lat:
          type: number
          description: Center latitude.
        zoom:
          type: number
          description: 0-22.
        width:
          type: integer
          description: Pixels (max 1280).
        height:
          type: integer
          description: Pixels (max 1280).
      required:
        - username
        - style_id
        - lng
        - lat
        - zoom
        - width
        - height
    operation:
      method: GET
      path: /styles/v1/{{params.username}}/{{params.style_id}}/static/{{params.overlay}}{{params.lng}},{{params.lat}},{{params.zoom}}/{{params.width}}x{{params.height}}
  - name: mapbox_tilequery
    description: Query features in a vector tileset at a specific point — e.g. find which neighborhood a coordinate falls in.
    input:
      type: object
      properties:
        tileset_id:
          type: string
          description: Tileset ID, e.g. 'mapbox.mapbox-streets-v8'.
        lng:
          type: number
          description: Longitude.
        lat:
          type: number
          description: Latitude.
        radius:
          type: integer
          description: Search radius in meters (default 0).
        layers:
          type: string
          description: Comma-separated layer names to query.
        limit:
          type: integer
          description: Max features (default 5, max 50).
      required:
        - tileset_id
        - lng
        - lat
    operation:
      method: GET
      path: /v4/{{params.tileset_id}}/tilequery/{{params.lng}},{{params.lat}}.json
      query:
        radius: '{{params.radius}}'
        layers: '{{params.layers}}'
        limit: '{{params.limit}}'
  - name: mapbox_list_styles
    description: List custom map styles owned by your account. Use to discover style IDs for the static-image endpoint.
    input:
      type: object
      properties:
        username:
          type: string
          description: Mapbox account username.
      required:
        - username
    operation:
      method: GET
      path: /styles/v1/{{params.username}}
