# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: nimble
  name: Nimble
  description: Manage Nimble CRM (contacts, activities, deals, tasks, notes) from any AI agent. 9 tools, OAuth2 auth.
  region: intl
  category: crm
  icon: nimble
  docsUrl: https://nimble.readme.io/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  NIMBLE_CLIENT_ID:
    required: true
  NIMBLE_CLIENT_SECRET:
    required: true
    secret: true
  NIMBLE_REFRESH_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://app.nimble.com/api/v1
auth:
  type: oauth2
  grant: refresh_token
  clientId: '{{env.NIMBLE_CLIENT_ID}}'
  clientSecret: '{{env.NIMBLE_CLIENT_SECRET}}'
  tokenUrl: https://app.nimble.com/oauth/token
  refreshToken: '{{env.NIMBLE_REFRESH_TOKEN}}'
instructions: |-
  This connector wraps the Nimble REST API v1 (app.nimble.com/api/v1).

  **Setup — OAuth2 refresh flow**:
  1. Sign in to https://app.nimble.com → **Settings → Integrations → API → Create OAuth app**.
  2. Note the `client_id`, `client_secret`, and complete the OAuth dance at `https://app.nimble.com/oauth/authorize?response_type=code&client_id=...&redirect_uri=...&scope=...` to get an authorization code.
  3. Exchange for tokens: `POST https://app.nimble.com/oauth/token?grant_type=authorization_code&code=...&client_id=...&client_secret=...&redirect_uri=...`.
  4. Save the `refresh_token`. Set `NIMBLE_CLIENT_ID`, `NIMBLE_CLIENT_SECRET`, `NIMBLE_REFRESH_TOKEN`.

  **Authentication**: OAuth2 — engine handles the refresh. Access token sent as `Authorization: Bearer ACCESS_TOKEN`.

  **Contact model**: Nimble unifies leads + contacts + companies into a single 'Contact' object with `record_type` discriminator (`person` or `company`). Fields are namespaced — `fields['email'][0].value`, `fields['first name'][0].value` etc.

  **Pagination**: `page` (1-based) + `per_page` (max 30).

  **Rate limits**: 5 req/sec per token. 429 → exponential backoff.

  **Out of scope here**: pipeline analytics, social-listening streams, email-sync settings, group messaging.
tools:
  - name: nimble_myself
    description: Return the authenticated user info.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /myself
  - name: nimble_list_contacts
    description: List contacts (people + companies). Filter by record_type, query, tag.
    input:
      type: object
      properties:
        record_type:
          type: string
          description: person, company, lead.
        query:
          type: string
          description: Free-text search.
        tag:
          type: string
          description: Filter by tag name.
        page:
          type: integer
          description: 1-based.
        per_page:
          type: integer
          description: Max 30.
        sort:
          type: string
          description: Field name. Prefix with - for desc.
    operation:
      method: GET
      path: /contacts
      query:
        record_type: '{{params.record_type}}'
        query: '{{params.query}}'
        tag: '{{params.tag}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
        sort: '{{params.sort}}'
  - name: nimble_get_contact
    description: Get one contact by ID with all fields, tags, social-network links.
    input:
      type: object
      properties:
        id:
          type: string
          description: Contact ID.
      required:
        - id
    operation:
      method: GET
      path: /contact/{{params.id}}
  - name: nimble_create_contact
    description: Create a contact. `fields` is the Nimble namespaced shape — `{"first name":[{value:'John'}], email:[{value:'a@b.com', modifier:'work'}]}`.
    input:
      type: object
      properties:
        record_type:
          type: string
          description: person or company.
        fields:
          type: object
          description: Field-name → array-of-{value, modifier?} map.
        tags:
          type: array
          description: Array of tag names.
      required:
        - record_type
        - fields
    operation:
      method: POST
      path: /contact
      body:
        value:
          record_type: '{{params.record_type}}'
          fields: '{{params.fields}}'
          tags: '{{params.tags}}'
  - name: nimble_update_contact
    description: Update a contact (PATCH semantics — supply only fields you want changed).
    input:
      type: object
      properties:
        id:
          type: string
          description: Contact ID.
        fields:
          type: object
          description: Fields to update.
      required:
        - id
        - fields
    operation:
      method: PUT
      path: /contact/{{params.id}}
      body:
        value:
          fields: '{{params.fields}}'
  - name: nimble_delete_contact
    description: Permanently delete a contact.
    input:
      type: object
      properties:
        id:
          type: string
          description: Contact ID.
      required:
        - id
    operation:
      method: DELETE
      path: /contact/{{params.id}}
  - name: nimble_list_activities
    description: List activities (calls, meetings, tasks, emails) for the workspace.
    input:
      type: object
      properties:
        contact_id:
          type: string
          description: Filter to one contact.
        type:
          type: string
          description: task, event, phone_call, email.
        page:
          type: integer
          description: 1-based.
        per_page:
          type: integer
          description: Max 30.
    operation:
      method: GET
      path: /activities
      query:
        contact_id: '{{params.contact_id}}'
        type: '{{params.type}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: nimble_create_activity
    description: Create an activity (task, call note, meeting log).
    input:
      type: object
      properties:
        type:
          type: string
          description: task, event, phone_call, email.
        subject:
          type: string
          description: Subject / title.
        description:
          type: string
          description: Body.
        contact_id:
          type: string
          description: Linked contact.
        start_time:
          type: string
          description: ISO 8601 start.
        end_time:
          type: string
          description: ISO 8601 end.
      required:
        - type
        - subject
    operation:
      method: POST
      path: /activity
      body:
        value:
          type: '{{params.type}}'
          subject: '{{params.subject}}'
          description: '{{params.description}}'
          contact_id: '{{params.contact_id}}'
          start_time: '{{params.start_time}}'
          end_time: '{{params.end_time}}'
  - name: nimble_list_deals
    description: List sales deals/opportunities.
    input:
      type: object
      properties:
        stage:
          type: string
          description: Filter by stage name.
        owner:
          type: string
          description: Filter by owner ID.
        page:
          type: integer
          description: 1-based.
        per_page:
          type: integer
          description: Max 30.
    operation:
      method: GET
      path: /deals
      query:
        stage: '{{params.stage}}'
        owner: '{{params.owner}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
