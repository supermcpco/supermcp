# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: zoho-crm
  name: Zoho CRM
  description: Manage Zoho CRM (leads, contacts, accounts, deals, tasks, notes, custom modules) from any AI agent. 10 tools, OAuth refresh-token auth.
  region: intl
  category: crm
  icon: zoho-crm
  docsUrl: https://www.zoho.com/crm/developer/docs/api/v8/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  ZOHO_CLIENT_ID:
    required: true
  ZOHO_CLIENT_SECRET:
    required: true
    secret: true
  ZOHO_REFRESH_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://www.zohoapis.com/crm/v8
auth:
  type: oauth2
  grant: refresh_token
  clientId: '{{env.ZOHO_CLIENT_ID}}'
  clientSecret: '{{env.ZOHO_CLIENT_SECRET}}'
  tokenUrl: https://accounts.zoho.com/oauth/v2/token
  refreshToken: '{{env.ZOHO_REFRESH_TOKEN}}'
  inject:
    prefix: Zoho-oauthtoken
instructions: |-
  This connector wraps the Zoho CRM API v8 (www.zohoapis.com/crm/v8).

  **Setup — OAuth client + refresh token**:
  1. Go to https://api-console.zoho.com → **Add Client → Self Client**. Generate a 'grant token' with scope `ZohoCRM.modules.ALL,ZohoCRM.settings.READ,ZohoCRM.users.READ` and copy it.
  2. Exchange it for a refresh token via:
     `curl -X POST 'https://accounts.zoho.com/oauth/v2/token?grant_type=authorization_code&client_id=CLIENT_ID&client_secret=CLIENT_SECRET&code=GRANT_TOKEN'`
  3. Save the `refresh_token` from the response. Set `ZOHO_CLIENT_ID`, `ZOHO_CLIENT_SECRET`, `ZOHO_REFRESH_TOKEN`.
  4. **Data centre matters**: Zoho hosts data in regional clusters: `.com` (US, default), `.eu` (EU), `.in` (India), `.com.au` (AU), `.jp` (Japan). If your org is on a non-US DC change baseUrl + token URL accordingly — wrong DC returns `INVALID_TOKEN`.

  **Authentication**: the engine handles the OAuth2 refresh flow — every call exchanges the refresh token for a short-lived (1h) access token and sends it as `Authorization: Zoho-oauthtoken ACCESS_TOKEN`. Zoho uses `Zoho-oauthtoken` instead of `Bearer` — non-standard but documented.

  **Module API**: every record type (Leads/Contacts/Accounts/Deals/Tasks/...) lives at `/crm/v8/{module}`. Custom modules use their API name (`Cf__Custom_Module1`). List of module API names is exposed via the modules metadata endpoint.

  **Bulk writes**: insert/update endpoints expect `{data: [{...}, {...}], trigger: ['approval','workflow','blueprint']}` shape — wrap a single record in an array.

  **Pagination**: `page` + `per_page` (max 200). Response has `info: {more_records: bool, page: N, per_page: N}`.

  **Rate limits**: 50 req/min per OAuth client + daily credits (5k on free, 25k on Standard, 250k on Enterprise). 429 → exponential backoff.

  **Out of scope here**: bulk import (CSV upload + polling), territory rules CRUD, workflow execution, Sandbox switching.
tools:
  - name: zoho_crm_list_records
    description: List records of any module (Leads, Contacts, Accounts, Deals, Tasks, custom). Pass module API name. Use `fields` to project specific fields and limit payload size.
    input:
      type: object
      properties:
        module:
          type: string
          description: 'Module API name: Leads, Contacts, Accounts, Deals, Tasks, Calls, Notes, ...'
        fields:
          type: string
          description: Comma-separated field API names to return (highly recommended for performance).
        page:
          type: integer
          description: 1-based page index.
        per_page:
          type: integer
          description: Max 200, default 200.
        sort_by:
          type: string
          description: Field API name to sort by.
        sort_order:
          type: string
          description: '''asc'' or ''desc''.'
      required:
        - module
    operation:
      method: GET
      path: /{{params.module}}
      query:
        fields: '{{params.fields}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
        sort_by: '{{params.sort_by}}'
        sort_order: '{{params.sort_order}}'
  - name: zoho_crm_get_record
    description: Get a single record by ID from any module.
    input:
      type: object
      properties:
        module:
          type: string
          description: Module API name.
        record_id:
          type: string
          description: Record ID (Zoho's internal numeric/string ID).
        fields:
          type: string
          description: Comma-separated field API names.
      required:
        - module
        - record_id
    operation:
      method: GET
      path: /{{params.module}}/{{params.record_id}}
      query:
        fields: '{{params.fields}}'
  - name: zoho_crm_search_records
    description: 'Search records using one of three modes: `criteria` (Zoho''s COQL-like criteria syntax), `email`, `phone`, or `word` (text search). Returns matching records with all fields.'
    input:
      type: object
      properties:
        module:
          type: string
          description: Module API name.
        criteria:
          type: string
          description: Criteria expression, e.g. '(Last_Name:equals:Doe)'.
        email:
          type: string
          description: Exact-email match.
        phone:
          type: string
          description: Exact-phone match.
        word:
          type: string
          description: Substring search across primary fields.
        page:
          type: integer
          description: 1-based page.
        per_page:
          type: integer
          description: Max 200.
      required:
        - module
    operation:
      method: GET
      path: /{{params.module}}/search
      query:
        criteria: '{{params.criteria}}'
        email: '{{params.email}}'
        phone: '{{params.phone}}'
        word: '{{params.word}}'
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: zoho_crm_create_records
    description: Create one or more records in a module. Pass `data` as an array even for one record. Returns per-record success/failure with the new record IDs.
    input:
      type: object
      properties:
        module:
          type: string
          description: Module API name.
        data:
          type: array
          description: Array of record objects with field-API-name → value pairs.
        trigger:
          type: array
          description: 'Array of triggers to fire: ''approval'', ''workflow'', ''blueprint''. Empty to skip all.'
      required:
        - module
        - data
    operation:
      method: POST
      path: /{{params.module}}
      body:
        value:
          data: '{{params.data}}'
          trigger: '{{params.trigger}}'
  - name: zoho_crm_update_records
    description: Update one or more records. Each item in `data` must include `id` of the record to update.
    input:
      type: object
      properties:
        module:
          type: string
          description: Module API name.
        data:
          type: array
          description: Array of record objects, each must include `id` + the fields to change.
        trigger:
          type: array
          description: Triggers to fire (see create).
      required:
        - module
        - data
    operation:
      method: PUT
      path: /{{params.module}}
      body:
        value:
          data: '{{params.data}}'
          trigger: '{{params.trigger}}'
  - name: zoho_crm_upsert_records
    description: Insert OR update by duplicate-check fields. Useful when sync'ing from external systems. Pass `duplicate_check_fields` (comma-separated field API names) to define how matches are detected.
    input:
      type: object
      properties:
        module:
          type: string
          description: Module API name.
        data:
          type: array
          description: Array of record objects.
        duplicate_check_fields:
          type: array
          description: Field API names used to detect duplicates.
        trigger:
          type: array
          description: Triggers.
      required:
        - module
        - data
    operation:
      method: POST
      path: /{{params.module}}/upsert
      body:
        value:
          data: '{{params.data}}'
          duplicate_check_fields: '{{params.duplicate_check_fields}}'
          trigger: '{{params.trigger}}'
  - name: zoho_crm_delete_record
    description: Delete a single record by ID. Optionally trigger workflows.
    input:
      type: object
      properties:
        module:
          type: string
          description: Module API name.
        record_id:
          type: string
          description: Record ID.
        wf_trigger:
          type: boolean
          description: Fire workflows on delete.
      required:
        - module
        - record_id
    operation:
      method: DELETE
      path: /{{params.module}}/{{params.record_id}}
      query:
        wf_trigger: '{{params.wf_trigger}}'
  - name: zoho_crm_list_notes
    description: List notes attached to a record (works on any module).
    input:
      type: object
      properties:
        module:
          type: string
          description: Parent module API name.
        record_id:
          type: string
          description: Parent record ID.
        page:
          type: integer
          description: 1-based.
        per_page:
          type: integer
          description: Max 200.
      required:
        - module
        - record_id
    operation:
      method: GET
      path: /{{params.module}}/{{params.record_id}}/Notes
      query:
        page: '{{params.page}}'
        per_page: '{{params.per_page}}'
  - name: zoho_crm_create_note
    description: Add a note to a record.
    input:
      type: object
      properties:
        module:
          type: string
          description: Parent module API name.
        record_id:
          type: string
          description: Parent record ID.
        note_title:
          type: string
          description: Note title.
        note_content:
          type: string
          description: Note body.
      required:
        - module
        - record_id
        - note_content
    operation:
      method: POST
      path: /{{params.module}}/{{params.record_id}}/Notes
      body:
        value:
          data:
            - Note_Title: '{{params.note_title}}'
              Note_Content: '{{params.note_content}}'
  - name: zoho_crm_list_modules
    description: List all modules in the org (standard + custom) with their API names, display names, and whether they're CRM-modifiable. Use this to discover which `module` strings you can pass to the other tools.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /settings/modules
