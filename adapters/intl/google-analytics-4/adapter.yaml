# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: google-analytics-4
  name: Google Analytics 4
  description: Query Google Analytics 4 (account/property metadata, custom dimensions/metrics, core reports, realtime reports, funnel reports) from any AI agent. 8 tools, OAuth2 user auth.
  region: intl
  category: analytics
  icon: google-analytics-4
  docsUrl: https://developers.google.com/analytics
  lint:
    allow:
      - healthcheck-present
      - tool-name-prefix
credentials:
  GOOGLE_CLIENT_ID:
    required: true
  GOOGLE_CLIENT_SECRET:
    required: true
    secret: true
  GOOGLE_REFRESH_TOKEN:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://analyticsadmin.googleapis.com
auth:
  type: oauth2
  grant: refresh_token
  clientId: '{{env.GOOGLE_CLIENT_ID}}'
  clientSecret: '{{env.GOOGLE_CLIENT_SECRET}}'
  tokenUrl: https://oauth2.googleapis.com/token
  refreshToken: '{{env.GOOGLE_REFRESH_TOKEN}}'
instructions: |-
  This connector wraps the Google Analytics Data API v1beta (analyticsdata.googleapis.com) and Admin API v1beta (analyticsadmin.googleapis.com) — the same two APIs the official googleanalytics/google-analytics-mcp server uses.

  **Setup — OAuth2 user flow (one-time per account)**:
  1. Go to https://console.cloud.google.com → pick or create a project.
  2. **APIs & Services → Library** → enable both:
     - **Google Analytics Admin API** (https://console.cloud.google.com/apis/library/analyticsadmin.googleapis.com)
     - **Google Analytics Data API** (https://console.cloud.google.com/apis/library/analyticsdata.googleapis.com)
  3. **APIs & Services → Credentials → Create Credentials → OAuth client ID** → application type 'Desktop app' (simplest for one-off auth). Add `https://developers.google.com/oauthplayground` as redirect URI if you'll mint the token there.
  4. Download the client JSON (or copy the `client_id` + `client_secret`).
  5. **Mint a refresh_token** — three options, pick what suits you:
     - **Easiest**: https://developers.google.com/oauthplayground → ⚙️ → 'Use your own OAuth credentials' → paste client_id/secret → scope `https://www.googleapis.com/auth/analytics.readonly` → 'Authorize APIs' → log in with the Google account that owns the GA property → 'Exchange authorization code for tokens' → copy the **Refresh token**.
     - **gcloud**: `gcloud auth application-default login --scopes=https://www.googleapis.com/auth/analytics.readonly --client-id-file=YOUR_CLIENT_JSON_FILE` → then grep `refresh_token` from `~/.config/gcloud/application_default_credentials.json`.
     - **Custom flow**: bake the standard OAuth2 dance into your app's UI.
  6. Set `GOOGLE_CLIENT_ID`, `GOOGLE_CLIENT_SECRET`, `GOOGLE_REFRESH_TOKEN`.

  **Authentication**: OAuth2 with refresh — the engine exchanges `refresh_token → access_token` against `https://oauth2.googleapis.com/token` automatically and sends `Authorization: Bearer ACCESS_TOKEN` on every call. Tokens are cached and refreshed on 401.

  **Service accounts are NOT supported yet** — they require JWT RS256 signing which our engine doesn't do. Workaround: create a dedicated 'automation' Google account, grant it Viewer access to the GA properties you care about, and mint the refresh_token from that account. The token never expires unless the account password changes or the OAuth grant is revoked.

  **Two hosts in one adapter**: tools transparently call either Admin (admin endpoints) or Data (report endpoints) — paths are absolute URLs so the engine routes correctly. No extra config needed.

  **Property IDs**: GA4 properties are 9-12 digit numeric IDs (NOT the measurement ID `G-XXXXXXXX`, NOT the Universal Analytics view ID). Find them via `ga4_get_account_summaries` (the first call you should make) or in the GA admin UI under Property Settings → Property details.

  **Reports — `runReport` body shape**:
  - `dimensions`: array of `{name: 'pagePath'}` — see https://ga.dev/api/data/v1/dimensions for the full list (~190 built-in).
  - `metrics`: array of `{name: 'sessions'}` — see https://ga.dev/api/data/v1/metrics (~80 built-in).
  - `dateRanges`: array of `{startDate: '2025-01-01', endDate: 'today'}`. `startDate` accepts `YYYY-MM-DD`, `today`, `yesterday`, or `NdaysAgo`.
  - `dimensionFilter` / `metricFilter`: optional Filter expressions.
  - `limit` (default 10k, max 250k), `offset`, `orderBys`.

  **Realtime**: `runRealtimeReport` looks at the last 30 minutes. Only a subset of dimensions/metrics work here (those with `realtime` in their docs).

  **Funnel reports**: `runFunnelReport` is in v1alpha — uses a multi-step funnel definition. See instructions in tool description.

  **Quotas**:
  - Data API: 200k requests/day per project, 5k tokens/hour, 25k tokens/day. Token cost depends on report complexity — see https://ga.dev/api/data/v1/quotas.
  - Admin API: 1500 requests/hour per project, 100k/day.
  - 429 → exponential backoff (engine handles retry on quota errors).

  **Out of scope here**: BigQuery export, GTM (Tag Manager) — separate APIs, would be a sibling adapter.
tools:
  - name: ga4_get_account_summaries
    description: List the user's GA4 accounts and their properties (account ID, account name, property IDs, display names). Always call this first — every other tool needs a property ID (the 9-12 digit numeric value, NOT the G-XXX measurement ID). Paginated via pageToken.
    input:
      type: object
      properties:
        pageSize:
          type: integer
          description: Max accounts per page (default 50, max 200).
        pageToken:
          type: string
          description: Cursor from previous response.
    operation:
      method: GET
      path: https://analyticsadmin.googleapis.com/v1beta/accountSummaries
      query:
        pageSize: '{{params.pageSize}}'
        pageToken: '{{params.pageToken}}'
  - name: ga4_get_property_details
    description: 'Get detailed info about one GA4 property: display name, create time, time zone, currency, parent account, industry category, service level, account.'
    input:
      type: object
      properties:
        property_id:
          type: string
          description: GA4 property ID (numeric, e.g. '123456789').
      required:
        - property_id
    operation:
      method: GET
      path: https://analyticsadmin.googleapis.com/v1beta/properties/{{params.property_id}}
  - name: ga4_list_google_ads_links
    description: List Google Ads accounts linked to a GA4 property (useful to confirm conversion attribution wiring).
    input:
      type: object
      properties:
        property_id:
          type: string
          description: GA4 property ID.
        pageSize:
          type: integer
          description: Max per page.
        pageToken:
          type: string
          description: Pagination cursor.
      required:
        - property_id
    operation:
      method: GET
      path: https://analyticsadmin.googleapis.com/v1beta/properties/{{params.property_id}}/googleAdsLinks
      query:
        pageSize: '{{params.pageSize}}'
        pageToken: '{{params.pageToken}}'
  - name: ga4_list_custom_dimensions
    description: List custom dimensions defined on a property — use these `parameterName` values in `dimensions` of ga4_run_report. Useful before authoring a report to discover what's available.
    input:
      type: object
      properties:
        property_id:
          type: string
          description: GA4 property ID.
        pageSize:
          type: integer
          description: Max per page.
        pageToken:
          type: string
          description: Pagination cursor.
      required:
        - property_id
    operation:
      method: GET
      path: https://analyticsadmin.googleapis.com/v1beta/properties/{{params.property_id}}/customDimensions
      query:
        pageSize: '{{params.pageSize}}'
        pageToken: '{{params.pageToken}}'
  - name: ga4_list_custom_metrics
    description: List custom metrics defined on a property — use these `parameterName` values in `metrics` of ga4_run_report.
    input:
      type: object
      properties:
        property_id:
          type: string
          description: GA4 property ID.
        pageSize:
          type: integer
          description: Max per page.
        pageToken:
          type: string
          description: Pagination cursor.
      required:
        - property_id
    operation:
      method: GET
      path: https://analyticsadmin.googleapis.com/v1beta/properties/{{params.property_id}}/customMetrics
      query:
        pageSize: '{{params.pageSize}}'
        pageToken: '{{params.pageToken}}'
  - name: ga4_run_report
    description: Run a core analytics report. The most common tool you'll use. Returns rows with one column per dimension + one per metric. Example bodies in instructions. Use dimensions/metrics names from https://ga.dev/api/data/v1/dimensions and https://ga.dev/api/data/v1/metrics, plus any custom ones from ga4_list_custom_dimensions/metrics.
    input:
      type: object
      properties:
        property_id:
          type: string
          description: GA4 property ID.
        dimensions:
          type: array
          description: 'Array of {name: ''<dimensionName>''} — e.g. [{name:''country''}, {name:''deviceCategory''}].'
        metrics:
          type: array
          description: 'Array of {name: ''<metricName>''} — e.g. [{name:''activeUsers''}, {name:''sessions''}].'
        dateRanges:
          type: array
          description: Array of {startDate, endDate, name?} — dates as YYYY-MM-DD / 'today' / 'yesterday' / 'NdaysAgo'.
        dimensionFilter:
          type: object
          description: Filter expression. e.g. {filter:{fieldName:'country', stringFilter:{value:'Italy'}}}.
        metricFilter:
          type: object
          description: Filter expression on metrics. e.g. {filter:{fieldName:'sessions', numericFilter:{operation:'GREATER_THAN', value:{int64Value:100}}}}.
        orderBys:
          type: array
          description: Sort. e.g. [{metric:{metricName:'sessions'}, desc:true}].
        limit:
          type: string
          description: Max rows (default 10000, max 250000). String because GA accepts int64.
        offset:
          type: string
          description: Pagination offset (string int64).
        keepEmptyRows:
          type: boolean
          description: Include zero-value rows.
        currencyCode:
          type: string
          description: ISO 4217 to override property default.
        returnPropertyQuota:
          type: boolean
          description: If true include `propertyQuota` block in response for cost diagnostics.
      required:
        - property_id
        - dimensions
        - metrics
        - dateRanges
    operation:
      method: POST
      path: https://analyticsdata.googleapis.com/v1beta/properties/{{params.property_id}}:runReport
      body:
        value:
          dimensions: '{{params.dimensions}}'
          metrics: '{{params.metrics}}'
          dateRanges: '{{params.dateRanges}}'
          dimensionFilter: '{{params.dimensionFilter}}'
          metricFilter: '{{params.metricFilter}}'
          orderBys: '{{params.orderBys}}'
          limit: '{{params.limit}}'
          offset: '{{params.offset}}'
          keepEmptyRows: '{{params.keepEmptyRows}}'
          currencyCode: '{{params.currencyCode}}'
          returnPropertyQuota: '{{params.returnPropertyQuota}}'
  - name: ga4_run_realtime_report
    description: Run a realtime report (last 30 minutes of activity). Only a subset of dimensions/metrics work here — see https://ga.dev/api/data/v1/realtime-dimensions and https://ga.dev/api/data/v1/realtime-metrics. Use for 'how many users are on the site right now', 'which pages are hot in the last minute', etc.
    input:
      type: object
      properties:
        property_id:
          type: string
          description: GA4 property ID.
        dimensions:
          type: array
          description: Realtime dimensions only — e.g. [{name:'country'}, {name:'unifiedScreenName'}].
        metrics:
          type: array
          description: Realtime metrics — e.g. [{name:'activeUsers'}].
        dimensionFilter:
          type: object
          description: Optional dimension filter expression.
        metricFilter:
          type: object
          description: Optional metric filter.
        orderBys:
          type: array
          description: Sort.
        limit:
          type: string
          description: Max rows (default 10000).
        minuteRanges:
          type: array
          description: Restrict to specific minute windows (default last 30 min). [{startMinutesAgo:30, endMinutesAgo:0}].
      required:
        - property_id
        - metrics
    operation:
      method: POST
      path: https://analyticsdata.googleapis.com/v1beta/properties/{{params.property_id}}:runRealtimeReport
      body:
        value:
          dimensions: '{{params.dimensions}}'
          metrics: '{{params.metrics}}'
          dimensionFilter: '{{params.dimensionFilter}}'
          metricFilter: '{{params.metricFilter}}'
          orderBys: '{{params.orderBys}}'
          limit: '{{params.limit}}'
          minuteRanges: '{{params.minuteRanges}}'
  - name: ga4_run_funnel_report
    description: Run a funnel report — measures conversion at each step of a user journey (e.g. landed → viewed product → added to cart → purchased). Uses v1alpha endpoint. `funnel` defines the steps; each step is a filter on events/dimensions.
    input:
      type: object
      properties:
        property_id:
          type: string
          description: GA4 property ID.
        dateRanges:
          type: array
          description: Array of {startDate, endDate}.
        funnel:
          type: object
          description: 'Funnel definition: {steps:[{name:''Landed'', filterExpression:{...}}, {name:''Added to cart'', filterExpression:{...}}], isOpenFunnel: false}.'
        funnelBreakdown:
          type: object
          description: 'Optional breakdown by a dimension at each step: {breakdownDimension:{name:''deviceCategory''}, limit:5}.'
        funnelNextAction:
          type: object
          description: 'Optional ''next action'' analysis: shows what users did at each step.'
        funnelVisualizationType:
          type: string
          description: STANDARD_FUNNEL or TRENDED_FUNNEL.
        segments:
          type: array
          description: Optional user/session segments to compare.
        limit:
          type: string
          description: Max rows.
        dimensionFilter:
          type: object
          description: Global filter applied across all steps.
        returnPropertyQuota:
          type: boolean
          description: Include quota info in response.
      required:
        - property_id
        - dateRanges
        - funnel
    operation:
      method: POST
      path: https://analyticsdata.googleapis.com/v1alpha/properties/{{params.property_id}}:runFunnelReport
      body:
        value:
          dateRanges: '{{params.dateRanges}}'
          funnel: '{{params.funnel}}'
          funnelBreakdown: '{{params.funnelBreakdown}}'
          funnelNextAction: '{{params.funnelNextAction}}'
          funnelVisualizationType: '{{params.funnelVisualizationType}}'
          segments: '{{params.segments}}'
          limit: '{{params.limit}}'
          dimensionFilter: '{{params.dimensionFilter}}'
          returnPropertyQuota: '{{params.returnPropertyQuota}}'
