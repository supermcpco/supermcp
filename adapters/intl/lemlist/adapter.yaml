# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: lemlist
  name: Lemlist
  description: 'Drive Lemlist (cold email + multichannel outreach) from any AI agent: campaigns, leads (in-campaign prospects), team members, hooks. 11 tools, API-key Basic auth.'
  region: intl
  category: crm
  icon: lemlist
  docsUrl: https://developer.lemlist.com/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  LEMLIST_API_KEY:
    required: true
    secret: true
transport:
  type: http
  baseUrl: https://api.lemlist.com/api
auth:
  type: basic
  password: '{{env.LEMLIST_API_KEY}}'
instructions: |-
  This connector uses the Lemlist API v1 (developer.lemlist.com).

  **Setup**:
  1. Sign in to Lemlist → top-right avatar → **Settings → Integrations → API → Get my API key**.
  2. Copy the key. Set `LEMLIST_API_KEY`.

  **Authentication**: HTTP Basic Auth — `Authorization: Basic base64('':${LEMLIST_API_KEY})` — username is empty, password is the API key. (Yes, swapped from the usual: empty username, key as password.) The adapter handles this via BASIC_AUTH with username='' and password=key.

  **Campaign model**: Lemlist's central unit. A campaign has a sequence of steps (email + waits + LinkedIn touches). You add **leads** (prospects) to a campaign — the campaign then drips touchpoints to each lead.

  **Lead state**: a lead in a campaign has status (active/paused/replied/bounced/unsubscribed/completed). New leads default to active and start receiving the campaign's first step.

  **Custom variables**: leads support arbitrary key/value pairs (e.g. `{firstName:'Jane', icebreaker:'...'}`) — referenced as `{{firstName}}` in the campaign emails. Lemlist's selling point is dynamic-personalization with image overlays driven by these variables.

  **Email accounts**: each campaign sends from a connected email account (Gmail, Outlook, custom SMTP). Configured in UI; the API doesn't expose connection management.

  **Pagination**: `limit` (default 100, max 100) + `offset`. Some endpoints return arrays without paging metadata — assume more if you get exactly `limit` items back.

  **Out of scope here**: campaign creation (the step-builder is UI-only), team analytics, hook editing (configured via Lemlist's UI), Lemlist Chrome extension actions.
tools:
  - name: lemlist_get_team
    description: Return the team the API key belongs to (id, name, plan, members). Health check + identifies the workspace.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /team
  - name: lemlist_list_campaigns
    description: List campaigns. Each campaign has _id, name, labels, createdBy, status, scheduleTimezone, multichannel?.
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Max per page (default 100, max 100).
        offset:
          type: integer
          description: Pagination offset.
        version:
          type: string
          description: Use 'v2' for the multichannel campaign schema.
    operation:
      method: GET
      path: /campaigns
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        version: '{{params.version}}'
  - name: lemlist_get_campaign_stats
    description: 'Get aggregated stats for a campaign: leads counts by status, emails sent/opened/clicked/replied/bounced, deliverability score.'
    input:
      type: object
      properties:
        campaignId:
          type: string
          description: Campaign ID.
      required:
        - campaignId
    operation:
      method: GET
      path: /campaigns/{{params.campaignId}}/stats
  - name: lemlist_list_campaign_leads
    description: List leads (prospects) in a campaign. Each lead has _id, email, firstName, lastName, companyName, status, isPaused, customVariables.
    input:
      type: object
      properties:
        campaignId:
          type: string
          description: Campaign ID.
        limit:
          type: integer
          description: Per page.
        offset:
          type: integer
          description: Pagination offset.
        version:
          type: string
          description: Use 'v2' for multichannel.
      required:
        - campaignId
    operation:
      method: GET
      path: /campaigns/{{params.campaignId}}/leads
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
        version: '{{params.version}}'
  - name: lemlist_add_lead_to_campaign
    description: 'Add a new prospect to a campaign. Required: campaignId + email. customVariables fill template placeholders. deduplicate=true skips if email already in the campaign.'
    input:
      type: object
      properties:
        campaignId:
          type: string
          description: Campaign ID.
        email:
          type: string
          description: Prospect email.
        firstName:
          type: string
          description: First name.
        lastName:
          type: string
          description: Last name.
        companyName:
          type: string
          description: Company name.
        picture:
          type: string
          description: Picture URL (used in image-personalization templates).
        linkedinUrl:
          type: string
          description: LinkedIn URL.
        phone:
          type: string
          description: Phone for LinkedIn voice/SMS steps.
        customVariables:
          type: object
          description: Arbitrary {{key}} → value used in templates.
        deduplicate:
          type: boolean
          description: Skip if email already exists in the campaign. Default false.
      required:
        - campaignId
        - email
    operation:
      method: POST
      path: /campaigns/{{params.campaignId}}/leads/{{params.email}}
      body:
        value:
          firstName: '{{params.firstName}}'
          lastName: '{{params.lastName}}'
          companyName: '{{params.companyName}}'
          picture: '{{params.picture}}'
          linkedinUrl: '{{params.linkedinUrl}}'
          phone: '{{params.phone}}'
          customVariables: '{{params.customVariables}}'
          deduplicate: '{{params.deduplicate}}'
  - name: lemlist_pause_lead
    description: Pause a lead in a campaign (stops further touches without unsubscribing them).
    input:
      type: object
      properties:
        campaignId:
          type: string
          description: Campaign ID.
        email:
          type: string
          description: Lead email.
      required:
        - campaignId
        - email
    operation:
      method: POST
      path: /campaigns/{{params.campaignId}}/leads/{{params.email}}/pause
  - name: lemlist_resume_lead
    description: Resume a previously-paused lead.
    input:
      type: object
      properties:
        campaignId:
          type: string
          description: Campaign ID.
        email:
          type: string
          description: Lead email.
      required:
        - campaignId
        - email
    operation:
      method: POST
      path: /campaigns/{{params.campaignId}}/leads/{{params.email}}/resume
  - name: lemlist_delete_lead_from_campaign
    description: Remove a lead from a campaign. They stop receiving touches but stay in your database.
    input:
      type: object
      properties:
        campaignId:
          type: string
          description: Campaign ID.
        email:
          type: string
          description: Lead email.
      required:
        - campaignId
        - email
    operation:
      method: DELETE
      path: /campaigns/{{params.campaignId}}/leads/{{params.email}}
  - name: lemlist_unsubscribe_lead
    description: Mark a lead as unsubscribed globally — they will no longer receive any Lemlist email from your team across all campaigns. Compliance-friendly.
    input:
      type: object
      properties:
        email:
          type: string
          description: Lead email.
      required:
        - email
    operation:
      method: POST
      path: /unsubscribes/{{params.email}}
  - name: lemlist_list_unsubscribes
    description: List all unsubscribed emails on the team (compliance reporting).
    input:
      type: object
      properties:
        limit:
          type: integer
          description: Per page.
        offset:
          type: integer
          description: Pagination offset.
    operation:
      method: GET
      path: /unsubscribes
      query:
        limit: '{{params.limit}}'
        offset: '{{params.offset}}'
  - name: lemlist_list_hooks
    description: List webhook subscriptions configured on the team (event delivery to your hosted endpoint).
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /hooks
