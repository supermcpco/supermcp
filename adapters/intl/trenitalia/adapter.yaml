# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: trenitalia
  name: Trenitalia
  description: Search Italian high-speed and regional trains via Trenitalia's Le Frecce mobile API. Find trips by origin/destination/date, read offers and prices, see live home alerts and mobility info. 3 tools, no auth — reverse-engineered from the Le Frecce iOS app.
  region: intl
  category: travel
  icon: trenitalia
  docsUrl: https://www.trenitalia.com
  priority: 78
  featured: true
  selfHostOnly: true
transport:
  type: http
  baseUrl: https://app.lefrecce.it
auth:
  type: none
healthcheck:
  tool: trenitalia_search_trips
  params:
    from_name: Milano Centrale
    to_name: Roma Termini
    departure_date: __TOMORROW__T08:00:00
    adults: 1
    children: 0
    page: 1
instructions: |-
  This connector wraps the Trenitalia Le Frecce mobile app's internal API (app.lefrecce.it, channel `Channels.Mobile.BFF`).

  **Setup**: nothing. The endpoints exposed here are the same the Le Frecce iOS app uses for trip discovery.

  **What it does NOT do**: complete bookings. The booking flow requires a logged-in session and the Trenitalia payment hub. Use this connector to *find* trains and prices; book in the Le Frecce app or trenitalia.com.

  **Station codes**: Trenitalia uses internal station codes (e.g. `S08409` for Milano Centrale, `S08400` for Roma Termini). Use `trenitalia_search_stations` to discover them, or pass `from_name` / `to_name` as free-text — the search endpoint usually resolves names internally.

  **Date/time**: ISO-8601 local, e.g. `2026-05-24T08:00:00`.

  **Suggested starter prompts**:
  - "Find Milano-Roma Frecciarossa trains for Saturday morning, 2 adults."
  - "What's the cheapest train from Bologna to Firenze tomorrow afternoon?"
  - "Show me Trenitalia alerts on the Milano-Napoli line today."
tools:
  - name: trenitalia_search_trips
    description: Search Trenitalia trains between two stations on a date. Returns trips with departure/arrival time, train type (Frecciarossa, Frecciargento, Intercity, regional), duration, transfers, available fares and prices.
    input:
      type: object
      properties:
        from_name:
          type: string
          description: Origin station name (e.g. 'Milano Centrale', 'Roma Termini').
        to_name:
          type: string
          description: Destination station name.
        departure_date:
          type: string
          description: Departure date/time, naive ISO-8601 (e.g. '2026-05-24T08:00:00').
        return_date:
          type: string
          description: Optional return date/time for round-trip.
        adults:
          type: integer
          default: 1
          minimum: 1
          maximum: 9
        children:
          type: integer
          default: 0
        page:
          type: integer
          default: 1
      required:
        - from_name
        - to_name
        - departure_date
    proxy: true
    operation:
      method: POST
      path: /Channels.Mobile.BFF/api/search/page
      body:
        value:
          from: '{{params.from_name}}'
          to: '{{params.to_name}}'
          departureDate: '{{params.departure_date}}'
          returnDate: '{{params.return_date}}'
          adults: '{{params.adults}}'
          children: '{{params.children}}'
          page: '{{params.page}}'
  - name: trenitalia_get_home_alerts
    description: Get current service alerts and mobility info from Trenitalia's home feed — strikes, delays, line-wide notices.
    input:
      type: object
      properties: {}
    proxy: true
    operation:
      method: GET
      path: /Channels.Mobile.BFF/api/home/alerts
  - name: trenitalia_get_mobility_info
    description: Get general mobility info — strikes (`scioperi`), planned outages, network status — from Trenitalia's home info feed.
    input:
      type: object
      properties: {}
    proxy: true
    operation:
      method: GET
      path: /Channels.Mobile.BFF/api/home/info/mobility
