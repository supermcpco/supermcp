# yaml-language-server: $schema=https://supermcp.dev/schema/adapter/v2.json
apiVersion: supermcp.dev/v2
kind: Adapter
metadata:
  slug: ghost
  name: Ghost
  description: 'Drive Ghost (open-source publishing platform) from any AI agent: posts, pages, tags, members, newsletters. 12 tools, Admin API JWT auth.'
  region: intl
  category: publishing
  icon: ghost
  docsUrl: https://ghost.org/docs/admin-api/
  lint:
    allow:
      - description-min-60
      - healthcheck-present
credentials:
  GHOST_ADMIN_API_URL:
    required: true
  GHOST_ADMIN_JWT:
    required: true
transport:
  type: http
  baseUrl: '{{env.GHOST_ADMIN_API_URL}}'
auth:
  type: apiKey
  in: header
  name: Authorization
  value: Ghost {{env.GHOST_ADMIN_JWT}}
instructions: |-
  This connector uses the Ghost Admin API v5 (ghost.org/docs/admin-api/).

  **Setup**:
  1. Sign in to Ghost Admin → **Settings → Advanced → Integrations → Add custom integration**.
  2. Copy the **Admin API Key** — format is `<id>:<secret>` (e.g. `5f3a...c4:b9d8...e2`).
  3. Set:
     - `GHOST_ADMIN_API_URL` = your Ghost site's admin API base, e.g. `https://yoursite.com/ghost/api/admin`
     - `GHOST_ADMIN_API_KEY` = the full `id:secret` key from step 2

  **Authentication — JWT generation required**: Ghost's Admin API does NOT accept the raw API key. Each request needs a JWT signed with the secret half. The JWT is short-lived (5 min) and has these claims:
  ```
    alg: 'HS256', kid: <id_part>, typ: 'JWT'
    exp: now+5min, iat: now, aud: '/admin/'
  ```
  This connector currently expects the OPERATOR or external orchestrator to **generate the JWT and pass it as `GHOST_ADMIN_JWT`** — the engine then sends `Authorization: Ghost ${GHOST_ADMIN_JWT}`. For a proper LOGIN_TOKEN-style auto-rotation see the Sorare adapter as the reference pattern; that's a future enhancement.

  **Workaround for testing**: use the official `@tryghost/admin-api` JS SDK to generate a JWT and copy it as `GHOST_ADMIN_JWT`. Or use the Ghost CLI: `ghost generate-jwt`.

  **Content API alternative**: for read-only public-published content, the simpler **Content API** uses a single key as a query parameter — no JWT. Switch baseUrl to `/ghost/api/content` and use a Content API key.

  **Post status**: draft, published, scheduled, sent.

  **Mobiledoc vs Lexical**: Ghost stores post content in either format. Modern Ghost (v5+) defaults to Lexical (`lexical` field). Set `html` on writes — Ghost converts to its internal format.

  **Pagination**: `?page=N&limit=M` (max 100 for posts/pages, 15 for some). Response has `meta.pagination`.

  **Webhooks** out of scope.

  **Out of scope here**: themes, settings, redirects management, oEmbed.
tools:
  - name: ghost_list_posts
    description: List posts. Each post has id, uuid, title, slug, html, status, published_at, authors, tags, featured.
    input:
      type: object
      properties:
        filter:
          type: string
          description: NQL filter, e.g. 'status:published+tag:ai' or 'published_at:>=2025-01-01'.
        page:
          type: integer
          description: Page.
        limit:
          type: integer
          description: Per page (max 100).
        order:
          type: string
          description: 'field directives: ''published_at desc''.'
        include:
          type: string
          description: 'Side-load: authors, tags, count.posts.'
        fields:
          type: string
          description: Sparse fieldset, comma-separated.
        formats:
          type: string
          description: html, mobiledoc, lexical, plaintext (comma-separated).
    operation:
      method: GET
      path: /posts/
      query:
        filter: '{{params.filter}}'
        page: '{{params.page}}'
        limit: '{{params.limit}}'
        order: '{{params.order}}'
        include: '{{params.include}}'
        fields: '{{params.fields}}'
        formats: '{{params.formats}}'
  - name: ghost_get_post
    description: Fetch a post by ID (or by slug with /slug/{slug}/).
    input:
      type: object
      properties:
        postId:
          type: string
          description: Post ID.
        formats:
          type: string
          description: html, mobiledoc, lexical, plaintext.
        include:
          type: string
          description: Side-load related.
      required:
        - postId
    operation:
      method: GET
      path: /posts/{{params.postId}}/
      query:
        formats: '{{params.formats}}'
        include: '{{params.include}}'
  - name: ghost_create_post
    description: Create a post. Pass html for content. Set status='published' to publish immediately, 'scheduled' + published_at for future, 'draft' for draft.
    input:
      type: object
      properties:
        posts:
          type: array
          description: Wrap your post in {posts:[{title, html, status?, slug?, custom_excerpt?, feature_image?, featured?, tags?:[{name}], authors?:[{email}], visibility?:'public'|'members'|'paid', published_at?, email_recipient_filter?:'all'|'none'|'paid'|...}]}. Ghost requires this wrapper array.
        source:
          type: string
          description: If 'html', the engine accepts html field in posts[].
      required:
        - posts
    operation:
      method: POST
      path: /posts/
      query:
        source: '{{params.source}}'
      body:
        value:
          posts: '{{params.posts}}'
  - name: ghost_update_post
    description: Update a post. MUST include updated_at field matching the current value (Ghost's optimistic concurrency check) — fetch with ghost_get_post first.
    input:
      type: object
      properties:
        postId:
          type: string
          description: Post ID.
        posts:
          type: array
          description: '[{updated_at: <current>, title?, html?, status?, ...}]. updated_at is required.'
        source:
          type: string
          description: html.
      required:
        - postId
        - posts
    operation:
      method: PUT
      path: /posts/{{params.postId}}/
      query:
        source: '{{params.source}}'
      body:
        value:
          posts: '{{params.posts}}'
  - name: ghost_delete_post
    description: Delete a post permanently.
    input:
      type: object
      properties:
        postId:
          type: string
          description: Post ID.
      required:
        - postId
    operation:
      method: DELETE
      path: /posts/{{params.postId}}/
  - name: ghost_list_pages
    description: List static pages (separate from posts). Pages have similar shape to posts.
    input:
      type: object
      properties:
        filter:
          type: string
          description: NQL filter.
        page:
          type: integer
          description: Page.
        limit:
          type: integer
          description: Per page.
        include:
          type: string
          description: Side-load.
        formats:
          type: string
          description: html, mobiledoc, lexical.
    operation:
      method: GET
      path: /pages/
      query:
        filter: '{{params.filter}}'
        page: '{{params.page}}'
        limit: '{{params.limit}}'
        include: '{{params.include}}'
        formats: '{{params.formats}}'
  - name: ghost_list_tags
    description: List tags with member/post counts.
    input:
      type: object
      properties:
        filter:
          type: string
          description: NQL filter.
        page:
          type: integer
          description: Page.
        limit:
          type: integer
          description: Per page.
    operation:
      method: GET
      path: /tags/
      query:
        filter: '{{params.filter}}'
        page: '{{params.page}}'
        limit: '{{params.limit}}'
  - name: ghost_list_members
    description: List members (subscribers, both free and paid).
    input:
      type: object
      properties:
        filter:
          type: string
          description: 'NQL: ''status:paid'', ''created_at:>=2025-01-01''.'
        search:
          type: string
          description: Substring search across name and email.
        page:
          type: integer
          description: Page.
        limit:
          type: integer
          description: Per page.
        order:
          type: string
          description: Sort, e.g. 'created_at desc'.
    operation:
      method: GET
      path: /members/
      query:
        filter: '{{params.filter}}'
        search: '{{params.search}}'
        page: '{{params.page}}'
        limit: '{{params.limit}}'
        order: '{{params.order}}'
  - name: ghost_create_member
    description: Create a member (subscribe email).
    input:
      type: object
      properties:
        members:
          type: array
          description: '[{email, name?, note?, labels?:[{name}], subscribed?:true, send_email_series?:false}].'
      required:
        - members
    operation:
      method: POST
      path: /members/
      body:
        value:
          members: '{{params.members}}'
  - name: ghost_update_member
    description: Update a member.
    input:
      type: object
      properties:
        memberId:
          type: string
          description: Member ID.
        members:
          type: array
          description: '[{name?, note?, labels?, subscribed?, newsletters?:[{id}]}].'
      required:
        - memberId
        - members
    operation:
      method: PUT
      path: /members/{{params.memberId}}/
      body:
        value:
          members: '{{params.members}}'
  - name: ghost_list_newsletters
    description: List newsletters on the site (Ghost supports multiple newsletters per site since v5).
    input:
      type: object
      properties:
        filter:
          type: string
          description: NQL filter, e.g. 'status:active'.
        limit:
          type: integer
          description: Per page.
    operation:
      method: GET
      path: /newsletters/
      query:
        filter: '{{params.filter}}'
        limit: '{{params.limit}}'
  - name: ghost_site
    description: Return site info (title, description, version, url). Health check.
    input:
      type: object
      properties: {}
    operation:
      method: GET
      path: /site/
