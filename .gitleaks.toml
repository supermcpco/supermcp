# What a leak means here, and what it does not.
#
# This system's job is to handle other people's credentials: the importers
# read them out of curl commands and Postman collections, the data-loss
# detectors recognise them, the cassettes record exchanges that carried
# them, and the adapter definitions name them. Fixtures for all of that
# contain credential-shaped strings on purpose, and a scan that fails on
# them is a scan nobody reads.
#
# So the default rules stay, one rule is added for this system's own key
# format, and the exceptions below are narrow and say why.

title = "supermcp"

[extend]
useDefault = true

[[rules]]
id = "supermcp-api-key"
description = "A supermcp API key. These are shown once and stored as a digest; one in a file is one somebody copied."
regex = '''smk_[A-Za-z0-9]{12}[A-Za-z0-9]{43}'''
keywords = ["smk_"]

[allowlist]
description = "Fixtures and definitions that are meant to contain credential-shaped strings"
regexTarget = "match"
regexes = [
  # A placeholder is the opposite of a secret: it is what the converter
  # puts in place of one.
  '''\{\{\s*env\.[A-Za-z0-9_]+\s*\}\}''',
  '''\$\{[A-Za-z0-9_]+\}''',
  # Recorded exchanges have their credentials replaced at record time.
  '''<REDACTED[^>]*>''',
  # Values written to say they are not real.
  '''EXAMPLE_NOT_A_REAL''',
]
paths = [
  # The importers' own fixtures: a curl command with an inline key is the
  # input, and moving it to a declared credential is what is being tested.
  '''internal/parser/testdata/.*''',
  '''internal/parser/.*_test\.go''',
  # The detectors' fixtures: a card, an IBAN and a token are the subject.
  '''internal/dlp/.*_test\.go''',
  # Recording proves a credential is replaced, which needs one to replace.
  '''internal/cassette/.*_test\.go''',
  # Recorded upstream responses. Coin tickers and identifiers look like
  # keys to a scanner and are somebody else's public data.
  '''adapters/.*/cassettes/.*''',
  # The vendored v1 catalogue and its conversion: placeholders throughout.
  '''pkg/adapter/v1/testdata/corpus/.*''',
  # Adapter definitions are generated by the converter, which moves every
  # literal credential into a declared one, and they carry long prose that
  # a generic rule reads as a key ("unlike most APIs, ImmobilienScout24").
  # What stops a literal getting in is the converter's report and
  # `adapter validate --strict`, which the adapters job runs.
  '''adapters/[a-z]+/[a-z0-9-]+/adapter\.yaml''',
]
