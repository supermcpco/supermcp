version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - misspell
    - revive
    - bodyclose
    - noctx
    - errorlint
    - contextcheck
  settings:
    gosec:
      excludes:
        - G304 # file paths are operator-controlled CLI arguments
        - G301 # the adapter CLI writes source files that must be world-readable
        - G306 # same
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    paths:
      - pkg/adapter/v1/testdata
      - adapters
    rules:
      - path: _test\.go
        linters: [bodyclose, noctx, errcheck, gosec]

formatters:
  enable: [gofmt, goimports]
