apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supermcp.fullname" . }}
  labels:
    {{- include "supermcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "supermcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "supermcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "supermcp.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: supermcp
          image: {{ include "supermcp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env:
            - name: SUPERMCP_LISTEN
              value: ":8080"
            {{- if .Values.metrics.enabled }}
            - name: SUPERMCP_ADMIN_LISTEN
              value: ":{{ .Values.metrics.port }}"
            {{- end }}
            # Without this the rate limiter's memory fallback would hand
            # each replica the whole budget, which together is N times the
            # ceiling the operator asked for.
            - name: SUPERMCP_EXPECTED_REPLICAS
              value: "{{ .Values.replicaCount }}"
            {{- include "supermcp.env" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            # The exposition describes the shape of the estate, so it has
            # its own port and stays off the ingress.
            - name: admin
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.audit.spool.enabled }}
            - name: audit-spool
              mountPath: {{ .Values.audit.spool.path }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.audit.spool.enabled }}
        - name: audit-spool
          persistentVolumeClaim:
            claimName: {{ .Values.audit.spool.existingClaim | default (printf "%s-audit-spool" (include "supermcp.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
