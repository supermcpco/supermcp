apiVersion: v1
kind: Service
metadata:
  name: {{ include "supermcp.fullname" . }}
  labels:
    {{- include "supermcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: admin
      port: {{ .Values.metrics.port }}
      targetPort: admin
      protocol: TCP
    {{- end }}
  selector:
    {{- include "supermcp.selectorLabels" . | nindent 4 }}
