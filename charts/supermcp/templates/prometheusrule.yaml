{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "supermcp.fullname" . }}
  labels:
    {{- include "supermcp.labels" . | nindent 4 }}
spec:
  groups:
    - name: supermcp
      rules:
        # Symptoms, not causes. Each one is something a person can act on
        # at three in the morning; anything that is merely interesting
        # belongs on a dashboard instead.
        - alert: SupermcpDown
          expr: up{job=~".*{{ include "supermcp.fullname" . }}.*"} == 0
          for: {{ .Values.metrics.prometheusRule.for.down }}
          labels: { severity: critical }
          annotations:
            summary: "supermcp is not answering"
            description: "No replica has responded for {{ .Values.metrics.prometheusRule.for.down }}. AI clients cannot reach any tool."

        - alert: SupermcpToolCallsFailing
          expr: |
            sum(rate(supermcp_tool_calls_total{status!="success"}[5m]))
              / clamp_min(sum(rate(supermcp_tool_calls_total[5m])), 0.001) > 0.25
          for: {{ .Values.metrics.prometheusRule.for.errors }}
          labels: { severity: warning }
          annotations:
            summary: "a quarter of tool calls are failing"
            description: "Most failures are upstream, so check the connectors' own systems before this one."

        - alert: SupermcpToolCallsSlow
          expr: histogram_quantile(0.99, sum by (le) (rate(supermcp_tool_call_duration_seconds_bucket[10m]))) > 10
          for: {{ .Values.metrics.prometheusRule.for.latency }}
          labels: { severity: warning }
          annotations:
            summary: "the slowest tool calls are taking over ten seconds"

        - alert: SupermcpBreakerOpen
          expr: max by (connector) (supermcp_breaker_state) == 2
          for: {{ .Values.metrics.prometheusRule.for.errors }}
          labels: { severity: warning }
          annotations:
            summary: "a connector's circuit breaker is open"
            description: "Calls to {{`{{ $labels.connector }}`}} are being refused locally because its upstream was failing."

        - alert: SupermcpRateLimiterDegraded
          expr: max(supermcp_ratelimit_degraded) == 1
          for: {{ .Values.metrics.prometheusRule.for.errors }}
          labels: { severity: warning }
          annotations:
            summary: "the rate limiter has lost its shared store"
            description: "Budgets are being enforced per replica, so the effective ceiling is lower and uneven. Check Redis."

        - alert: SupermcpAuditQueueBacklog
          expr: max(supermcp_audit_queue_depth) > 200
          for: {{ .Values.metrics.prometheusRule.for.errors }}
          labels: { severity: critical }
          annotations:
            summary: "the audit writer is falling behind"
            description: "Events queue before they are written, and a full queue drops them. A dropped event is a gap in the record."

        # Reads the awskms provider only; a local key cannot be unreachable.
        # Unwrapped data keys are cached, so KMS is called on a cold cache
        # and for new keys only: an error here is a call something needed.
        # The window is shorter than the wait so one failure cannot fire it.
        - alert: SupermcpKMSUnreachable
          expr: |
            sum(rate(supermcp_kek_operations_total{provider="awskms",outcome="error"}[5m]))
              / sum(rate(supermcp_kek_operations_total{provider="awskms"}[5m])) > 0.5
          for: {{ .Values.metrics.prometheusRule.for.errors }}
          labels: { severity: critical }
          annotations:
            summary: "AWS KMS is refusing or not answering"
            description: "Most master key calls are failing. Replicas that already hold their data keys keep working; a restarted or new one cannot open any stored credential, and a new workspace cannot save one. Check the key policy, the pod's AWS identity and the route to KMS."

        - alert: SupermcpAuditExportLag
          expr: max by (kind) (supermcp_audit_export_lag_seconds) > 900
          for: {{ .Values.metrics.prometheusRule.for.errors }}
          labels: { severity: warning }
          annotations:
            summary: "audit events are not reaching a {{`{{ $labels.kind }}`}} destination"
            description: "The oldest undelivered event is over fifteen minutes old. Nothing is lost, delivery resumes from the cursor, but the receiver is behind. The destination's lastError says why; audit_exporters.last_error has it for every workspace."

        # Every replica measures it from the catalog, so they agree; max
        # keeps a replica that has not measured yet from firing it, and
        # absent catches a deployment where none reports it at all. The
        # job keeps three months ahead, so below two it has missed a month
        # boundary and not caught up. Nothing is refused when it runs out
        # (events land in the default partition), so this is a warning.
        - alert: SupermcpAuditPartitionsRunningOut
          expr: max(supermcp_audit_partition_months_ahead) < 2 or absent(supermcp_audit_partition_months_ahead)
          for: {{ .Values.metrics.prometheusRule.for.partitions }}
          labels: { severity: warning }
          annotations:
            summary: "audit_events is partitioned less than two months ahead"
            description: "The audit-partition-maint job has not created the months ahead. Events are still recorded, and once the months run out they land in audit_events_default, where retention cannot drop them a month at a time. The log of whichever replica ran it has 'background sweep failed' with job=audit-partition-maint and the reason."

        - alert: SupermcpDBConnPoolSaturated
          expr: |
            max by (pool) (
              supermcp_db_pool_acquired_connections / supermcp_db_pool_max_connections > 0.9
                and rate(supermcp_db_pool_empty_acquires_total[5m]) > 0
            )
          for: {{ .Values.metrics.prometheusRule.for.errors }}
          labels: { severity: warning }
          annotations:
            summary: "the {{`{{ $labels.pool }}`}} database pool is full and callers are queueing"
            description: "Requests wait for a connection before they do anything, so everything slows at once. Look for slow queries or held transactions before raising pool_max_conns in the database URL."
{{- if .Values.metrics.prometheusRule.cacheInvalidation.expected }}

        # The gauge is exported as 0 from start-up until the listener has
        # proved delivery, so a replica that never connects is caught too;
        # a replica that is not scraped at all is SupermcpDown's business.
        # Reconnects back off to thirty seconds at most, so a blip cannot
        # last the wait.
        - alert: SupermcpCacheListenerDown
          expr: supermcp_cache_listener_connected == 0
          for: {{ .Values.metrics.prometheusRule.for.errors }}
          labels: { severity: warning }
          annotations:
            summary: "a replica is not hearing cache invalidations"
            description: "On {{`{{ $labels.instance }}`}} a revoked role or a changed data-loss policy made on another replica applies only when the cached entry expires, up to thirty seconds later. Check that SUPERMCP_MAINT_DATABASE_URL reaches Postgres directly or through a session-mode proxy, not PgBouncer in transaction mode, and read the replica's log for 'cache invalidation listener disconnected'. Behind a transaction-pooling proxy by choice, set metrics.prometheusRule.cacheInvalidation.expected=false."
{{- end }}
{{- if .Values.database.migrate.enabled }}

        # Needs kube-state-metrics. The hook job is kept after a failure, but
        # only for database.migrate.ttlSecondsAfterFinished, so this fires
        # on the first evaluation rather than waiting it out.
        - alert: SupermcpMigrationJobFailed
          expr: max(kube_job_failed{namespace="{{ .Release.Namespace }}", job_name="{{ include "supermcp.fullname" . }}-migrate", condition="true"}) == 1
          labels: { severity: warning }
          annotations:
            summary: "the schema migration failed"
            description: "The install or upgrade stopped before the new version rolled out; the old one is still serving. kubectl logs job/{{ include "supermcp.fullname" . }}-migrate says why, and it is deleted after {{ .Values.database.migrate.ttlSecondsAfterFinished }}s."
{{- end }}
{{- end }}
