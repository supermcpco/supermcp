{{- if and .Values.database.migrate.enabled .Values.serviceAccount.create }}
# The migrate Job's own identity, created as a hook just before it. The
# Job runs before any of the release's ordinary objects exist, so it
# cannot use the ServiceAccount below them: on a first install the Job
# controller refuses to create its pod and the install times out.
# Migrations only talk to Postgres, so this account carries no workload
# identity annotations and mounts no token. Deleted once the hooks
# succeed; left in place after a failure so the Job can be inspected.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "supermcp.migrateServiceAccountName" . }}
  labels:
    {{- include "supermcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
automountServiceAccountToken: false
{{- end }}
