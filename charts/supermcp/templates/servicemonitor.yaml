{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "supermcp.fullname" . }}
  labels:
    {{- include "supermcp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "supermcp.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: admin
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
